syntax = "proto3";

package benchmark.pkg99;

// Message with various field types
message Message99 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage99 nested = 7;
  Status99 status = 8;
}

// Nested message type
message NestedMessage99 {
  string name = 1;
  int32 value = 2;
  repeated Item99 items = 3;
}

// Simple item message
message Item99 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status99 {
  STATUS_99_UNSPECIFIED = 0;
  STATUS_99_ACTIVE = 1;
  STATUS_99_INACTIVE = 2;
  STATUS_99_PENDING = 3;
}

// Service definition
service Service99 {
  rpc Get99(Get99Request) returns (Get99Response);
  rpc List99(List99Request) returns (List99Response);
  rpc Create99(Create99Request) returns (Create99Response);
}

message Get99Request {
  string id = 1;
}

message Get99Response {
  Message99 result = 1;
}

message List99Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List99Response {
  repeated Message99 results = 1;
  string next_page_token = 2;
}

message Create99Request {
  Message99 message = 1;
}

message Create99Response {
  Message99 result = 1;
}
