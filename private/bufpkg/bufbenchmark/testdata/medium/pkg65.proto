syntax = "proto3";

package benchmark.pkg65;

// Message with various field types
message Message65 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage65 nested = 7;
  Status65 status = 8;
}

// Nested message type
message NestedMessage65 {
  string name = 1;
  int32 value = 2;
  repeated Item65 items = 3;
}

// Simple item message
message Item65 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status65 {
  STATUS_65_UNSPECIFIED = 0;
  STATUS_65_ACTIVE = 1;
  STATUS_65_INACTIVE = 2;
  STATUS_65_PENDING = 3;
}

// Service definition
service Service65 {
  rpc Get65(Get65Request) returns (Get65Response);
  rpc List65(List65Request) returns (List65Response);
  rpc Create65(Create65Request) returns (Create65Response);
}

message Get65Request {
  string id = 1;
}

message Get65Response {
  Message65 result = 1;
}

message List65Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List65Response {
  repeated Message65 results = 1;
  string next_page_token = 2;
}

message Create65Request {
  Message65 message = 1;
}

message Create65Response {
  Message65 result = 1;
}
