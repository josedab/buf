syntax = "proto3";

package benchmark.pkg25;

// Message with various field types
message Message25 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage25 nested = 7;
  Status25 status = 8;
}

// Nested message type
message NestedMessage25 {
  string name = 1;
  int32 value = 2;
  repeated Item25 items = 3;
}

// Simple item message
message Item25 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status25 {
  STATUS_25_UNSPECIFIED = 0;
  STATUS_25_ACTIVE = 1;
  STATUS_25_INACTIVE = 2;
  STATUS_25_PENDING = 3;
}

// Service definition
service Service25 {
  rpc Get25(Get25Request) returns (Get25Response);
  rpc List25(List25Request) returns (List25Response);
  rpc Create25(Create25Request) returns (Create25Response);
}

message Get25Request {
  string id = 1;
}

message Get25Response {
  Message25 result = 1;
}

message List25Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List25Response {
  repeated Message25 results = 1;
  string next_page_token = 2;
}

message Create25Request {
  Message25 message = 1;
}

message Create25Response {
  Message25 result = 1;
}
