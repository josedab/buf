syntax = "proto3";

package benchmark.pkg26;

// Message with various field types
message Message26 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage26 nested = 7;
  Status26 status = 8;
}

// Nested message type
message NestedMessage26 {
  string name = 1;
  int32 value = 2;
  repeated Item26 items = 3;
}

// Simple item message
message Item26 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status26 {
  STATUS_26_UNSPECIFIED = 0;
  STATUS_26_ACTIVE = 1;
  STATUS_26_INACTIVE = 2;
  STATUS_26_PENDING = 3;
}

// Service definition
service Service26 {
  rpc Get26(Get26Request) returns (Get26Response);
  rpc List26(List26Request) returns (List26Response);
  rpc Create26(Create26Request) returns (Create26Response);
}

message Get26Request {
  string id = 1;
}

message Get26Response {
  Message26 result = 1;
}

message List26Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List26Response {
  repeated Message26 results = 1;
  string next_page_token = 2;
}

message Create26Request {
  Message26 message = 1;
}

message Create26Response {
  Message26 result = 1;
}
