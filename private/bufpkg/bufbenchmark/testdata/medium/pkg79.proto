syntax = "proto3";

package benchmark.pkg79;

// Message with various field types
message Message79 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage79 nested = 7;
  Status79 status = 8;
}

// Nested message type
message NestedMessage79 {
  string name = 1;
  int32 value = 2;
  repeated Item79 items = 3;
}

// Simple item message
message Item79 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status79 {
  STATUS_79_UNSPECIFIED = 0;
  STATUS_79_ACTIVE = 1;
  STATUS_79_INACTIVE = 2;
  STATUS_79_PENDING = 3;
}

// Service definition
service Service79 {
  rpc Get79(Get79Request) returns (Get79Response);
  rpc List79(List79Request) returns (List79Response);
  rpc Create79(Create79Request) returns (Create79Response);
}

message Get79Request {
  string id = 1;
}

message Get79Response {
  Message79 result = 1;
}

message List79Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List79Response {
  repeated Message79 results = 1;
  string next_page_token = 2;
}

message Create79Request {
  Message79 message = 1;
}

message Create79Response {
  Message79 result = 1;
}
