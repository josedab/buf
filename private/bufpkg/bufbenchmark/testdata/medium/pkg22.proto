syntax = "proto3";

package benchmark.pkg22;

// Message with various field types
message Message22 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage22 nested = 7;
  Status22 status = 8;
}

// Nested message type
message NestedMessage22 {
  string name = 1;
  int32 value = 2;
  repeated Item22 items = 3;
}

// Simple item message
message Item22 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status22 {
  STATUS_22_UNSPECIFIED = 0;
  STATUS_22_ACTIVE = 1;
  STATUS_22_INACTIVE = 2;
  STATUS_22_PENDING = 3;
}

// Service definition
service Service22 {
  rpc Get22(Get22Request) returns (Get22Response);
  rpc List22(List22Request) returns (List22Response);
  rpc Create22(Create22Request) returns (Create22Response);
}

message Get22Request {
  string id = 1;
}

message Get22Response {
  Message22 result = 1;
}

message List22Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List22Response {
  repeated Message22 results = 1;
  string next_page_token = 2;
}

message Create22Request {
  Message22 message = 1;
}

message Create22Response {
  Message22 result = 1;
}
