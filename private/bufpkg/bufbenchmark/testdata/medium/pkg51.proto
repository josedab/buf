syntax = "proto3";

package benchmark.pkg51;

// Message with various field types
message Message51 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage51 nested = 7;
  Status51 status = 8;
}

// Nested message type
message NestedMessage51 {
  string name = 1;
  int32 value = 2;
  repeated Item51 items = 3;
}

// Simple item message
message Item51 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status51 {
  STATUS_51_UNSPECIFIED = 0;
  STATUS_51_ACTIVE = 1;
  STATUS_51_INACTIVE = 2;
  STATUS_51_PENDING = 3;
}

// Service definition
service Service51 {
  rpc Get51(Get51Request) returns (Get51Response);
  rpc List51(List51Request) returns (List51Response);
  rpc Create51(Create51Request) returns (Create51Response);
}

message Get51Request {
  string id = 1;
}

message Get51Response {
  Message51 result = 1;
}

message List51Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List51Response {
  repeated Message51 results = 1;
  string next_page_token = 2;
}

message Create51Request {
  Message51 message = 1;
}

message Create51Response {
  Message51 result = 1;
}
