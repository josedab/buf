syntax = "proto3";

package benchmark.pkg30;

// Message with various field types
message Message30 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage30 nested = 7;
  Status30 status = 8;
}

// Nested message type
message NestedMessage30 {
  string name = 1;
  int32 value = 2;
  repeated Item30 items = 3;
}

// Simple item message
message Item30 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status30 {
  STATUS_30_UNSPECIFIED = 0;
  STATUS_30_ACTIVE = 1;
  STATUS_30_INACTIVE = 2;
  STATUS_30_PENDING = 3;
}

// Service definition
service Service30 {
  rpc Get30(Get30Request) returns (Get30Response);
  rpc List30(List30Request) returns (List30Response);
  rpc Create30(Create30Request) returns (Create30Response);
}

message Get30Request {
  string id = 1;
}

message Get30Response {
  Message30 result = 1;
}

message List30Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List30Response {
  repeated Message30 results = 1;
  string next_page_token = 2;
}

message Create30Request {
  Message30 message = 1;
}

message Create30Response {
  Message30 result = 1;
}
