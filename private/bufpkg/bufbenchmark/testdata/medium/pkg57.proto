syntax = "proto3";

package benchmark.pkg57;

// Message with various field types
message Message57 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage57 nested = 7;
  Status57 status = 8;
}

// Nested message type
message NestedMessage57 {
  string name = 1;
  int32 value = 2;
  repeated Item57 items = 3;
}

// Simple item message
message Item57 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status57 {
  STATUS_57_UNSPECIFIED = 0;
  STATUS_57_ACTIVE = 1;
  STATUS_57_INACTIVE = 2;
  STATUS_57_PENDING = 3;
}

// Service definition
service Service57 {
  rpc Get57(Get57Request) returns (Get57Response);
  rpc List57(List57Request) returns (List57Response);
  rpc Create57(Create57Request) returns (Create57Response);
}

message Get57Request {
  string id = 1;
}

message Get57Response {
  Message57 result = 1;
}

message List57Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List57Response {
  repeated Message57 results = 1;
  string next_page_token = 2;
}

message Create57Request {
  Message57 message = 1;
}

message Create57Response {
  Message57 result = 1;
}
