syntax = "proto3";

package benchmark.pkg81;

// Message with various field types
message Message81 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage81 nested = 7;
  Status81 status = 8;
}

// Nested message type
message NestedMessage81 {
  string name = 1;
  int32 value = 2;
  repeated Item81 items = 3;
}

// Simple item message
message Item81 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status81 {
  STATUS_81_UNSPECIFIED = 0;
  STATUS_81_ACTIVE = 1;
  STATUS_81_INACTIVE = 2;
  STATUS_81_PENDING = 3;
}

// Service definition
service Service81 {
  rpc Get81(Get81Request) returns (Get81Response);
  rpc List81(List81Request) returns (List81Response);
  rpc Create81(Create81Request) returns (Create81Response);
}

message Get81Request {
  string id = 1;
}

message Get81Response {
  Message81 result = 1;
}

message List81Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List81Response {
  repeated Message81 results = 1;
  string next_page_token = 2;
}

message Create81Request {
  Message81 message = 1;
}

message Create81Response {
  Message81 result = 1;
}
