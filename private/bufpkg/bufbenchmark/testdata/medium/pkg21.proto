syntax = "proto3";

package benchmark.pkg21;

// Message with various field types
message Message21 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage21 nested = 7;
  Status21 status = 8;
}

// Nested message type
message NestedMessage21 {
  string name = 1;
  int32 value = 2;
  repeated Item21 items = 3;
}

// Simple item message
message Item21 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status21 {
  STATUS_21_UNSPECIFIED = 0;
  STATUS_21_ACTIVE = 1;
  STATUS_21_INACTIVE = 2;
  STATUS_21_PENDING = 3;
}

// Service definition
service Service21 {
  rpc Get21(Get21Request) returns (Get21Response);
  rpc List21(List21Request) returns (List21Response);
  rpc Create21(Create21Request) returns (Create21Response);
}

message Get21Request {
  string id = 1;
}

message Get21Response {
  Message21 result = 1;
}

message List21Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List21Response {
  repeated Message21 results = 1;
  string next_page_token = 2;
}

message Create21Request {
  Message21 message = 1;
}

message Create21Response {
  Message21 result = 1;
}
