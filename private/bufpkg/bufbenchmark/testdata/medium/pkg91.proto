syntax = "proto3";

package benchmark.pkg91;

// Message with various field types
message Message91 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage91 nested = 7;
  Status91 status = 8;
}

// Nested message type
message NestedMessage91 {
  string name = 1;
  int32 value = 2;
  repeated Item91 items = 3;
}

// Simple item message
message Item91 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status91 {
  STATUS_91_UNSPECIFIED = 0;
  STATUS_91_ACTIVE = 1;
  STATUS_91_INACTIVE = 2;
  STATUS_91_PENDING = 3;
}

// Service definition
service Service91 {
  rpc Get91(Get91Request) returns (Get91Response);
  rpc List91(List91Request) returns (List91Response);
  rpc Create91(Create91Request) returns (Create91Response);
}

message Get91Request {
  string id = 1;
}

message Get91Response {
  Message91 result = 1;
}

message List91Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List91Response {
  repeated Message91 results = 1;
  string next_page_token = 2;
}

message Create91Request {
  Message91 message = 1;
}

message Create91Response {
  Message91 result = 1;
}
