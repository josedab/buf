syntax = "proto3";

package benchmark.pkg50;

// Message with various field types
message Message50 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage50 nested = 7;
  Status50 status = 8;
}

// Nested message type
message NestedMessage50 {
  string name = 1;
  int32 value = 2;
  repeated Item50 items = 3;
}

// Simple item message
message Item50 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status50 {
  STATUS_50_UNSPECIFIED = 0;
  STATUS_50_ACTIVE = 1;
  STATUS_50_INACTIVE = 2;
  STATUS_50_PENDING = 3;
}

// Service definition
service Service50 {
  rpc Get50(Get50Request) returns (Get50Response);
  rpc List50(List50Request) returns (List50Response);
  rpc Create50(Create50Request) returns (Create50Response);
}

message Get50Request {
  string id = 1;
}

message Get50Response {
  Message50 result = 1;
}

message List50Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List50Response {
  repeated Message50 results = 1;
  string next_page_token = 2;
}

message Create50Request {
  Message50 message = 1;
}

message Create50Response {
  Message50 result = 1;
}
