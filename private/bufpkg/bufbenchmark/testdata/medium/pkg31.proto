syntax = "proto3";

package benchmark.pkg31;

// Message with various field types
message Message31 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage31 nested = 7;
  Status31 status = 8;
}

// Nested message type
message NestedMessage31 {
  string name = 1;
  int32 value = 2;
  repeated Item31 items = 3;
}

// Simple item message
message Item31 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status31 {
  STATUS_31_UNSPECIFIED = 0;
  STATUS_31_ACTIVE = 1;
  STATUS_31_INACTIVE = 2;
  STATUS_31_PENDING = 3;
}

// Service definition
service Service31 {
  rpc Get31(Get31Request) returns (Get31Response);
  rpc List31(List31Request) returns (List31Response);
  rpc Create31(Create31Request) returns (Create31Response);
}

message Get31Request {
  string id = 1;
}

message Get31Response {
  Message31 result = 1;
}

message List31Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List31Response {
  repeated Message31 results = 1;
  string next_page_token = 2;
}

message Create31Request {
  Message31 message = 1;
}

message Create31Response {
  Message31 result = 1;
}
