syntax = "proto3";

package benchmark.pkg58;

// Message with various field types
message Message58 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage58 nested = 7;
  Status58 status = 8;
}

// Nested message type
message NestedMessage58 {
  string name = 1;
  int32 value = 2;
  repeated Item58 items = 3;
}

// Simple item message
message Item58 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status58 {
  STATUS_58_UNSPECIFIED = 0;
  STATUS_58_ACTIVE = 1;
  STATUS_58_INACTIVE = 2;
  STATUS_58_PENDING = 3;
}

// Service definition
service Service58 {
  rpc Get58(Get58Request) returns (Get58Response);
  rpc List58(List58Request) returns (List58Response);
  rpc Create58(Create58Request) returns (Create58Response);
}

message Get58Request {
  string id = 1;
}

message Get58Response {
  Message58 result = 1;
}

message List58Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List58Response {
  repeated Message58 results = 1;
  string next_page_token = 2;
}

message Create58Request {
  Message58 message = 1;
}

message Create58Response {
  Message58 result = 1;
}
