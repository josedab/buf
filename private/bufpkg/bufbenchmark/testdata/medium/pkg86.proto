syntax = "proto3";

package benchmark.pkg86;

// Message with various field types
message Message86 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage86 nested = 7;
  Status86 status = 8;
}

// Nested message type
message NestedMessage86 {
  string name = 1;
  int32 value = 2;
  repeated Item86 items = 3;
}

// Simple item message
message Item86 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status86 {
  STATUS_86_UNSPECIFIED = 0;
  STATUS_86_ACTIVE = 1;
  STATUS_86_INACTIVE = 2;
  STATUS_86_PENDING = 3;
}

// Service definition
service Service86 {
  rpc Get86(Get86Request) returns (Get86Response);
  rpc List86(List86Request) returns (List86Response);
  rpc Create86(Create86Request) returns (Create86Response);
}

message Get86Request {
  string id = 1;
}

message Get86Response {
  Message86 result = 1;
}

message List86Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List86Response {
  repeated Message86 results = 1;
  string next_page_token = 2;
}

message Create86Request {
  Message86 message = 1;
}

message Create86Response {
  Message86 result = 1;
}
