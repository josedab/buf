syntax = "proto3";

package benchmark.pkg2;

// Message with various field types
message Message2 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage2 nested = 7;
  Status2 status = 8;
}

// Nested message type
message NestedMessage2 {
  string name = 1;
  int32 value = 2;
  repeated Item2 items = 3;
}

// Simple item message
message Item2 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status2 {
  STATUS_2_UNSPECIFIED = 0;
  STATUS_2_ACTIVE = 1;
  STATUS_2_INACTIVE = 2;
  STATUS_2_PENDING = 3;
}

// Service definition
service Service2 {
  rpc Get2(Get2Request) returns (Get2Response);
  rpc List2(List2Request) returns (List2Response);
  rpc Create2(Create2Request) returns (Create2Response);
}

message Get2Request {
  string id = 1;
}

message Get2Response {
  Message2 result = 1;
}

message List2Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List2Response {
  repeated Message2 results = 1;
  string next_page_token = 2;
}

message Create2Request {
  Message2 message = 1;
}

message Create2Response {
  Message2 result = 1;
}
