syntax = "proto3";

package benchmark.pkg83;

// Message with various field types
message Message83 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage83 nested = 7;
  Status83 status = 8;
}

// Nested message type
message NestedMessage83 {
  string name = 1;
  int32 value = 2;
  repeated Item83 items = 3;
}

// Simple item message
message Item83 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status83 {
  STATUS_83_UNSPECIFIED = 0;
  STATUS_83_ACTIVE = 1;
  STATUS_83_INACTIVE = 2;
  STATUS_83_PENDING = 3;
}

// Service definition
service Service83 {
  rpc Get83(Get83Request) returns (Get83Response);
  rpc List83(List83Request) returns (List83Response);
  rpc Create83(Create83Request) returns (Create83Response);
}

message Get83Request {
  string id = 1;
}

message Get83Response {
  Message83 result = 1;
}

message List83Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List83Response {
  repeated Message83 results = 1;
  string next_page_token = 2;
}

message Create83Request {
  Message83 message = 1;
}

message Create83Response {
  Message83 result = 1;
}
