syntax = "proto3";

package benchmark.pkg40;

// Message with various field types
message Message40 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage40 nested = 7;
  Status40 status = 8;
}

// Nested message type
message NestedMessage40 {
  string name = 1;
  int32 value = 2;
  repeated Item40 items = 3;
}

// Simple item message
message Item40 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status40 {
  STATUS_40_UNSPECIFIED = 0;
  STATUS_40_ACTIVE = 1;
  STATUS_40_INACTIVE = 2;
  STATUS_40_PENDING = 3;
}

// Service definition
service Service40 {
  rpc Get40(Get40Request) returns (Get40Response);
  rpc List40(List40Request) returns (List40Response);
  rpc Create40(Create40Request) returns (Create40Response);
}

message Get40Request {
  string id = 1;
}

message Get40Response {
  Message40 result = 1;
}

message List40Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List40Response {
  repeated Message40 results = 1;
  string next_page_token = 2;
}

message Create40Request {
  Message40 message = 1;
}

message Create40Response {
  Message40 result = 1;
}
