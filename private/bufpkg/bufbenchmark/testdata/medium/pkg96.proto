syntax = "proto3";

package benchmark.pkg96;

// Message with various field types
message Message96 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage96 nested = 7;
  Status96 status = 8;
}

// Nested message type
message NestedMessage96 {
  string name = 1;
  int32 value = 2;
  repeated Item96 items = 3;
}

// Simple item message
message Item96 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status96 {
  STATUS_96_UNSPECIFIED = 0;
  STATUS_96_ACTIVE = 1;
  STATUS_96_INACTIVE = 2;
  STATUS_96_PENDING = 3;
}

// Service definition
service Service96 {
  rpc Get96(Get96Request) returns (Get96Response);
  rpc List96(List96Request) returns (List96Response);
  rpc Create96(Create96Request) returns (Create96Response);
}

message Get96Request {
  string id = 1;
}

message Get96Response {
  Message96 result = 1;
}

message List96Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List96Response {
  repeated Message96 results = 1;
  string next_page_token = 2;
}

message Create96Request {
  Message96 message = 1;
}

message Create96Response {
  Message96 result = 1;
}
