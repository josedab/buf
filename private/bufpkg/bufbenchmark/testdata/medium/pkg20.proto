syntax = "proto3";

package benchmark.pkg20;

// Message with various field types
message Message20 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage20 nested = 7;
  Status20 status = 8;
}

// Nested message type
message NestedMessage20 {
  string name = 1;
  int32 value = 2;
  repeated Item20 items = 3;
}

// Simple item message
message Item20 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status20 {
  STATUS_20_UNSPECIFIED = 0;
  STATUS_20_ACTIVE = 1;
  STATUS_20_INACTIVE = 2;
  STATUS_20_PENDING = 3;
}

// Service definition
service Service20 {
  rpc Get20(Get20Request) returns (Get20Response);
  rpc List20(List20Request) returns (List20Response);
  rpc Create20(Create20Request) returns (Create20Response);
}

message Get20Request {
  string id = 1;
}

message Get20Response {
  Message20 result = 1;
}

message List20Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List20Response {
  repeated Message20 results = 1;
  string next_page_token = 2;
}

message Create20Request {
  Message20 message = 1;
}

message Create20Response {
  Message20 result = 1;
}
