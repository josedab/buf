syntax = "proto3";

package benchmark.pkg15;

// Message with various field types
message Message15 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage15 nested = 7;
  Status15 status = 8;
}

// Nested message type
message NestedMessage15 {
  string name = 1;
  int32 value = 2;
  repeated Item15 items = 3;
}

// Simple item message
message Item15 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status15 {
  STATUS_15_UNSPECIFIED = 0;
  STATUS_15_ACTIVE = 1;
  STATUS_15_INACTIVE = 2;
  STATUS_15_PENDING = 3;
}

// Service definition
service Service15 {
  rpc Get15(Get15Request) returns (Get15Response);
  rpc List15(List15Request) returns (List15Response);
  rpc Create15(Create15Request) returns (Create15Response);
}

message Get15Request {
  string id = 1;
}

message Get15Response {
  Message15 result = 1;
}

message List15Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List15Response {
  repeated Message15 results = 1;
  string next_page_token = 2;
}

message Create15Request {
  Message15 message = 1;
}

message Create15Response {
  Message15 result = 1;
}
