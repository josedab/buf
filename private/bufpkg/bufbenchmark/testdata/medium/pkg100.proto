syntax = "proto3";

package benchmark.pkg100;

// Message with various field types
message Message100 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage100 nested = 7;
  Status100 status = 8;
}

// Nested message type
message NestedMessage100 {
  string name = 1;
  int32 value = 2;
  repeated Item100 items = 3;
}

// Simple item message
message Item100 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status100 {
  STATUS_100_UNSPECIFIED = 0;
  STATUS_100_ACTIVE = 1;
  STATUS_100_INACTIVE = 2;
  STATUS_100_PENDING = 3;
}

// Service definition
service Service100 {
  rpc Get100(Get100Request) returns (Get100Response);
  rpc List100(List100Request) returns (List100Response);
  rpc Create100(Create100Request) returns (Create100Response);
}

message Get100Request {
  string id = 1;
}

message Get100Response {
  Message100 result = 1;
}

message List100Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List100Response {
  repeated Message100 results = 1;
  string next_page_token = 2;
}

message Create100Request {
  Message100 message = 1;
}

message Create100Response {
  Message100 result = 1;
}
