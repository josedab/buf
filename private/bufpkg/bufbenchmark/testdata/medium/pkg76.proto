syntax = "proto3";

package benchmark.pkg76;

// Message with various field types
message Message76 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage76 nested = 7;
  Status76 status = 8;
}

// Nested message type
message NestedMessage76 {
  string name = 1;
  int32 value = 2;
  repeated Item76 items = 3;
}

// Simple item message
message Item76 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status76 {
  STATUS_76_UNSPECIFIED = 0;
  STATUS_76_ACTIVE = 1;
  STATUS_76_INACTIVE = 2;
  STATUS_76_PENDING = 3;
}

// Service definition
service Service76 {
  rpc Get76(Get76Request) returns (Get76Response);
  rpc List76(List76Request) returns (List76Response);
  rpc Create76(Create76Request) returns (Create76Response);
}

message Get76Request {
  string id = 1;
}

message Get76Response {
  Message76 result = 1;
}

message List76Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List76Response {
  repeated Message76 results = 1;
  string next_page_token = 2;
}

message Create76Request {
  Message76 message = 1;
}

message Create76Response {
  Message76 result = 1;
}
