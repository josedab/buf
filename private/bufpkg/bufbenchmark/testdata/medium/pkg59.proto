syntax = "proto3";

package benchmark.pkg59;

// Message with various field types
message Message59 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage59 nested = 7;
  Status59 status = 8;
}

// Nested message type
message NestedMessage59 {
  string name = 1;
  int32 value = 2;
  repeated Item59 items = 3;
}

// Simple item message
message Item59 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status59 {
  STATUS_59_UNSPECIFIED = 0;
  STATUS_59_ACTIVE = 1;
  STATUS_59_INACTIVE = 2;
  STATUS_59_PENDING = 3;
}

// Service definition
service Service59 {
  rpc Get59(Get59Request) returns (Get59Response);
  rpc List59(List59Request) returns (List59Response);
  rpc Create59(Create59Request) returns (Create59Response);
}

message Get59Request {
  string id = 1;
}

message Get59Response {
  Message59 result = 1;
}

message List59Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List59Response {
  repeated Message59 results = 1;
  string next_page_token = 2;
}

message Create59Request {
  Message59 message = 1;
}

message Create59Response {
  Message59 result = 1;
}
