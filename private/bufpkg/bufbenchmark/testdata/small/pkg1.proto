syntax = "proto3";

package benchmark.pkg1;

// Message with various field types
message Message1 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage1 nested = 7;
  Status1 status = 8;
}

// Nested message type
message NestedMessage1 {
  string name = 1;
  int32 value = 2;
  repeated Item1 items = 3;
}

// Simple item message
message Item1 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status1 {
  STATUS_1_UNSPECIFIED = 0;
  STATUS_1_ACTIVE = 1;
  STATUS_1_INACTIVE = 2;
  STATUS_1_PENDING = 3;
}

// Service definition
service Service1 {
  rpc Get1(Get1Request) returns (Get1Response);
  rpc List1(List1Request) returns (List1Response);
  rpc Create1(Create1Request) returns (Create1Response);
}

message Get1Request {
  string id = 1;
}

message Get1Response {
  Message1 result = 1;
}

message List1Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List1Response {
  repeated Message1 results = 1;
  string next_page_token = 2;
}

message Create1Request {
  Message1 message = 1;
}

message Create1Response {
  Message1 result = 1;
}
