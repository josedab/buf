syntax = "proto3";

package benchmark.pkg4;

// Message with various field types
message Message4 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage4 nested = 7;
  Status4 status = 8;
}

// Nested message type
message NestedMessage4 {
  string name = 1;
  int32 value = 2;
  repeated Item4 items = 3;
}

// Simple item message
message Item4 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status4 {
  STATUS_4_UNSPECIFIED = 0;
  STATUS_4_ACTIVE = 1;
  STATUS_4_INACTIVE = 2;
  STATUS_4_PENDING = 3;
}

// Service definition
service Service4 {
  rpc Get4(Get4Request) returns (Get4Response);
  rpc List4(List4Request) returns (List4Response);
  rpc Create4(Create4Request) returns (Create4Response);
}

message Get4Request {
  string id = 1;
}

message Get4Response {
  Message4 result = 1;
}

message List4Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List4Response {
  repeated Message4 results = 1;
  string next_page_token = 2;
}

message Create4Request {
  Message4 message = 1;
}

message Create4Response {
  Message4 result = 1;
}
