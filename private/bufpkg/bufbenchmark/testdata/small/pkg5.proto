syntax = "proto3";

package benchmark.pkg5;

// Message with various field types
message Message5 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage5 nested = 7;
  Status5 status = 8;
}

// Nested message type
message NestedMessage5 {
  string name = 1;
  int32 value = 2;
  repeated Item5 items = 3;
}

// Simple item message
message Item5 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status5 {
  STATUS_5_UNSPECIFIED = 0;
  STATUS_5_ACTIVE = 1;
  STATUS_5_INACTIVE = 2;
  STATUS_5_PENDING = 3;
}

// Service definition
service Service5 {
  rpc Get5(Get5Request) returns (Get5Response);
  rpc List5(List5Request) returns (List5Response);
  rpc Create5(Create5Request) returns (Create5Response);
}

message Get5Request {
  string id = 1;
}

message Get5Response {
  Message5 result = 1;
}

message List5Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List5Response {
  repeated Message5 results = 1;
  string next_page_token = 2;
}

message Create5Request {
  Message5 message = 1;
}

message Create5Response {
  Message5 result = 1;
}
