syntax = "proto3";

package benchmark.pkg10;

// Message with various field types
message Message10 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage10 nested = 7;
  Status10 status = 8;
}

// Nested message type
message NestedMessage10 {
  string name = 1;
  int32 value = 2;
  repeated Item10 items = 3;
}

// Simple item message
message Item10 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status10 {
  STATUS_10_UNSPECIFIED = 0;
  STATUS_10_ACTIVE = 1;
  STATUS_10_INACTIVE = 2;
  STATUS_10_PENDING = 3;
}

// Service definition
service Service10 {
  rpc Get10(Get10Request) returns (Get10Response);
  rpc List10(List10Request) returns (List10Response);
  rpc Create10(Create10Request) returns (Create10Response);
}

message Get10Request {
  string id = 1;
}

message Get10Response {
  Message10 result = 1;
}

message List10Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List10Response {
  repeated Message10 results = 1;
  string next_page_token = 2;
}

message Create10Request {
  Message10 message = 1;
}

message Create10Response {
  Message10 result = 1;
}
