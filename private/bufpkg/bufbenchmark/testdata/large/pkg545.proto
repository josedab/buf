syntax = "proto3";

package benchmark.pkg545;

// Message with various field types
message Message545 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage545 nested = 7;
  Status545 status = 8;
}

// Nested message type
message NestedMessage545 {
  string name = 1;
  int32 value = 2;
  repeated Item545 items = 3;
}

// Simple item message
message Item545 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status545 {
  STATUS_545_UNSPECIFIED = 0;
  STATUS_545_ACTIVE = 1;
  STATUS_545_INACTIVE = 2;
  STATUS_545_PENDING = 3;
}

// Service definition
service Service545 {
  rpc Get545(Get545Request) returns (Get545Response);
  rpc List545(List545Request) returns (List545Response);
  rpc Create545(Create545Request) returns (Create545Response);
}

message Get545Request {
  string id = 1;
}

message Get545Response {
  Message545 result = 1;
}

message List545Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List545Response {
  repeated Message545 results = 1;
  string next_page_token = 2;
}

message Create545Request {
  Message545 message = 1;
}

message Create545Response {
  Message545 result = 1;
}
