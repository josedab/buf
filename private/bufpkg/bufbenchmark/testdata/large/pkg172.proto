syntax = "proto3";

package benchmark.pkg172;

// Message with various field types
message Message172 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage172 nested = 7;
  Status172 status = 8;
}

// Nested message type
message NestedMessage172 {
  string name = 1;
  int32 value = 2;
  repeated Item172 items = 3;
}

// Simple item message
message Item172 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status172 {
  STATUS_172_UNSPECIFIED = 0;
  STATUS_172_ACTIVE = 1;
  STATUS_172_INACTIVE = 2;
  STATUS_172_PENDING = 3;
}

// Service definition
service Service172 {
  rpc Get172(Get172Request) returns (Get172Response);
  rpc List172(List172Request) returns (List172Response);
  rpc Create172(Create172Request) returns (Create172Response);
}

message Get172Request {
  string id = 1;
}

message Get172Response {
  Message172 result = 1;
}

message List172Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List172Response {
  repeated Message172 results = 1;
  string next_page_token = 2;
}

message Create172Request {
  Message172 message = 1;
}

message Create172Response {
  Message172 result = 1;
}
