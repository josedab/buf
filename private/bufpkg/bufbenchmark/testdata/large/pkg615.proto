syntax = "proto3";

package benchmark.pkg615;

// Message with various field types
message Message615 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage615 nested = 7;
  Status615 status = 8;
}

// Nested message type
message NestedMessage615 {
  string name = 1;
  int32 value = 2;
  repeated Item615 items = 3;
}

// Simple item message
message Item615 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status615 {
  STATUS_615_UNSPECIFIED = 0;
  STATUS_615_ACTIVE = 1;
  STATUS_615_INACTIVE = 2;
  STATUS_615_PENDING = 3;
}

// Service definition
service Service615 {
  rpc Get615(Get615Request) returns (Get615Response);
  rpc List615(List615Request) returns (List615Response);
  rpc Create615(Create615Request) returns (Create615Response);
}

message Get615Request {
  string id = 1;
}

message Get615Response {
  Message615 result = 1;
}

message List615Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List615Response {
  repeated Message615 results = 1;
  string next_page_token = 2;
}

message Create615Request {
  Message615 message = 1;
}

message Create615Response {
  Message615 result = 1;
}
