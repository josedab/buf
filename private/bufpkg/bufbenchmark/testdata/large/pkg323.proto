syntax = "proto3";

package benchmark.pkg323;

// Message with various field types
message Message323 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage323 nested = 7;
  Status323 status = 8;
}

// Nested message type
message NestedMessage323 {
  string name = 1;
  int32 value = 2;
  repeated Item323 items = 3;
}

// Simple item message
message Item323 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status323 {
  STATUS_323_UNSPECIFIED = 0;
  STATUS_323_ACTIVE = 1;
  STATUS_323_INACTIVE = 2;
  STATUS_323_PENDING = 3;
}

// Service definition
service Service323 {
  rpc Get323(Get323Request) returns (Get323Response);
  rpc List323(List323Request) returns (List323Response);
  rpc Create323(Create323Request) returns (Create323Response);
}

message Get323Request {
  string id = 1;
}

message Get323Response {
  Message323 result = 1;
}

message List323Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List323Response {
  repeated Message323 results = 1;
  string next_page_token = 2;
}

message Create323Request {
  Message323 message = 1;
}

message Create323Response {
  Message323 result = 1;
}
