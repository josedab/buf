syntax = "proto3";

package benchmark.pkg226;

// Message with various field types
message Message226 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage226 nested = 7;
  Status226 status = 8;
}

// Nested message type
message NestedMessage226 {
  string name = 1;
  int32 value = 2;
  repeated Item226 items = 3;
}

// Simple item message
message Item226 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status226 {
  STATUS_226_UNSPECIFIED = 0;
  STATUS_226_ACTIVE = 1;
  STATUS_226_INACTIVE = 2;
  STATUS_226_PENDING = 3;
}

// Service definition
service Service226 {
  rpc Get226(Get226Request) returns (Get226Response);
  rpc List226(List226Request) returns (List226Response);
  rpc Create226(Create226Request) returns (Create226Response);
}

message Get226Request {
  string id = 1;
}

message Get226Response {
  Message226 result = 1;
}

message List226Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List226Response {
  repeated Message226 results = 1;
  string next_page_token = 2;
}

message Create226Request {
  Message226 message = 1;
}

message Create226Response {
  Message226 result = 1;
}
