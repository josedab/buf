syntax = "proto3";

package benchmark.pkg94;

// Message with various field types
message Message94 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage94 nested = 7;
  Status94 status = 8;
}

// Nested message type
message NestedMessage94 {
  string name = 1;
  int32 value = 2;
  repeated Item94 items = 3;
}

// Simple item message
message Item94 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status94 {
  STATUS_94_UNSPECIFIED = 0;
  STATUS_94_ACTIVE = 1;
  STATUS_94_INACTIVE = 2;
  STATUS_94_PENDING = 3;
}

// Service definition
service Service94 {
  rpc Get94(Get94Request) returns (Get94Response);
  rpc List94(List94Request) returns (List94Response);
  rpc Create94(Create94Request) returns (Create94Response);
}

message Get94Request {
  string id = 1;
}

message Get94Response {
  Message94 result = 1;
}

message List94Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List94Response {
  repeated Message94 results = 1;
  string next_page_token = 2;
}

message Create94Request {
  Message94 message = 1;
}

message Create94Response {
  Message94 result = 1;
}
