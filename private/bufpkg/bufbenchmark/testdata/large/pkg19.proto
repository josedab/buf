syntax = "proto3";

package benchmark.pkg19;

// Message with various field types
message Message19 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage19 nested = 7;
  Status19 status = 8;
}

// Nested message type
message NestedMessage19 {
  string name = 1;
  int32 value = 2;
  repeated Item19 items = 3;
}

// Simple item message
message Item19 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status19 {
  STATUS_19_UNSPECIFIED = 0;
  STATUS_19_ACTIVE = 1;
  STATUS_19_INACTIVE = 2;
  STATUS_19_PENDING = 3;
}

// Service definition
service Service19 {
  rpc Get19(Get19Request) returns (Get19Response);
  rpc List19(List19Request) returns (List19Response);
  rpc Create19(Create19Request) returns (Create19Response);
}

message Get19Request {
  string id = 1;
}

message Get19Response {
  Message19 result = 1;
}

message List19Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List19Response {
  repeated Message19 results = 1;
  string next_page_token = 2;
}

message Create19Request {
  Message19 message = 1;
}

message Create19Response {
  Message19 result = 1;
}
