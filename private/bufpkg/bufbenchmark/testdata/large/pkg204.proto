syntax = "proto3";

package benchmark.pkg204;

// Message with various field types
message Message204 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage204 nested = 7;
  Status204 status = 8;
}

// Nested message type
message NestedMessage204 {
  string name = 1;
  int32 value = 2;
  repeated Item204 items = 3;
}

// Simple item message
message Item204 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status204 {
  STATUS_204_UNSPECIFIED = 0;
  STATUS_204_ACTIVE = 1;
  STATUS_204_INACTIVE = 2;
  STATUS_204_PENDING = 3;
}

// Service definition
service Service204 {
  rpc Get204(Get204Request) returns (Get204Response);
  rpc List204(List204Request) returns (List204Response);
  rpc Create204(Create204Request) returns (Create204Response);
}

message Get204Request {
  string id = 1;
}

message Get204Response {
  Message204 result = 1;
}

message List204Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List204Response {
  repeated Message204 results = 1;
  string next_page_token = 2;
}

message Create204Request {
  Message204 message = 1;
}

message Create204Response {
  Message204 result = 1;
}
