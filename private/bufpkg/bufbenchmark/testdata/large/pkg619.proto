syntax = "proto3";

package benchmark.pkg619;

// Message with various field types
message Message619 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage619 nested = 7;
  Status619 status = 8;
}

// Nested message type
message NestedMessage619 {
  string name = 1;
  int32 value = 2;
  repeated Item619 items = 3;
}

// Simple item message
message Item619 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status619 {
  STATUS_619_UNSPECIFIED = 0;
  STATUS_619_ACTIVE = 1;
  STATUS_619_INACTIVE = 2;
  STATUS_619_PENDING = 3;
}

// Service definition
service Service619 {
  rpc Get619(Get619Request) returns (Get619Response);
  rpc List619(List619Request) returns (List619Response);
  rpc Create619(Create619Request) returns (Create619Response);
}

message Get619Request {
  string id = 1;
}

message Get619Response {
  Message619 result = 1;
}

message List619Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List619Response {
  repeated Message619 results = 1;
  string next_page_token = 2;
}

message Create619Request {
  Message619 message = 1;
}

message Create619Response {
  Message619 result = 1;
}
