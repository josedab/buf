syntax = "proto3";

package benchmark.pkg47;

// Message with various field types
message Message47 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage47 nested = 7;
  Status47 status = 8;
}

// Nested message type
message NestedMessage47 {
  string name = 1;
  int32 value = 2;
  repeated Item47 items = 3;
}

// Simple item message
message Item47 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status47 {
  STATUS_47_UNSPECIFIED = 0;
  STATUS_47_ACTIVE = 1;
  STATUS_47_INACTIVE = 2;
  STATUS_47_PENDING = 3;
}

// Service definition
service Service47 {
  rpc Get47(Get47Request) returns (Get47Response);
  rpc List47(List47Request) returns (List47Response);
  rpc Create47(Create47Request) returns (Create47Response);
}

message Get47Request {
  string id = 1;
}

message Get47Response {
  Message47 result = 1;
}

message List47Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List47Response {
  repeated Message47 results = 1;
  string next_page_token = 2;
}

message Create47Request {
  Message47 message = 1;
}

message Create47Response {
  Message47 result = 1;
}
