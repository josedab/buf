syntax = "proto3";

package benchmark.pkg585;

// Message with various field types
message Message585 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage585 nested = 7;
  Status585 status = 8;
}

// Nested message type
message NestedMessage585 {
  string name = 1;
  int32 value = 2;
  repeated Item585 items = 3;
}

// Simple item message
message Item585 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status585 {
  STATUS_585_UNSPECIFIED = 0;
  STATUS_585_ACTIVE = 1;
  STATUS_585_INACTIVE = 2;
  STATUS_585_PENDING = 3;
}

// Service definition
service Service585 {
  rpc Get585(Get585Request) returns (Get585Response);
  rpc List585(List585Request) returns (List585Response);
  rpc Create585(Create585Request) returns (Create585Response);
}

message Get585Request {
  string id = 1;
}

message Get585Response {
  Message585 result = 1;
}

message List585Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List585Response {
  repeated Message585 results = 1;
  string next_page_token = 2;
}

message Create585Request {
  Message585 message = 1;
}

message Create585Response {
  Message585 result = 1;
}
