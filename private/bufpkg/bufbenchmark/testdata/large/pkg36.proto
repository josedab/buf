syntax = "proto3";

package benchmark.pkg36;

// Message with various field types
message Message36 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage36 nested = 7;
  Status36 status = 8;
}

// Nested message type
message NestedMessage36 {
  string name = 1;
  int32 value = 2;
  repeated Item36 items = 3;
}

// Simple item message
message Item36 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status36 {
  STATUS_36_UNSPECIFIED = 0;
  STATUS_36_ACTIVE = 1;
  STATUS_36_INACTIVE = 2;
  STATUS_36_PENDING = 3;
}

// Service definition
service Service36 {
  rpc Get36(Get36Request) returns (Get36Response);
  rpc List36(List36Request) returns (List36Response);
  rpc Create36(Create36Request) returns (Create36Response);
}

message Get36Request {
  string id = 1;
}

message Get36Response {
  Message36 result = 1;
}

message List36Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List36Response {
  repeated Message36 results = 1;
  string next_page_token = 2;
}

message Create36Request {
  Message36 message = 1;
}

message Create36Response {
  Message36 result = 1;
}
