syntax = "proto3";

package benchmark.pkg923;

// Message with various field types
message Message923 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage923 nested = 7;
  Status923 status = 8;
}

// Nested message type
message NestedMessage923 {
  string name = 1;
  int32 value = 2;
  repeated Item923 items = 3;
}

// Simple item message
message Item923 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status923 {
  STATUS_923_UNSPECIFIED = 0;
  STATUS_923_ACTIVE = 1;
  STATUS_923_INACTIVE = 2;
  STATUS_923_PENDING = 3;
}

// Service definition
service Service923 {
  rpc Get923(Get923Request) returns (Get923Response);
  rpc List923(List923Request) returns (List923Response);
  rpc Create923(Create923Request) returns (Create923Response);
}

message Get923Request {
  string id = 1;
}

message Get923Response {
  Message923 result = 1;
}

message List923Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List923Response {
  repeated Message923 results = 1;
  string next_page_token = 2;
}

message Create923Request {
  Message923 message = 1;
}

message Create923Response {
  Message923 result = 1;
}
