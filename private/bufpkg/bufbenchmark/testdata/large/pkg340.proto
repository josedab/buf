syntax = "proto3";

package benchmark.pkg340;

// Message with various field types
message Message340 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage340 nested = 7;
  Status340 status = 8;
}

// Nested message type
message NestedMessage340 {
  string name = 1;
  int32 value = 2;
  repeated Item340 items = 3;
}

// Simple item message
message Item340 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status340 {
  STATUS_340_UNSPECIFIED = 0;
  STATUS_340_ACTIVE = 1;
  STATUS_340_INACTIVE = 2;
  STATUS_340_PENDING = 3;
}

// Service definition
service Service340 {
  rpc Get340(Get340Request) returns (Get340Response);
  rpc List340(List340Request) returns (List340Response);
  rpc Create340(Create340Request) returns (Create340Response);
}

message Get340Request {
  string id = 1;
}

message Get340Response {
  Message340 result = 1;
}

message List340Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List340Response {
  repeated Message340 results = 1;
  string next_page_token = 2;
}

message Create340Request {
  Message340 message = 1;
}

message Create340Response {
  Message340 result = 1;
}
