syntax = "proto3";

package benchmark.pkg183;

// Message with various field types
message Message183 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage183 nested = 7;
  Status183 status = 8;
}

// Nested message type
message NestedMessage183 {
  string name = 1;
  int32 value = 2;
  repeated Item183 items = 3;
}

// Simple item message
message Item183 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status183 {
  STATUS_183_UNSPECIFIED = 0;
  STATUS_183_ACTIVE = 1;
  STATUS_183_INACTIVE = 2;
  STATUS_183_PENDING = 3;
}

// Service definition
service Service183 {
  rpc Get183(Get183Request) returns (Get183Response);
  rpc List183(List183Request) returns (List183Response);
  rpc Create183(Create183Request) returns (Create183Response);
}

message Get183Request {
  string id = 1;
}

message Get183Response {
  Message183 result = 1;
}

message List183Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List183Response {
  repeated Message183 results = 1;
  string next_page_token = 2;
}

message Create183Request {
  Message183 message = 1;
}

message Create183Response {
  Message183 result = 1;
}
