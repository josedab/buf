syntax = "proto3";

package benchmark.pkg434;

// Message with various field types
message Message434 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage434 nested = 7;
  Status434 status = 8;
}

// Nested message type
message NestedMessage434 {
  string name = 1;
  int32 value = 2;
  repeated Item434 items = 3;
}

// Simple item message
message Item434 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status434 {
  STATUS_434_UNSPECIFIED = 0;
  STATUS_434_ACTIVE = 1;
  STATUS_434_INACTIVE = 2;
  STATUS_434_PENDING = 3;
}

// Service definition
service Service434 {
  rpc Get434(Get434Request) returns (Get434Response);
  rpc List434(List434Request) returns (List434Response);
  rpc Create434(Create434Request) returns (Create434Response);
}

message Get434Request {
  string id = 1;
}

message Get434Response {
  Message434 result = 1;
}

message List434Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List434Response {
  repeated Message434 results = 1;
  string next_page_token = 2;
}

message Create434Request {
  Message434 message = 1;
}

message Create434Response {
  Message434 result = 1;
}
