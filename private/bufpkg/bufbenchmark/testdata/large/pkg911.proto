syntax = "proto3";

package benchmark.pkg911;

// Message with various field types
message Message911 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage911 nested = 7;
  Status911 status = 8;
}

// Nested message type
message NestedMessage911 {
  string name = 1;
  int32 value = 2;
  repeated Item911 items = 3;
}

// Simple item message
message Item911 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status911 {
  STATUS_911_UNSPECIFIED = 0;
  STATUS_911_ACTIVE = 1;
  STATUS_911_INACTIVE = 2;
  STATUS_911_PENDING = 3;
}

// Service definition
service Service911 {
  rpc Get911(Get911Request) returns (Get911Response);
  rpc List911(List911Request) returns (List911Response);
  rpc Create911(Create911Request) returns (Create911Response);
}

message Get911Request {
  string id = 1;
}

message Get911Response {
  Message911 result = 1;
}

message List911Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List911Response {
  repeated Message911 results = 1;
  string next_page_token = 2;
}

message Create911Request {
  Message911 message = 1;
}

message Create911Response {
  Message911 result = 1;
}
