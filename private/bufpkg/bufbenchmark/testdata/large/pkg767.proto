syntax = "proto3";

package benchmark.pkg767;

// Message with various field types
message Message767 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage767 nested = 7;
  Status767 status = 8;
}

// Nested message type
message NestedMessage767 {
  string name = 1;
  int32 value = 2;
  repeated Item767 items = 3;
}

// Simple item message
message Item767 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status767 {
  STATUS_767_UNSPECIFIED = 0;
  STATUS_767_ACTIVE = 1;
  STATUS_767_INACTIVE = 2;
  STATUS_767_PENDING = 3;
}

// Service definition
service Service767 {
  rpc Get767(Get767Request) returns (Get767Response);
  rpc List767(List767Request) returns (List767Response);
  rpc Create767(Create767Request) returns (Create767Response);
}

message Get767Request {
  string id = 1;
}

message Get767Response {
  Message767 result = 1;
}

message List767Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List767Response {
  repeated Message767 results = 1;
  string next_page_token = 2;
}

message Create767Request {
  Message767 message = 1;
}

message Create767Response {
  Message767 result = 1;
}
