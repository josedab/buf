syntax = "proto3";

package benchmark.pkg790;

// Message with various field types
message Message790 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage790 nested = 7;
  Status790 status = 8;
}

// Nested message type
message NestedMessage790 {
  string name = 1;
  int32 value = 2;
  repeated Item790 items = 3;
}

// Simple item message
message Item790 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status790 {
  STATUS_790_UNSPECIFIED = 0;
  STATUS_790_ACTIVE = 1;
  STATUS_790_INACTIVE = 2;
  STATUS_790_PENDING = 3;
}

// Service definition
service Service790 {
  rpc Get790(Get790Request) returns (Get790Response);
  rpc List790(List790Request) returns (List790Response);
  rpc Create790(Create790Request) returns (Create790Response);
}

message Get790Request {
  string id = 1;
}

message Get790Response {
  Message790 result = 1;
}

message List790Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List790Response {
  repeated Message790 results = 1;
  string next_page_token = 2;
}

message Create790Request {
  Message790 message = 1;
}

message Create790Response {
  Message790 result = 1;
}
