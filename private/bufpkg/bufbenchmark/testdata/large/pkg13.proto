syntax = "proto3";

package benchmark.pkg13;

// Message with various field types
message Message13 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage13 nested = 7;
  Status13 status = 8;
}

// Nested message type
message NestedMessage13 {
  string name = 1;
  int32 value = 2;
  repeated Item13 items = 3;
}

// Simple item message
message Item13 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status13 {
  STATUS_13_UNSPECIFIED = 0;
  STATUS_13_ACTIVE = 1;
  STATUS_13_INACTIVE = 2;
  STATUS_13_PENDING = 3;
}

// Service definition
service Service13 {
  rpc Get13(Get13Request) returns (Get13Response);
  rpc List13(List13Request) returns (List13Response);
  rpc Create13(Create13Request) returns (Create13Response);
}

message Get13Request {
  string id = 1;
}

message Get13Response {
  Message13 result = 1;
}

message List13Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List13Response {
  repeated Message13 results = 1;
  string next_page_token = 2;
}

message Create13Request {
  Message13 message = 1;
}

message Create13Response {
  Message13 result = 1;
}
