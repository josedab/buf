syntax = "proto3";

package benchmark.pkg401;

// Message with various field types
message Message401 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage401 nested = 7;
  Status401 status = 8;
}

// Nested message type
message NestedMessage401 {
  string name = 1;
  int32 value = 2;
  repeated Item401 items = 3;
}

// Simple item message
message Item401 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status401 {
  STATUS_401_UNSPECIFIED = 0;
  STATUS_401_ACTIVE = 1;
  STATUS_401_INACTIVE = 2;
  STATUS_401_PENDING = 3;
}

// Service definition
service Service401 {
  rpc Get401(Get401Request) returns (Get401Response);
  rpc List401(List401Request) returns (List401Response);
  rpc Create401(Create401Request) returns (Create401Response);
}

message Get401Request {
  string id = 1;
}

message Get401Response {
  Message401 result = 1;
}

message List401Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List401Response {
  repeated Message401 results = 1;
  string next_page_token = 2;
}

message Create401Request {
  Message401 message = 1;
}

message Create401Response {
  Message401 result = 1;
}
