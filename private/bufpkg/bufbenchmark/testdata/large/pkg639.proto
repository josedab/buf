syntax = "proto3";

package benchmark.pkg639;

// Message with various field types
message Message639 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage639 nested = 7;
  Status639 status = 8;
}

// Nested message type
message NestedMessage639 {
  string name = 1;
  int32 value = 2;
  repeated Item639 items = 3;
}

// Simple item message
message Item639 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status639 {
  STATUS_639_UNSPECIFIED = 0;
  STATUS_639_ACTIVE = 1;
  STATUS_639_INACTIVE = 2;
  STATUS_639_PENDING = 3;
}

// Service definition
service Service639 {
  rpc Get639(Get639Request) returns (Get639Response);
  rpc List639(List639Request) returns (List639Response);
  rpc Create639(Create639Request) returns (Create639Response);
}

message Get639Request {
  string id = 1;
}

message Get639Response {
  Message639 result = 1;
}

message List639Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List639Response {
  repeated Message639 results = 1;
  string next_page_token = 2;
}

message Create639Request {
  Message639 message = 1;
}

message Create639Response {
  Message639 result = 1;
}
