syntax = "proto3";

package benchmark.pkg196;

// Message with various field types
message Message196 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage196 nested = 7;
  Status196 status = 8;
}

// Nested message type
message NestedMessage196 {
  string name = 1;
  int32 value = 2;
  repeated Item196 items = 3;
}

// Simple item message
message Item196 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status196 {
  STATUS_196_UNSPECIFIED = 0;
  STATUS_196_ACTIVE = 1;
  STATUS_196_INACTIVE = 2;
  STATUS_196_PENDING = 3;
}

// Service definition
service Service196 {
  rpc Get196(Get196Request) returns (Get196Response);
  rpc List196(List196Request) returns (List196Response);
  rpc Create196(Create196Request) returns (Create196Response);
}

message Get196Request {
  string id = 1;
}

message Get196Response {
  Message196 result = 1;
}

message List196Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List196Response {
  repeated Message196 results = 1;
  string next_page_token = 2;
}

message Create196Request {
  Message196 message = 1;
}

message Create196Response {
  Message196 result = 1;
}
