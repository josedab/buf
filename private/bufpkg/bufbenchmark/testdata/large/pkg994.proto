syntax = "proto3";

package benchmark.pkg994;

// Message with various field types
message Message994 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage994 nested = 7;
  Status994 status = 8;
}

// Nested message type
message NestedMessage994 {
  string name = 1;
  int32 value = 2;
  repeated Item994 items = 3;
}

// Simple item message
message Item994 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status994 {
  STATUS_994_UNSPECIFIED = 0;
  STATUS_994_ACTIVE = 1;
  STATUS_994_INACTIVE = 2;
  STATUS_994_PENDING = 3;
}

// Service definition
service Service994 {
  rpc Get994(Get994Request) returns (Get994Response);
  rpc List994(List994Request) returns (List994Response);
  rpc Create994(Create994Request) returns (Create994Response);
}

message Get994Request {
  string id = 1;
}

message Get994Response {
  Message994 result = 1;
}

message List994Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List994Response {
  repeated Message994 results = 1;
  string next_page_token = 2;
}

message Create994Request {
  Message994 message = 1;
}

message Create994Response {
  Message994 result = 1;
}
