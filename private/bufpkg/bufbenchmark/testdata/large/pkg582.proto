syntax = "proto3";

package benchmark.pkg582;

// Message with various field types
message Message582 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage582 nested = 7;
  Status582 status = 8;
}

// Nested message type
message NestedMessage582 {
  string name = 1;
  int32 value = 2;
  repeated Item582 items = 3;
}

// Simple item message
message Item582 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status582 {
  STATUS_582_UNSPECIFIED = 0;
  STATUS_582_ACTIVE = 1;
  STATUS_582_INACTIVE = 2;
  STATUS_582_PENDING = 3;
}

// Service definition
service Service582 {
  rpc Get582(Get582Request) returns (Get582Response);
  rpc List582(List582Request) returns (List582Response);
  rpc Create582(Create582Request) returns (Create582Response);
}

message Get582Request {
  string id = 1;
}

message Get582Response {
  Message582 result = 1;
}

message List582Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List582Response {
  repeated Message582 results = 1;
  string next_page_token = 2;
}

message Create582Request {
  Message582 message = 1;
}

message Create582Response {
  Message582 result = 1;
}
