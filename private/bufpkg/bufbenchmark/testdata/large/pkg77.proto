syntax = "proto3";

package benchmark.pkg77;

// Message with various field types
message Message77 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage77 nested = 7;
  Status77 status = 8;
}

// Nested message type
message NestedMessage77 {
  string name = 1;
  int32 value = 2;
  repeated Item77 items = 3;
}

// Simple item message
message Item77 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status77 {
  STATUS_77_UNSPECIFIED = 0;
  STATUS_77_ACTIVE = 1;
  STATUS_77_INACTIVE = 2;
  STATUS_77_PENDING = 3;
}

// Service definition
service Service77 {
  rpc Get77(Get77Request) returns (Get77Response);
  rpc List77(List77Request) returns (List77Response);
  rpc Create77(Create77Request) returns (Create77Response);
}

message Get77Request {
  string id = 1;
}

message Get77Response {
  Message77 result = 1;
}

message List77Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List77Response {
  repeated Message77 results = 1;
  string next_page_token = 2;
}

message Create77Request {
  Message77 message = 1;
}

message Create77Response {
  Message77 result = 1;
}
