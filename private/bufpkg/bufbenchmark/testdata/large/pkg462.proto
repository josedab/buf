syntax = "proto3";

package benchmark.pkg462;

// Message with various field types
message Message462 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage462 nested = 7;
  Status462 status = 8;
}

// Nested message type
message NestedMessage462 {
  string name = 1;
  int32 value = 2;
  repeated Item462 items = 3;
}

// Simple item message
message Item462 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status462 {
  STATUS_462_UNSPECIFIED = 0;
  STATUS_462_ACTIVE = 1;
  STATUS_462_INACTIVE = 2;
  STATUS_462_PENDING = 3;
}

// Service definition
service Service462 {
  rpc Get462(Get462Request) returns (Get462Response);
  rpc List462(List462Request) returns (List462Response);
  rpc Create462(Create462Request) returns (Create462Response);
}

message Get462Request {
  string id = 1;
}

message Get462Response {
  Message462 result = 1;
}

message List462Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List462Response {
  repeated Message462 results = 1;
  string next_page_token = 2;
}

message Create462Request {
  Message462 message = 1;
}

message Create462Response {
  Message462 result = 1;
}
