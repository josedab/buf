syntax = "proto3";

package benchmark.pkg704;

// Message with various field types
message Message704 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage704 nested = 7;
  Status704 status = 8;
}

// Nested message type
message NestedMessage704 {
  string name = 1;
  int32 value = 2;
  repeated Item704 items = 3;
}

// Simple item message
message Item704 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status704 {
  STATUS_704_UNSPECIFIED = 0;
  STATUS_704_ACTIVE = 1;
  STATUS_704_INACTIVE = 2;
  STATUS_704_PENDING = 3;
}

// Service definition
service Service704 {
  rpc Get704(Get704Request) returns (Get704Response);
  rpc List704(List704Request) returns (List704Response);
  rpc Create704(Create704Request) returns (Create704Response);
}

message Get704Request {
  string id = 1;
}

message Get704Response {
  Message704 result = 1;
}

message List704Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List704Response {
  repeated Message704 results = 1;
  string next_page_token = 2;
}

message Create704Request {
  Message704 message = 1;
}

message Create704Response {
  Message704 result = 1;
}
