syntax = "proto3";

package benchmark.pkg177;

// Message with various field types
message Message177 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage177 nested = 7;
  Status177 status = 8;
}

// Nested message type
message NestedMessage177 {
  string name = 1;
  int32 value = 2;
  repeated Item177 items = 3;
}

// Simple item message
message Item177 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status177 {
  STATUS_177_UNSPECIFIED = 0;
  STATUS_177_ACTIVE = 1;
  STATUS_177_INACTIVE = 2;
  STATUS_177_PENDING = 3;
}

// Service definition
service Service177 {
  rpc Get177(Get177Request) returns (Get177Response);
  rpc List177(List177Request) returns (List177Response);
  rpc Create177(Create177Request) returns (Create177Response);
}

message Get177Request {
  string id = 1;
}

message Get177Response {
  Message177 result = 1;
}

message List177Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List177Response {
  repeated Message177 results = 1;
  string next_page_token = 2;
}

message Create177Request {
  Message177 message = 1;
}

message Create177Response {
  Message177 result = 1;
}
