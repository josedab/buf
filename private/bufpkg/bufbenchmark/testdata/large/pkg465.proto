syntax = "proto3";

package benchmark.pkg465;

// Message with various field types
message Message465 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage465 nested = 7;
  Status465 status = 8;
}

// Nested message type
message NestedMessage465 {
  string name = 1;
  int32 value = 2;
  repeated Item465 items = 3;
}

// Simple item message
message Item465 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status465 {
  STATUS_465_UNSPECIFIED = 0;
  STATUS_465_ACTIVE = 1;
  STATUS_465_INACTIVE = 2;
  STATUS_465_PENDING = 3;
}

// Service definition
service Service465 {
  rpc Get465(Get465Request) returns (Get465Response);
  rpc List465(List465Request) returns (List465Response);
  rpc Create465(Create465Request) returns (Create465Response);
}

message Get465Request {
  string id = 1;
}

message Get465Response {
  Message465 result = 1;
}

message List465Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List465Response {
  repeated Message465 results = 1;
  string next_page_token = 2;
}

message Create465Request {
  Message465 message = 1;
}

message Create465Response {
  Message465 result = 1;
}
