syntax = "proto3";

package benchmark.pkg78;

// Message with various field types
message Message78 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage78 nested = 7;
  Status78 status = 8;
}

// Nested message type
message NestedMessage78 {
  string name = 1;
  int32 value = 2;
  repeated Item78 items = 3;
}

// Simple item message
message Item78 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status78 {
  STATUS_78_UNSPECIFIED = 0;
  STATUS_78_ACTIVE = 1;
  STATUS_78_INACTIVE = 2;
  STATUS_78_PENDING = 3;
}

// Service definition
service Service78 {
  rpc Get78(Get78Request) returns (Get78Response);
  rpc List78(List78Request) returns (List78Response);
  rpc Create78(Create78Request) returns (Create78Response);
}

message Get78Request {
  string id = 1;
}

message Get78Response {
  Message78 result = 1;
}

message List78Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List78Response {
  repeated Message78 results = 1;
  string next_page_token = 2;
}

message Create78Request {
  Message78 message = 1;
}

message Create78Response {
  Message78 result = 1;
}
