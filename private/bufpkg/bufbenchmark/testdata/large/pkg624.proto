syntax = "proto3";

package benchmark.pkg624;

// Message with various field types
message Message624 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage624 nested = 7;
  Status624 status = 8;
}

// Nested message type
message NestedMessage624 {
  string name = 1;
  int32 value = 2;
  repeated Item624 items = 3;
}

// Simple item message
message Item624 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status624 {
  STATUS_624_UNSPECIFIED = 0;
  STATUS_624_ACTIVE = 1;
  STATUS_624_INACTIVE = 2;
  STATUS_624_PENDING = 3;
}

// Service definition
service Service624 {
  rpc Get624(Get624Request) returns (Get624Response);
  rpc List624(List624Request) returns (List624Response);
  rpc Create624(Create624Request) returns (Create624Response);
}

message Get624Request {
  string id = 1;
}

message Get624Response {
  Message624 result = 1;
}

message List624Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List624Response {
  repeated Message624 results = 1;
  string next_page_token = 2;
}

message Create624Request {
  Message624 message = 1;
}

message Create624Response {
  Message624 result = 1;
}
