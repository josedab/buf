syntax = "proto3";

package benchmark.pkg374;

// Message with various field types
message Message374 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage374 nested = 7;
  Status374 status = 8;
}

// Nested message type
message NestedMessage374 {
  string name = 1;
  int32 value = 2;
  repeated Item374 items = 3;
}

// Simple item message
message Item374 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status374 {
  STATUS_374_UNSPECIFIED = 0;
  STATUS_374_ACTIVE = 1;
  STATUS_374_INACTIVE = 2;
  STATUS_374_PENDING = 3;
}

// Service definition
service Service374 {
  rpc Get374(Get374Request) returns (Get374Response);
  rpc List374(List374Request) returns (List374Response);
  rpc Create374(Create374Request) returns (Create374Response);
}

message Get374Request {
  string id = 1;
}

message Get374Response {
  Message374 result = 1;
}

message List374Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List374Response {
  repeated Message374 results = 1;
  string next_page_token = 2;
}

message Create374Request {
  Message374 message = 1;
}

message Create374Response {
  Message374 result = 1;
}
