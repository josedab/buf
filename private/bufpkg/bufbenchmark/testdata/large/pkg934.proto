syntax = "proto3";

package benchmark.pkg934;

// Message with various field types
message Message934 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage934 nested = 7;
  Status934 status = 8;
}

// Nested message type
message NestedMessage934 {
  string name = 1;
  int32 value = 2;
  repeated Item934 items = 3;
}

// Simple item message
message Item934 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status934 {
  STATUS_934_UNSPECIFIED = 0;
  STATUS_934_ACTIVE = 1;
  STATUS_934_INACTIVE = 2;
  STATUS_934_PENDING = 3;
}

// Service definition
service Service934 {
  rpc Get934(Get934Request) returns (Get934Response);
  rpc List934(List934Request) returns (List934Response);
  rpc Create934(Create934Request) returns (Create934Response);
}

message Get934Request {
  string id = 1;
}

message Get934Response {
  Message934 result = 1;
}

message List934Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List934Response {
  repeated Message934 results = 1;
  string next_page_token = 2;
}

message Create934Request {
  Message934 message = 1;
}

message Create934Response {
  Message934 result = 1;
}
