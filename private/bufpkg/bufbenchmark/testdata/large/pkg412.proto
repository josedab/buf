syntax = "proto3";

package benchmark.pkg412;

// Message with various field types
message Message412 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage412 nested = 7;
  Status412 status = 8;
}

// Nested message type
message NestedMessage412 {
  string name = 1;
  int32 value = 2;
  repeated Item412 items = 3;
}

// Simple item message
message Item412 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status412 {
  STATUS_412_UNSPECIFIED = 0;
  STATUS_412_ACTIVE = 1;
  STATUS_412_INACTIVE = 2;
  STATUS_412_PENDING = 3;
}

// Service definition
service Service412 {
  rpc Get412(Get412Request) returns (Get412Response);
  rpc List412(List412Request) returns (List412Response);
  rpc Create412(Create412Request) returns (Create412Response);
}

message Get412Request {
  string id = 1;
}

message Get412Response {
  Message412 result = 1;
}

message List412Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List412Response {
  repeated Message412 results = 1;
  string next_page_token = 2;
}

message Create412Request {
  Message412 message = 1;
}

message Create412Response {
  Message412 result = 1;
}
