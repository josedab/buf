syntax = "proto3";

package benchmark.pkg534;

// Message with various field types
message Message534 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage534 nested = 7;
  Status534 status = 8;
}

// Nested message type
message NestedMessage534 {
  string name = 1;
  int32 value = 2;
  repeated Item534 items = 3;
}

// Simple item message
message Item534 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status534 {
  STATUS_534_UNSPECIFIED = 0;
  STATUS_534_ACTIVE = 1;
  STATUS_534_INACTIVE = 2;
  STATUS_534_PENDING = 3;
}

// Service definition
service Service534 {
  rpc Get534(Get534Request) returns (Get534Response);
  rpc List534(List534Request) returns (List534Response);
  rpc Create534(Create534Request) returns (Create534Response);
}

message Get534Request {
  string id = 1;
}

message Get534Response {
  Message534 result = 1;
}

message List534Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List534Response {
  repeated Message534 results = 1;
  string next_page_token = 2;
}

message Create534Request {
  Message534 message = 1;
}

message Create534Response {
  Message534 result = 1;
}
