syntax = "proto3";

package benchmark.pkg971;

// Message with various field types
message Message971 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage971 nested = 7;
  Status971 status = 8;
}

// Nested message type
message NestedMessage971 {
  string name = 1;
  int32 value = 2;
  repeated Item971 items = 3;
}

// Simple item message
message Item971 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status971 {
  STATUS_971_UNSPECIFIED = 0;
  STATUS_971_ACTIVE = 1;
  STATUS_971_INACTIVE = 2;
  STATUS_971_PENDING = 3;
}

// Service definition
service Service971 {
  rpc Get971(Get971Request) returns (Get971Response);
  rpc List971(List971Request) returns (List971Response);
  rpc Create971(Create971Request) returns (Create971Response);
}

message Get971Request {
  string id = 1;
}

message Get971Response {
  Message971 result = 1;
}

message List971Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List971Response {
  repeated Message971 results = 1;
  string next_page_token = 2;
}

message Create971Request {
  Message971 message = 1;
}

message Create971Response {
  Message971 result = 1;
}
