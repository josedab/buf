syntax = "proto3";

package benchmark.pkg878;

// Message with various field types
message Message878 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage878 nested = 7;
  Status878 status = 8;
}

// Nested message type
message NestedMessage878 {
  string name = 1;
  int32 value = 2;
  repeated Item878 items = 3;
}

// Simple item message
message Item878 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status878 {
  STATUS_878_UNSPECIFIED = 0;
  STATUS_878_ACTIVE = 1;
  STATUS_878_INACTIVE = 2;
  STATUS_878_PENDING = 3;
}

// Service definition
service Service878 {
  rpc Get878(Get878Request) returns (Get878Response);
  rpc List878(List878Request) returns (List878Response);
  rpc Create878(Create878Request) returns (Create878Response);
}

message Get878Request {
  string id = 1;
}

message Get878Response {
  Message878 result = 1;
}

message List878Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List878Response {
  repeated Message878 results = 1;
  string next_page_token = 2;
}

message Create878Request {
  Message878 message = 1;
}

message Create878Response {
  Message878 result = 1;
}
