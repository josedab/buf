syntax = "proto3";

package benchmark.pkg488;

// Message with various field types
message Message488 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage488 nested = 7;
  Status488 status = 8;
}

// Nested message type
message NestedMessage488 {
  string name = 1;
  int32 value = 2;
  repeated Item488 items = 3;
}

// Simple item message
message Item488 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status488 {
  STATUS_488_UNSPECIFIED = 0;
  STATUS_488_ACTIVE = 1;
  STATUS_488_INACTIVE = 2;
  STATUS_488_PENDING = 3;
}

// Service definition
service Service488 {
  rpc Get488(Get488Request) returns (Get488Response);
  rpc List488(List488Request) returns (List488Response);
  rpc Create488(Create488Request) returns (Create488Response);
}

message Get488Request {
  string id = 1;
}

message Get488Response {
  Message488 result = 1;
}

message List488Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List488Response {
  repeated Message488 results = 1;
  string next_page_token = 2;
}

message Create488Request {
  Message488 message = 1;
}

message Create488Response {
  Message488 result = 1;
}
