syntax = "proto3";

package benchmark.pkg372;

// Message with various field types
message Message372 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage372 nested = 7;
  Status372 status = 8;
}

// Nested message type
message NestedMessage372 {
  string name = 1;
  int32 value = 2;
  repeated Item372 items = 3;
}

// Simple item message
message Item372 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status372 {
  STATUS_372_UNSPECIFIED = 0;
  STATUS_372_ACTIVE = 1;
  STATUS_372_INACTIVE = 2;
  STATUS_372_PENDING = 3;
}

// Service definition
service Service372 {
  rpc Get372(Get372Request) returns (Get372Response);
  rpc List372(List372Request) returns (List372Response);
  rpc Create372(Create372Request) returns (Create372Response);
}

message Get372Request {
  string id = 1;
}

message Get372Response {
  Message372 result = 1;
}

message List372Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List372Response {
  repeated Message372 results = 1;
  string next_page_token = 2;
}

message Create372Request {
  Message372 message = 1;
}

message Create372Response {
  Message372 result = 1;
}
