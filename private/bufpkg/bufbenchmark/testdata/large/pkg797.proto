syntax = "proto3";

package benchmark.pkg797;

// Message with various field types
message Message797 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage797 nested = 7;
  Status797 status = 8;
}

// Nested message type
message NestedMessage797 {
  string name = 1;
  int32 value = 2;
  repeated Item797 items = 3;
}

// Simple item message
message Item797 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status797 {
  STATUS_797_UNSPECIFIED = 0;
  STATUS_797_ACTIVE = 1;
  STATUS_797_INACTIVE = 2;
  STATUS_797_PENDING = 3;
}

// Service definition
service Service797 {
  rpc Get797(Get797Request) returns (Get797Response);
  rpc List797(List797Request) returns (List797Response);
  rpc Create797(Create797Request) returns (Create797Response);
}

message Get797Request {
  string id = 1;
}

message Get797Response {
  Message797 result = 1;
}

message List797Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List797Response {
  repeated Message797 results = 1;
  string next_page_token = 2;
}

message Create797Request {
  Message797 message = 1;
}

message Create797Response {
  Message797 result = 1;
}
