syntax = "proto3";

package benchmark.pkg909;

// Message with various field types
message Message909 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage909 nested = 7;
  Status909 status = 8;
}

// Nested message type
message NestedMessage909 {
  string name = 1;
  int32 value = 2;
  repeated Item909 items = 3;
}

// Simple item message
message Item909 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status909 {
  STATUS_909_UNSPECIFIED = 0;
  STATUS_909_ACTIVE = 1;
  STATUS_909_INACTIVE = 2;
  STATUS_909_PENDING = 3;
}

// Service definition
service Service909 {
  rpc Get909(Get909Request) returns (Get909Response);
  rpc List909(List909Request) returns (List909Response);
  rpc Create909(Create909Request) returns (Create909Response);
}

message Get909Request {
  string id = 1;
}

message Get909Response {
  Message909 result = 1;
}

message List909Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List909Response {
  repeated Message909 results = 1;
  string next_page_token = 2;
}

message Create909Request {
  Message909 message = 1;
}

message Create909Response {
  Message909 result = 1;
}
