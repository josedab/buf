syntax = "proto3";

package benchmark.pkg375;

// Message with various field types
message Message375 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage375 nested = 7;
  Status375 status = 8;
}

// Nested message type
message NestedMessage375 {
  string name = 1;
  int32 value = 2;
  repeated Item375 items = 3;
}

// Simple item message
message Item375 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status375 {
  STATUS_375_UNSPECIFIED = 0;
  STATUS_375_ACTIVE = 1;
  STATUS_375_INACTIVE = 2;
  STATUS_375_PENDING = 3;
}

// Service definition
service Service375 {
  rpc Get375(Get375Request) returns (Get375Response);
  rpc List375(List375Request) returns (List375Response);
  rpc Create375(Create375Request) returns (Create375Response);
}

message Get375Request {
  string id = 1;
}

message Get375Response {
  Message375 result = 1;
}

message List375Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List375Response {
  repeated Message375 results = 1;
  string next_page_token = 2;
}

message Create375Request {
  Message375 message = 1;
}

message Create375Response {
  Message375 result = 1;
}
