syntax = "proto3";

package benchmark.pkg286;

// Message with various field types
message Message286 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage286 nested = 7;
  Status286 status = 8;
}

// Nested message type
message NestedMessage286 {
  string name = 1;
  int32 value = 2;
  repeated Item286 items = 3;
}

// Simple item message
message Item286 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status286 {
  STATUS_286_UNSPECIFIED = 0;
  STATUS_286_ACTIVE = 1;
  STATUS_286_INACTIVE = 2;
  STATUS_286_PENDING = 3;
}

// Service definition
service Service286 {
  rpc Get286(Get286Request) returns (Get286Response);
  rpc List286(List286Request) returns (List286Response);
  rpc Create286(Create286Request) returns (Create286Response);
}

message Get286Request {
  string id = 1;
}

message Get286Response {
  Message286 result = 1;
}

message List286Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List286Response {
  repeated Message286 results = 1;
  string next_page_token = 2;
}

message Create286Request {
  Message286 message = 1;
}

message Create286Response {
  Message286 result = 1;
}
