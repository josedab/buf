syntax = "proto3";

package benchmark.pkg609;

// Message with various field types
message Message609 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage609 nested = 7;
  Status609 status = 8;
}

// Nested message type
message NestedMessage609 {
  string name = 1;
  int32 value = 2;
  repeated Item609 items = 3;
}

// Simple item message
message Item609 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status609 {
  STATUS_609_UNSPECIFIED = 0;
  STATUS_609_ACTIVE = 1;
  STATUS_609_INACTIVE = 2;
  STATUS_609_PENDING = 3;
}

// Service definition
service Service609 {
  rpc Get609(Get609Request) returns (Get609Response);
  rpc List609(List609Request) returns (List609Response);
  rpc Create609(Create609Request) returns (Create609Response);
}

message Get609Request {
  string id = 1;
}

message Get609Response {
  Message609 result = 1;
}

message List609Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List609Response {
  repeated Message609 results = 1;
  string next_page_token = 2;
}

message Create609Request {
  Message609 message = 1;
}

message Create609Response {
  Message609 result = 1;
}
