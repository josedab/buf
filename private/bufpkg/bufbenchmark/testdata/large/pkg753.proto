syntax = "proto3";

package benchmark.pkg753;

// Message with various field types
message Message753 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage753 nested = 7;
  Status753 status = 8;
}

// Nested message type
message NestedMessage753 {
  string name = 1;
  int32 value = 2;
  repeated Item753 items = 3;
}

// Simple item message
message Item753 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status753 {
  STATUS_753_UNSPECIFIED = 0;
  STATUS_753_ACTIVE = 1;
  STATUS_753_INACTIVE = 2;
  STATUS_753_PENDING = 3;
}

// Service definition
service Service753 {
  rpc Get753(Get753Request) returns (Get753Response);
  rpc List753(List753Request) returns (List753Response);
  rpc Create753(Create753Request) returns (Create753Response);
}

message Get753Request {
  string id = 1;
}

message Get753Response {
  Message753 result = 1;
}

message List753Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List753Response {
  repeated Message753 results = 1;
  string next_page_token = 2;
}

message Create753Request {
  Message753 message = 1;
}

message Create753Response {
  Message753 result = 1;
}
