syntax = "proto3";

package benchmark.pkg800;

// Message with various field types
message Message800 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage800 nested = 7;
  Status800 status = 8;
}

// Nested message type
message NestedMessage800 {
  string name = 1;
  int32 value = 2;
  repeated Item800 items = 3;
}

// Simple item message
message Item800 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status800 {
  STATUS_800_UNSPECIFIED = 0;
  STATUS_800_ACTIVE = 1;
  STATUS_800_INACTIVE = 2;
  STATUS_800_PENDING = 3;
}

// Service definition
service Service800 {
  rpc Get800(Get800Request) returns (Get800Response);
  rpc List800(List800Request) returns (List800Response);
  rpc Create800(Create800Request) returns (Create800Response);
}

message Get800Request {
  string id = 1;
}

message Get800Response {
  Message800 result = 1;
}

message List800Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List800Response {
  repeated Message800 results = 1;
  string next_page_token = 2;
}

message Create800Request {
  Message800 message = 1;
}

message Create800Response {
  Message800 result = 1;
}
