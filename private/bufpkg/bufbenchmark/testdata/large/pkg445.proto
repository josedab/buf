syntax = "proto3";

package benchmark.pkg445;

// Message with various field types
message Message445 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage445 nested = 7;
  Status445 status = 8;
}

// Nested message type
message NestedMessage445 {
  string name = 1;
  int32 value = 2;
  repeated Item445 items = 3;
}

// Simple item message
message Item445 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status445 {
  STATUS_445_UNSPECIFIED = 0;
  STATUS_445_ACTIVE = 1;
  STATUS_445_INACTIVE = 2;
  STATUS_445_PENDING = 3;
}

// Service definition
service Service445 {
  rpc Get445(Get445Request) returns (Get445Response);
  rpc List445(List445Request) returns (List445Response);
  rpc Create445(Create445Request) returns (Create445Response);
}

message Get445Request {
  string id = 1;
}

message Get445Response {
  Message445 result = 1;
}

message List445Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List445Response {
  repeated Message445 results = 1;
  string next_page_token = 2;
}

message Create445Request {
  Message445 message = 1;
}

message Create445Response {
  Message445 result = 1;
}
