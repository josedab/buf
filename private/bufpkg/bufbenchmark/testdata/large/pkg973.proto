syntax = "proto3";

package benchmark.pkg973;

// Message with various field types
message Message973 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage973 nested = 7;
  Status973 status = 8;
}

// Nested message type
message NestedMessage973 {
  string name = 1;
  int32 value = 2;
  repeated Item973 items = 3;
}

// Simple item message
message Item973 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status973 {
  STATUS_973_UNSPECIFIED = 0;
  STATUS_973_ACTIVE = 1;
  STATUS_973_INACTIVE = 2;
  STATUS_973_PENDING = 3;
}

// Service definition
service Service973 {
  rpc Get973(Get973Request) returns (Get973Response);
  rpc List973(List973Request) returns (List973Response);
  rpc Create973(Create973Request) returns (Create973Response);
}

message Get973Request {
  string id = 1;
}

message Get973Response {
  Message973 result = 1;
}

message List973Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List973Response {
  repeated Message973 results = 1;
  string next_page_token = 2;
}

message Create973Request {
  Message973 message = 1;
}

message Create973Response {
  Message973 result = 1;
}
