syntax = "proto3";

package benchmark.pkg563;

// Message with various field types
message Message563 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage563 nested = 7;
  Status563 status = 8;
}

// Nested message type
message NestedMessage563 {
  string name = 1;
  int32 value = 2;
  repeated Item563 items = 3;
}

// Simple item message
message Item563 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status563 {
  STATUS_563_UNSPECIFIED = 0;
  STATUS_563_ACTIVE = 1;
  STATUS_563_INACTIVE = 2;
  STATUS_563_PENDING = 3;
}

// Service definition
service Service563 {
  rpc Get563(Get563Request) returns (Get563Response);
  rpc List563(List563Request) returns (List563Response);
  rpc Create563(Create563Request) returns (Create563Response);
}

message Get563Request {
  string id = 1;
}

message Get563Response {
  Message563 result = 1;
}

message List563Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List563Response {
  repeated Message563 results = 1;
  string next_page_token = 2;
}

message Create563Request {
  Message563 message = 1;
}

message Create563Response {
  Message563 result = 1;
}
