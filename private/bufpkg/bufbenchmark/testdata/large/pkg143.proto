syntax = "proto3";

package benchmark.pkg143;

// Message with various field types
message Message143 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage143 nested = 7;
  Status143 status = 8;
}

// Nested message type
message NestedMessage143 {
  string name = 1;
  int32 value = 2;
  repeated Item143 items = 3;
}

// Simple item message
message Item143 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status143 {
  STATUS_143_UNSPECIFIED = 0;
  STATUS_143_ACTIVE = 1;
  STATUS_143_INACTIVE = 2;
  STATUS_143_PENDING = 3;
}

// Service definition
service Service143 {
  rpc Get143(Get143Request) returns (Get143Response);
  rpc List143(List143Request) returns (List143Response);
  rpc Create143(Create143Request) returns (Create143Response);
}

message Get143Request {
  string id = 1;
}

message Get143Response {
  Message143 result = 1;
}

message List143Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List143Response {
  repeated Message143 results = 1;
  string next_page_token = 2;
}

message Create143Request {
  Message143 message = 1;
}

message Create143Response {
  Message143 result = 1;
}
