syntax = "proto3";

package benchmark.pkg714;

// Message with various field types
message Message714 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage714 nested = 7;
  Status714 status = 8;
}

// Nested message type
message NestedMessage714 {
  string name = 1;
  int32 value = 2;
  repeated Item714 items = 3;
}

// Simple item message
message Item714 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status714 {
  STATUS_714_UNSPECIFIED = 0;
  STATUS_714_ACTIVE = 1;
  STATUS_714_INACTIVE = 2;
  STATUS_714_PENDING = 3;
}

// Service definition
service Service714 {
  rpc Get714(Get714Request) returns (Get714Response);
  rpc List714(List714Request) returns (List714Response);
  rpc Create714(Create714Request) returns (Create714Response);
}

message Get714Request {
  string id = 1;
}

message Get714Response {
  Message714 result = 1;
}

message List714Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List714Response {
  repeated Message714 results = 1;
  string next_page_token = 2;
}

message Create714Request {
  Message714 message = 1;
}

message Create714Response {
  Message714 result = 1;
}
