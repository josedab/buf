syntax = "proto3";

package benchmark.pkg236;

// Message with various field types
message Message236 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage236 nested = 7;
  Status236 status = 8;
}

// Nested message type
message NestedMessage236 {
  string name = 1;
  int32 value = 2;
  repeated Item236 items = 3;
}

// Simple item message
message Item236 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status236 {
  STATUS_236_UNSPECIFIED = 0;
  STATUS_236_ACTIVE = 1;
  STATUS_236_INACTIVE = 2;
  STATUS_236_PENDING = 3;
}

// Service definition
service Service236 {
  rpc Get236(Get236Request) returns (Get236Response);
  rpc List236(List236Request) returns (List236Response);
  rpc Create236(Create236Request) returns (Create236Response);
}

message Get236Request {
  string id = 1;
}

message Get236Response {
  Message236 result = 1;
}

message List236Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List236Response {
  repeated Message236 results = 1;
  string next_page_token = 2;
}

message Create236Request {
  Message236 message = 1;
}

message Create236Response {
  Message236 result = 1;
}
