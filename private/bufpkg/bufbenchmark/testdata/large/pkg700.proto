syntax = "proto3";

package benchmark.pkg700;

// Message with various field types
message Message700 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage700 nested = 7;
  Status700 status = 8;
}

// Nested message type
message NestedMessage700 {
  string name = 1;
  int32 value = 2;
  repeated Item700 items = 3;
}

// Simple item message
message Item700 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status700 {
  STATUS_700_UNSPECIFIED = 0;
  STATUS_700_ACTIVE = 1;
  STATUS_700_INACTIVE = 2;
  STATUS_700_PENDING = 3;
}

// Service definition
service Service700 {
  rpc Get700(Get700Request) returns (Get700Response);
  rpc List700(List700Request) returns (List700Response);
  rpc Create700(Create700Request) returns (Create700Response);
}

message Get700Request {
  string id = 1;
}

message Get700Response {
  Message700 result = 1;
}

message List700Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List700Response {
  repeated Message700 results = 1;
  string next_page_token = 2;
}

message Create700Request {
  Message700 message = 1;
}

message Create700Response {
  Message700 result = 1;
}
