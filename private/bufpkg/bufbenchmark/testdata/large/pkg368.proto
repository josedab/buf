syntax = "proto3";

package benchmark.pkg368;

// Message with various field types
message Message368 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage368 nested = 7;
  Status368 status = 8;
}

// Nested message type
message NestedMessage368 {
  string name = 1;
  int32 value = 2;
  repeated Item368 items = 3;
}

// Simple item message
message Item368 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status368 {
  STATUS_368_UNSPECIFIED = 0;
  STATUS_368_ACTIVE = 1;
  STATUS_368_INACTIVE = 2;
  STATUS_368_PENDING = 3;
}

// Service definition
service Service368 {
  rpc Get368(Get368Request) returns (Get368Response);
  rpc List368(List368Request) returns (List368Response);
  rpc Create368(Create368Request) returns (Create368Response);
}

message Get368Request {
  string id = 1;
}

message Get368Response {
  Message368 result = 1;
}

message List368Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List368Response {
  repeated Message368 results = 1;
  string next_page_token = 2;
}

message Create368Request {
  Message368 message = 1;
}

message Create368Response {
  Message368 result = 1;
}
