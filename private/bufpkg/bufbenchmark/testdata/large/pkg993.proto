syntax = "proto3";

package benchmark.pkg993;

// Message with various field types
message Message993 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage993 nested = 7;
  Status993 status = 8;
}

// Nested message type
message NestedMessage993 {
  string name = 1;
  int32 value = 2;
  repeated Item993 items = 3;
}

// Simple item message
message Item993 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status993 {
  STATUS_993_UNSPECIFIED = 0;
  STATUS_993_ACTIVE = 1;
  STATUS_993_INACTIVE = 2;
  STATUS_993_PENDING = 3;
}

// Service definition
service Service993 {
  rpc Get993(Get993Request) returns (Get993Response);
  rpc List993(List993Request) returns (List993Response);
  rpc Create993(Create993Request) returns (Create993Response);
}

message Get993Request {
  string id = 1;
}

message Get993Response {
  Message993 result = 1;
}

message List993Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List993Response {
  repeated Message993 results = 1;
  string next_page_token = 2;
}

message Create993Request {
  Message993 message = 1;
}

message Create993Response {
  Message993 result = 1;
}
