syntax = "proto3";

package benchmark.pkg426;

// Message with various field types
message Message426 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage426 nested = 7;
  Status426 status = 8;
}

// Nested message type
message NestedMessage426 {
  string name = 1;
  int32 value = 2;
  repeated Item426 items = 3;
}

// Simple item message
message Item426 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status426 {
  STATUS_426_UNSPECIFIED = 0;
  STATUS_426_ACTIVE = 1;
  STATUS_426_INACTIVE = 2;
  STATUS_426_PENDING = 3;
}

// Service definition
service Service426 {
  rpc Get426(Get426Request) returns (Get426Response);
  rpc List426(List426Request) returns (List426Response);
  rpc Create426(Create426Request) returns (Create426Response);
}

message Get426Request {
  string id = 1;
}

message Get426Response {
  Message426 result = 1;
}

message List426Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List426Response {
  repeated Message426 results = 1;
  string next_page_token = 2;
}

message Create426Request {
  Message426 message = 1;
}

message Create426Response {
  Message426 result = 1;
}
