syntax = "proto3";

package benchmark.pkg394;

// Message with various field types
message Message394 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage394 nested = 7;
  Status394 status = 8;
}

// Nested message type
message NestedMessage394 {
  string name = 1;
  int32 value = 2;
  repeated Item394 items = 3;
}

// Simple item message
message Item394 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status394 {
  STATUS_394_UNSPECIFIED = 0;
  STATUS_394_ACTIVE = 1;
  STATUS_394_INACTIVE = 2;
  STATUS_394_PENDING = 3;
}

// Service definition
service Service394 {
  rpc Get394(Get394Request) returns (Get394Response);
  rpc List394(List394Request) returns (List394Response);
  rpc Create394(Create394Request) returns (Create394Response);
}

message Get394Request {
  string id = 1;
}

message Get394Response {
  Message394 result = 1;
}

message List394Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List394Response {
  repeated Message394 results = 1;
  string next_page_token = 2;
}

message Create394Request {
  Message394 message = 1;
}

message Create394Response {
  Message394 result = 1;
}
