syntax = "proto3";

package benchmark.pkg382;

// Message with various field types
message Message382 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage382 nested = 7;
  Status382 status = 8;
}

// Nested message type
message NestedMessage382 {
  string name = 1;
  int32 value = 2;
  repeated Item382 items = 3;
}

// Simple item message
message Item382 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status382 {
  STATUS_382_UNSPECIFIED = 0;
  STATUS_382_ACTIVE = 1;
  STATUS_382_INACTIVE = 2;
  STATUS_382_PENDING = 3;
}

// Service definition
service Service382 {
  rpc Get382(Get382Request) returns (Get382Response);
  rpc List382(List382Request) returns (List382Response);
  rpc Create382(Create382Request) returns (Create382Response);
}

message Get382Request {
  string id = 1;
}

message Get382Response {
  Message382 result = 1;
}

message List382Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List382Response {
  repeated Message382 results = 1;
  string next_page_token = 2;
}

message Create382Request {
  Message382 message = 1;
}

message Create382Response {
  Message382 result = 1;
}
