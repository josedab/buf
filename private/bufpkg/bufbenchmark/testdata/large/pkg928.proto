syntax = "proto3";

package benchmark.pkg928;

// Message with various field types
message Message928 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage928 nested = 7;
  Status928 status = 8;
}

// Nested message type
message NestedMessage928 {
  string name = 1;
  int32 value = 2;
  repeated Item928 items = 3;
}

// Simple item message
message Item928 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status928 {
  STATUS_928_UNSPECIFIED = 0;
  STATUS_928_ACTIVE = 1;
  STATUS_928_INACTIVE = 2;
  STATUS_928_PENDING = 3;
}

// Service definition
service Service928 {
  rpc Get928(Get928Request) returns (Get928Response);
  rpc List928(List928Request) returns (List928Response);
  rpc Create928(Create928Request) returns (Create928Response);
}

message Get928Request {
  string id = 1;
}

message Get928Response {
  Message928 result = 1;
}

message List928Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List928Response {
  repeated Message928 results = 1;
  string next_page_token = 2;
}

message Create928Request {
  Message928 message = 1;
}

message Create928Response {
  Message928 result = 1;
}
