syntax = "proto3";

package benchmark.pkg773;

// Message with various field types
message Message773 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage773 nested = 7;
  Status773 status = 8;
}

// Nested message type
message NestedMessage773 {
  string name = 1;
  int32 value = 2;
  repeated Item773 items = 3;
}

// Simple item message
message Item773 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status773 {
  STATUS_773_UNSPECIFIED = 0;
  STATUS_773_ACTIVE = 1;
  STATUS_773_INACTIVE = 2;
  STATUS_773_PENDING = 3;
}

// Service definition
service Service773 {
  rpc Get773(Get773Request) returns (Get773Response);
  rpc List773(List773Request) returns (List773Response);
  rpc Create773(Create773Request) returns (Create773Response);
}

message Get773Request {
  string id = 1;
}

message Get773Response {
  Message773 result = 1;
}

message List773Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List773Response {
  repeated Message773 results = 1;
  string next_page_token = 2;
}

message Create773Request {
  Message773 message = 1;
}

message Create773Response {
  Message773 result = 1;
}
