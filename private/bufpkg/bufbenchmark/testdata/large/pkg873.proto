syntax = "proto3";

package benchmark.pkg873;

// Message with various field types
message Message873 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage873 nested = 7;
  Status873 status = 8;
}

// Nested message type
message NestedMessage873 {
  string name = 1;
  int32 value = 2;
  repeated Item873 items = 3;
}

// Simple item message
message Item873 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status873 {
  STATUS_873_UNSPECIFIED = 0;
  STATUS_873_ACTIVE = 1;
  STATUS_873_INACTIVE = 2;
  STATUS_873_PENDING = 3;
}

// Service definition
service Service873 {
  rpc Get873(Get873Request) returns (Get873Response);
  rpc List873(List873Request) returns (List873Response);
  rpc Create873(Create873Request) returns (Create873Response);
}

message Get873Request {
  string id = 1;
}

message Get873Response {
  Message873 result = 1;
}

message List873Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List873Response {
  repeated Message873 results = 1;
  string next_page_token = 2;
}

message Create873Request {
  Message873 message = 1;
}

message Create873Response {
  Message873 result = 1;
}
