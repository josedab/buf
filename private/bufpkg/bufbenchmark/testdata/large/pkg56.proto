syntax = "proto3";

package benchmark.pkg56;

// Message with various field types
message Message56 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage56 nested = 7;
  Status56 status = 8;
}

// Nested message type
message NestedMessage56 {
  string name = 1;
  int32 value = 2;
  repeated Item56 items = 3;
}

// Simple item message
message Item56 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status56 {
  STATUS_56_UNSPECIFIED = 0;
  STATUS_56_ACTIVE = 1;
  STATUS_56_INACTIVE = 2;
  STATUS_56_PENDING = 3;
}

// Service definition
service Service56 {
  rpc Get56(Get56Request) returns (Get56Response);
  rpc List56(List56Request) returns (List56Response);
  rpc Create56(Create56Request) returns (Create56Response);
}

message Get56Request {
  string id = 1;
}

message Get56Response {
  Message56 result = 1;
}

message List56Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List56Response {
  repeated Message56 results = 1;
  string next_page_token = 2;
}

message Create56Request {
  Message56 message = 1;
}

message Create56Response {
  Message56 result = 1;
}
