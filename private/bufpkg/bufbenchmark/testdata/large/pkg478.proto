syntax = "proto3";

package benchmark.pkg478;

// Message with various field types
message Message478 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage478 nested = 7;
  Status478 status = 8;
}

// Nested message type
message NestedMessage478 {
  string name = 1;
  int32 value = 2;
  repeated Item478 items = 3;
}

// Simple item message
message Item478 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status478 {
  STATUS_478_UNSPECIFIED = 0;
  STATUS_478_ACTIVE = 1;
  STATUS_478_INACTIVE = 2;
  STATUS_478_PENDING = 3;
}

// Service definition
service Service478 {
  rpc Get478(Get478Request) returns (Get478Response);
  rpc List478(List478Request) returns (List478Response);
  rpc Create478(Create478Request) returns (Create478Response);
}

message Get478Request {
  string id = 1;
}

message Get478Response {
  Message478 result = 1;
}

message List478Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List478Response {
  repeated Message478 results = 1;
  string next_page_token = 2;
}

message Create478Request {
  Message478 message = 1;
}

message Create478Response {
  Message478 result = 1;
}
