syntax = "proto3";

package benchmark.pkg722;

// Message with various field types
message Message722 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage722 nested = 7;
  Status722 status = 8;
}

// Nested message type
message NestedMessage722 {
  string name = 1;
  int32 value = 2;
  repeated Item722 items = 3;
}

// Simple item message
message Item722 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status722 {
  STATUS_722_UNSPECIFIED = 0;
  STATUS_722_ACTIVE = 1;
  STATUS_722_INACTIVE = 2;
  STATUS_722_PENDING = 3;
}

// Service definition
service Service722 {
  rpc Get722(Get722Request) returns (Get722Response);
  rpc List722(List722Request) returns (List722Response);
  rpc Create722(Create722Request) returns (Create722Response);
}

message Get722Request {
  string id = 1;
}

message Get722Response {
  Message722 result = 1;
}

message List722Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List722Response {
  repeated Message722 results = 1;
  string next_page_token = 2;
}

message Create722Request {
  Message722 message = 1;
}

message Create722Response {
  Message722 result = 1;
}
