syntax = "proto3";

package benchmark.pkg127;

// Message with various field types
message Message127 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage127 nested = 7;
  Status127 status = 8;
}

// Nested message type
message NestedMessage127 {
  string name = 1;
  int32 value = 2;
  repeated Item127 items = 3;
}

// Simple item message
message Item127 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status127 {
  STATUS_127_UNSPECIFIED = 0;
  STATUS_127_ACTIVE = 1;
  STATUS_127_INACTIVE = 2;
  STATUS_127_PENDING = 3;
}

// Service definition
service Service127 {
  rpc Get127(Get127Request) returns (Get127Response);
  rpc List127(List127Request) returns (List127Response);
  rpc Create127(Create127Request) returns (Create127Response);
}

message Get127Request {
  string id = 1;
}

message Get127Response {
  Message127 result = 1;
}

message List127Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List127Response {
  repeated Message127 results = 1;
  string next_page_token = 2;
}

message Create127Request {
  Message127 message = 1;
}

message Create127Response {
  Message127 result = 1;
}
