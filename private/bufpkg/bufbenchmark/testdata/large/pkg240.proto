syntax = "proto3";

package benchmark.pkg240;

// Message with various field types
message Message240 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage240 nested = 7;
  Status240 status = 8;
}

// Nested message type
message NestedMessage240 {
  string name = 1;
  int32 value = 2;
  repeated Item240 items = 3;
}

// Simple item message
message Item240 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status240 {
  STATUS_240_UNSPECIFIED = 0;
  STATUS_240_ACTIVE = 1;
  STATUS_240_INACTIVE = 2;
  STATUS_240_PENDING = 3;
}

// Service definition
service Service240 {
  rpc Get240(Get240Request) returns (Get240Response);
  rpc List240(List240Request) returns (List240Response);
  rpc Create240(Create240Request) returns (Create240Response);
}

message Get240Request {
  string id = 1;
}

message Get240Response {
  Message240 result = 1;
}

message List240Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List240Response {
  repeated Message240 results = 1;
  string next_page_token = 2;
}

message Create240Request {
  Message240 message = 1;
}

message Create240Response {
  Message240 result = 1;
}
