syntax = "proto3";

package benchmark.pkg782;

// Message with various field types
message Message782 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage782 nested = 7;
  Status782 status = 8;
}

// Nested message type
message NestedMessage782 {
  string name = 1;
  int32 value = 2;
  repeated Item782 items = 3;
}

// Simple item message
message Item782 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status782 {
  STATUS_782_UNSPECIFIED = 0;
  STATUS_782_ACTIVE = 1;
  STATUS_782_INACTIVE = 2;
  STATUS_782_PENDING = 3;
}

// Service definition
service Service782 {
  rpc Get782(Get782Request) returns (Get782Response);
  rpc List782(List782Request) returns (List782Response);
  rpc Create782(Create782Request) returns (Create782Response);
}

message Get782Request {
  string id = 1;
}

message Get782Response {
  Message782 result = 1;
}

message List782Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List782Response {
  repeated Message782 results = 1;
  string next_page_token = 2;
}

message Create782Request {
  Message782 message = 1;
}

message Create782Response {
  Message782 result = 1;
}
