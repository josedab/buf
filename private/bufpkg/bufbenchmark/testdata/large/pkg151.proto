syntax = "proto3";

package benchmark.pkg151;

// Message with various field types
message Message151 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage151 nested = 7;
  Status151 status = 8;
}

// Nested message type
message NestedMessage151 {
  string name = 1;
  int32 value = 2;
  repeated Item151 items = 3;
}

// Simple item message
message Item151 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status151 {
  STATUS_151_UNSPECIFIED = 0;
  STATUS_151_ACTIVE = 1;
  STATUS_151_INACTIVE = 2;
  STATUS_151_PENDING = 3;
}

// Service definition
service Service151 {
  rpc Get151(Get151Request) returns (Get151Response);
  rpc List151(List151Request) returns (List151Response);
  rpc Create151(Create151Request) returns (Create151Response);
}

message Get151Request {
  string id = 1;
}

message Get151Response {
  Message151 result = 1;
}

message List151Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List151Response {
  repeated Message151 results = 1;
  string next_page_token = 2;
}

message Create151Request {
  Message151 message = 1;
}

message Create151Response {
  Message151 result = 1;
}
