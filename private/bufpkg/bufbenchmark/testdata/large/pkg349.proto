syntax = "proto3";

package benchmark.pkg349;

// Message with various field types
message Message349 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage349 nested = 7;
  Status349 status = 8;
}

// Nested message type
message NestedMessage349 {
  string name = 1;
  int32 value = 2;
  repeated Item349 items = 3;
}

// Simple item message
message Item349 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status349 {
  STATUS_349_UNSPECIFIED = 0;
  STATUS_349_ACTIVE = 1;
  STATUS_349_INACTIVE = 2;
  STATUS_349_PENDING = 3;
}

// Service definition
service Service349 {
  rpc Get349(Get349Request) returns (Get349Response);
  rpc List349(List349Request) returns (List349Response);
  rpc Create349(Create349Request) returns (Create349Response);
}

message Get349Request {
  string id = 1;
}

message Get349Response {
  Message349 result = 1;
}

message List349Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List349Response {
  repeated Message349 results = 1;
  string next_page_token = 2;
}

message Create349Request {
  Message349 message = 1;
}

message Create349Response {
  Message349 result = 1;
}
