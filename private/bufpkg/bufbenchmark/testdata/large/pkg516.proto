syntax = "proto3";

package benchmark.pkg516;

// Message with various field types
message Message516 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage516 nested = 7;
  Status516 status = 8;
}

// Nested message type
message NestedMessage516 {
  string name = 1;
  int32 value = 2;
  repeated Item516 items = 3;
}

// Simple item message
message Item516 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status516 {
  STATUS_516_UNSPECIFIED = 0;
  STATUS_516_ACTIVE = 1;
  STATUS_516_INACTIVE = 2;
  STATUS_516_PENDING = 3;
}

// Service definition
service Service516 {
  rpc Get516(Get516Request) returns (Get516Response);
  rpc List516(List516Request) returns (List516Response);
  rpc Create516(Create516Request) returns (Create516Response);
}

message Get516Request {
  string id = 1;
}

message Get516Response {
  Message516 result = 1;
}

message List516Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List516Response {
  repeated Message516 results = 1;
  string next_page_token = 2;
}

message Create516Request {
  Message516 message = 1;
}

message Create516Response {
  Message516 result = 1;
}
