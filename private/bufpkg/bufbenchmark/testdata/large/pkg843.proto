syntax = "proto3";

package benchmark.pkg843;

// Message with various field types
message Message843 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage843 nested = 7;
  Status843 status = 8;
}

// Nested message type
message NestedMessage843 {
  string name = 1;
  int32 value = 2;
  repeated Item843 items = 3;
}

// Simple item message
message Item843 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status843 {
  STATUS_843_UNSPECIFIED = 0;
  STATUS_843_ACTIVE = 1;
  STATUS_843_INACTIVE = 2;
  STATUS_843_PENDING = 3;
}

// Service definition
service Service843 {
  rpc Get843(Get843Request) returns (Get843Response);
  rpc List843(List843Request) returns (List843Response);
  rpc Create843(Create843Request) returns (Create843Response);
}

message Get843Request {
  string id = 1;
}

message Get843Response {
  Message843 result = 1;
}

message List843Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List843Response {
  repeated Message843 results = 1;
  string next_page_token = 2;
}

message Create843Request {
  Message843 message = 1;
}

message Create843Response {
  Message843 result = 1;
}
