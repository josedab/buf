syntax = "proto3";

package benchmark.pkg330;

// Message with various field types
message Message330 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage330 nested = 7;
  Status330 status = 8;
}

// Nested message type
message NestedMessage330 {
  string name = 1;
  int32 value = 2;
  repeated Item330 items = 3;
}

// Simple item message
message Item330 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status330 {
  STATUS_330_UNSPECIFIED = 0;
  STATUS_330_ACTIVE = 1;
  STATUS_330_INACTIVE = 2;
  STATUS_330_PENDING = 3;
}

// Service definition
service Service330 {
  rpc Get330(Get330Request) returns (Get330Response);
  rpc List330(List330Request) returns (List330Response);
  rpc Create330(Create330Request) returns (Create330Response);
}

message Get330Request {
  string id = 1;
}

message Get330Response {
  Message330 result = 1;
}

message List330Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List330Response {
  repeated Message330 results = 1;
  string next_page_token = 2;
}

message Create330Request {
  Message330 message = 1;
}

message Create330Response {
  Message330 result = 1;
}
