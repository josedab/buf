syntax = "proto3";

package benchmark.pkg728;

// Message with various field types
message Message728 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage728 nested = 7;
  Status728 status = 8;
}

// Nested message type
message NestedMessage728 {
  string name = 1;
  int32 value = 2;
  repeated Item728 items = 3;
}

// Simple item message
message Item728 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status728 {
  STATUS_728_UNSPECIFIED = 0;
  STATUS_728_ACTIVE = 1;
  STATUS_728_INACTIVE = 2;
  STATUS_728_PENDING = 3;
}

// Service definition
service Service728 {
  rpc Get728(Get728Request) returns (Get728Response);
  rpc List728(List728Request) returns (List728Response);
  rpc Create728(Create728Request) returns (Create728Response);
}

message Get728Request {
  string id = 1;
}

message Get728Response {
  Message728 result = 1;
}

message List728Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List728Response {
  repeated Message728 results = 1;
  string next_page_token = 2;
}

message Create728Request {
  Message728 message = 1;
}

message Create728Response {
  Message728 result = 1;
}
