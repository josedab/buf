syntax = "proto3";

package benchmark.pkg625;

// Message with various field types
message Message625 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage625 nested = 7;
  Status625 status = 8;
}

// Nested message type
message NestedMessage625 {
  string name = 1;
  int32 value = 2;
  repeated Item625 items = 3;
}

// Simple item message
message Item625 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status625 {
  STATUS_625_UNSPECIFIED = 0;
  STATUS_625_ACTIVE = 1;
  STATUS_625_INACTIVE = 2;
  STATUS_625_PENDING = 3;
}

// Service definition
service Service625 {
  rpc Get625(Get625Request) returns (Get625Response);
  rpc List625(List625Request) returns (List625Response);
  rpc Create625(Create625Request) returns (Create625Response);
}

message Get625Request {
  string id = 1;
}

message Get625Response {
  Message625 result = 1;
}

message List625Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List625Response {
  repeated Message625 results = 1;
  string next_page_token = 2;
}

message Create625Request {
  Message625 message = 1;
}

message Create625Response {
  Message625 result = 1;
}
