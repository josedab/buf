syntax = "proto3";

package benchmark.pkg959;

// Message with various field types
message Message959 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage959 nested = 7;
  Status959 status = 8;
}

// Nested message type
message NestedMessage959 {
  string name = 1;
  int32 value = 2;
  repeated Item959 items = 3;
}

// Simple item message
message Item959 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status959 {
  STATUS_959_UNSPECIFIED = 0;
  STATUS_959_ACTIVE = 1;
  STATUS_959_INACTIVE = 2;
  STATUS_959_PENDING = 3;
}

// Service definition
service Service959 {
  rpc Get959(Get959Request) returns (Get959Response);
  rpc List959(List959Request) returns (List959Response);
  rpc Create959(Create959Request) returns (Create959Response);
}

message Get959Request {
  string id = 1;
}

message Get959Response {
  Message959 result = 1;
}

message List959Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List959Response {
  repeated Message959 results = 1;
  string next_page_token = 2;
}

message Create959Request {
  Message959 message = 1;
}

message Create959Response {
  Message959 result = 1;
}
