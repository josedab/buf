syntax = "proto3";

package benchmark.pkg357;

// Message with various field types
message Message357 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage357 nested = 7;
  Status357 status = 8;
}

// Nested message type
message NestedMessage357 {
  string name = 1;
  int32 value = 2;
  repeated Item357 items = 3;
}

// Simple item message
message Item357 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status357 {
  STATUS_357_UNSPECIFIED = 0;
  STATUS_357_ACTIVE = 1;
  STATUS_357_INACTIVE = 2;
  STATUS_357_PENDING = 3;
}

// Service definition
service Service357 {
  rpc Get357(Get357Request) returns (Get357Response);
  rpc List357(List357Request) returns (List357Response);
  rpc Create357(Create357Request) returns (Create357Response);
}

message Get357Request {
  string id = 1;
}

message Get357Response {
  Message357 result = 1;
}

message List357Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List357Response {
  repeated Message357 results = 1;
  string next_page_token = 2;
}

message Create357Request {
  Message357 message = 1;
}

message Create357Response {
  Message357 result = 1;
}
