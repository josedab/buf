syntax = "proto3";

package benchmark.pkg905;

// Message with various field types
message Message905 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage905 nested = 7;
  Status905 status = 8;
}

// Nested message type
message NestedMessage905 {
  string name = 1;
  int32 value = 2;
  repeated Item905 items = 3;
}

// Simple item message
message Item905 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status905 {
  STATUS_905_UNSPECIFIED = 0;
  STATUS_905_ACTIVE = 1;
  STATUS_905_INACTIVE = 2;
  STATUS_905_PENDING = 3;
}

// Service definition
service Service905 {
  rpc Get905(Get905Request) returns (Get905Response);
  rpc List905(List905Request) returns (List905Response);
  rpc Create905(Create905Request) returns (Create905Response);
}

message Get905Request {
  string id = 1;
}

message Get905Response {
  Message905 result = 1;
}

message List905Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List905Response {
  repeated Message905 results = 1;
  string next_page_token = 2;
}

message Create905Request {
  Message905 message = 1;
}

message Create905Response {
  Message905 result = 1;
}
