syntax = "proto3";

package benchmark.pkg475;

// Message with various field types
message Message475 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage475 nested = 7;
  Status475 status = 8;
}

// Nested message type
message NestedMessage475 {
  string name = 1;
  int32 value = 2;
  repeated Item475 items = 3;
}

// Simple item message
message Item475 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status475 {
  STATUS_475_UNSPECIFIED = 0;
  STATUS_475_ACTIVE = 1;
  STATUS_475_INACTIVE = 2;
  STATUS_475_PENDING = 3;
}

// Service definition
service Service475 {
  rpc Get475(Get475Request) returns (Get475Response);
  rpc List475(List475Request) returns (List475Response);
  rpc Create475(Create475Request) returns (Create475Response);
}

message Get475Request {
  string id = 1;
}

message Get475Response {
  Message475 result = 1;
}

message List475Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List475Response {
  repeated Message475 results = 1;
  string next_page_token = 2;
}

message Create475Request {
  Message475 message = 1;
}

message Create475Response {
  Message475 result = 1;
}
