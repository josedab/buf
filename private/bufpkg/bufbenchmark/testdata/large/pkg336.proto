syntax = "proto3";

package benchmark.pkg336;

// Message with various field types
message Message336 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage336 nested = 7;
  Status336 status = 8;
}

// Nested message type
message NestedMessage336 {
  string name = 1;
  int32 value = 2;
  repeated Item336 items = 3;
}

// Simple item message
message Item336 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status336 {
  STATUS_336_UNSPECIFIED = 0;
  STATUS_336_ACTIVE = 1;
  STATUS_336_INACTIVE = 2;
  STATUS_336_PENDING = 3;
}

// Service definition
service Service336 {
  rpc Get336(Get336Request) returns (Get336Response);
  rpc List336(List336Request) returns (List336Response);
  rpc Create336(Create336Request) returns (Create336Response);
}

message Get336Request {
  string id = 1;
}

message Get336Response {
  Message336 result = 1;
}

message List336Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List336Response {
  repeated Message336 results = 1;
  string next_page_token = 2;
}

message Create336Request {
  Message336 message = 1;
}

message Create336Response {
  Message336 result = 1;
}
