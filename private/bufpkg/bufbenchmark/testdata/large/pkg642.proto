syntax = "proto3";

package benchmark.pkg642;

// Message with various field types
message Message642 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage642 nested = 7;
  Status642 status = 8;
}

// Nested message type
message NestedMessage642 {
  string name = 1;
  int32 value = 2;
  repeated Item642 items = 3;
}

// Simple item message
message Item642 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status642 {
  STATUS_642_UNSPECIFIED = 0;
  STATUS_642_ACTIVE = 1;
  STATUS_642_INACTIVE = 2;
  STATUS_642_PENDING = 3;
}

// Service definition
service Service642 {
  rpc Get642(Get642Request) returns (Get642Response);
  rpc List642(List642Request) returns (List642Response);
  rpc Create642(Create642Request) returns (Create642Response);
}

message Get642Request {
  string id = 1;
}

message Get642Response {
  Message642 result = 1;
}

message List642Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List642Response {
  repeated Message642 results = 1;
  string next_page_token = 2;
}

message Create642Request {
  Message642 message = 1;
}

message Create642Response {
  Message642 result = 1;
}
