syntax = "proto3";

package benchmark.pkg629;

// Message with various field types
message Message629 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage629 nested = 7;
  Status629 status = 8;
}

// Nested message type
message NestedMessage629 {
  string name = 1;
  int32 value = 2;
  repeated Item629 items = 3;
}

// Simple item message
message Item629 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status629 {
  STATUS_629_UNSPECIFIED = 0;
  STATUS_629_ACTIVE = 1;
  STATUS_629_INACTIVE = 2;
  STATUS_629_PENDING = 3;
}

// Service definition
service Service629 {
  rpc Get629(Get629Request) returns (Get629Response);
  rpc List629(List629Request) returns (List629Response);
  rpc Create629(Create629Request) returns (Create629Response);
}

message Get629Request {
  string id = 1;
}

message Get629Response {
  Message629 result = 1;
}

message List629Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List629Response {
  repeated Message629 results = 1;
  string next_page_token = 2;
}

message Create629Request {
  Message629 message = 1;
}

message Create629Response {
  Message629 result = 1;
}
