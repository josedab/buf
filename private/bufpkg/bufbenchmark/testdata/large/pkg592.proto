syntax = "proto3";

package benchmark.pkg592;

// Message with various field types
message Message592 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage592 nested = 7;
  Status592 status = 8;
}

// Nested message type
message NestedMessage592 {
  string name = 1;
  int32 value = 2;
  repeated Item592 items = 3;
}

// Simple item message
message Item592 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status592 {
  STATUS_592_UNSPECIFIED = 0;
  STATUS_592_ACTIVE = 1;
  STATUS_592_INACTIVE = 2;
  STATUS_592_PENDING = 3;
}

// Service definition
service Service592 {
  rpc Get592(Get592Request) returns (Get592Response);
  rpc List592(List592Request) returns (List592Response);
  rpc Create592(Create592Request) returns (Create592Response);
}

message Get592Request {
  string id = 1;
}

message Get592Response {
  Message592 result = 1;
}

message List592Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List592Response {
  repeated Message592 results = 1;
  string next_page_token = 2;
}

message Create592Request {
  Message592 message = 1;
}

message Create592Response {
  Message592 result = 1;
}
