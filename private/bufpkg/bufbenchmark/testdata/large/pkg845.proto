syntax = "proto3";

package benchmark.pkg845;

// Message with various field types
message Message845 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage845 nested = 7;
  Status845 status = 8;
}

// Nested message type
message NestedMessage845 {
  string name = 1;
  int32 value = 2;
  repeated Item845 items = 3;
}

// Simple item message
message Item845 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status845 {
  STATUS_845_UNSPECIFIED = 0;
  STATUS_845_ACTIVE = 1;
  STATUS_845_INACTIVE = 2;
  STATUS_845_PENDING = 3;
}

// Service definition
service Service845 {
  rpc Get845(Get845Request) returns (Get845Response);
  rpc List845(List845Request) returns (List845Response);
  rpc Create845(Create845Request) returns (Create845Response);
}

message Get845Request {
  string id = 1;
}

message Get845Response {
  Message845 result = 1;
}

message List845Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List845Response {
  repeated Message845 results = 1;
  string next_page_token = 2;
}

message Create845Request {
  Message845 message = 1;
}

message Create845Response {
  Message845 result = 1;
}
