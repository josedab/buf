syntax = "proto3";

package benchmark.pkg680;

// Message with various field types
message Message680 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage680 nested = 7;
  Status680 status = 8;
}

// Nested message type
message NestedMessage680 {
  string name = 1;
  int32 value = 2;
  repeated Item680 items = 3;
}

// Simple item message
message Item680 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status680 {
  STATUS_680_UNSPECIFIED = 0;
  STATUS_680_ACTIVE = 1;
  STATUS_680_INACTIVE = 2;
  STATUS_680_PENDING = 3;
}

// Service definition
service Service680 {
  rpc Get680(Get680Request) returns (Get680Response);
  rpc List680(List680Request) returns (List680Response);
  rpc Create680(Create680Request) returns (Create680Response);
}

message Get680Request {
  string id = 1;
}

message Get680Response {
  Message680 result = 1;
}

message List680Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List680Response {
  repeated Message680 results = 1;
  string next_page_token = 2;
}

message Create680Request {
  Message680 message = 1;
}

message Create680Response {
  Message680 result = 1;
}
