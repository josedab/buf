syntax = "proto3";

package benchmark.pkg153;

// Message with various field types
message Message153 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage153 nested = 7;
  Status153 status = 8;
}

// Nested message type
message NestedMessage153 {
  string name = 1;
  int32 value = 2;
  repeated Item153 items = 3;
}

// Simple item message
message Item153 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status153 {
  STATUS_153_UNSPECIFIED = 0;
  STATUS_153_ACTIVE = 1;
  STATUS_153_INACTIVE = 2;
  STATUS_153_PENDING = 3;
}

// Service definition
service Service153 {
  rpc Get153(Get153Request) returns (Get153Response);
  rpc List153(List153Request) returns (List153Response);
  rpc Create153(Create153Request) returns (Create153Response);
}

message Get153Request {
  string id = 1;
}

message Get153Response {
  Message153 result = 1;
}

message List153Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List153Response {
  repeated Message153 results = 1;
  string next_page_token = 2;
}

message Create153Request {
  Message153 message = 1;
}

message Create153Response {
  Message153 result = 1;
}
