syntax = "proto3";

package benchmark.pkg724;

// Message with various field types
message Message724 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage724 nested = 7;
  Status724 status = 8;
}

// Nested message type
message NestedMessage724 {
  string name = 1;
  int32 value = 2;
  repeated Item724 items = 3;
}

// Simple item message
message Item724 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status724 {
  STATUS_724_UNSPECIFIED = 0;
  STATUS_724_ACTIVE = 1;
  STATUS_724_INACTIVE = 2;
  STATUS_724_PENDING = 3;
}

// Service definition
service Service724 {
  rpc Get724(Get724Request) returns (Get724Response);
  rpc List724(List724Request) returns (List724Response);
  rpc Create724(Create724Request) returns (Create724Response);
}

message Get724Request {
  string id = 1;
}

message Get724Response {
  Message724 result = 1;
}

message List724Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List724Response {
  repeated Message724 results = 1;
  string next_page_token = 2;
}

message Create724Request {
  Message724 message = 1;
}

message Create724Response {
  Message724 result = 1;
}
