syntax = "proto3";

package benchmark.pkg296;

// Message with various field types
message Message296 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage296 nested = 7;
  Status296 status = 8;
}

// Nested message type
message NestedMessage296 {
  string name = 1;
  int32 value = 2;
  repeated Item296 items = 3;
}

// Simple item message
message Item296 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status296 {
  STATUS_296_UNSPECIFIED = 0;
  STATUS_296_ACTIVE = 1;
  STATUS_296_INACTIVE = 2;
  STATUS_296_PENDING = 3;
}

// Service definition
service Service296 {
  rpc Get296(Get296Request) returns (Get296Response);
  rpc List296(List296Request) returns (List296Response);
  rpc Create296(Create296Request) returns (Create296Response);
}

message Get296Request {
  string id = 1;
}

message Get296Response {
  Message296 result = 1;
}

message List296Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List296Response {
  repeated Message296 results = 1;
  string next_page_token = 2;
}

message Create296Request {
  Message296 message = 1;
}

message Create296Response {
  Message296 result = 1;
}
