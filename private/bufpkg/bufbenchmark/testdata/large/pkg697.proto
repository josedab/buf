syntax = "proto3";

package benchmark.pkg697;

// Message with various field types
message Message697 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage697 nested = 7;
  Status697 status = 8;
}

// Nested message type
message NestedMessage697 {
  string name = 1;
  int32 value = 2;
  repeated Item697 items = 3;
}

// Simple item message
message Item697 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status697 {
  STATUS_697_UNSPECIFIED = 0;
  STATUS_697_ACTIVE = 1;
  STATUS_697_INACTIVE = 2;
  STATUS_697_PENDING = 3;
}

// Service definition
service Service697 {
  rpc Get697(Get697Request) returns (Get697Response);
  rpc List697(List697Request) returns (List697Response);
  rpc Create697(Create697Request) returns (Create697Response);
}

message Get697Request {
  string id = 1;
}

message Get697Response {
  Message697 result = 1;
}

message List697Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List697Response {
  repeated Message697 results = 1;
  string next_page_token = 2;
}

message Create697Request {
  Message697 message = 1;
}

message Create697Response {
  Message697 result = 1;
}
