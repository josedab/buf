syntax = "proto3";

package benchmark.pkg720;

// Message with various field types
message Message720 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage720 nested = 7;
  Status720 status = 8;
}

// Nested message type
message NestedMessage720 {
  string name = 1;
  int32 value = 2;
  repeated Item720 items = 3;
}

// Simple item message
message Item720 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status720 {
  STATUS_720_UNSPECIFIED = 0;
  STATUS_720_ACTIVE = 1;
  STATUS_720_INACTIVE = 2;
  STATUS_720_PENDING = 3;
}

// Service definition
service Service720 {
  rpc Get720(Get720Request) returns (Get720Response);
  rpc List720(List720Request) returns (List720Response);
  rpc Create720(Create720Request) returns (Create720Response);
}

message Get720Request {
  string id = 1;
}

message Get720Response {
  Message720 result = 1;
}

message List720Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List720Response {
  repeated Message720 results = 1;
  string next_page_token = 2;
}

message Create720Request {
  Message720 message = 1;
}

message Create720Response {
  Message720 result = 1;
}
