syntax = "proto3";

package benchmark.pkg407;

// Message with various field types
message Message407 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage407 nested = 7;
  Status407 status = 8;
}

// Nested message type
message NestedMessage407 {
  string name = 1;
  int32 value = 2;
  repeated Item407 items = 3;
}

// Simple item message
message Item407 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status407 {
  STATUS_407_UNSPECIFIED = 0;
  STATUS_407_ACTIVE = 1;
  STATUS_407_INACTIVE = 2;
  STATUS_407_PENDING = 3;
}

// Service definition
service Service407 {
  rpc Get407(Get407Request) returns (Get407Response);
  rpc List407(List407Request) returns (List407Response);
  rpc Create407(Create407Request) returns (Create407Response);
}

message Get407Request {
  string id = 1;
}

message Get407Response {
  Message407 result = 1;
}

message List407Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List407Response {
  repeated Message407 results = 1;
  string next_page_token = 2;
}

message Create407Request {
  Message407 message = 1;
}

message Create407Response {
  Message407 result = 1;
}
