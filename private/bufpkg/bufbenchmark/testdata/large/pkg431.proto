syntax = "proto3";

package benchmark.pkg431;

// Message with various field types
message Message431 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage431 nested = 7;
  Status431 status = 8;
}

// Nested message type
message NestedMessage431 {
  string name = 1;
  int32 value = 2;
  repeated Item431 items = 3;
}

// Simple item message
message Item431 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status431 {
  STATUS_431_UNSPECIFIED = 0;
  STATUS_431_ACTIVE = 1;
  STATUS_431_INACTIVE = 2;
  STATUS_431_PENDING = 3;
}

// Service definition
service Service431 {
  rpc Get431(Get431Request) returns (Get431Response);
  rpc List431(List431Request) returns (List431Response);
  rpc Create431(Create431Request) returns (Create431Response);
}

message Get431Request {
  string id = 1;
}

message Get431Response {
  Message431 result = 1;
}

message List431Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List431Response {
  repeated Message431 results = 1;
  string next_page_token = 2;
}

message Create431Request {
  Message431 message = 1;
}

message Create431Response {
  Message431 result = 1;
}
