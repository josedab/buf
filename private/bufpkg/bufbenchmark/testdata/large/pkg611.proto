syntax = "proto3";

package benchmark.pkg611;

// Message with various field types
message Message611 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage611 nested = 7;
  Status611 status = 8;
}

// Nested message type
message NestedMessage611 {
  string name = 1;
  int32 value = 2;
  repeated Item611 items = 3;
}

// Simple item message
message Item611 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status611 {
  STATUS_611_UNSPECIFIED = 0;
  STATUS_611_ACTIVE = 1;
  STATUS_611_INACTIVE = 2;
  STATUS_611_PENDING = 3;
}

// Service definition
service Service611 {
  rpc Get611(Get611Request) returns (Get611Response);
  rpc List611(List611Request) returns (List611Response);
  rpc Create611(Create611Request) returns (Create611Response);
}

message Get611Request {
  string id = 1;
}

message Get611Response {
  Message611 result = 1;
}

message List611Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List611Response {
  repeated Message611 results = 1;
  string next_page_token = 2;
}

message Create611Request {
  Message611 message = 1;
}

message Create611Response {
  Message611 result = 1;
}
