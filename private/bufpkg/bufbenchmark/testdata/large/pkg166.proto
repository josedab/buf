syntax = "proto3";

package benchmark.pkg166;

// Message with various field types
message Message166 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage166 nested = 7;
  Status166 status = 8;
}

// Nested message type
message NestedMessage166 {
  string name = 1;
  int32 value = 2;
  repeated Item166 items = 3;
}

// Simple item message
message Item166 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status166 {
  STATUS_166_UNSPECIFIED = 0;
  STATUS_166_ACTIVE = 1;
  STATUS_166_INACTIVE = 2;
  STATUS_166_PENDING = 3;
}

// Service definition
service Service166 {
  rpc Get166(Get166Request) returns (Get166Response);
  rpc List166(List166Request) returns (List166Response);
  rpc Create166(Create166Request) returns (Create166Response);
}

message Get166Request {
  string id = 1;
}

message Get166Response {
  Message166 result = 1;
}

message List166Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List166Response {
  repeated Message166 results = 1;
  string next_page_token = 2;
}

message Create166Request {
  Message166 message = 1;
}

message Create166Response {
  Message166 result = 1;
}
