syntax = "proto3";

package benchmark.pkg14;

// Message with various field types
message Message14 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage14 nested = 7;
  Status14 status = 8;
}

// Nested message type
message NestedMessage14 {
  string name = 1;
  int32 value = 2;
  repeated Item14 items = 3;
}

// Simple item message
message Item14 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status14 {
  STATUS_14_UNSPECIFIED = 0;
  STATUS_14_ACTIVE = 1;
  STATUS_14_INACTIVE = 2;
  STATUS_14_PENDING = 3;
}

// Service definition
service Service14 {
  rpc Get14(Get14Request) returns (Get14Response);
  rpc List14(List14Request) returns (List14Response);
  rpc Create14(Create14Request) returns (Create14Response);
}

message Get14Request {
  string id = 1;
}

message Get14Response {
  Message14 result = 1;
}

message List14Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List14Response {
  repeated Message14 results = 1;
  string next_page_token = 2;
}

message Create14Request {
  Message14 message = 1;
}

message Create14Response {
  Message14 result = 1;
}
