syntax = "proto3";

package benchmark.pkg758;

// Message with various field types
message Message758 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage758 nested = 7;
  Status758 status = 8;
}

// Nested message type
message NestedMessage758 {
  string name = 1;
  int32 value = 2;
  repeated Item758 items = 3;
}

// Simple item message
message Item758 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status758 {
  STATUS_758_UNSPECIFIED = 0;
  STATUS_758_ACTIVE = 1;
  STATUS_758_INACTIVE = 2;
  STATUS_758_PENDING = 3;
}

// Service definition
service Service758 {
  rpc Get758(Get758Request) returns (Get758Response);
  rpc List758(List758Request) returns (List758Response);
  rpc Create758(Create758Request) returns (Create758Response);
}

message Get758Request {
  string id = 1;
}

message Get758Response {
  Message758 result = 1;
}

message List758Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List758Response {
  repeated Message758 results = 1;
  string next_page_token = 2;
}

message Create758Request {
  Message758 message = 1;
}

message Create758Response {
  Message758 result = 1;
}
