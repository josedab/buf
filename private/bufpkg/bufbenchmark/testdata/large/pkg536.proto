syntax = "proto3";

package benchmark.pkg536;

// Message with various field types
message Message536 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage536 nested = 7;
  Status536 status = 8;
}

// Nested message type
message NestedMessage536 {
  string name = 1;
  int32 value = 2;
  repeated Item536 items = 3;
}

// Simple item message
message Item536 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status536 {
  STATUS_536_UNSPECIFIED = 0;
  STATUS_536_ACTIVE = 1;
  STATUS_536_INACTIVE = 2;
  STATUS_536_PENDING = 3;
}

// Service definition
service Service536 {
  rpc Get536(Get536Request) returns (Get536Response);
  rpc List536(List536Request) returns (List536Response);
  rpc Create536(Create536Request) returns (Create536Response);
}

message Get536Request {
  string id = 1;
}

message Get536Response {
  Message536 result = 1;
}

message List536Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List536Response {
  repeated Message536 results = 1;
  string next_page_token = 2;
}

message Create536Request {
  Message536 message = 1;
}

message Create536Response {
  Message536 result = 1;
}
