syntax = "proto3";

package benchmark.pkg529;

// Message with various field types
message Message529 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage529 nested = 7;
  Status529 status = 8;
}

// Nested message type
message NestedMessage529 {
  string name = 1;
  int32 value = 2;
  repeated Item529 items = 3;
}

// Simple item message
message Item529 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status529 {
  STATUS_529_UNSPECIFIED = 0;
  STATUS_529_ACTIVE = 1;
  STATUS_529_INACTIVE = 2;
  STATUS_529_PENDING = 3;
}

// Service definition
service Service529 {
  rpc Get529(Get529Request) returns (Get529Response);
  rpc List529(List529Request) returns (List529Response);
  rpc Create529(Create529Request) returns (Create529Response);
}

message Get529Request {
  string id = 1;
}

message Get529Response {
  Message529 result = 1;
}

message List529Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List529Response {
  repeated Message529 results = 1;
  string next_page_token = 2;
}

message Create529Request {
  Message529 message = 1;
}

message Create529Response {
  Message529 result = 1;
}
