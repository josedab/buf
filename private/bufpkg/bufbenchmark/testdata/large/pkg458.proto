syntax = "proto3";

package benchmark.pkg458;

// Message with various field types
message Message458 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage458 nested = 7;
  Status458 status = 8;
}

// Nested message type
message NestedMessage458 {
  string name = 1;
  int32 value = 2;
  repeated Item458 items = 3;
}

// Simple item message
message Item458 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status458 {
  STATUS_458_UNSPECIFIED = 0;
  STATUS_458_ACTIVE = 1;
  STATUS_458_INACTIVE = 2;
  STATUS_458_PENDING = 3;
}

// Service definition
service Service458 {
  rpc Get458(Get458Request) returns (Get458Response);
  rpc List458(List458Request) returns (List458Response);
  rpc Create458(Create458Request) returns (Create458Response);
}

message Get458Request {
  string id = 1;
}

message Get458Response {
  Message458 result = 1;
}

message List458Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List458Response {
  repeated Message458 results = 1;
  string next_page_token = 2;
}

message Create458Request {
  Message458 message = 1;
}

message Create458Response {
  Message458 result = 1;
}
