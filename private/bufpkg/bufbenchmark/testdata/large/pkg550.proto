syntax = "proto3";

package benchmark.pkg550;

// Message with various field types
message Message550 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage550 nested = 7;
  Status550 status = 8;
}

// Nested message type
message NestedMessage550 {
  string name = 1;
  int32 value = 2;
  repeated Item550 items = 3;
}

// Simple item message
message Item550 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status550 {
  STATUS_550_UNSPECIFIED = 0;
  STATUS_550_ACTIVE = 1;
  STATUS_550_INACTIVE = 2;
  STATUS_550_PENDING = 3;
}

// Service definition
service Service550 {
  rpc Get550(Get550Request) returns (Get550Response);
  rpc List550(List550Request) returns (List550Response);
  rpc Create550(Create550Request) returns (Create550Response);
}

message Get550Request {
  string id = 1;
}

message Get550Response {
  Message550 result = 1;
}

message List550Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List550Response {
  repeated Message550 results = 1;
  string next_page_token = 2;
}

message Create550Request {
  Message550 message = 1;
}

message Create550Response {
  Message550 result = 1;
}
