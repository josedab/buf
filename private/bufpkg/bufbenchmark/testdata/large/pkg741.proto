syntax = "proto3";

package benchmark.pkg741;

// Message with various field types
message Message741 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage741 nested = 7;
  Status741 status = 8;
}

// Nested message type
message NestedMessage741 {
  string name = 1;
  int32 value = 2;
  repeated Item741 items = 3;
}

// Simple item message
message Item741 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status741 {
  STATUS_741_UNSPECIFIED = 0;
  STATUS_741_ACTIVE = 1;
  STATUS_741_INACTIVE = 2;
  STATUS_741_PENDING = 3;
}

// Service definition
service Service741 {
  rpc Get741(Get741Request) returns (Get741Response);
  rpc List741(List741Request) returns (List741Response);
  rpc Create741(Create741Request) returns (Create741Response);
}

message Get741Request {
  string id = 1;
}

message Get741Response {
  Message741 result = 1;
}

message List741Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List741Response {
  repeated Message741 results = 1;
  string next_page_token = 2;
}

message Create741Request {
  Message741 message = 1;
}

message Create741Response {
  Message741 result = 1;
}
