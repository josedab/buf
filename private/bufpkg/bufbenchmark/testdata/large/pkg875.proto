syntax = "proto3";

package benchmark.pkg875;

// Message with various field types
message Message875 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage875 nested = 7;
  Status875 status = 8;
}

// Nested message type
message NestedMessage875 {
  string name = 1;
  int32 value = 2;
  repeated Item875 items = 3;
}

// Simple item message
message Item875 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status875 {
  STATUS_875_UNSPECIFIED = 0;
  STATUS_875_ACTIVE = 1;
  STATUS_875_INACTIVE = 2;
  STATUS_875_PENDING = 3;
}

// Service definition
service Service875 {
  rpc Get875(Get875Request) returns (Get875Response);
  rpc List875(List875Request) returns (List875Response);
  rpc Create875(Create875Request) returns (Create875Response);
}

message Get875Request {
  string id = 1;
}

message Get875Response {
  Message875 result = 1;
}

message List875Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List875Response {
  repeated Message875 results = 1;
  string next_page_token = 2;
}

message Create875Request {
  Message875 message = 1;
}

message Create875Response {
  Message875 result = 1;
}
