syntax = "proto3";

package benchmark.pkg654;

// Message with various field types
message Message654 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage654 nested = 7;
  Status654 status = 8;
}

// Nested message type
message NestedMessage654 {
  string name = 1;
  int32 value = 2;
  repeated Item654 items = 3;
}

// Simple item message
message Item654 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status654 {
  STATUS_654_UNSPECIFIED = 0;
  STATUS_654_ACTIVE = 1;
  STATUS_654_INACTIVE = 2;
  STATUS_654_PENDING = 3;
}

// Service definition
service Service654 {
  rpc Get654(Get654Request) returns (Get654Response);
  rpc List654(List654Request) returns (List654Response);
  rpc Create654(Create654Request) returns (Create654Response);
}

message Get654Request {
  string id = 1;
}

message Get654Response {
  Message654 result = 1;
}

message List654Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List654Response {
  repeated Message654 results = 1;
  string next_page_token = 2;
}

message Create654Request {
  Message654 message = 1;
}

message Create654Response {
  Message654 result = 1;
}
