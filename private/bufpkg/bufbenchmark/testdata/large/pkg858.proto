syntax = "proto3";

package benchmark.pkg858;

// Message with various field types
message Message858 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage858 nested = 7;
  Status858 status = 8;
}

// Nested message type
message NestedMessage858 {
  string name = 1;
  int32 value = 2;
  repeated Item858 items = 3;
}

// Simple item message
message Item858 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status858 {
  STATUS_858_UNSPECIFIED = 0;
  STATUS_858_ACTIVE = 1;
  STATUS_858_INACTIVE = 2;
  STATUS_858_PENDING = 3;
}

// Service definition
service Service858 {
  rpc Get858(Get858Request) returns (Get858Response);
  rpc List858(List858Request) returns (List858Response);
  rpc Create858(Create858Request) returns (Create858Response);
}

message Get858Request {
  string id = 1;
}

message Get858Response {
  Message858 result = 1;
}

message List858Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List858Response {
  repeated Message858 results = 1;
  string next_page_token = 2;
}

message Create858Request {
  Message858 message = 1;
}

message Create858Response {
  Message858 result = 1;
}
