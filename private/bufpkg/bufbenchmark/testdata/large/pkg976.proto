syntax = "proto3";

package benchmark.pkg976;

// Message with various field types
message Message976 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage976 nested = 7;
  Status976 status = 8;
}

// Nested message type
message NestedMessage976 {
  string name = 1;
  int32 value = 2;
  repeated Item976 items = 3;
}

// Simple item message
message Item976 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status976 {
  STATUS_976_UNSPECIFIED = 0;
  STATUS_976_ACTIVE = 1;
  STATUS_976_INACTIVE = 2;
  STATUS_976_PENDING = 3;
}

// Service definition
service Service976 {
  rpc Get976(Get976Request) returns (Get976Response);
  rpc List976(List976Request) returns (List976Response);
  rpc Create976(Create976Request) returns (Create976Response);
}

message Get976Request {
  string id = 1;
}

message Get976Response {
  Message976 result = 1;
}

message List976Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List976Response {
  repeated Message976 results = 1;
  string next_page_token = 2;
}

message Create976Request {
  Message976 message = 1;
}

message Create976Response {
  Message976 result = 1;
}
