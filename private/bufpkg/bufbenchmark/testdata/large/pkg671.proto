syntax = "proto3";

package benchmark.pkg671;

// Message with various field types
message Message671 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage671 nested = 7;
  Status671 status = 8;
}

// Nested message type
message NestedMessage671 {
  string name = 1;
  int32 value = 2;
  repeated Item671 items = 3;
}

// Simple item message
message Item671 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status671 {
  STATUS_671_UNSPECIFIED = 0;
  STATUS_671_ACTIVE = 1;
  STATUS_671_INACTIVE = 2;
  STATUS_671_PENDING = 3;
}

// Service definition
service Service671 {
  rpc Get671(Get671Request) returns (Get671Response);
  rpc List671(List671Request) returns (List671Response);
  rpc Create671(Create671Request) returns (Create671Response);
}

message Get671Request {
  string id = 1;
}

message Get671Response {
  Message671 result = 1;
}

message List671Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List671Response {
  repeated Message671 results = 1;
  string next_page_token = 2;
}

message Create671Request {
  Message671 message = 1;
}

message Create671Response {
  Message671 result = 1;
}
