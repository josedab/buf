syntax = "proto3";

package benchmark.pkg848;

// Message with various field types
message Message848 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage848 nested = 7;
  Status848 status = 8;
}

// Nested message type
message NestedMessage848 {
  string name = 1;
  int32 value = 2;
  repeated Item848 items = 3;
}

// Simple item message
message Item848 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status848 {
  STATUS_848_UNSPECIFIED = 0;
  STATUS_848_ACTIVE = 1;
  STATUS_848_INACTIVE = 2;
  STATUS_848_PENDING = 3;
}

// Service definition
service Service848 {
  rpc Get848(Get848Request) returns (Get848Response);
  rpc List848(List848Request) returns (List848Response);
  rpc Create848(Create848Request) returns (Create848Response);
}

message Get848Request {
  string id = 1;
}

message Get848Response {
  Message848 result = 1;
}

message List848Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List848Response {
  repeated Message848 results = 1;
  string next_page_token = 2;
}

message Create848Request {
  Message848 message = 1;
}

message Create848Response {
  Message848 result = 1;
}
