syntax = "proto3";

package benchmark.pkg267;

// Message with various field types
message Message267 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage267 nested = 7;
  Status267 status = 8;
}

// Nested message type
message NestedMessage267 {
  string name = 1;
  int32 value = 2;
  repeated Item267 items = 3;
}

// Simple item message
message Item267 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status267 {
  STATUS_267_UNSPECIFIED = 0;
  STATUS_267_ACTIVE = 1;
  STATUS_267_INACTIVE = 2;
  STATUS_267_PENDING = 3;
}

// Service definition
service Service267 {
  rpc Get267(Get267Request) returns (Get267Response);
  rpc List267(List267Request) returns (List267Response);
  rpc Create267(Create267Request) returns (Create267Response);
}

message Get267Request {
  string id = 1;
}

message Get267Response {
  Message267 result = 1;
}

message List267Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List267Response {
  repeated Message267 results = 1;
  string next_page_token = 2;
}

message Create267Request {
  Message267 message = 1;
}

message Create267Response {
  Message267 result = 1;
}
