syntax = "proto3";

package benchmark.pkg305;

// Message with various field types
message Message305 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage305 nested = 7;
  Status305 status = 8;
}

// Nested message type
message NestedMessage305 {
  string name = 1;
  int32 value = 2;
  repeated Item305 items = 3;
}

// Simple item message
message Item305 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status305 {
  STATUS_305_UNSPECIFIED = 0;
  STATUS_305_ACTIVE = 1;
  STATUS_305_INACTIVE = 2;
  STATUS_305_PENDING = 3;
}

// Service definition
service Service305 {
  rpc Get305(Get305Request) returns (Get305Response);
  rpc List305(List305Request) returns (List305Response);
  rpc Create305(Create305Request) returns (Create305Response);
}

message Get305Request {
  string id = 1;
}

message Get305Response {
  Message305 result = 1;
}

message List305Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List305Response {
  repeated Message305 results = 1;
  string next_page_token = 2;
}

message Create305Request {
  Message305 message = 1;
}

message Create305Response {
  Message305 result = 1;
}
