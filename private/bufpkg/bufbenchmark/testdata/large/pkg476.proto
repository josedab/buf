syntax = "proto3";

package benchmark.pkg476;

// Message with various field types
message Message476 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage476 nested = 7;
  Status476 status = 8;
}

// Nested message type
message NestedMessage476 {
  string name = 1;
  int32 value = 2;
  repeated Item476 items = 3;
}

// Simple item message
message Item476 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status476 {
  STATUS_476_UNSPECIFIED = 0;
  STATUS_476_ACTIVE = 1;
  STATUS_476_INACTIVE = 2;
  STATUS_476_PENDING = 3;
}

// Service definition
service Service476 {
  rpc Get476(Get476Request) returns (Get476Response);
  rpc List476(List476Request) returns (List476Response);
  rpc Create476(Create476Request) returns (Create476Response);
}

message Get476Request {
  string id = 1;
}

message Get476Response {
  Message476 result = 1;
}

message List476Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List476Response {
  repeated Message476 results = 1;
  string next_page_token = 2;
}

message Create476Request {
  Message476 message = 1;
}

message Create476Response {
  Message476 result = 1;
}
