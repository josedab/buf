syntax = "proto3";

package benchmark.pkg874;

// Message with various field types
message Message874 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage874 nested = 7;
  Status874 status = 8;
}

// Nested message type
message NestedMessage874 {
  string name = 1;
  int32 value = 2;
  repeated Item874 items = 3;
}

// Simple item message
message Item874 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status874 {
  STATUS_874_UNSPECIFIED = 0;
  STATUS_874_ACTIVE = 1;
  STATUS_874_INACTIVE = 2;
  STATUS_874_PENDING = 3;
}

// Service definition
service Service874 {
  rpc Get874(Get874Request) returns (Get874Response);
  rpc List874(List874Request) returns (List874Response);
  rpc Create874(Create874Request) returns (Create874Response);
}

message Get874Request {
  string id = 1;
}

message Get874Response {
  Message874 result = 1;
}

message List874Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List874Response {
  repeated Message874 results = 1;
  string next_page_token = 2;
}

message Create874Request {
  Message874 message = 1;
}

message Create874Response {
  Message874 result = 1;
}
