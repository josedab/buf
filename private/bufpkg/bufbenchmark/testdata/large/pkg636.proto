syntax = "proto3";

package benchmark.pkg636;

// Message with various field types
message Message636 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage636 nested = 7;
  Status636 status = 8;
}

// Nested message type
message NestedMessage636 {
  string name = 1;
  int32 value = 2;
  repeated Item636 items = 3;
}

// Simple item message
message Item636 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status636 {
  STATUS_636_UNSPECIFIED = 0;
  STATUS_636_ACTIVE = 1;
  STATUS_636_INACTIVE = 2;
  STATUS_636_PENDING = 3;
}

// Service definition
service Service636 {
  rpc Get636(Get636Request) returns (Get636Response);
  rpc List636(List636Request) returns (List636Response);
  rpc Create636(Create636Request) returns (Create636Response);
}

message Get636Request {
  string id = 1;
}

message Get636Response {
  Message636 result = 1;
}

message List636Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List636Response {
  repeated Message636 results = 1;
  string next_page_token = 2;
}

message Create636Request {
  Message636 message = 1;
}

message Create636Response {
  Message636 result = 1;
}
