syntax = "proto3";

package benchmark.pkg764;

// Message with various field types
message Message764 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage764 nested = 7;
  Status764 status = 8;
}

// Nested message type
message NestedMessage764 {
  string name = 1;
  int32 value = 2;
  repeated Item764 items = 3;
}

// Simple item message
message Item764 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status764 {
  STATUS_764_UNSPECIFIED = 0;
  STATUS_764_ACTIVE = 1;
  STATUS_764_INACTIVE = 2;
  STATUS_764_PENDING = 3;
}

// Service definition
service Service764 {
  rpc Get764(Get764Request) returns (Get764Response);
  rpc List764(List764Request) returns (List764Response);
  rpc Create764(Create764Request) returns (Create764Response);
}

message Get764Request {
  string id = 1;
}

message Get764Response {
  Message764 result = 1;
}

message List764Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List764Response {
  repeated Message764 results = 1;
  string next_page_token = 2;
}

message Create764Request {
  Message764 message = 1;
}

message Create764Response {
  Message764 result = 1;
}
