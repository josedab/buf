syntax = "proto3";

package benchmark.pkg116;

// Message with various field types
message Message116 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage116 nested = 7;
  Status116 status = 8;
}

// Nested message type
message NestedMessage116 {
  string name = 1;
  int32 value = 2;
  repeated Item116 items = 3;
}

// Simple item message
message Item116 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status116 {
  STATUS_116_UNSPECIFIED = 0;
  STATUS_116_ACTIVE = 1;
  STATUS_116_INACTIVE = 2;
  STATUS_116_PENDING = 3;
}

// Service definition
service Service116 {
  rpc Get116(Get116Request) returns (Get116Response);
  rpc List116(List116Request) returns (List116Response);
  rpc Create116(Create116Request) returns (Create116Response);
}

message Get116Request {
  string id = 1;
}

message Get116Response {
  Message116 result = 1;
}

message List116Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List116Response {
  repeated Message116 results = 1;
  string next_page_token = 2;
}

message Create116Request {
  Message116 message = 1;
}

message Create116Response {
  Message116 result = 1;
}
