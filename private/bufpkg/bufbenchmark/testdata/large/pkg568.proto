syntax = "proto3";

package benchmark.pkg568;

// Message with various field types
message Message568 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage568 nested = 7;
  Status568 status = 8;
}

// Nested message type
message NestedMessage568 {
  string name = 1;
  int32 value = 2;
  repeated Item568 items = 3;
}

// Simple item message
message Item568 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status568 {
  STATUS_568_UNSPECIFIED = 0;
  STATUS_568_ACTIVE = 1;
  STATUS_568_INACTIVE = 2;
  STATUS_568_PENDING = 3;
}

// Service definition
service Service568 {
  rpc Get568(Get568Request) returns (Get568Response);
  rpc List568(List568Request) returns (List568Response);
  rpc Create568(Create568Request) returns (Create568Response);
}

message Get568Request {
  string id = 1;
}

message Get568Response {
  Message568 result = 1;
}

message List568Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List568Response {
  repeated Message568 results = 1;
  string next_page_token = 2;
}

message Create568Request {
  Message568 message = 1;
}

message Create568Response {
  Message568 result = 1;
}
