syntax = "proto3";

package benchmark.pkg927;

// Message with various field types
message Message927 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage927 nested = 7;
  Status927 status = 8;
}

// Nested message type
message NestedMessage927 {
  string name = 1;
  int32 value = 2;
  repeated Item927 items = 3;
}

// Simple item message
message Item927 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status927 {
  STATUS_927_UNSPECIFIED = 0;
  STATUS_927_ACTIVE = 1;
  STATUS_927_INACTIVE = 2;
  STATUS_927_PENDING = 3;
}

// Service definition
service Service927 {
  rpc Get927(Get927Request) returns (Get927Response);
  rpc List927(List927Request) returns (List927Response);
  rpc Create927(Create927Request) returns (Create927Response);
}

message Get927Request {
  string id = 1;
}

message Get927Response {
  Message927 result = 1;
}

message List927Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List927Response {
  repeated Message927 results = 1;
  string next_page_token = 2;
}

message Create927Request {
  Message927 message = 1;
}

message Create927Response {
  Message927 result = 1;
}
