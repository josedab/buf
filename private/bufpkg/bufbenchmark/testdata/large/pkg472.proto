syntax = "proto3";

package benchmark.pkg472;

// Message with various field types
message Message472 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage472 nested = 7;
  Status472 status = 8;
}

// Nested message type
message NestedMessage472 {
  string name = 1;
  int32 value = 2;
  repeated Item472 items = 3;
}

// Simple item message
message Item472 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status472 {
  STATUS_472_UNSPECIFIED = 0;
  STATUS_472_ACTIVE = 1;
  STATUS_472_INACTIVE = 2;
  STATUS_472_PENDING = 3;
}

// Service definition
service Service472 {
  rpc Get472(Get472Request) returns (Get472Response);
  rpc List472(List472Request) returns (List472Response);
  rpc Create472(Create472Request) returns (Create472Response);
}

message Get472Request {
  string id = 1;
}

message Get472Response {
  Message472 result = 1;
}

message List472Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List472Response {
  repeated Message472 results = 1;
  string next_page_token = 2;
}

message Create472Request {
  Message472 message = 1;
}

message Create472Response {
  Message472 result = 1;
}
