syntax = "proto3";

package benchmark.pkg754;

// Message with various field types
message Message754 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage754 nested = 7;
  Status754 status = 8;
}

// Nested message type
message NestedMessage754 {
  string name = 1;
  int32 value = 2;
  repeated Item754 items = 3;
}

// Simple item message
message Item754 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status754 {
  STATUS_754_UNSPECIFIED = 0;
  STATUS_754_ACTIVE = 1;
  STATUS_754_INACTIVE = 2;
  STATUS_754_PENDING = 3;
}

// Service definition
service Service754 {
  rpc Get754(Get754Request) returns (Get754Response);
  rpc List754(List754Request) returns (List754Response);
  rpc Create754(Create754Request) returns (Create754Response);
}

message Get754Request {
  string id = 1;
}

message Get754Response {
  Message754 result = 1;
}

message List754Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List754Response {
  repeated Message754 results = 1;
  string next_page_token = 2;
}

message Create754Request {
  Message754 message = 1;
}

message Create754Response {
  Message754 result = 1;
}
