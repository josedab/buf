syntax = "proto3";

package benchmark.pkg113;

// Message with various field types
message Message113 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage113 nested = 7;
  Status113 status = 8;
}

// Nested message type
message NestedMessage113 {
  string name = 1;
  int32 value = 2;
  repeated Item113 items = 3;
}

// Simple item message
message Item113 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status113 {
  STATUS_113_UNSPECIFIED = 0;
  STATUS_113_ACTIVE = 1;
  STATUS_113_INACTIVE = 2;
  STATUS_113_PENDING = 3;
}

// Service definition
service Service113 {
  rpc Get113(Get113Request) returns (Get113Response);
  rpc List113(List113Request) returns (List113Response);
  rpc Create113(Create113Request) returns (Create113Response);
}

message Get113Request {
  string id = 1;
}

message Get113Response {
  Message113 result = 1;
}

message List113Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List113Response {
  repeated Message113 results = 1;
  string next_page_token = 2;
}

message Create113Request {
  Message113 message = 1;
}

message Create113Response {
  Message113 result = 1;
}
