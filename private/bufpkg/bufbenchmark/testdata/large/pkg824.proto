syntax = "proto3";

package benchmark.pkg824;

// Message with various field types
message Message824 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage824 nested = 7;
  Status824 status = 8;
}

// Nested message type
message NestedMessage824 {
  string name = 1;
  int32 value = 2;
  repeated Item824 items = 3;
}

// Simple item message
message Item824 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status824 {
  STATUS_824_UNSPECIFIED = 0;
  STATUS_824_ACTIVE = 1;
  STATUS_824_INACTIVE = 2;
  STATUS_824_PENDING = 3;
}

// Service definition
service Service824 {
  rpc Get824(Get824Request) returns (Get824Response);
  rpc List824(List824Request) returns (List824Response);
  rpc Create824(Create824Request) returns (Create824Response);
}

message Get824Request {
  string id = 1;
}

message Get824Response {
  Message824 result = 1;
}

message List824Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List824Response {
  repeated Message824 results = 1;
  string next_page_token = 2;
}

message Create824Request {
  Message824 message = 1;
}

message Create824Response {
  Message824 result = 1;
}
