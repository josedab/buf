syntax = "proto3";

package benchmark.pkg676;

// Message with various field types
message Message676 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage676 nested = 7;
  Status676 status = 8;
}

// Nested message type
message NestedMessage676 {
  string name = 1;
  int32 value = 2;
  repeated Item676 items = 3;
}

// Simple item message
message Item676 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status676 {
  STATUS_676_UNSPECIFIED = 0;
  STATUS_676_ACTIVE = 1;
  STATUS_676_INACTIVE = 2;
  STATUS_676_PENDING = 3;
}

// Service definition
service Service676 {
  rpc Get676(Get676Request) returns (Get676Response);
  rpc List676(List676Request) returns (List676Response);
  rpc Create676(Create676Request) returns (Create676Response);
}

message Get676Request {
  string id = 1;
}

message Get676Response {
  Message676 result = 1;
}

message List676Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List676Response {
  repeated Message676 results = 1;
  string next_page_token = 2;
}

message Create676Request {
  Message676 message = 1;
}

message Create676Response {
  Message676 result = 1;
}
