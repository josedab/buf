syntax = "proto3";

package benchmark.pkg467;

// Message with various field types
message Message467 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage467 nested = 7;
  Status467 status = 8;
}

// Nested message type
message NestedMessage467 {
  string name = 1;
  int32 value = 2;
  repeated Item467 items = 3;
}

// Simple item message
message Item467 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status467 {
  STATUS_467_UNSPECIFIED = 0;
  STATUS_467_ACTIVE = 1;
  STATUS_467_INACTIVE = 2;
  STATUS_467_PENDING = 3;
}

// Service definition
service Service467 {
  rpc Get467(Get467Request) returns (Get467Response);
  rpc List467(List467Request) returns (List467Response);
  rpc Create467(Create467Request) returns (Create467Response);
}

message Get467Request {
  string id = 1;
}

message Get467Response {
  Message467 result = 1;
}

message List467Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List467Response {
  repeated Message467 results = 1;
  string next_page_token = 2;
}

message Create467Request {
  Message467 message = 1;
}

message Create467Response {
  Message467 result = 1;
}
