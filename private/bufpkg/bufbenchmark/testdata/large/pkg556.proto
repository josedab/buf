syntax = "proto3";

package benchmark.pkg556;

// Message with various field types
message Message556 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage556 nested = 7;
  Status556 status = 8;
}

// Nested message type
message NestedMessage556 {
  string name = 1;
  int32 value = 2;
  repeated Item556 items = 3;
}

// Simple item message
message Item556 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status556 {
  STATUS_556_UNSPECIFIED = 0;
  STATUS_556_ACTIVE = 1;
  STATUS_556_INACTIVE = 2;
  STATUS_556_PENDING = 3;
}

// Service definition
service Service556 {
  rpc Get556(Get556Request) returns (Get556Response);
  rpc List556(List556Request) returns (List556Response);
  rpc Create556(Create556Request) returns (Create556Response);
}

message Get556Request {
  string id = 1;
}

message Get556Response {
  Message556 result = 1;
}

message List556Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List556Response {
  repeated Message556 results = 1;
  string next_page_token = 2;
}

message Create556Request {
  Message556 message = 1;
}

message Create556Response {
  Message556 result = 1;
}
