syntax = "proto3";

package benchmark.pkg463;

// Message with various field types
message Message463 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage463 nested = 7;
  Status463 status = 8;
}

// Nested message type
message NestedMessage463 {
  string name = 1;
  int32 value = 2;
  repeated Item463 items = 3;
}

// Simple item message
message Item463 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status463 {
  STATUS_463_UNSPECIFIED = 0;
  STATUS_463_ACTIVE = 1;
  STATUS_463_INACTIVE = 2;
  STATUS_463_PENDING = 3;
}

// Service definition
service Service463 {
  rpc Get463(Get463Request) returns (Get463Response);
  rpc List463(List463Request) returns (List463Response);
  rpc Create463(Create463Request) returns (Create463Response);
}

message Get463Request {
  string id = 1;
}

message Get463Response {
  Message463 result = 1;
}

message List463Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List463Response {
  repeated Message463 results = 1;
  string next_page_token = 2;
}

message Create463Request {
  Message463 message = 1;
}

message Create463Response {
  Message463 result = 1;
}
