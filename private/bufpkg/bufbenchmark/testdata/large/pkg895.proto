syntax = "proto3";

package benchmark.pkg895;

// Message with various field types
message Message895 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage895 nested = 7;
  Status895 status = 8;
}

// Nested message type
message NestedMessage895 {
  string name = 1;
  int32 value = 2;
  repeated Item895 items = 3;
}

// Simple item message
message Item895 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status895 {
  STATUS_895_UNSPECIFIED = 0;
  STATUS_895_ACTIVE = 1;
  STATUS_895_INACTIVE = 2;
  STATUS_895_PENDING = 3;
}

// Service definition
service Service895 {
  rpc Get895(Get895Request) returns (Get895Response);
  rpc List895(List895Request) returns (List895Response);
  rpc Create895(Create895Request) returns (Create895Response);
}

message Get895Request {
  string id = 1;
}

message Get895Response {
  Message895 result = 1;
}

message List895Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List895Response {
  repeated Message895 results = 1;
  string next_page_token = 2;
}

message Create895Request {
  Message895 message = 1;
}

message Create895Response {
  Message895 result = 1;
}
