syntax = "proto3";

package benchmark.pkg1000;

// Message with various field types
message Message1000 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage1000 nested = 7;
  Status1000 status = 8;
}

// Nested message type
message NestedMessage1000 {
  string name = 1;
  int32 value = 2;
  repeated Item1000 items = 3;
}

// Simple item message
message Item1000 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status1000 {
  STATUS_1000_UNSPECIFIED = 0;
  STATUS_1000_ACTIVE = 1;
  STATUS_1000_INACTIVE = 2;
  STATUS_1000_PENDING = 3;
}

// Service definition
service Service1000 {
  rpc Get1000(Get1000Request) returns (Get1000Response);
  rpc List1000(List1000Request) returns (List1000Response);
  rpc Create1000(Create1000Request) returns (Create1000Response);
}

message Get1000Request {
  string id = 1;
}

message Get1000Response {
  Message1000 result = 1;
}

message List1000Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List1000Response {
  repeated Message1000 results = 1;
  string next_page_token = 2;
}

message Create1000Request {
  Message1000 message = 1;
}

message Create1000Response {
  Message1000 result = 1;
}
