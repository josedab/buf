syntax = "proto3";

package benchmark.pkg346;

// Message with various field types
message Message346 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage346 nested = 7;
  Status346 status = 8;
}

// Nested message type
message NestedMessage346 {
  string name = 1;
  int32 value = 2;
  repeated Item346 items = 3;
}

// Simple item message
message Item346 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status346 {
  STATUS_346_UNSPECIFIED = 0;
  STATUS_346_ACTIVE = 1;
  STATUS_346_INACTIVE = 2;
  STATUS_346_PENDING = 3;
}

// Service definition
service Service346 {
  rpc Get346(Get346Request) returns (Get346Response);
  rpc List346(List346Request) returns (List346Response);
  rpc Create346(Create346Request) returns (Create346Response);
}

message Get346Request {
  string id = 1;
}

message Get346Response {
  Message346 result = 1;
}

message List346Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List346Response {
  repeated Message346 results = 1;
  string next_page_token = 2;
}

message Create346Request {
  Message346 message = 1;
}

message Create346Response {
  Message346 result = 1;
}
