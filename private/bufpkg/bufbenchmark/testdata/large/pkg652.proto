syntax = "proto3";

package benchmark.pkg652;

// Message with various field types
message Message652 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage652 nested = 7;
  Status652 status = 8;
}

// Nested message type
message NestedMessage652 {
  string name = 1;
  int32 value = 2;
  repeated Item652 items = 3;
}

// Simple item message
message Item652 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status652 {
  STATUS_652_UNSPECIFIED = 0;
  STATUS_652_ACTIVE = 1;
  STATUS_652_INACTIVE = 2;
  STATUS_652_PENDING = 3;
}

// Service definition
service Service652 {
  rpc Get652(Get652Request) returns (Get652Response);
  rpc List652(List652Request) returns (List652Response);
  rpc Create652(Create652Request) returns (Create652Response);
}

message Get652Request {
  string id = 1;
}

message Get652Response {
  Message652 result = 1;
}

message List652Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List652Response {
  repeated Message652 results = 1;
  string next_page_token = 2;
}

message Create652Request {
  Message652 message = 1;
}

message Create652Response {
  Message652 result = 1;
}
