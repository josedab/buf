syntax = "proto3";

package benchmark.pkg635;

// Message with various field types
message Message635 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage635 nested = 7;
  Status635 status = 8;
}

// Nested message type
message NestedMessage635 {
  string name = 1;
  int32 value = 2;
  repeated Item635 items = 3;
}

// Simple item message
message Item635 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status635 {
  STATUS_635_UNSPECIFIED = 0;
  STATUS_635_ACTIVE = 1;
  STATUS_635_INACTIVE = 2;
  STATUS_635_PENDING = 3;
}

// Service definition
service Service635 {
  rpc Get635(Get635Request) returns (Get635Response);
  rpc List635(List635Request) returns (List635Response);
  rpc Create635(Create635Request) returns (Create635Response);
}

message Get635Request {
  string id = 1;
}

message Get635Response {
  Message635 result = 1;
}

message List635Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List635Response {
  repeated Message635 results = 1;
  string next_page_token = 2;
}

message Create635Request {
  Message635 message = 1;
}

message Create635Response {
  Message635 result = 1;
}
