syntax = "proto3";

package benchmark.pkg479;

// Message with various field types
message Message479 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage479 nested = 7;
  Status479 status = 8;
}

// Nested message type
message NestedMessage479 {
  string name = 1;
  int32 value = 2;
  repeated Item479 items = 3;
}

// Simple item message
message Item479 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status479 {
  STATUS_479_UNSPECIFIED = 0;
  STATUS_479_ACTIVE = 1;
  STATUS_479_INACTIVE = 2;
  STATUS_479_PENDING = 3;
}

// Service definition
service Service479 {
  rpc Get479(Get479Request) returns (Get479Response);
  rpc List479(List479Request) returns (List479Response);
  rpc Create479(Create479Request) returns (Create479Response);
}

message Get479Request {
  string id = 1;
}

message Get479Response {
  Message479 result = 1;
}

message List479Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List479Response {
  repeated Message479 results = 1;
  string next_page_token = 2;
}

message Create479Request {
  Message479 message = 1;
}

message Create479Response {
  Message479 result = 1;
}
