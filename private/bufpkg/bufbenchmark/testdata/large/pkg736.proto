syntax = "proto3";

package benchmark.pkg736;

// Message with various field types
message Message736 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage736 nested = 7;
  Status736 status = 8;
}

// Nested message type
message NestedMessage736 {
  string name = 1;
  int32 value = 2;
  repeated Item736 items = 3;
}

// Simple item message
message Item736 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status736 {
  STATUS_736_UNSPECIFIED = 0;
  STATUS_736_ACTIVE = 1;
  STATUS_736_INACTIVE = 2;
  STATUS_736_PENDING = 3;
}

// Service definition
service Service736 {
  rpc Get736(Get736Request) returns (Get736Response);
  rpc List736(List736Request) returns (List736Response);
  rpc Create736(Create736Request) returns (Create736Response);
}

message Get736Request {
  string id = 1;
}

message Get736Response {
  Message736 result = 1;
}

message List736Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List736Response {
  repeated Message736 results = 1;
  string next_page_token = 2;
}

message Create736Request {
  Message736 message = 1;
}

message Create736Response {
  Message736 result = 1;
}
