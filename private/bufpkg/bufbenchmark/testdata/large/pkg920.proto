syntax = "proto3";

package benchmark.pkg920;

// Message with various field types
message Message920 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage920 nested = 7;
  Status920 status = 8;
}

// Nested message type
message NestedMessage920 {
  string name = 1;
  int32 value = 2;
  repeated Item920 items = 3;
}

// Simple item message
message Item920 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status920 {
  STATUS_920_UNSPECIFIED = 0;
  STATUS_920_ACTIVE = 1;
  STATUS_920_INACTIVE = 2;
  STATUS_920_PENDING = 3;
}

// Service definition
service Service920 {
  rpc Get920(Get920Request) returns (Get920Response);
  rpc List920(List920Request) returns (List920Response);
  rpc Create920(Create920Request) returns (Create920Response);
}

message Get920Request {
  string id = 1;
}

message Get920Response {
  Message920 result = 1;
}

message List920Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List920Response {
  repeated Message920 results = 1;
  string next_page_token = 2;
}

message Create920Request {
  Message920 message = 1;
}

message Create920Response {
  Message920 result = 1;
}
