syntax = "proto3";

package benchmark.pkg900;

// Message with various field types
message Message900 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage900 nested = 7;
  Status900 status = 8;
}

// Nested message type
message NestedMessage900 {
  string name = 1;
  int32 value = 2;
  repeated Item900 items = 3;
}

// Simple item message
message Item900 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status900 {
  STATUS_900_UNSPECIFIED = 0;
  STATUS_900_ACTIVE = 1;
  STATUS_900_INACTIVE = 2;
  STATUS_900_PENDING = 3;
}

// Service definition
service Service900 {
  rpc Get900(Get900Request) returns (Get900Response);
  rpc List900(List900Request) returns (List900Response);
  rpc Create900(Create900Request) returns (Create900Response);
}

message Get900Request {
  string id = 1;
}

message Get900Response {
  Message900 result = 1;
}

message List900Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List900Response {
  repeated Message900 results = 1;
  string next_page_token = 2;
}

message Create900Request {
  Message900 message = 1;
}

message Create900Response {
  Message900 result = 1;
}
