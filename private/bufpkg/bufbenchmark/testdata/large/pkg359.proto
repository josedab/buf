syntax = "proto3";

package benchmark.pkg359;

// Message with various field types
message Message359 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage359 nested = 7;
  Status359 status = 8;
}

// Nested message type
message NestedMessage359 {
  string name = 1;
  int32 value = 2;
  repeated Item359 items = 3;
}

// Simple item message
message Item359 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status359 {
  STATUS_359_UNSPECIFIED = 0;
  STATUS_359_ACTIVE = 1;
  STATUS_359_INACTIVE = 2;
  STATUS_359_PENDING = 3;
}

// Service definition
service Service359 {
  rpc Get359(Get359Request) returns (Get359Response);
  rpc List359(List359Request) returns (List359Response);
  rpc Create359(Create359Request) returns (Create359Response);
}

message Get359Request {
  string id = 1;
}

message Get359Response {
  Message359 result = 1;
}

message List359Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List359Response {
  repeated Message359 results = 1;
  string next_page_token = 2;
}

message Create359Request {
  Message359 message = 1;
}

message Create359Response {
  Message359 result = 1;
}
