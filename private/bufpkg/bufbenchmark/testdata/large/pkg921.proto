syntax = "proto3";

package benchmark.pkg921;

// Message with various field types
message Message921 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage921 nested = 7;
  Status921 status = 8;
}

// Nested message type
message NestedMessage921 {
  string name = 1;
  int32 value = 2;
  repeated Item921 items = 3;
}

// Simple item message
message Item921 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status921 {
  STATUS_921_UNSPECIFIED = 0;
  STATUS_921_ACTIVE = 1;
  STATUS_921_INACTIVE = 2;
  STATUS_921_PENDING = 3;
}

// Service definition
service Service921 {
  rpc Get921(Get921Request) returns (Get921Response);
  rpc List921(List921Request) returns (List921Response);
  rpc Create921(Create921Request) returns (Create921Response);
}

message Get921Request {
  string id = 1;
}

message Get921Response {
  Message921 result = 1;
}

message List921Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List921Response {
  repeated Message921 results = 1;
  string next_page_token = 2;
}

message Create921Request {
  Message921 message = 1;
}

message Create921Response {
  Message921 result = 1;
}
