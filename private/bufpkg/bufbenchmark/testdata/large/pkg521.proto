syntax = "proto3";

package benchmark.pkg521;

// Message with various field types
message Message521 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage521 nested = 7;
  Status521 status = 8;
}

// Nested message type
message NestedMessage521 {
  string name = 1;
  int32 value = 2;
  repeated Item521 items = 3;
}

// Simple item message
message Item521 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status521 {
  STATUS_521_UNSPECIFIED = 0;
  STATUS_521_ACTIVE = 1;
  STATUS_521_INACTIVE = 2;
  STATUS_521_PENDING = 3;
}

// Service definition
service Service521 {
  rpc Get521(Get521Request) returns (Get521Response);
  rpc List521(List521Request) returns (List521Response);
  rpc Create521(Create521Request) returns (Create521Response);
}

message Get521Request {
  string id = 1;
}

message Get521Response {
  Message521 result = 1;
}

message List521Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List521Response {
  repeated Message521 results = 1;
  string next_page_token = 2;
}

message Create521Request {
  Message521 message = 1;
}

message Create521Response {
  Message521 result = 1;
}
