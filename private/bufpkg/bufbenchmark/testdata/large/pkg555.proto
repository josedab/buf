syntax = "proto3";

package benchmark.pkg555;

// Message with various field types
message Message555 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage555 nested = 7;
  Status555 status = 8;
}

// Nested message type
message NestedMessage555 {
  string name = 1;
  int32 value = 2;
  repeated Item555 items = 3;
}

// Simple item message
message Item555 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status555 {
  STATUS_555_UNSPECIFIED = 0;
  STATUS_555_ACTIVE = 1;
  STATUS_555_INACTIVE = 2;
  STATUS_555_PENDING = 3;
}

// Service definition
service Service555 {
  rpc Get555(Get555Request) returns (Get555Response);
  rpc List555(List555Request) returns (List555Response);
  rpc Create555(Create555Request) returns (Create555Response);
}

message Get555Request {
  string id = 1;
}

message Get555Response {
  Message555 result = 1;
}

message List555Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List555Response {
  repeated Message555 results = 1;
  string next_page_token = 2;
}

message Create555Request {
  Message555 message = 1;
}

message Create555Response {
  Message555 result = 1;
}
