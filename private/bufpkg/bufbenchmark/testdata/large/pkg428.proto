syntax = "proto3";

package benchmark.pkg428;

// Message with various field types
message Message428 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage428 nested = 7;
  Status428 status = 8;
}

// Nested message type
message NestedMessage428 {
  string name = 1;
  int32 value = 2;
  repeated Item428 items = 3;
}

// Simple item message
message Item428 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status428 {
  STATUS_428_UNSPECIFIED = 0;
  STATUS_428_ACTIVE = 1;
  STATUS_428_INACTIVE = 2;
  STATUS_428_PENDING = 3;
}

// Service definition
service Service428 {
  rpc Get428(Get428Request) returns (Get428Response);
  rpc List428(List428Request) returns (List428Response);
  rpc Create428(Create428Request) returns (Create428Response);
}

message Get428Request {
  string id = 1;
}

message Get428Response {
  Message428 result = 1;
}

message List428Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List428Response {
  repeated Message428 results = 1;
  string next_page_token = 2;
}

message Create428Request {
  Message428 message = 1;
}

message Create428Response {
  Message428 result = 1;
}
