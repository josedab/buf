syntax = "proto3";

package benchmark.pkg708;

// Message with various field types
message Message708 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage708 nested = 7;
  Status708 status = 8;
}

// Nested message type
message NestedMessage708 {
  string name = 1;
  int32 value = 2;
  repeated Item708 items = 3;
}

// Simple item message
message Item708 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status708 {
  STATUS_708_UNSPECIFIED = 0;
  STATUS_708_ACTIVE = 1;
  STATUS_708_INACTIVE = 2;
  STATUS_708_PENDING = 3;
}

// Service definition
service Service708 {
  rpc Get708(Get708Request) returns (Get708Response);
  rpc List708(List708Request) returns (List708Response);
  rpc Create708(Create708Request) returns (Create708Response);
}

message Get708Request {
  string id = 1;
}

message Get708Response {
  Message708 result = 1;
}

message List708Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List708Response {
  repeated Message708 results = 1;
  string next_page_token = 2;
}

message Create708Request {
  Message708 message = 1;
}

message Create708Response {
  Message708 result = 1;
}
