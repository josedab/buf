syntax = "proto3";

package benchmark.pkg788;

// Message with various field types
message Message788 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage788 nested = 7;
  Status788 status = 8;
}

// Nested message type
message NestedMessage788 {
  string name = 1;
  int32 value = 2;
  repeated Item788 items = 3;
}

// Simple item message
message Item788 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status788 {
  STATUS_788_UNSPECIFIED = 0;
  STATUS_788_ACTIVE = 1;
  STATUS_788_INACTIVE = 2;
  STATUS_788_PENDING = 3;
}

// Service definition
service Service788 {
  rpc Get788(Get788Request) returns (Get788Response);
  rpc List788(List788Request) returns (List788Response);
  rpc Create788(Create788Request) returns (Create788Response);
}

message Get788Request {
  string id = 1;
}

message Get788Response {
  Message788 result = 1;
}

message List788Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List788Response {
  repeated Message788 results = 1;
  string next_page_token = 2;
}

message Create788Request {
  Message788 message = 1;
}

message Create788Response {
  Message788 result = 1;
}
