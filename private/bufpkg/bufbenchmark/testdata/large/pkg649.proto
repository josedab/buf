syntax = "proto3";

package benchmark.pkg649;

// Message with various field types
message Message649 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage649 nested = 7;
  Status649 status = 8;
}

// Nested message type
message NestedMessage649 {
  string name = 1;
  int32 value = 2;
  repeated Item649 items = 3;
}

// Simple item message
message Item649 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status649 {
  STATUS_649_UNSPECIFIED = 0;
  STATUS_649_ACTIVE = 1;
  STATUS_649_INACTIVE = 2;
  STATUS_649_PENDING = 3;
}

// Service definition
service Service649 {
  rpc Get649(Get649Request) returns (Get649Response);
  rpc List649(List649Request) returns (List649Response);
  rpc Create649(Create649Request) returns (Create649Response);
}

message Get649Request {
  string id = 1;
}

message Get649Response {
  Message649 result = 1;
}

message List649Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List649Response {
  repeated Message649 results = 1;
  string next_page_token = 2;
}

message Create649Request {
  Message649 message = 1;
}

message Create649Response {
  Message649 result = 1;
}
