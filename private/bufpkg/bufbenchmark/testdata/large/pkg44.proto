syntax = "proto3";

package benchmark.pkg44;

// Message with various field types
message Message44 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage44 nested = 7;
  Status44 status = 8;
}

// Nested message type
message NestedMessage44 {
  string name = 1;
  int32 value = 2;
  repeated Item44 items = 3;
}

// Simple item message
message Item44 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status44 {
  STATUS_44_UNSPECIFIED = 0;
  STATUS_44_ACTIVE = 1;
  STATUS_44_INACTIVE = 2;
  STATUS_44_PENDING = 3;
}

// Service definition
service Service44 {
  rpc Get44(Get44Request) returns (Get44Response);
  rpc List44(List44Request) returns (List44Response);
  rpc Create44(Create44Request) returns (Create44Response);
}

message Get44Request {
  string id = 1;
}

message Get44Response {
  Message44 result = 1;
}

message List44Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List44Response {
  repeated Message44 results = 1;
  string next_page_token = 2;
}

message Create44Request {
  Message44 message = 1;
}

message Create44Response {
  Message44 result = 1;
}
