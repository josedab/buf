syntax = "proto3";

package benchmark.pkg174;

// Message with various field types
message Message174 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage174 nested = 7;
  Status174 status = 8;
}

// Nested message type
message NestedMessage174 {
  string name = 1;
  int32 value = 2;
  repeated Item174 items = 3;
}

// Simple item message
message Item174 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status174 {
  STATUS_174_UNSPECIFIED = 0;
  STATUS_174_ACTIVE = 1;
  STATUS_174_INACTIVE = 2;
  STATUS_174_PENDING = 3;
}

// Service definition
service Service174 {
  rpc Get174(Get174Request) returns (Get174Response);
  rpc List174(List174Request) returns (List174Response);
  rpc Create174(Create174Request) returns (Create174Response);
}

message Get174Request {
  string id = 1;
}

message Get174Response {
  Message174 result = 1;
}

message List174Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List174Response {
  repeated Message174 results = 1;
  string next_page_token = 2;
}

message Create174Request {
  Message174 message = 1;
}

message Create174Response {
  Message174 result = 1;
}
