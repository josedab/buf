syntax = "proto3";

package benchmark.pkg118;

// Message with various field types
message Message118 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage118 nested = 7;
  Status118 status = 8;
}

// Nested message type
message NestedMessage118 {
  string name = 1;
  int32 value = 2;
  repeated Item118 items = 3;
}

// Simple item message
message Item118 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status118 {
  STATUS_118_UNSPECIFIED = 0;
  STATUS_118_ACTIVE = 1;
  STATUS_118_INACTIVE = 2;
  STATUS_118_PENDING = 3;
}

// Service definition
service Service118 {
  rpc Get118(Get118Request) returns (Get118Response);
  rpc List118(List118Request) returns (List118Response);
  rpc Create118(Create118Request) returns (Create118Response);
}

message Get118Request {
  string id = 1;
}

message Get118Response {
  Message118 result = 1;
}

message List118Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List118Response {
  repeated Message118 results = 1;
  string next_page_token = 2;
}

message Create118Request {
  Message118 message = 1;
}

message Create118Response {
  Message118 result = 1;
}
