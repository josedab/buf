syntax = "proto3";

package benchmark.pkg673;

// Message with various field types
message Message673 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage673 nested = 7;
  Status673 status = 8;
}

// Nested message type
message NestedMessage673 {
  string name = 1;
  int32 value = 2;
  repeated Item673 items = 3;
}

// Simple item message
message Item673 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status673 {
  STATUS_673_UNSPECIFIED = 0;
  STATUS_673_ACTIVE = 1;
  STATUS_673_INACTIVE = 2;
  STATUS_673_PENDING = 3;
}

// Service definition
service Service673 {
  rpc Get673(Get673Request) returns (Get673Response);
  rpc List673(List673Request) returns (List673Response);
  rpc Create673(Create673Request) returns (Create673Response);
}

message Get673Request {
  string id = 1;
}

message Get673Response {
  Message673 result = 1;
}

message List673Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List673Response {
  repeated Message673 results = 1;
  string next_page_token = 2;
}

message Create673Request {
  Message673 message = 1;
}

message Create673Response {
  Message673 result = 1;
}
