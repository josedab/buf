syntax = "proto3";

package benchmark.pkg370;

// Message with various field types
message Message370 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage370 nested = 7;
  Status370 status = 8;
}

// Nested message type
message NestedMessage370 {
  string name = 1;
  int32 value = 2;
  repeated Item370 items = 3;
}

// Simple item message
message Item370 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status370 {
  STATUS_370_UNSPECIFIED = 0;
  STATUS_370_ACTIVE = 1;
  STATUS_370_INACTIVE = 2;
  STATUS_370_PENDING = 3;
}

// Service definition
service Service370 {
  rpc Get370(Get370Request) returns (Get370Response);
  rpc List370(List370Request) returns (List370Response);
  rpc Create370(Create370Request) returns (Create370Response);
}

message Get370Request {
  string id = 1;
}

message Get370Response {
  Message370 result = 1;
}

message List370Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List370Response {
  repeated Message370 results = 1;
  string next_page_token = 2;
}

message Create370Request {
  Message370 message = 1;
}

message Create370Response {
  Message370 result = 1;
}
