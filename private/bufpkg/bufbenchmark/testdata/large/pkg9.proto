syntax = "proto3";

package benchmark.pkg9;

// Message with various field types
message Message9 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage9 nested = 7;
  Status9 status = 8;
}

// Nested message type
message NestedMessage9 {
  string name = 1;
  int32 value = 2;
  repeated Item9 items = 3;
}

// Simple item message
message Item9 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status9 {
  STATUS_9_UNSPECIFIED = 0;
  STATUS_9_ACTIVE = 1;
  STATUS_9_INACTIVE = 2;
  STATUS_9_PENDING = 3;
}

// Service definition
service Service9 {
  rpc Get9(Get9Request) returns (Get9Response);
  rpc List9(List9Request) returns (List9Response);
  rpc Create9(Create9Request) returns (Create9Response);
}

message Get9Request {
  string id = 1;
}

message Get9Response {
  Message9 result = 1;
}

message List9Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List9Response {
  repeated Message9 results = 1;
  string next_page_token = 2;
}

message Create9Request {
  Message9 message = 1;
}

message Create9Response {
  Message9 result = 1;
}
