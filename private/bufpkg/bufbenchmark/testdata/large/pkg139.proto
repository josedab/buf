syntax = "proto3";

package benchmark.pkg139;

// Message with various field types
message Message139 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage139 nested = 7;
  Status139 status = 8;
}

// Nested message type
message NestedMessage139 {
  string name = 1;
  int32 value = 2;
  repeated Item139 items = 3;
}

// Simple item message
message Item139 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status139 {
  STATUS_139_UNSPECIFIED = 0;
  STATUS_139_ACTIVE = 1;
  STATUS_139_INACTIVE = 2;
  STATUS_139_PENDING = 3;
}

// Service definition
service Service139 {
  rpc Get139(Get139Request) returns (Get139Response);
  rpc List139(List139Request) returns (List139Response);
  rpc Create139(Create139Request) returns (Create139Response);
}

message Get139Request {
  string id = 1;
}

message Get139Response {
  Message139 result = 1;
}

message List139Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List139Response {
  repeated Message139 results = 1;
  string next_page_token = 2;
}

message Create139Request {
  Message139 message = 1;
}

message Create139Response {
  Message139 result = 1;
}
