syntax = "proto3";

package benchmark.pkg861;

// Message with various field types
message Message861 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage861 nested = 7;
  Status861 status = 8;
}

// Nested message type
message NestedMessage861 {
  string name = 1;
  int32 value = 2;
  repeated Item861 items = 3;
}

// Simple item message
message Item861 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status861 {
  STATUS_861_UNSPECIFIED = 0;
  STATUS_861_ACTIVE = 1;
  STATUS_861_INACTIVE = 2;
  STATUS_861_PENDING = 3;
}

// Service definition
service Service861 {
  rpc Get861(Get861Request) returns (Get861Response);
  rpc List861(List861Request) returns (List861Response);
  rpc Create861(Create861Request) returns (Create861Response);
}

message Get861Request {
  string id = 1;
}

message Get861Response {
  Message861 result = 1;
}

message List861Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List861Response {
  repeated Message861 results = 1;
  string next_page_token = 2;
}

message Create861Request {
  Message861 message = 1;
}

message Create861Response {
  Message861 result = 1;
}
