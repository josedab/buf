syntax = "proto3";

package benchmark.pkg182;

// Message with various field types
message Message182 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage182 nested = 7;
  Status182 status = 8;
}

// Nested message type
message NestedMessage182 {
  string name = 1;
  int32 value = 2;
  repeated Item182 items = 3;
}

// Simple item message
message Item182 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status182 {
  STATUS_182_UNSPECIFIED = 0;
  STATUS_182_ACTIVE = 1;
  STATUS_182_INACTIVE = 2;
  STATUS_182_PENDING = 3;
}

// Service definition
service Service182 {
  rpc Get182(Get182Request) returns (Get182Response);
  rpc List182(List182Request) returns (List182Response);
  rpc Create182(Create182Request) returns (Create182Response);
}

message Get182Request {
  string id = 1;
}

message Get182Response {
  Message182 result = 1;
}

message List182Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List182Response {
  repeated Message182 results = 1;
  string next_page_token = 2;
}

message Create182Request {
  Message182 message = 1;
}

message Create182Response {
  Message182 result = 1;
}
