syntax = "proto3";

package benchmark.pkg523;

// Message with various field types
message Message523 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage523 nested = 7;
  Status523 status = 8;
}

// Nested message type
message NestedMessage523 {
  string name = 1;
  int32 value = 2;
  repeated Item523 items = 3;
}

// Simple item message
message Item523 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status523 {
  STATUS_523_UNSPECIFIED = 0;
  STATUS_523_ACTIVE = 1;
  STATUS_523_INACTIVE = 2;
  STATUS_523_PENDING = 3;
}

// Service definition
service Service523 {
  rpc Get523(Get523Request) returns (Get523Response);
  rpc List523(List523Request) returns (List523Response);
  rpc Create523(Create523Request) returns (Create523Response);
}

message Get523Request {
  string id = 1;
}

message Get523Response {
  Message523 result = 1;
}

message List523Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List523Response {
  repeated Message523 results = 1;
  string next_page_token = 2;
}

message Create523Request {
  Message523 message = 1;
}

message Create523Response {
  Message523 result = 1;
}
