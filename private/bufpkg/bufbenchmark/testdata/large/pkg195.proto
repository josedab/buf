syntax = "proto3";

package benchmark.pkg195;

// Message with various field types
message Message195 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage195 nested = 7;
  Status195 status = 8;
}

// Nested message type
message NestedMessage195 {
  string name = 1;
  int32 value = 2;
  repeated Item195 items = 3;
}

// Simple item message
message Item195 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status195 {
  STATUS_195_UNSPECIFIED = 0;
  STATUS_195_ACTIVE = 1;
  STATUS_195_INACTIVE = 2;
  STATUS_195_PENDING = 3;
}

// Service definition
service Service195 {
  rpc Get195(Get195Request) returns (Get195Response);
  rpc List195(List195Request) returns (List195Response);
  rpc Create195(Create195Request) returns (Create195Response);
}

message Get195Request {
  string id = 1;
}

message Get195Response {
  Message195 result = 1;
}

message List195Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List195Response {
  repeated Message195 results = 1;
  string next_page_token = 2;
}

message Create195Request {
  Message195 message = 1;
}

message Create195Response {
  Message195 result = 1;
}
