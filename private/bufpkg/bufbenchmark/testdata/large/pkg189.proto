syntax = "proto3";

package benchmark.pkg189;

// Message with various field types
message Message189 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage189 nested = 7;
  Status189 status = 8;
}

// Nested message type
message NestedMessage189 {
  string name = 1;
  int32 value = 2;
  repeated Item189 items = 3;
}

// Simple item message
message Item189 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status189 {
  STATUS_189_UNSPECIFIED = 0;
  STATUS_189_ACTIVE = 1;
  STATUS_189_INACTIVE = 2;
  STATUS_189_PENDING = 3;
}

// Service definition
service Service189 {
  rpc Get189(Get189Request) returns (Get189Response);
  rpc List189(List189Request) returns (List189Response);
  rpc Create189(Create189Request) returns (Create189Response);
}

message Get189Request {
  string id = 1;
}

message Get189Response {
  Message189 result = 1;
}

message List189Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List189Response {
  repeated Message189 results = 1;
  string next_page_token = 2;
}

message Create189Request {
  Message189 message = 1;
}

message Create189Response {
  Message189 result = 1;
}
