syntax = "proto3";

package benchmark.pkg756;

// Message with various field types
message Message756 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage756 nested = 7;
  Status756 status = 8;
}

// Nested message type
message NestedMessage756 {
  string name = 1;
  int32 value = 2;
  repeated Item756 items = 3;
}

// Simple item message
message Item756 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status756 {
  STATUS_756_UNSPECIFIED = 0;
  STATUS_756_ACTIVE = 1;
  STATUS_756_INACTIVE = 2;
  STATUS_756_PENDING = 3;
}

// Service definition
service Service756 {
  rpc Get756(Get756Request) returns (Get756Response);
  rpc List756(List756Request) returns (List756Response);
  rpc Create756(Create756Request) returns (Create756Response);
}

message Get756Request {
  string id = 1;
}

message Get756Response {
  Message756 result = 1;
}

message List756Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List756Response {
  repeated Message756 results = 1;
  string next_page_token = 2;
}

message Create756Request {
  Message756 message = 1;
}

message Create756Response {
  Message756 result = 1;
}
