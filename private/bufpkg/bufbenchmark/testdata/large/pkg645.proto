syntax = "proto3";

package benchmark.pkg645;

// Message with various field types
message Message645 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage645 nested = 7;
  Status645 status = 8;
}

// Nested message type
message NestedMessage645 {
  string name = 1;
  int32 value = 2;
  repeated Item645 items = 3;
}

// Simple item message
message Item645 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status645 {
  STATUS_645_UNSPECIFIED = 0;
  STATUS_645_ACTIVE = 1;
  STATUS_645_INACTIVE = 2;
  STATUS_645_PENDING = 3;
}

// Service definition
service Service645 {
  rpc Get645(Get645Request) returns (Get645Response);
  rpc List645(List645Request) returns (List645Response);
  rpc Create645(Create645Request) returns (Create645Response);
}

message Get645Request {
  string id = 1;
}

message Get645Response {
  Message645 result = 1;
}

message List645Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List645Response {
  repeated Message645 results = 1;
  string next_page_token = 2;
}

message Create645Request {
  Message645 message = 1;
}

message Create645Response {
  Message645 result = 1;
}
