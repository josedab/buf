syntax = "proto3";

package benchmark.pkg980;

// Message with various field types
message Message980 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage980 nested = 7;
  Status980 status = 8;
}

// Nested message type
message NestedMessage980 {
  string name = 1;
  int32 value = 2;
  repeated Item980 items = 3;
}

// Simple item message
message Item980 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status980 {
  STATUS_980_UNSPECIFIED = 0;
  STATUS_980_ACTIVE = 1;
  STATUS_980_INACTIVE = 2;
  STATUS_980_PENDING = 3;
}

// Service definition
service Service980 {
  rpc Get980(Get980Request) returns (Get980Response);
  rpc List980(List980Request) returns (List980Response);
  rpc Create980(Create980Request) returns (Create980Response);
}

message Get980Request {
  string id = 1;
}

message Get980Response {
  Message980 result = 1;
}

message List980Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List980Response {
  repeated Message980 results = 1;
  string next_page_token = 2;
}

message Create980Request {
  Message980 message = 1;
}

message Create980Response {
  Message980 result = 1;
}
