syntax = "proto3";

package benchmark.pkg265;

// Message with various field types
message Message265 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage265 nested = 7;
  Status265 status = 8;
}

// Nested message type
message NestedMessage265 {
  string name = 1;
  int32 value = 2;
  repeated Item265 items = 3;
}

// Simple item message
message Item265 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status265 {
  STATUS_265_UNSPECIFIED = 0;
  STATUS_265_ACTIVE = 1;
  STATUS_265_INACTIVE = 2;
  STATUS_265_PENDING = 3;
}

// Service definition
service Service265 {
  rpc Get265(Get265Request) returns (Get265Response);
  rpc List265(List265Request) returns (List265Response);
  rpc Create265(Create265Request) returns (Create265Response);
}

message Get265Request {
  string id = 1;
}

message Get265Response {
  Message265 result = 1;
}

message List265Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List265Response {
  repeated Message265 results = 1;
  string next_page_token = 2;
}

message Create265Request {
  Message265 message = 1;
}

message Create265Response {
  Message265 result = 1;
}
