syntax = "proto3";

package benchmark.pkg142;

// Message with various field types
message Message142 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage142 nested = 7;
  Status142 status = 8;
}

// Nested message type
message NestedMessage142 {
  string name = 1;
  int32 value = 2;
  repeated Item142 items = 3;
}

// Simple item message
message Item142 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status142 {
  STATUS_142_UNSPECIFIED = 0;
  STATUS_142_ACTIVE = 1;
  STATUS_142_INACTIVE = 2;
  STATUS_142_PENDING = 3;
}

// Service definition
service Service142 {
  rpc Get142(Get142Request) returns (Get142Response);
  rpc List142(List142Request) returns (List142Response);
  rpc Create142(Create142Request) returns (Create142Response);
}

message Get142Request {
  string id = 1;
}

message Get142Response {
  Message142 result = 1;
}

message List142Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List142Response {
  repeated Message142 results = 1;
  string next_page_token = 2;
}

message Create142Request {
  Message142 message = 1;
}

message Create142Response {
  Message142 result = 1;
}
