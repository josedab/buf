syntax = "proto3";

package benchmark.pkg930;

// Message with various field types
message Message930 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage930 nested = 7;
  Status930 status = 8;
}

// Nested message type
message NestedMessage930 {
  string name = 1;
  int32 value = 2;
  repeated Item930 items = 3;
}

// Simple item message
message Item930 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status930 {
  STATUS_930_UNSPECIFIED = 0;
  STATUS_930_ACTIVE = 1;
  STATUS_930_INACTIVE = 2;
  STATUS_930_PENDING = 3;
}

// Service definition
service Service930 {
  rpc Get930(Get930Request) returns (Get930Response);
  rpc List930(List930Request) returns (List930Response);
  rpc Create930(Create930Request) returns (Create930Response);
}

message Get930Request {
  string id = 1;
}

message Get930Response {
  Message930 result = 1;
}

message List930Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List930Response {
  repeated Message930 results = 1;
  string next_page_token = 2;
}

message Create930Request {
  Message930 message = 1;
}

message Create930Response {
  Message930 result = 1;
}
