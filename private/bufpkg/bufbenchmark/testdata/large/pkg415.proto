syntax = "proto3";

package benchmark.pkg415;

// Message with various field types
message Message415 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage415 nested = 7;
  Status415 status = 8;
}

// Nested message type
message NestedMessage415 {
  string name = 1;
  int32 value = 2;
  repeated Item415 items = 3;
}

// Simple item message
message Item415 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status415 {
  STATUS_415_UNSPECIFIED = 0;
  STATUS_415_ACTIVE = 1;
  STATUS_415_INACTIVE = 2;
  STATUS_415_PENDING = 3;
}

// Service definition
service Service415 {
  rpc Get415(Get415Request) returns (Get415Response);
  rpc List415(List415Request) returns (List415Response);
  rpc Create415(Create415Request) returns (Create415Response);
}

message Get415Request {
  string id = 1;
}

message Get415Response {
  Message415 result = 1;
}

message List415Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List415Response {
  repeated Message415 results = 1;
  string next_page_token = 2;
}

message Create415Request {
  Message415 message = 1;
}

message Create415Response {
  Message415 result = 1;
}
