syntax = "proto3";

package benchmark.pkg717;

// Message with various field types
message Message717 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage717 nested = 7;
  Status717 status = 8;
}

// Nested message type
message NestedMessage717 {
  string name = 1;
  int32 value = 2;
  repeated Item717 items = 3;
}

// Simple item message
message Item717 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status717 {
  STATUS_717_UNSPECIFIED = 0;
  STATUS_717_ACTIVE = 1;
  STATUS_717_INACTIVE = 2;
  STATUS_717_PENDING = 3;
}

// Service definition
service Service717 {
  rpc Get717(Get717Request) returns (Get717Response);
  rpc List717(List717Request) returns (List717Response);
  rpc Create717(Create717Request) returns (Create717Response);
}

message Get717Request {
  string id = 1;
}

message Get717Response {
  Message717 result = 1;
}

message List717Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List717Response {
  repeated Message717 results = 1;
  string next_page_token = 2;
}

message Create717Request {
  Message717 message = 1;
}

message Create717Response {
  Message717 result = 1;
}
