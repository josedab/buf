syntax = "proto3";

package benchmark.pkg513;

// Message with various field types
message Message513 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage513 nested = 7;
  Status513 status = 8;
}

// Nested message type
message NestedMessage513 {
  string name = 1;
  int32 value = 2;
  repeated Item513 items = 3;
}

// Simple item message
message Item513 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status513 {
  STATUS_513_UNSPECIFIED = 0;
  STATUS_513_ACTIVE = 1;
  STATUS_513_INACTIVE = 2;
  STATUS_513_PENDING = 3;
}

// Service definition
service Service513 {
  rpc Get513(Get513Request) returns (Get513Response);
  rpc List513(List513Request) returns (List513Response);
  rpc Create513(Create513Request) returns (Create513Response);
}

message Get513Request {
  string id = 1;
}

message Get513Response {
  Message513 result = 1;
}

message List513Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List513Response {
  repeated Message513 results = 1;
  string next_page_token = 2;
}

message Create513Request {
  Message513 message = 1;
}

message Create513Response {
  Message513 result = 1;
}
