syntax = "proto3";

package benchmark.pkg827;

// Message with various field types
message Message827 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage827 nested = 7;
  Status827 status = 8;
}

// Nested message type
message NestedMessage827 {
  string name = 1;
  int32 value = 2;
  repeated Item827 items = 3;
}

// Simple item message
message Item827 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status827 {
  STATUS_827_UNSPECIFIED = 0;
  STATUS_827_ACTIVE = 1;
  STATUS_827_INACTIVE = 2;
  STATUS_827_PENDING = 3;
}

// Service definition
service Service827 {
  rpc Get827(Get827Request) returns (Get827Response);
  rpc List827(List827Request) returns (List827Response);
  rpc Create827(Create827Request) returns (Create827Response);
}

message Get827Request {
  string id = 1;
}

message Get827Response {
  Message827 result = 1;
}

message List827Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List827Response {
  repeated Message827 results = 1;
  string next_page_token = 2;
}

message Create827Request {
  Message827 message = 1;
}

message Create827Response {
  Message827 result = 1;
}
