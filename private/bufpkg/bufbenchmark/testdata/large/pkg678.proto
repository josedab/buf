syntax = "proto3";

package benchmark.pkg678;

// Message with various field types
message Message678 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage678 nested = 7;
  Status678 status = 8;
}

// Nested message type
message NestedMessage678 {
  string name = 1;
  int32 value = 2;
  repeated Item678 items = 3;
}

// Simple item message
message Item678 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status678 {
  STATUS_678_UNSPECIFIED = 0;
  STATUS_678_ACTIVE = 1;
  STATUS_678_INACTIVE = 2;
  STATUS_678_PENDING = 3;
}

// Service definition
service Service678 {
  rpc Get678(Get678Request) returns (Get678Response);
  rpc List678(List678Request) returns (List678Response);
  rpc Create678(Create678Request) returns (Create678Response);
}

message Get678Request {
  string id = 1;
}

message Get678Response {
  Message678 result = 1;
}

message List678Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List678Response {
  repeated Message678 results = 1;
  string next_page_token = 2;
}

message Create678Request {
  Message678 message = 1;
}

message Create678Response {
  Message678 result = 1;
}
