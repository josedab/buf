syntax = "proto3";

package benchmark.pkg146;

// Message with various field types
message Message146 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage146 nested = 7;
  Status146 status = 8;
}

// Nested message type
message NestedMessage146 {
  string name = 1;
  int32 value = 2;
  repeated Item146 items = 3;
}

// Simple item message
message Item146 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status146 {
  STATUS_146_UNSPECIFIED = 0;
  STATUS_146_ACTIVE = 1;
  STATUS_146_INACTIVE = 2;
  STATUS_146_PENDING = 3;
}

// Service definition
service Service146 {
  rpc Get146(Get146Request) returns (Get146Response);
  rpc List146(List146Request) returns (List146Response);
  rpc Create146(Create146Request) returns (Create146Response);
}

message Get146Request {
  string id = 1;
}

message Get146Response {
  Message146 result = 1;
}

message List146Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List146Response {
  repeated Message146 results = 1;
  string next_page_token = 2;
}

message Create146Request {
  Message146 message = 1;
}

message Create146Response {
  Message146 result = 1;
}
