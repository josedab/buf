syntax = "proto3";

package benchmark.pkg87;

// Message with various field types
message Message87 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage87 nested = 7;
  Status87 status = 8;
}

// Nested message type
message NestedMessage87 {
  string name = 1;
  int32 value = 2;
  repeated Item87 items = 3;
}

// Simple item message
message Item87 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status87 {
  STATUS_87_UNSPECIFIED = 0;
  STATUS_87_ACTIVE = 1;
  STATUS_87_INACTIVE = 2;
  STATUS_87_PENDING = 3;
}

// Service definition
service Service87 {
  rpc Get87(Get87Request) returns (Get87Response);
  rpc List87(List87Request) returns (List87Response);
  rpc Create87(Create87Request) returns (Create87Response);
}

message Get87Request {
  string id = 1;
}

message Get87Response {
  Message87 result = 1;
}

message List87Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List87Response {
  repeated Message87 results = 1;
  string next_page_token = 2;
}

message Create87Request {
  Message87 message = 1;
}

message Create87Response {
  Message87 result = 1;
}
