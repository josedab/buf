syntax = "proto3";

package benchmark.pkg452;

// Message with various field types
message Message452 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage452 nested = 7;
  Status452 status = 8;
}

// Nested message type
message NestedMessage452 {
  string name = 1;
  int32 value = 2;
  repeated Item452 items = 3;
}

// Simple item message
message Item452 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status452 {
  STATUS_452_UNSPECIFIED = 0;
  STATUS_452_ACTIVE = 1;
  STATUS_452_INACTIVE = 2;
  STATUS_452_PENDING = 3;
}

// Service definition
service Service452 {
  rpc Get452(Get452Request) returns (Get452Response);
  rpc List452(List452Request) returns (List452Response);
  rpc Create452(Create452Request) returns (Create452Response);
}

message Get452Request {
  string id = 1;
}

message Get452Response {
  Message452 result = 1;
}

message List452Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List452Response {
  repeated Message452 results = 1;
  string next_page_token = 2;
}

message Create452Request {
  Message452 message = 1;
}

message Create452Response {
  Message452 result = 1;
}
