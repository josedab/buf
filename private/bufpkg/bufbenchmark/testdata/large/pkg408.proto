syntax = "proto3";

package benchmark.pkg408;

// Message with various field types
message Message408 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage408 nested = 7;
  Status408 status = 8;
}

// Nested message type
message NestedMessage408 {
  string name = 1;
  int32 value = 2;
  repeated Item408 items = 3;
}

// Simple item message
message Item408 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status408 {
  STATUS_408_UNSPECIFIED = 0;
  STATUS_408_ACTIVE = 1;
  STATUS_408_INACTIVE = 2;
  STATUS_408_PENDING = 3;
}

// Service definition
service Service408 {
  rpc Get408(Get408Request) returns (Get408Response);
  rpc List408(List408Request) returns (List408Response);
  rpc Create408(Create408Request) returns (Create408Response);
}

message Get408Request {
  string id = 1;
}

message Get408Response {
  Message408 result = 1;
}

message List408Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List408Response {
  repeated Message408 results = 1;
  string next_page_token = 2;
}

message Create408Request {
  Message408 message = 1;
}

message Create408Response {
  Message408 result = 1;
}
