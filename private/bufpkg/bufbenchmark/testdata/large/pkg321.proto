syntax = "proto3";

package benchmark.pkg321;

// Message with various field types
message Message321 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage321 nested = 7;
  Status321 status = 8;
}

// Nested message type
message NestedMessage321 {
  string name = 1;
  int32 value = 2;
  repeated Item321 items = 3;
}

// Simple item message
message Item321 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status321 {
  STATUS_321_UNSPECIFIED = 0;
  STATUS_321_ACTIVE = 1;
  STATUS_321_INACTIVE = 2;
  STATUS_321_PENDING = 3;
}

// Service definition
service Service321 {
  rpc Get321(Get321Request) returns (Get321Response);
  rpc List321(List321Request) returns (List321Response);
  rpc Create321(Create321Request) returns (Create321Response);
}

message Get321Request {
  string id = 1;
}

message Get321Response {
  Message321 result = 1;
}

message List321Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List321Response {
  repeated Message321 results = 1;
  string next_page_token = 2;
}

message Create321Request {
  Message321 message = 1;
}

message Create321Response {
  Message321 result = 1;
}
