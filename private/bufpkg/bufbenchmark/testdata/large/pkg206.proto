syntax = "proto3";

package benchmark.pkg206;

// Message with various field types
message Message206 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage206 nested = 7;
  Status206 status = 8;
}

// Nested message type
message NestedMessage206 {
  string name = 1;
  int32 value = 2;
  repeated Item206 items = 3;
}

// Simple item message
message Item206 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status206 {
  STATUS_206_UNSPECIFIED = 0;
  STATUS_206_ACTIVE = 1;
  STATUS_206_INACTIVE = 2;
  STATUS_206_PENDING = 3;
}

// Service definition
service Service206 {
  rpc Get206(Get206Request) returns (Get206Response);
  rpc List206(List206Request) returns (List206Response);
  rpc Create206(Create206Request) returns (Create206Response);
}

message Get206Request {
  string id = 1;
}

message Get206Response {
  Message206 result = 1;
}

message List206Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List206Response {
  repeated Message206 results = 1;
  string next_page_token = 2;
}

message Create206Request {
  Message206 message = 1;
}

message Create206Response {
  Message206 result = 1;
}
