syntax = "proto3";

package benchmark.pkg948;

// Message with various field types
message Message948 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage948 nested = 7;
  Status948 status = 8;
}

// Nested message type
message NestedMessage948 {
  string name = 1;
  int32 value = 2;
  repeated Item948 items = 3;
}

// Simple item message
message Item948 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status948 {
  STATUS_948_UNSPECIFIED = 0;
  STATUS_948_ACTIVE = 1;
  STATUS_948_INACTIVE = 2;
  STATUS_948_PENDING = 3;
}

// Service definition
service Service948 {
  rpc Get948(Get948Request) returns (Get948Response);
  rpc List948(List948Request) returns (List948Response);
  rpc Create948(Create948Request) returns (Create948Response);
}

message Get948Request {
  string id = 1;
}

message Get948Response {
  Message948 result = 1;
}

message List948Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List948Response {
  repeated Message948 results = 1;
  string next_page_token = 2;
}

message Create948Request {
  Message948 message = 1;
}

message Create948Response {
  Message948 result = 1;
}
