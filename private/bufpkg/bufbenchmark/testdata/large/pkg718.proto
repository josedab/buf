syntax = "proto3";

package benchmark.pkg718;

// Message with various field types
message Message718 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage718 nested = 7;
  Status718 status = 8;
}

// Nested message type
message NestedMessage718 {
  string name = 1;
  int32 value = 2;
  repeated Item718 items = 3;
}

// Simple item message
message Item718 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status718 {
  STATUS_718_UNSPECIFIED = 0;
  STATUS_718_ACTIVE = 1;
  STATUS_718_INACTIVE = 2;
  STATUS_718_PENDING = 3;
}

// Service definition
service Service718 {
  rpc Get718(Get718Request) returns (Get718Response);
  rpc List718(List718Request) returns (List718Response);
  rpc Create718(Create718Request) returns (Create718Response);
}

message Get718Request {
  string id = 1;
}

message Get718Response {
  Message718 result = 1;
}

message List718Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List718Response {
  repeated Message718 results = 1;
  string next_page_token = 2;
}

message Create718Request {
  Message718 message = 1;
}

message Create718Response {
  Message718 result = 1;
}
