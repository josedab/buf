syntax = "proto3";

package benchmark.pkg234;

// Message with various field types
message Message234 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage234 nested = 7;
  Status234 status = 8;
}

// Nested message type
message NestedMessage234 {
  string name = 1;
  int32 value = 2;
  repeated Item234 items = 3;
}

// Simple item message
message Item234 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status234 {
  STATUS_234_UNSPECIFIED = 0;
  STATUS_234_ACTIVE = 1;
  STATUS_234_INACTIVE = 2;
  STATUS_234_PENDING = 3;
}

// Service definition
service Service234 {
  rpc Get234(Get234Request) returns (Get234Response);
  rpc List234(List234Request) returns (List234Response);
  rpc Create234(Create234Request) returns (Create234Response);
}

message Get234Request {
  string id = 1;
}

message Get234Response {
  Message234 result = 1;
}

message List234Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List234Response {
  repeated Message234 results = 1;
  string next_page_token = 2;
}

message Create234Request {
  Message234 message = 1;
}

message Create234Response {
  Message234 result = 1;
}
