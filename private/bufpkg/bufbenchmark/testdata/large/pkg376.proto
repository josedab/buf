syntax = "proto3";

package benchmark.pkg376;

// Message with various field types
message Message376 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage376 nested = 7;
  Status376 status = 8;
}

// Nested message type
message NestedMessage376 {
  string name = 1;
  int32 value = 2;
  repeated Item376 items = 3;
}

// Simple item message
message Item376 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status376 {
  STATUS_376_UNSPECIFIED = 0;
  STATUS_376_ACTIVE = 1;
  STATUS_376_INACTIVE = 2;
  STATUS_376_PENDING = 3;
}

// Service definition
service Service376 {
  rpc Get376(Get376Request) returns (Get376Response);
  rpc List376(List376Request) returns (List376Response);
  rpc Create376(Create376Request) returns (Create376Response);
}

message Get376Request {
  string id = 1;
}

message Get376Response {
  Message376 result = 1;
}

message List376Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List376Response {
  repeated Message376 results = 1;
  string next_page_token = 2;
}

message Create376Request {
  Message376 message = 1;
}

message Create376Response {
  Message376 result = 1;
}
