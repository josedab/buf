syntax = "proto3";

package benchmark.pkg114;

// Message with various field types
message Message114 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage114 nested = 7;
  Status114 status = 8;
}

// Nested message type
message NestedMessage114 {
  string name = 1;
  int32 value = 2;
  repeated Item114 items = 3;
}

// Simple item message
message Item114 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status114 {
  STATUS_114_UNSPECIFIED = 0;
  STATUS_114_ACTIVE = 1;
  STATUS_114_INACTIVE = 2;
  STATUS_114_PENDING = 3;
}

// Service definition
service Service114 {
  rpc Get114(Get114Request) returns (Get114Response);
  rpc List114(List114Request) returns (List114Response);
  rpc Create114(Create114Request) returns (Create114Response);
}

message Get114Request {
  string id = 1;
}

message Get114Response {
  Message114 result = 1;
}

message List114Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List114Response {
  repeated Message114 results = 1;
  string next_page_token = 2;
}

message Create114Request {
  Message114 message = 1;
}

message Create114Response {
  Message114 result = 1;
}
