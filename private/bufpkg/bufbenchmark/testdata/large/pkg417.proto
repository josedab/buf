syntax = "proto3";

package benchmark.pkg417;

// Message with various field types
message Message417 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage417 nested = 7;
  Status417 status = 8;
}

// Nested message type
message NestedMessage417 {
  string name = 1;
  int32 value = 2;
  repeated Item417 items = 3;
}

// Simple item message
message Item417 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status417 {
  STATUS_417_UNSPECIFIED = 0;
  STATUS_417_ACTIVE = 1;
  STATUS_417_INACTIVE = 2;
  STATUS_417_PENDING = 3;
}

// Service definition
service Service417 {
  rpc Get417(Get417Request) returns (Get417Response);
  rpc List417(List417Request) returns (List417Response);
  rpc Create417(Create417Request) returns (Create417Response);
}

message Get417Request {
  string id = 1;
}

message Get417Response {
  Message417 result = 1;
}

message List417Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List417Response {
  repeated Message417 results = 1;
  string next_page_token = 2;
}

message Create417Request {
  Message417 message = 1;
}

message Create417Response {
  Message417 result = 1;
}
