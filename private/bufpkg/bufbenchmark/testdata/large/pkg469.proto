syntax = "proto3";

package benchmark.pkg469;

// Message with various field types
message Message469 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage469 nested = 7;
  Status469 status = 8;
}

// Nested message type
message NestedMessage469 {
  string name = 1;
  int32 value = 2;
  repeated Item469 items = 3;
}

// Simple item message
message Item469 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status469 {
  STATUS_469_UNSPECIFIED = 0;
  STATUS_469_ACTIVE = 1;
  STATUS_469_INACTIVE = 2;
  STATUS_469_PENDING = 3;
}

// Service definition
service Service469 {
  rpc Get469(Get469Request) returns (Get469Response);
  rpc List469(List469Request) returns (List469Response);
  rpc Create469(Create469Request) returns (Create469Response);
}

message Get469Request {
  string id = 1;
}

message Get469Response {
  Message469 result = 1;
}

message List469Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List469Response {
  repeated Message469 results = 1;
  string next_page_token = 2;
}

message Create469Request {
  Message469 message = 1;
}

message Create469Response {
  Message469 result = 1;
}
