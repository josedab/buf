syntax = "proto3";

package benchmark.pkg256;

// Message with various field types
message Message256 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage256 nested = 7;
  Status256 status = 8;
}

// Nested message type
message NestedMessage256 {
  string name = 1;
  int32 value = 2;
  repeated Item256 items = 3;
}

// Simple item message
message Item256 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status256 {
  STATUS_256_UNSPECIFIED = 0;
  STATUS_256_ACTIVE = 1;
  STATUS_256_INACTIVE = 2;
  STATUS_256_PENDING = 3;
}

// Service definition
service Service256 {
  rpc Get256(Get256Request) returns (Get256Response);
  rpc List256(List256Request) returns (List256Response);
  rpc Create256(Create256Request) returns (Create256Response);
}

message Get256Request {
  string id = 1;
}

message Get256Response {
  Message256 result = 1;
}

message List256Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List256Response {
  repeated Message256 results = 1;
  string next_page_token = 2;
}

message Create256Request {
  Message256 message = 1;
}

message Create256Response {
  Message256 result = 1;
}
