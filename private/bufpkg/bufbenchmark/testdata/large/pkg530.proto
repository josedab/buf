syntax = "proto3";

package benchmark.pkg530;

// Message with various field types
message Message530 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage530 nested = 7;
  Status530 status = 8;
}

// Nested message type
message NestedMessage530 {
  string name = 1;
  int32 value = 2;
  repeated Item530 items = 3;
}

// Simple item message
message Item530 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status530 {
  STATUS_530_UNSPECIFIED = 0;
  STATUS_530_ACTIVE = 1;
  STATUS_530_INACTIVE = 2;
  STATUS_530_PENDING = 3;
}

// Service definition
service Service530 {
  rpc Get530(Get530Request) returns (Get530Response);
  rpc List530(List530Request) returns (List530Response);
  rpc Create530(Create530Request) returns (Create530Response);
}

message Get530Request {
  string id = 1;
}

message Get530Response {
  Message530 result = 1;
}

message List530Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List530Response {
  repeated Message530 results = 1;
  string next_page_token = 2;
}

message Create530Request {
  Message530 message = 1;
}

message Create530Response {
  Message530 result = 1;
}
