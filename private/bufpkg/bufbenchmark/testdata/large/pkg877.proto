syntax = "proto3";

package benchmark.pkg877;

// Message with various field types
message Message877 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage877 nested = 7;
  Status877 status = 8;
}

// Nested message type
message NestedMessage877 {
  string name = 1;
  int32 value = 2;
  repeated Item877 items = 3;
}

// Simple item message
message Item877 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status877 {
  STATUS_877_UNSPECIFIED = 0;
  STATUS_877_ACTIVE = 1;
  STATUS_877_INACTIVE = 2;
  STATUS_877_PENDING = 3;
}

// Service definition
service Service877 {
  rpc Get877(Get877Request) returns (Get877Response);
  rpc List877(List877Request) returns (List877Response);
  rpc Create877(Create877Request) returns (Create877Response);
}

message Get877Request {
  string id = 1;
}

message Get877Response {
  Message877 result = 1;
}

message List877Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List877Response {
  repeated Message877 results = 1;
  string next_page_token = 2;
}

message Create877Request {
  Message877 message = 1;
}

message Create877Response {
  Message877 result = 1;
}
