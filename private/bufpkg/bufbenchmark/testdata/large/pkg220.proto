syntax = "proto3";

package benchmark.pkg220;

// Message with various field types
message Message220 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage220 nested = 7;
  Status220 status = 8;
}

// Nested message type
message NestedMessage220 {
  string name = 1;
  int32 value = 2;
  repeated Item220 items = 3;
}

// Simple item message
message Item220 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status220 {
  STATUS_220_UNSPECIFIED = 0;
  STATUS_220_ACTIVE = 1;
  STATUS_220_INACTIVE = 2;
  STATUS_220_PENDING = 3;
}

// Service definition
service Service220 {
  rpc Get220(Get220Request) returns (Get220Response);
  rpc List220(List220Request) returns (List220Response);
  rpc Create220(Create220Request) returns (Create220Response);
}

message Get220Request {
  string id = 1;
}

message Get220Response {
  Message220 result = 1;
}

message List220Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List220Response {
  repeated Message220 results = 1;
  string next_page_token = 2;
}

message Create220Request {
  Message220 message = 1;
}

message Create220Response {
  Message220 result = 1;
}
