syntax = "proto3";

package benchmark.pkg332;

// Message with various field types
message Message332 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage332 nested = 7;
  Status332 status = 8;
}

// Nested message type
message NestedMessage332 {
  string name = 1;
  int32 value = 2;
  repeated Item332 items = 3;
}

// Simple item message
message Item332 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status332 {
  STATUS_332_UNSPECIFIED = 0;
  STATUS_332_ACTIVE = 1;
  STATUS_332_INACTIVE = 2;
  STATUS_332_PENDING = 3;
}

// Service definition
service Service332 {
  rpc Get332(Get332Request) returns (Get332Response);
  rpc List332(List332Request) returns (List332Response);
  rpc Create332(Create332Request) returns (Create332Response);
}

message Get332Request {
  string id = 1;
}

message Get332Response {
  Message332 result = 1;
}

message List332Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List332Response {
  repeated Message332 results = 1;
  string next_page_token = 2;
}

message Create332Request {
  Message332 message = 1;
}

message Create332Response {
  Message332 result = 1;
}
