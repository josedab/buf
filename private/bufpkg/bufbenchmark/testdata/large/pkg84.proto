syntax = "proto3";

package benchmark.pkg84;

// Message with various field types
message Message84 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage84 nested = 7;
  Status84 status = 8;
}

// Nested message type
message NestedMessage84 {
  string name = 1;
  int32 value = 2;
  repeated Item84 items = 3;
}

// Simple item message
message Item84 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status84 {
  STATUS_84_UNSPECIFIED = 0;
  STATUS_84_ACTIVE = 1;
  STATUS_84_INACTIVE = 2;
  STATUS_84_PENDING = 3;
}

// Service definition
service Service84 {
  rpc Get84(Get84Request) returns (Get84Response);
  rpc List84(List84Request) returns (List84Response);
  rpc Create84(Create84Request) returns (Create84Response);
}

message Get84Request {
  string id = 1;
}

message Get84Response {
  Message84 result = 1;
}

message List84Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List84Response {
  repeated Message84 results = 1;
  string next_page_token = 2;
}

message Create84Request {
  Message84 message = 1;
}

message Create84Response {
  Message84 result = 1;
}
