syntax = "proto3";

package benchmark.pkg735;

// Message with various field types
message Message735 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage735 nested = 7;
  Status735 status = 8;
}

// Nested message type
message NestedMessage735 {
  string name = 1;
  int32 value = 2;
  repeated Item735 items = 3;
}

// Simple item message
message Item735 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status735 {
  STATUS_735_UNSPECIFIED = 0;
  STATUS_735_ACTIVE = 1;
  STATUS_735_INACTIVE = 2;
  STATUS_735_PENDING = 3;
}

// Service definition
service Service735 {
  rpc Get735(Get735Request) returns (Get735Response);
  rpc List735(List735Request) returns (List735Response);
  rpc Create735(Create735Request) returns (Create735Response);
}

message Get735Request {
  string id = 1;
}

message Get735Response {
  Message735 result = 1;
}

message List735Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List735Response {
  repeated Message735 results = 1;
  string next_page_token = 2;
}

message Create735Request {
  Message735 message = 1;
}

message Create735Response {
  Message735 result = 1;
}
