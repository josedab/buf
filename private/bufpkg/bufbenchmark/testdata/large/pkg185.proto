syntax = "proto3";

package benchmark.pkg185;

// Message with various field types
message Message185 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage185 nested = 7;
  Status185 status = 8;
}

// Nested message type
message NestedMessage185 {
  string name = 1;
  int32 value = 2;
  repeated Item185 items = 3;
}

// Simple item message
message Item185 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status185 {
  STATUS_185_UNSPECIFIED = 0;
  STATUS_185_ACTIVE = 1;
  STATUS_185_INACTIVE = 2;
  STATUS_185_PENDING = 3;
}

// Service definition
service Service185 {
  rpc Get185(Get185Request) returns (Get185Response);
  rpc List185(List185Request) returns (List185Response);
  rpc Create185(Create185Request) returns (Create185Response);
}

message Get185Request {
  string id = 1;
}

message Get185Response {
  Message185 result = 1;
}

message List185Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List185Response {
  repeated Message185 results = 1;
  string next_page_token = 2;
}

message Create185Request {
  Message185 message = 1;
}

message Create185Response {
  Message185 result = 1;
}
