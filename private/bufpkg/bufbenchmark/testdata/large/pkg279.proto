syntax = "proto3";

package benchmark.pkg279;

// Message with various field types
message Message279 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage279 nested = 7;
  Status279 status = 8;
}

// Nested message type
message NestedMessage279 {
  string name = 1;
  int32 value = 2;
  repeated Item279 items = 3;
}

// Simple item message
message Item279 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status279 {
  STATUS_279_UNSPECIFIED = 0;
  STATUS_279_ACTIVE = 1;
  STATUS_279_INACTIVE = 2;
  STATUS_279_PENDING = 3;
}

// Service definition
service Service279 {
  rpc Get279(Get279Request) returns (Get279Response);
  rpc List279(List279Request) returns (List279Response);
  rpc Create279(Create279Request) returns (Create279Response);
}

message Get279Request {
  string id = 1;
}

message Get279Response {
  Message279 result = 1;
}

message List279Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List279Response {
  repeated Message279 results = 1;
  string next_page_token = 2;
}

message Create279Request {
  Message279 message = 1;
}

message Create279Response {
  Message279 result = 1;
}
