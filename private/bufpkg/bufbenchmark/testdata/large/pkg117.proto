syntax = "proto3";

package benchmark.pkg117;

// Message with various field types
message Message117 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage117 nested = 7;
  Status117 status = 8;
}

// Nested message type
message NestedMessage117 {
  string name = 1;
  int32 value = 2;
  repeated Item117 items = 3;
}

// Simple item message
message Item117 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status117 {
  STATUS_117_UNSPECIFIED = 0;
  STATUS_117_ACTIVE = 1;
  STATUS_117_INACTIVE = 2;
  STATUS_117_PENDING = 3;
}

// Service definition
service Service117 {
  rpc Get117(Get117Request) returns (Get117Response);
  rpc List117(List117Request) returns (List117Response);
  rpc Create117(Create117Request) returns (Create117Response);
}

message Get117Request {
  string id = 1;
}

message Get117Response {
  Message117 result = 1;
}

message List117Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List117Response {
  repeated Message117 results = 1;
  string next_page_token = 2;
}

message Create117Request {
  Message117 message = 1;
}

message Create117Response {
  Message117 result = 1;
}
