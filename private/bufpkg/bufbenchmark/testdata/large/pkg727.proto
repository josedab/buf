syntax = "proto3";

package benchmark.pkg727;

// Message with various field types
message Message727 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage727 nested = 7;
  Status727 status = 8;
}

// Nested message type
message NestedMessage727 {
  string name = 1;
  int32 value = 2;
  repeated Item727 items = 3;
}

// Simple item message
message Item727 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status727 {
  STATUS_727_UNSPECIFIED = 0;
  STATUS_727_ACTIVE = 1;
  STATUS_727_INACTIVE = 2;
  STATUS_727_PENDING = 3;
}

// Service definition
service Service727 {
  rpc Get727(Get727Request) returns (Get727Response);
  rpc List727(List727Request) returns (List727Response);
  rpc Create727(Create727Request) returns (Create727Response);
}

message Get727Request {
  string id = 1;
}

message Get727Response {
  Message727 result = 1;
}

message List727Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List727Response {
  repeated Message727 results = 1;
  string next_page_token = 2;
}

message Create727Request {
  Message727 message = 1;
}

message Create727Response {
  Message727 result = 1;
}
