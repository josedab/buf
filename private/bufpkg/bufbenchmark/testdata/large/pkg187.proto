syntax = "proto3";

package benchmark.pkg187;

// Message with various field types
message Message187 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage187 nested = 7;
  Status187 status = 8;
}

// Nested message type
message NestedMessage187 {
  string name = 1;
  int32 value = 2;
  repeated Item187 items = 3;
}

// Simple item message
message Item187 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status187 {
  STATUS_187_UNSPECIFIED = 0;
  STATUS_187_ACTIVE = 1;
  STATUS_187_INACTIVE = 2;
  STATUS_187_PENDING = 3;
}

// Service definition
service Service187 {
  rpc Get187(Get187Request) returns (Get187Response);
  rpc List187(List187Request) returns (List187Response);
  rpc Create187(Create187Request) returns (Create187Response);
}

message Get187Request {
  string id = 1;
}

message Get187Response {
  Message187 result = 1;
}

message List187Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List187Response {
  repeated Message187 results = 1;
  string next_page_token = 2;
}

message Create187Request {
  Message187 message = 1;
}

message Create187Response {
  Message187 result = 1;
}
