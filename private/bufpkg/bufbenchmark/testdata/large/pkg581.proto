syntax = "proto3";

package benchmark.pkg581;

// Message with various field types
message Message581 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage581 nested = 7;
  Status581 status = 8;
}

// Nested message type
message NestedMessage581 {
  string name = 1;
  int32 value = 2;
  repeated Item581 items = 3;
}

// Simple item message
message Item581 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status581 {
  STATUS_581_UNSPECIFIED = 0;
  STATUS_581_ACTIVE = 1;
  STATUS_581_INACTIVE = 2;
  STATUS_581_PENDING = 3;
}

// Service definition
service Service581 {
  rpc Get581(Get581Request) returns (Get581Response);
  rpc List581(List581Request) returns (List581Response);
  rpc Create581(Create581Request) returns (Create581Response);
}

message Get581Request {
  string id = 1;
}

message Get581Response {
  Message581 result = 1;
}

message List581Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List581Response {
  repeated Message581 results = 1;
  string next_page_token = 2;
}

message Create581Request {
  Message581 message = 1;
}

message Create581Response {
  Message581 result = 1;
}
