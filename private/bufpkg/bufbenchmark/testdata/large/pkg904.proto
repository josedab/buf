syntax = "proto3";

package benchmark.pkg904;

// Message with various field types
message Message904 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage904 nested = 7;
  Status904 status = 8;
}

// Nested message type
message NestedMessage904 {
  string name = 1;
  int32 value = 2;
  repeated Item904 items = 3;
}

// Simple item message
message Item904 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status904 {
  STATUS_904_UNSPECIFIED = 0;
  STATUS_904_ACTIVE = 1;
  STATUS_904_INACTIVE = 2;
  STATUS_904_PENDING = 3;
}

// Service definition
service Service904 {
  rpc Get904(Get904Request) returns (Get904Response);
  rpc List904(List904Request) returns (List904Response);
  rpc Create904(Create904Request) returns (Create904Response);
}

message Get904Request {
  string id = 1;
}

message Get904Response {
  Message904 result = 1;
}

message List904Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List904Response {
  repeated Message904 results = 1;
  string next_page_token = 2;
}

message Create904Request {
  Message904 message = 1;
}

message Create904Response {
  Message904 result = 1;
}
