syntax = "proto3";

package benchmark.pkg579;

// Message with various field types
message Message579 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage579 nested = 7;
  Status579 status = 8;
}

// Nested message type
message NestedMessage579 {
  string name = 1;
  int32 value = 2;
  repeated Item579 items = 3;
}

// Simple item message
message Item579 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status579 {
  STATUS_579_UNSPECIFIED = 0;
  STATUS_579_ACTIVE = 1;
  STATUS_579_INACTIVE = 2;
  STATUS_579_PENDING = 3;
}

// Service definition
service Service579 {
  rpc Get579(Get579Request) returns (Get579Response);
  rpc List579(List579Request) returns (List579Response);
  rpc Create579(Create579Request) returns (Create579Response);
}

message Get579Request {
  string id = 1;
}

message Get579Response {
  Message579 result = 1;
}

message List579Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List579Response {
  repeated Message579 results = 1;
  string next_page_token = 2;
}

message Create579Request {
  Message579 message = 1;
}

message Create579Response {
  Message579 result = 1;
}
