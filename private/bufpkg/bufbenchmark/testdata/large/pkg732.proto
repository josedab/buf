syntax = "proto3";

package benchmark.pkg732;

// Message with various field types
message Message732 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage732 nested = 7;
  Status732 status = 8;
}

// Nested message type
message NestedMessage732 {
  string name = 1;
  int32 value = 2;
  repeated Item732 items = 3;
}

// Simple item message
message Item732 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status732 {
  STATUS_732_UNSPECIFIED = 0;
  STATUS_732_ACTIVE = 1;
  STATUS_732_INACTIVE = 2;
  STATUS_732_PENDING = 3;
}

// Service definition
service Service732 {
  rpc Get732(Get732Request) returns (Get732Response);
  rpc List732(List732Request) returns (List732Response);
  rpc Create732(Create732Request) returns (Create732Response);
}

message Get732Request {
  string id = 1;
}

message Get732Response {
  Message732 result = 1;
}

message List732Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List732Response {
  repeated Message732 results = 1;
  string next_page_token = 2;
}

message Create732Request {
  Message732 message = 1;
}

message Create732Response {
  Message732 result = 1;
}
