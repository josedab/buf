syntax = "proto3";

package benchmark.pkg39;

// Message with various field types
message Message39 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage39 nested = 7;
  Status39 status = 8;
}

// Nested message type
message NestedMessage39 {
  string name = 1;
  int32 value = 2;
  repeated Item39 items = 3;
}

// Simple item message
message Item39 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status39 {
  STATUS_39_UNSPECIFIED = 0;
  STATUS_39_ACTIVE = 1;
  STATUS_39_INACTIVE = 2;
  STATUS_39_PENDING = 3;
}

// Service definition
service Service39 {
  rpc Get39(Get39Request) returns (Get39Response);
  rpc List39(List39Request) returns (List39Response);
  rpc Create39(Create39Request) returns (Create39Response);
}

message Get39Request {
  string id = 1;
}

message Get39Response {
  Message39 result = 1;
}

message List39Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List39Response {
  repeated Message39 results = 1;
  string next_page_token = 2;
}

message Create39Request {
  Message39 message = 1;
}

message Create39Response {
  Message39 result = 1;
}
