syntax = "proto3";

package benchmark.pkg498;

// Message with various field types
message Message498 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage498 nested = 7;
  Status498 status = 8;
}

// Nested message type
message NestedMessage498 {
  string name = 1;
  int32 value = 2;
  repeated Item498 items = 3;
}

// Simple item message
message Item498 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status498 {
  STATUS_498_UNSPECIFIED = 0;
  STATUS_498_ACTIVE = 1;
  STATUS_498_INACTIVE = 2;
  STATUS_498_PENDING = 3;
}

// Service definition
service Service498 {
  rpc Get498(Get498Request) returns (Get498Response);
  rpc List498(List498Request) returns (List498Response);
  rpc Create498(Create498Request) returns (Create498Response);
}

message Get498Request {
  string id = 1;
}

message Get498Response {
  Message498 result = 1;
}

message List498Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List498Response {
  repeated Message498 results = 1;
  string next_page_token = 2;
}

message Create498Request {
  Message498 message = 1;
}

message Create498Response {
  Message498 result = 1;
}
