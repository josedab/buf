syntax = "proto3";

package benchmark.pkg276;

// Message with various field types
message Message276 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage276 nested = 7;
  Status276 status = 8;
}

// Nested message type
message NestedMessage276 {
  string name = 1;
  int32 value = 2;
  repeated Item276 items = 3;
}

// Simple item message
message Item276 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status276 {
  STATUS_276_UNSPECIFIED = 0;
  STATUS_276_ACTIVE = 1;
  STATUS_276_INACTIVE = 2;
  STATUS_276_PENDING = 3;
}

// Service definition
service Service276 {
  rpc Get276(Get276Request) returns (Get276Response);
  rpc List276(List276Request) returns (List276Response);
  rpc Create276(Create276Request) returns (Create276Response);
}

message Get276Request {
  string id = 1;
}

message Get276Response {
  Message276 result = 1;
}

message List276Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List276Response {
  repeated Message276 results = 1;
  string next_page_token = 2;
}

message Create276Request {
  Message276 message = 1;
}

message Create276Response {
  Message276 result = 1;
}
