syntax = "proto3";

package benchmark.pkg500;

// Message with various field types
message Message500 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage500 nested = 7;
  Status500 status = 8;
}

// Nested message type
message NestedMessage500 {
  string name = 1;
  int32 value = 2;
  repeated Item500 items = 3;
}

// Simple item message
message Item500 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status500 {
  STATUS_500_UNSPECIFIED = 0;
  STATUS_500_ACTIVE = 1;
  STATUS_500_INACTIVE = 2;
  STATUS_500_PENDING = 3;
}

// Service definition
service Service500 {
  rpc Get500(Get500Request) returns (Get500Response);
  rpc List500(List500Request) returns (List500Response);
  rpc Create500(Create500Request) returns (Create500Response);
}

message Get500Request {
  string id = 1;
}

message Get500Response {
  Message500 result = 1;
}

message List500Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List500Response {
  repeated Message500 results = 1;
  string next_page_token = 2;
}

message Create500Request {
  Message500 message = 1;
}

message Create500Response {
  Message500 result = 1;
}
