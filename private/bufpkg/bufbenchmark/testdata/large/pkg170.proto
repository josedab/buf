syntax = "proto3";

package benchmark.pkg170;

// Message with various field types
message Message170 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage170 nested = 7;
  Status170 status = 8;
}

// Nested message type
message NestedMessage170 {
  string name = 1;
  int32 value = 2;
  repeated Item170 items = 3;
}

// Simple item message
message Item170 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status170 {
  STATUS_170_UNSPECIFIED = 0;
  STATUS_170_ACTIVE = 1;
  STATUS_170_INACTIVE = 2;
  STATUS_170_PENDING = 3;
}

// Service definition
service Service170 {
  rpc Get170(Get170Request) returns (Get170Response);
  rpc List170(List170Request) returns (List170Response);
  rpc Create170(Create170Request) returns (Create170Response);
}

message Get170Request {
  string id = 1;
}

message Get170Response {
  Message170 result = 1;
}

message List170Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List170Response {
  repeated Message170 results = 1;
  string next_page_token = 2;
}

message Create170Request {
  Message170 message = 1;
}

message Create170Response {
  Message170 result = 1;
}
