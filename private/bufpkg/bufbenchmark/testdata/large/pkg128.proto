syntax = "proto3";

package benchmark.pkg128;

// Message with various field types
message Message128 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage128 nested = 7;
  Status128 status = 8;
}

// Nested message type
message NestedMessage128 {
  string name = 1;
  int32 value = 2;
  repeated Item128 items = 3;
}

// Simple item message
message Item128 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status128 {
  STATUS_128_UNSPECIFIED = 0;
  STATUS_128_ACTIVE = 1;
  STATUS_128_INACTIVE = 2;
  STATUS_128_PENDING = 3;
}

// Service definition
service Service128 {
  rpc Get128(Get128Request) returns (Get128Response);
  rpc List128(List128Request) returns (List128Response);
  rpc Create128(Create128Request) returns (Create128Response);
}

message Get128Request {
  string id = 1;
}

message Get128Response {
  Message128 result = 1;
}

message List128Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List128Response {
  repeated Message128 results = 1;
  string next_page_token = 2;
}

message Create128Request {
  Message128 message = 1;
}

message Create128Response {
  Message128 result = 1;
}
