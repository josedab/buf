syntax = "proto3";

package benchmark.pkg309;

// Message with various field types
message Message309 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage309 nested = 7;
  Status309 status = 8;
}

// Nested message type
message NestedMessage309 {
  string name = 1;
  int32 value = 2;
  repeated Item309 items = 3;
}

// Simple item message
message Item309 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status309 {
  STATUS_309_UNSPECIFIED = 0;
  STATUS_309_ACTIVE = 1;
  STATUS_309_INACTIVE = 2;
  STATUS_309_PENDING = 3;
}

// Service definition
service Service309 {
  rpc Get309(Get309Request) returns (Get309Response);
  rpc List309(List309Request) returns (List309Response);
  rpc Create309(Create309Request) returns (Create309Response);
}

message Get309Request {
  string id = 1;
}

message Get309Response {
  Message309 result = 1;
}

message List309Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List309Response {
  repeated Message309 results = 1;
  string next_page_token = 2;
}

message Create309Request {
  Message309 message = 1;
}

message Create309Response {
  Message309 result = 1;
}
