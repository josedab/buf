syntax = "proto3";

package benchmark.pkg405;

// Message with various field types
message Message405 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage405 nested = 7;
  Status405 status = 8;
}

// Nested message type
message NestedMessage405 {
  string name = 1;
  int32 value = 2;
  repeated Item405 items = 3;
}

// Simple item message
message Item405 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status405 {
  STATUS_405_UNSPECIFIED = 0;
  STATUS_405_ACTIVE = 1;
  STATUS_405_INACTIVE = 2;
  STATUS_405_PENDING = 3;
}

// Service definition
service Service405 {
  rpc Get405(Get405Request) returns (Get405Response);
  rpc List405(List405Request) returns (List405Response);
  rpc Create405(Create405Request) returns (Create405Response);
}

message Get405Request {
  string id = 1;
}

message Get405Response {
  Message405 result = 1;
}

message List405Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List405Response {
  repeated Message405 results = 1;
  string next_page_token = 2;
}

message Create405Request {
  Message405 message = 1;
}

message Create405Response {
  Message405 result = 1;
}
