syntax = "proto3";

package benchmark.pkg541;

// Message with various field types
message Message541 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage541 nested = 7;
  Status541 status = 8;
}

// Nested message type
message NestedMessage541 {
  string name = 1;
  int32 value = 2;
  repeated Item541 items = 3;
}

// Simple item message
message Item541 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status541 {
  STATUS_541_UNSPECIFIED = 0;
  STATUS_541_ACTIVE = 1;
  STATUS_541_INACTIVE = 2;
  STATUS_541_PENDING = 3;
}

// Service definition
service Service541 {
  rpc Get541(Get541Request) returns (Get541Response);
  rpc List541(List541Request) returns (List541Response);
  rpc Create541(Create541Request) returns (Create541Response);
}

message Get541Request {
  string id = 1;
}

message Get541Response {
  Message541 result = 1;
}

message List541Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List541Response {
  repeated Message541 results = 1;
  string next_page_token = 2;
}

message Create541Request {
  Message541 message = 1;
}

message Create541Response {
  Message541 result = 1;
}
