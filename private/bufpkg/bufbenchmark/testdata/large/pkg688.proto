syntax = "proto3";

package benchmark.pkg688;

// Message with various field types
message Message688 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage688 nested = 7;
  Status688 status = 8;
}

// Nested message type
message NestedMessage688 {
  string name = 1;
  int32 value = 2;
  repeated Item688 items = 3;
}

// Simple item message
message Item688 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status688 {
  STATUS_688_UNSPECIFIED = 0;
  STATUS_688_ACTIVE = 1;
  STATUS_688_INACTIVE = 2;
  STATUS_688_PENDING = 3;
}

// Service definition
service Service688 {
  rpc Get688(Get688Request) returns (Get688Response);
  rpc List688(List688Request) returns (List688Response);
  rpc Create688(Create688Request) returns (Create688Response);
}

message Get688Request {
  string id = 1;
}

message Get688Response {
  Message688 result = 1;
}

message List688Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List688Response {
  repeated Message688 results = 1;
  string next_page_token = 2;
}

message Create688Request {
  Message688 message = 1;
}

message Create688Response {
  Message688 result = 1;
}
