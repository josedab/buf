syntax = "proto3";

package benchmark.pkg868;

// Message with various field types
message Message868 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage868 nested = 7;
  Status868 status = 8;
}

// Nested message type
message NestedMessage868 {
  string name = 1;
  int32 value = 2;
  repeated Item868 items = 3;
}

// Simple item message
message Item868 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status868 {
  STATUS_868_UNSPECIFIED = 0;
  STATUS_868_ACTIVE = 1;
  STATUS_868_INACTIVE = 2;
  STATUS_868_PENDING = 3;
}

// Service definition
service Service868 {
  rpc Get868(Get868Request) returns (Get868Response);
  rpc List868(List868Request) returns (List868Response);
  rpc Create868(Create868Request) returns (Create868Response);
}

message Get868Request {
  string id = 1;
}

message Get868Response {
  Message868 result = 1;
}

message List868Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List868Response {
  repeated Message868 results = 1;
  string next_page_token = 2;
}

message Create868Request {
  Message868 message = 1;
}

message Create868Response {
  Message868 result = 1;
}
