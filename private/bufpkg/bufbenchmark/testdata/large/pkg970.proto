syntax = "proto3";

package benchmark.pkg970;

// Message with various field types
message Message970 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage970 nested = 7;
  Status970 status = 8;
}

// Nested message type
message NestedMessage970 {
  string name = 1;
  int32 value = 2;
  repeated Item970 items = 3;
}

// Simple item message
message Item970 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status970 {
  STATUS_970_UNSPECIFIED = 0;
  STATUS_970_ACTIVE = 1;
  STATUS_970_INACTIVE = 2;
  STATUS_970_PENDING = 3;
}

// Service definition
service Service970 {
  rpc Get970(Get970Request) returns (Get970Response);
  rpc List970(List970Request) returns (List970Response);
  rpc Create970(Create970Request) returns (Create970Response);
}

message Get970Request {
  string id = 1;
}

message Get970Response {
  Message970 result = 1;
}

message List970Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List970Response {
  repeated Message970 results = 1;
  string next_page_token = 2;
}

message Create970Request {
  Message970 message = 1;
}

message Create970Response {
  Message970 result = 1;
}
