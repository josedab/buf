syntax = "proto3";

package benchmark.pkg261;

// Message with various field types
message Message261 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage261 nested = 7;
  Status261 status = 8;
}

// Nested message type
message NestedMessage261 {
  string name = 1;
  int32 value = 2;
  repeated Item261 items = 3;
}

// Simple item message
message Item261 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status261 {
  STATUS_261_UNSPECIFIED = 0;
  STATUS_261_ACTIVE = 1;
  STATUS_261_INACTIVE = 2;
  STATUS_261_PENDING = 3;
}

// Service definition
service Service261 {
  rpc Get261(Get261Request) returns (Get261Response);
  rpc List261(List261Request) returns (List261Response);
  rpc Create261(Create261Request) returns (Create261Response);
}

message Get261Request {
  string id = 1;
}

message Get261Response {
  Message261 result = 1;
}

message List261Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List261Response {
  repeated Message261 results = 1;
  string next_page_token = 2;
}

message Create261Request {
  Message261 message = 1;
}

message Create261Response {
  Message261 result = 1;
}
