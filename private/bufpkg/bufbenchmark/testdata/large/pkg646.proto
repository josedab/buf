syntax = "proto3";

package benchmark.pkg646;

// Message with various field types
message Message646 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage646 nested = 7;
  Status646 status = 8;
}

// Nested message type
message NestedMessage646 {
  string name = 1;
  int32 value = 2;
  repeated Item646 items = 3;
}

// Simple item message
message Item646 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status646 {
  STATUS_646_UNSPECIFIED = 0;
  STATUS_646_ACTIVE = 1;
  STATUS_646_INACTIVE = 2;
  STATUS_646_PENDING = 3;
}

// Service definition
service Service646 {
  rpc Get646(Get646Request) returns (Get646Response);
  rpc List646(List646Request) returns (List646Response);
  rpc Create646(Create646Request) returns (Create646Response);
}

message Get646Request {
  string id = 1;
}

message Get646Response {
  Message646 result = 1;
}

message List646Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List646Response {
  repeated Message646 results = 1;
  string next_page_token = 2;
}

message Create646Request {
  Message646 message = 1;
}

message Create646Response {
  Message646 result = 1;
}
