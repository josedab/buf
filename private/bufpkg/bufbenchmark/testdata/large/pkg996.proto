syntax = "proto3";

package benchmark.pkg996;

// Message with various field types
message Message996 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage996 nested = 7;
  Status996 status = 8;
}

// Nested message type
message NestedMessage996 {
  string name = 1;
  int32 value = 2;
  repeated Item996 items = 3;
}

// Simple item message
message Item996 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status996 {
  STATUS_996_UNSPECIFIED = 0;
  STATUS_996_ACTIVE = 1;
  STATUS_996_INACTIVE = 2;
  STATUS_996_PENDING = 3;
}

// Service definition
service Service996 {
  rpc Get996(Get996Request) returns (Get996Response);
  rpc List996(List996Request) returns (List996Response);
  rpc Create996(Create996Request) returns (Create996Response);
}

message Get996Request {
  string id = 1;
}

message Get996Response {
  Message996 result = 1;
}

message List996Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List996Response {
  repeated Message996 results = 1;
  string next_page_token = 2;
}

message Create996Request {
  Message996 message = 1;
}

message Create996Response {
  Message996 result = 1;
}
