syntax = "proto3";

package benchmark.pkg613;

// Message with various field types
message Message613 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage613 nested = 7;
  Status613 status = 8;
}

// Nested message type
message NestedMessage613 {
  string name = 1;
  int32 value = 2;
  repeated Item613 items = 3;
}

// Simple item message
message Item613 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status613 {
  STATUS_613_UNSPECIFIED = 0;
  STATUS_613_ACTIVE = 1;
  STATUS_613_INACTIVE = 2;
  STATUS_613_PENDING = 3;
}

// Service definition
service Service613 {
  rpc Get613(Get613Request) returns (Get613Response);
  rpc List613(List613Request) returns (List613Response);
  rpc Create613(Create613Request) returns (Create613Response);
}

message Get613Request {
  string id = 1;
}

message Get613Response {
  Message613 result = 1;
}

message List613Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List613Response {
  repeated Message613 results = 1;
  string next_page_token = 2;
}

message Create613Request {
  Message613 message = 1;
}

message Create613Response {
  Message613 result = 1;
}
