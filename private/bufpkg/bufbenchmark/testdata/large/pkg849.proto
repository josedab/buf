syntax = "proto3";

package benchmark.pkg849;

// Message with various field types
message Message849 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage849 nested = 7;
  Status849 status = 8;
}

// Nested message type
message NestedMessage849 {
  string name = 1;
  int32 value = 2;
  repeated Item849 items = 3;
}

// Simple item message
message Item849 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status849 {
  STATUS_849_UNSPECIFIED = 0;
  STATUS_849_ACTIVE = 1;
  STATUS_849_INACTIVE = 2;
  STATUS_849_PENDING = 3;
}

// Service definition
service Service849 {
  rpc Get849(Get849Request) returns (Get849Response);
  rpc List849(List849Request) returns (List849Response);
  rpc Create849(Create849Request) returns (Create849Response);
}

message Get849Request {
  string id = 1;
}

message Get849Response {
  Message849 result = 1;
}

message List849Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List849Response {
  repeated Message849 results = 1;
  string next_page_token = 2;
}

message Create849Request {
  Message849 message = 1;
}

message Create849Response {
  Message849 result = 1;
}
