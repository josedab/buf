syntax = "proto3";

package benchmark.pkg130;

// Message with various field types
message Message130 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage130 nested = 7;
  Status130 status = 8;
}

// Nested message type
message NestedMessage130 {
  string name = 1;
  int32 value = 2;
  repeated Item130 items = 3;
}

// Simple item message
message Item130 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status130 {
  STATUS_130_UNSPECIFIED = 0;
  STATUS_130_ACTIVE = 1;
  STATUS_130_INACTIVE = 2;
  STATUS_130_PENDING = 3;
}

// Service definition
service Service130 {
  rpc Get130(Get130Request) returns (Get130Response);
  rpc List130(List130Request) returns (List130Response);
  rpc Create130(Create130Request) returns (Create130Response);
}

message Get130Request {
  string id = 1;
}

message Get130Response {
  Message130 result = 1;
}

message List130Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List130Response {
  repeated Message130 results = 1;
  string next_page_token = 2;
}

message Create130Request {
  Message130 message = 1;
}

message Create130Response {
  Message130 result = 1;
}
