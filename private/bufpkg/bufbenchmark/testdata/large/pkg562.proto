syntax = "proto3";

package benchmark.pkg562;

// Message with various field types
message Message562 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage562 nested = 7;
  Status562 status = 8;
}

// Nested message type
message NestedMessage562 {
  string name = 1;
  int32 value = 2;
  repeated Item562 items = 3;
}

// Simple item message
message Item562 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status562 {
  STATUS_562_UNSPECIFIED = 0;
  STATUS_562_ACTIVE = 1;
  STATUS_562_INACTIVE = 2;
  STATUS_562_PENDING = 3;
}

// Service definition
service Service562 {
  rpc Get562(Get562Request) returns (Get562Response);
  rpc List562(List562Request) returns (List562Response);
  rpc Create562(Create562Request) returns (Create562Response);
}

message Get562Request {
  string id = 1;
}

message Get562Response {
  Message562 result = 1;
}

message List562Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List562Response {
  repeated Message562 results = 1;
  string next_page_token = 2;
}

message Create562Request {
  Message562 message = 1;
}

message Create562Response {
  Message562 result = 1;
}
