syntax = "proto3";

package benchmark.pkg560;

// Message with various field types
message Message560 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage560 nested = 7;
  Status560 status = 8;
}

// Nested message type
message NestedMessage560 {
  string name = 1;
  int32 value = 2;
  repeated Item560 items = 3;
}

// Simple item message
message Item560 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status560 {
  STATUS_560_UNSPECIFIED = 0;
  STATUS_560_ACTIVE = 1;
  STATUS_560_INACTIVE = 2;
  STATUS_560_PENDING = 3;
}

// Service definition
service Service560 {
  rpc Get560(Get560Request) returns (Get560Response);
  rpc List560(List560Request) returns (List560Response);
  rpc Create560(Create560Request) returns (Create560Response);
}

message Get560Request {
  string id = 1;
}

message Get560Response {
  Message560 result = 1;
}

message List560Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List560Response {
  repeated Message560 results = 1;
  string next_page_token = 2;
}

message Create560Request {
  Message560 message = 1;
}

message Create560Response {
  Message560 result = 1;
}
