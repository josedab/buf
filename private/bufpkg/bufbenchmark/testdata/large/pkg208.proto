syntax = "proto3";

package benchmark.pkg208;

// Message with various field types
message Message208 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage208 nested = 7;
  Status208 status = 8;
}

// Nested message type
message NestedMessage208 {
  string name = 1;
  int32 value = 2;
  repeated Item208 items = 3;
}

// Simple item message
message Item208 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status208 {
  STATUS_208_UNSPECIFIED = 0;
  STATUS_208_ACTIVE = 1;
  STATUS_208_INACTIVE = 2;
  STATUS_208_PENDING = 3;
}

// Service definition
service Service208 {
  rpc Get208(Get208Request) returns (Get208Response);
  rpc List208(List208Request) returns (List208Response);
  rpc Create208(Create208Request) returns (Create208Response);
}

message Get208Request {
  string id = 1;
}

message Get208Response {
  Message208 result = 1;
}

message List208Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List208Response {
  repeated Message208 results = 1;
  string next_page_token = 2;
}

message Create208Request {
  Message208 message = 1;
}

message Create208Response {
  Message208 result = 1;
}
