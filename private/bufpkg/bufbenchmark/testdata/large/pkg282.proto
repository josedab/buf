syntax = "proto3";

package benchmark.pkg282;

// Message with various field types
message Message282 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage282 nested = 7;
  Status282 status = 8;
}

// Nested message type
message NestedMessage282 {
  string name = 1;
  int32 value = 2;
  repeated Item282 items = 3;
}

// Simple item message
message Item282 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status282 {
  STATUS_282_UNSPECIFIED = 0;
  STATUS_282_ACTIVE = 1;
  STATUS_282_INACTIVE = 2;
  STATUS_282_PENDING = 3;
}

// Service definition
service Service282 {
  rpc Get282(Get282Request) returns (Get282Response);
  rpc List282(List282Request) returns (List282Response);
  rpc Create282(Create282Request) returns (Create282Response);
}

message Get282Request {
  string id = 1;
}

message Get282Response {
  Message282 result = 1;
}

message List282Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List282Response {
  repeated Message282 results = 1;
  string next_page_token = 2;
}

message Create282Request {
  Message282 message = 1;
}

message Create282Response {
  Message282 result = 1;
}
