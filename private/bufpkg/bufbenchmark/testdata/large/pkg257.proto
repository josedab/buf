syntax = "proto3";

package benchmark.pkg257;

// Message with various field types
message Message257 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage257 nested = 7;
  Status257 status = 8;
}

// Nested message type
message NestedMessage257 {
  string name = 1;
  int32 value = 2;
  repeated Item257 items = 3;
}

// Simple item message
message Item257 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status257 {
  STATUS_257_UNSPECIFIED = 0;
  STATUS_257_ACTIVE = 1;
  STATUS_257_INACTIVE = 2;
  STATUS_257_PENDING = 3;
}

// Service definition
service Service257 {
  rpc Get257(Get257Request) returns (Get257Response);
  rpc List257(List257Request) returns (List257Response);
  rpc Create257(Create257Request) returns (Create257Response);
}

message Get257Request {
  string id = 1;
}

message Get257Response {
  Message257 result = 1;
}

message List257Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List257Response {
  repeated Message257 results = 1;
  string next_page_token = 2;
}

message Create257Request {
  Message257 message = 1;
}

message Create257Response {
  Message257 result = 1;
}
