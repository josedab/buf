syntax = "proto3";

package benchmark.pkg917;

// Message with various field types
message Message917 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage917 nested = 7;
  Status917 status = 8;
}

// Nested message type
message NestedMessage917 {
  string name = 1;
  int32 value = 2;
  repeated Item917 items = 3;
}

// Simple item message
message Item917 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status917 {
  STATUS_917_UNSPECIFIED = 0;
  STATUS_917_ACTIVE = 1;
  STATUS_917_INACTIVE = 2;
  STATUS_917_PENDING = 3;
}

// Service definition
service Service917 {
  rpc Get917(Get917Request) returns (Get917Response);
  rpc List917(List917Request) returns (List917Response);
  rpc Create917(Create917Request) returns (Create917Response);
}

message Get917Request {
  string id = 1;
}

message Get917Response {
  Message917 result = 1;
}

message List917Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List917Response {
  repeated Message917 results = 1;
  string next_page_token = 2;
}

message Create917Request {
  Message917 message = 1;
}

message Create917Response {
  Message917 result = 1;
}
