syntax = "proto3";

package benchmark.pkg350;

// Message with various field types
message Message350 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage350 nested = 7;
  Status350 status = 8;
}

// Nested message type
message NestedMessage350 {
  string name = 1;
  int32 value = 2;
  repeated Item350 items = 3;
}

// Simple item message
message Item350 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status350 {
  STATUS_350_UNSPECIFIED = 0;
  STATUS_350_ACTIVE = 1;
  STATUS_350_INACTIVE = 2;
  STATUS_350_PENDING = 3;
}

// Service definition
service Service350 {
  rpc Get350(Get350Request) returns (Get350Response);
  rpc List350(List350Request) returns (List350Response);
  rpc Create350(Create350Request) returns (Create350Response);
}

message Get350Request {
  string id = 1;
}

message Get350Response {
  Message350 result = 1;
}

message List350Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List350Response {
  repeated Message350 results = 1;
  string next_page_token = 2;
}

message Create350Request {
  Message350 message = 1;
}

message Create350Response {
  Message350 result = 1;
}
