syntax = "proto3";

package benchmark.pkg933;

// Message with various field types
message Message933 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage933 nested = 7;
  Status933 status = 8;
}

// Nested message type
message NestedMessage933 {
  string name = 1;
  int32 value = 2;
  repeated Item933 items = 3;
}

// Simple item message
message Item933 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status933 {
  STATUS_933_UNSPECIFIED = 0;
  STATUS_933_ACTIVE = 1;
  STATUS_933_INACTIVE = 2;
  STATUS_933_PENDING = 3;
}

// Service definition
service Service933 {
  rpc Get933(Get933Request) returns (Get933Response);
  rpc List933(List933Request) returns (List933Response);
  rpc Create933(Create933Request) returns (Create933Response);
}

message Get933Request {
  string id = 1;
}

message Get933Response {
  Message933 result = 1;
}

message List933Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List933Response {
  repeated Message933 results = 1;
  string next_page_token = 2;
}

message Create933Request {
  Message933 message = 1;
}

message Create933Response {
  Message933 result = 1;
}
