syntax = "proto3";

package benchmark.pkg712;

// Message with various field types
message Message712 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage712 nested = 7;
  Status712 status = 8;
}

// Nested message type
message NestedMessage712 {
  string name = 1;
  int32 value = 2;
  repeated Item712 items = 3;
}

// Simple item message
message Item712 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status712 {
  STATUS_712_UNSPECIFIED = 0;
  STATUS_712_ACTIVE = 1;
  STATUS_712_INACTIVE = 2;
  STATUS_712_PENDING = 3;
}

// Service definition
service Service712 {
  rpc Get712(Get712Request) returns (Get712Response);
  rpc List712(List712Request) returns (List712Response);
  rpc Create712(Create712Request) returns (Create712Response);
}

message Get712Request {
  string id = 1;
}

message Get712Response {
  Message712 result = 1;
}

message List712Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List712Response {
  repeated Message712 results = 1;
  string next_page_token = 2;
}

message Create712Request {
  Message712 message = 1;
}

message Create712Response {
  Message712 result = 1;
}
