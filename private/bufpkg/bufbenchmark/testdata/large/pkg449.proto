syntax = "proto3";

package benchmark.pkg449;

// Message with various field types
message Message449 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage449 nested = 7;
  Status449 status = 8;
}

// Nested message type
message NestedMessage449 {
  string name = 1;
  int32 value = 2;
  repeated Item449 items = 3;
}

// Simple item message
message Item449 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status449 {
  STATUS_449_UNSPECIFIED = 0;
  STATUS_449_ACTIVE = 1;
  STATUS_449_INACTIVE = 2;
  STATUS_449_PENDING = 3;
}

// Service definition
service Service449 {
  rpc Get449(Get449Request) returns (Get449Response);
  rpc List449(List449Request) returns (List449Response);
  rpc Create449(Create449Request) returns (Create449Response);
}

message Get449Request {
  string id = 1;
}

message Get449Response {
  Message449 result = 1;
}

message List449Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List449Response {
  repeated Message449 results = 1;
  string next_page_token = 2;
}

message Create449Request {
  Message449 message = 1;
}

message Create449Response {
  Message449 result = 1;
}
