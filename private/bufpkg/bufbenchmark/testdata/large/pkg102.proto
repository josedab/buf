syntax = "proto3";

package benchmark.pkg102;

// Message with various field types
message Message102 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage102 nested = 7;
  Status102 status = 8;
}

// Nested message type
message NestedMessage102 {
  string name = 1;
  int32 value = 2;
  repeated Item102 items = 3;
}

// Simple item message
message Item102 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status102 {
  STATUS_102_UNSPECIFIED = 0;
  STATUS_102_ACTIVE = 1;
  STATUS_102_INACTIVE = 2;
  STATUS_102_PENDING = 3;
}

// Service definition
service Service102 {
  rpc Get102(Get102Request) returns (Get102Response);
  rpc List102(List102Request) returns (List102Response);
  rpc Create102(Create102Request) returns (Create102Response);
}

message Get102Request {
  string id = 1;
}

message Get102Response {
  Message102 result = 1;
}

message List102Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List102Response {
  repeated Message102 results = 1;
  string next_page_token = 2;
}

message Create102Request {
  Message102 message = 1;
}

message Create102Response {
  Message102 result = 1;
}
