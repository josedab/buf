syntax = "proto3";

package benchmark.pkg432;

// Message with various field types
message Message432 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage432 nested = 7;
  Status432 status = 8;
}

// Nested message type
message NestedMessage432 {
  string name = 1;
  int32 value = 2;
  repeated Item432 items = 3;
}

// Simple item message
message Item432 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status432 {
  STATUS_432_UNSPECIFIED = 0;
  STATUS_432_ACTIVE = 1;
  STATUS_432_INACTIVE = 2;
  STATUS_432_PENDING = 3;
}

// Service definition
service Service432 {
  rpc Get432(Get432Request) returns (Get432Response);
  rpc List432(List432Request) returns (List432Response);
  rpc Create432(Create432Request) returns (Create432Response);
}

message Get432Request {
  string id = 1;
}

message Get432Response {
  Message432 result = 1;
}

message List432Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List432Response {
  repeated Message432 results = 1;
  string next_page_token = 2;
}

message Create432Request {
  Message432 message = 1;
}

message Create432Response {
  Message432 result = 1;
}
