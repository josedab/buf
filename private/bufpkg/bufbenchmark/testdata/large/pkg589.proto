syntax = "proto3";

package benchmark.pkg589;

// Message with various field types
message Message589 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage589 nested = 7;
  Status589 status = 8;
}

// Nested message type
message NestedMessage589 {
  string name = 1;
  int32 value = 2;
  repeated Item589 items = 3;
}

// Simple item message
message Item589 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status589 {
  STATUS_589_UNSPECIFIED = 0;
  STATUS_589_ACTIVE = 1;
  STATUS_589_INACTIVE = 2;
  STATUS_589_PENDING = 3;
}

// Service definition
service Service589 {
  rpc Get589(Get589Request) returns (Get589Response);
  rpc List589(List589Request) returns (List589Response);
  rpc Create589(Create589Request) returns (Create589Response);
}

message Get589Request {
  string id = 1;
}

message Get589Response {
  Message589 result = 1;
}

message List589Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List589Response {
  repeated Message589 results = 1;
  string next_page_token = 2;
}

message Create589Request {
  Message589 message = 1;
}

message Create589Response {
  Message589 result = 1;
}
