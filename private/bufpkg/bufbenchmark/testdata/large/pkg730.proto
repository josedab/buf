syntax = "proto3";

package benchmark.pkg730;

// Message with various field types
message Message730 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage730 nested = 7;
  Status730 status = 8;
}

// Nested message type
message NestedMessage730 {
  string name = 1;
  int32 value = 2;
  repeated Item730 items = 3;
}

// Simple item message
message Item730 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status730 {
  STATUS_730_UNSPECIFIED = 0;
  STATUS_730_ACTIVE = 1;
  STATUS_730_INACTIVE = 2;
  STATUS_730_PENDING = 3;
}

// Service definition
service Service730 {
  rpc Get730(Get730Request) returns (Get730Response);
  rpc List730(List730Request) returns (List730Response);
  rpc Create730(Create730Request) returns (Create730Response);
}

message Get730Request {
  string id = 1;
}

message Get730Response {
  Message730 result = 1;
}

message List730Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List730Response {
  repeated Message730 results = 1;
  string next_page_token = 2;
}

message Create730Request {
  Message730 message = 1;
}

message Create730Response {
  Message730 result = 1;
}
