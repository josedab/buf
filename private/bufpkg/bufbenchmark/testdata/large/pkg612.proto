syntax = "proto3";

package benchmark.pkg612;

// Message with various field types
message Message612 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage612 nested = 7;
  Status612 status = 8;
}

// Nested message type
message NestedMessage612 {
  string name = 1;
  int32 value = 2;
  repeated Item612 items = 3;
}

// Simple item message
message Item612 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status612 {
  STATUS_612_UNSPECIFIED = 0;
  STATUS_612_ACTIVE = 1;
  STATUS_612_INACTIVE = 2;
  STATUS_612_PENDING = 3;
}

// Service definition
service Service612 {
  rpc Get612(Get612Request) returns (Get612Response);
  rpc List612(List612Request) returns (List612Response);
  rpc Create612(Create612Request) returns (Create612Response);
}

message Get612Request {
  string id = 1;
}

message Get612Response {
  Message612 result = 1;
}

message List612Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List612Response {
  repeated Message612 results = 1;
  string next_page_token = 2;
}

message Create612Request {
  Message612 message = 1;
}

message Create612Response {
  Message612 result = 1;
}
