syntax = "proto3";

package benchmark.pkg285;

// Message with various field types
message Message285 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage285 nested = 7;
  Status285 status = 8;
}

// Nested message type
message NestedMessage285 {
  string name = 1;
  int32 value = 2;
  repeated Item285 items = 3;
}

// Simple item message
message Item285 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status285 {
  STATUS_285_UNSPECIFIED = 0;
  STATUS_285_ACTIVE = 1;
  STATUS_285_INACTIVE = 2;
  STATUS_285_PENDING = 3;
}

// Service definition
service Service285 {
  rpc Get285(Get285Request) returns (Get285Response);
  rpc List285(List285Request) returns (List285Response);
  rpc Create285(Create285Request) returns (Create285Response);
}

message Get285Request {
  string id = 1;
}

message Get285Response {
  Message285 result = 1;
}

message List285Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List285Response {
  repeated Message285 results = 1;
  string next_page_token = 2;
}

message Create285Request {
  Message285 message = 1;
}

message Create285Response {
  Message285 result = 1;
}
