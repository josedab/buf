syntax = "proto3";

package benchmark.pkg953;

// Message with various field types
message Message953 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage953 nested = 7;
  Status953 status = 8;
}

// Nested message type
message NestedMessage953 {
  string name = 1;
  int32 value = 2;
  repeated Item953 items = 3;
}

// Simple item message
message Item953 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status953 {
  STATUS_953_UNSPECIFIED = 0;
  STATUS_953_ACTIVE = 1;
  STATUS_953_INACTIVE = 2;
  STATUS_953_PENDING = 3;
}

// Service definition
service Service953 {
  rpc Get953(Get953Request) returns (Get953Response);
  rpc List953(List953Request) returns (List953Response);
  rpc Create953(Create953Request) returns (Create953Response);
}

message Get953Request {
  string id = 1;
}

message Get953Response {
  Message953 result = 1;
}

message List953Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List953Response {
  repeated Message953 results = 1;
  string next_page_token = 2;
}

message Create953Request {
  Message953 message = 1;
}

message Create953Response {
  Message953 result = 1;
}
