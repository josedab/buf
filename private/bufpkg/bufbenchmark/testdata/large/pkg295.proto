syntax = "proto3";

package benchmark.pkg295;

// Message with various field types
message Message295 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage295 nested = 7;
  Status295 status = 8;
}

// Nested message type
message NestedMessage295 {
  string name = 1;
  int32 value = 2;
  repeated Item295 items = 3;
}

// Simple item message
message Item295 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status295 {
  STATUS_295_UNSPECIFIED = 0;
  STATUS_295_ACTIVE = 1;
  STATUS_295_INACTIVE = 2;
  STATUS_295_PENDING = 3;
}

// Service definition
service Service295 {
  rpc Get295(Get295Request) returns (Get295Response);
  rpc List295(List295Request) returns (List295Response);
  rpc Create295(Create295Request) returns (Create295Response);
}

message Get295Request {
  string id = 1;
}

message Get295Response {
  Message295 result = 1;
}

message List295Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List295Response {
  repeated Message295 results = 1;
  string next_page_token = 2;
}

message Create295Request {
  Message295 message = 1;
}

message Create295Response {
  Message295 result = 1;
}
