syntax = "proto3";

package benchmark.pkg890;

// Message with various field types
message Message890 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage890 nested = 7;
  Status890 status = 8;
}

// Nested message type
message NestedMessage890 {
  string name = 1;
  int32 value = 2;
  repeated Item890 items = 3;
}

// Simple item message
message Item890 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status890 {
  STATUS_890_UNSPECIFIED = 0;
  STATUS_890_ACTIVE = 1;
  STATUS_890_INACTIVE = 2;
  STATUS_890_PENDING = 3;
}

// Service definition
service Service890 {
  rpc Get890(Get890Request) returns (Get890Response);
  rpc List890(List890Request) returns (List890Response);
  rpc Create890(Create890Request) returns (Create890Response);
}

message Get890Request {
  string id = 1;
}

message Get890Response {
  Message890 result = 1;
}

message List890Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List890Response {
  repeated Message890 results = 1;
  string next_page_token = 2;
}

message Create890Request {
  Message890 message = 1;
}

message Create890Response {
  Message890 result = 1;
}
