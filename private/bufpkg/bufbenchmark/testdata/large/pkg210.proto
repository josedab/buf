syntax = "proto3";

package benchmark.pkg210;

// Message with various field types
message Message210 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage210 nested = 7;
  Status210 status = 8;
}

// Nested message type
message NestedMessage210 {
  string name = 1;
  int32 value = 2;
  repeated Item210 items = 3;
}

// Simple item message
message Item210 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status210 {
  STATUS_210_UNSPECIFIED = 0;
  STATUS_210_ACTIVE = 1;
  STATUS_210_INACTIVE = 2;
  STATUS_210_PENDING = 3;
}

// Service definition
service Service210 {
  rpc Get210(Get210Request) returns (Get210Response);
  rpc List210(List210Request) returns (List210Response);
  rpc Create210(Create210Request) returns (Create210Response);
}

message Get210Request {
  string id = 1;
}

message Get210Response {
  Message210 result = 1;
}

message List210Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List210Response {
  repeated Message210 results = 1;
  string next_page_token = 2;
}

message Create210Request {
  Message210 message = 1;
}

message Create210Response {
  Message210 result = 1;
}
