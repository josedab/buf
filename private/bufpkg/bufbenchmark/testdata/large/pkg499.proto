syntax = "proto3";

package benchmark.pkg499;

// Message with various field types
message Message499 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage499 nested = 7;
  Status499 status = 8;
}

// Nested message type
message NestedMessage499 {
  string name = 1;
  int32 value = 2;
  repeated Item499 items = 3;
}

// Simple item message
message Item499 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status499 {
  STATUS_499_UNSPECIFIED = 0;
  STATUS_499_ACTIVE = 1;
  STATUS_499_INACTIVE = 2;
  STATUS_499_PENDING = 3;
}

// Service definition
service Service499 {
  rpc Get499(Get499Request) returns (Get499Response);
  rpc List499(List499Request) returns (List499Response);
  rpc Create499(Create499Request) returns (Create499Response);
}

message Get499Request {
  string id = 1;
}

message Get499Response {
  Message499 result = 1;
}

message List499Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List499Response {
  repeated Message499 results = 1;
  string next_page_token = 2;
}

message Create499Request {
  Message499 message = 1;
}

message Create499Response {
  Message499 result = 1;
}
