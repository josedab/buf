syntax = "proto3";

package benchmark.pkg482;

// Message with various field types
message Message482 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage482 nested = 7;
  Status482 status = 8;
}

// Nested message type
message NestedMessage482 {
  string name = 1;
  int32 value = 2;
  repeated Item482 items = 3;
}

// Simple item message
message Item482 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status482 {
  STATUS_482_UNSPECIFIED = 0;
  STATUS_482_ACTIVE = 1;
  STATUS_482_INACTIVE = 2;
  STATUS_482_PENDING = 3;
}

// Service definition
service Service482 {
  rpc Get482(Get482Request) returns (Get482Response);
  rpc List482(List482Request) returns (List482Response);
  rpc Create482(Create482Request) returns (Create482Response);
}

message Get482Request {
  string id = 1;
}

message Get482Response {
  Message482 result = 1;
}

message List482Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List482Response {
  repeated Message482 results = 1;
  string next_page_token = 2;
}

message Create482Request {
  Message482 message = 1;
}

message Create482Response {
  Message482 result = 1;
}
