syntax = "proto3";

package benchmark.pkg644;

// Message with various field types
message Message644 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage644 nested = 7;
  Status644 status = 8;
}

// Nested message type
message NestedMessage644 {
  string name = 1;
  int32 value = 2;
  repeated Item644 items = 3;
}

// Simple item message
message Item644 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status644 {
  STATUS_644_UNSPECIFIED = 0;
  STATUS_644_ACTIVE = 1;
  STATUS_644_INACTIVE = 2;
  STATUS_644_PENDING = 3;
}

// Service definition
service Service644 {
  rpc Get644(Get644Request) returns (Get644Response);
  rpc List644(List644Request) returns (List644Response);
  rpc Create644(Create644Request) returns (Create644Response);
}

message Get644Request {
  string id = 1;
}

message Get644Response {
  Message644 result = 1;
}

message List644Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List644Response {
  repeated Message644 results = 1;
  string next_page_token = 2;
}

message Create644Request {
  Message644 message = 1;
}

message Create644Response {
  Message644 result = 1;
}
