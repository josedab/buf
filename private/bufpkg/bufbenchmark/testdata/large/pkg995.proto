syntax = "proto3";

package benchmark.pkg995;

// Message with various field types
message Message995 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage995 nested = 7;
  Status995 status = 8;
}

// Nested message type
message NestedMessage995 {
  string name = 1;
  int32 value = 2;
  repeated Item995 items = 3;
}

// Simple item message
message Item995 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status995 {
  STATUS_995_UNSPECIFIED = 0;
  STATUS_995_ACTIVE = 1;
  STATUS_995_INACTIVE = 2;
  STATUS_995_PENDING = 3;
}

// Service definition
service Service995 {
  rpc Get995(Get995Request) returns (Get995Response);
  rpc List995(List995Request) returns (List995Response);
  rpc Create995(Create995Request) returns (Create995Response);
}

message Get995Request {
  string id = 1;
}

message Get995Response {
  Message995 result = 1;
}

message List995Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List995Response {
  repeated Message995 results = 1;
  string next_page_token = 2;
}

message Create995Request {
  Message995 message = 1;
}

message Create995Response {
  Message995 result = 1;
}
