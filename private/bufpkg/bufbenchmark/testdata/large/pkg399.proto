syntax = "proto3";

package benchmark.pkg399;

// Message with various field types
message Message399 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage399 nested = 7;
  Status399 status = 8;
}

// Nested message type
message NestedMessage399 {
  string name = 1;
  int32 value = 2;
  repeated Item399 items = 3;
}

// Simple item message
message Item399 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status399 {
  STATUS_399_UNSPECIFIED = 0;
  STATUS_399_ACTIVE = 1;
  STATUS_399_INACTIVE = 2;
  STATUS_399_PENDING = 3;
}

// Service definition
service Service399 {
  rpc Get399(Get399Request) returns (Get399Response);
  rpc List399(List399Request) returns (List399Response);
  rpc Create399(Create399Request) returns (Create399Response);
}

message Get399Request {
  string id = 1;
}

message Get399Response {
  Message399 result = 1;
}

message List399Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List399Response {
  repeated Message399 results = 1;
  string next_page_token = 2;
}

message Create399Request {
  Message399 message = 1;
}

message Create399Response {
  Message399 result = 1;
}
