syntax = "proto3";

package benchmark.pkg755;

// Message with various field types
message Message755 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage755 nested = 7;
  Status755 status = 8;
}

// Nested message type
message NestedMessage755 {
  string name = 1;
  int32 value = 2;
  repeated Item755 items = 3;
}

// Simple item message
message Item755 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status755 {
  STATUS_755_UNSPECIFIED = 0;
  STATUS_755_ACTIVE = 1;
  STATUS_755_INACTIVE = 2;
  STATUS_755_PENDING = 3;
}

// Service definition
service Service755 {
  rpc Get755(Get755Request) returns (Get755Response);
  rpc List755(List755Request) returns (List755Response);
  rpc Create755(Create755Request) returns (Create755Response);
}

message Get755Request {
  string id = 1;
}

message Get755Response {
  Message755 result = 1;
}

message List755Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List755Response {
  repeated Message755 results = 1;
  string next_page_token = 2;
}

message Create755Request {
  Message755 message = 1;
}

message Create755Response {
  Message755 result = 1;
}
