syntax = "proto3";

package benchmark.pkg745;

// Message with various field types
message Message745 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage745 nested = 7;
  Status745 status = 8;
}

// Nested message type
message NestedMessage745 {
  string name = 1;
  int32 value = 2;
  repeated Item745 items = 3;
}

// Simple item message
message Item745 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status745 {
  STATUS_745_UNSPECIFIED = 0;
  STATUS_745_ACTIVE = 1;
  STATUS_745_INACTIVE = 2;
  STATUS_745_PENDING = 3;
}

// Service definition
service Service745 {
  rpc Get745(Get745Request) returns (Get745Response);
  rpc List745(List745Request) returns (List745Response);
  rpc Create745(Create745Request) returns (Create745Response);
}

message Get745Request {
  string id = 1;
}

message Get745Response {
  Message745 result = 1;
}

message List745Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List745Response {
  repeated Message745 results = 1;
  string next_page_token = 2;
}

message Create745Request {
  Message745 message = 1;
}

message Create745Response {
  Message745 result = 1;
}
