syntax = "proto3";

package benchmark.pkg294;

// Message with various field types
message Message294 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage294 nested = 7;
  Status294 status = 8;
}

// Nested message type
message NestedMessage294 {
  string name = 1;
  int32 value = 2;
  repeated Item294 items = 3;
}

// Simple item message
message Item294 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status294 {
  STATUS_294_UNSPECIFIED = 0;
  STATUS_294_ACTIVE = 1;
  STATUS_294_INACTIVE = 2;
  STATUS_294_PENDING = 3;
}

// Service definition
service Service294 {
  rpc Get294(Get294Request) returns (Get294Response);
  rpc List294(List294Request) returns (List294Response);
  rpc Create294(Create294Request) returns (Create294Response);
}

message Get294Request {
  string id = 1;
}

message Get294Response {
  Message294 result = 1;
}

message List294Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List294Response {
  repeated Message294 results = 1;
  string next_page_token = 2;
}

message Create294Request {
  Message294 message = 1;
}

message Create294Response {
  Message294 result = 1;
}
