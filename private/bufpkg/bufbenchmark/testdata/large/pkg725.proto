syntax = "proto3";

package benchmark.pkg725;

// Message with various field types
message Message725 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage725 nested = 7;
  Status725 status = 8;
}

// Nested message type
message NestedMessage725 {
  string name = 1;
  int32 value = 2;
  repeated Item725 items = 3;
}

// Simple item message
message Item725 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status725 {
  STATUS_725_UNSPECIFIED = 0;
  STATUS_725_ACTIVE = 1;
  STATUS_725_INACTIVE = 2;
  STATUS_725_PENDING = 3;
}

// Service definition
service Service725 {
  rpc Get725(Get725Request) returns (Get725Response);
  rpc List725(List725Request) returns (List725Response);
  rpc Create725(Create725Request) returns (Create725Response);
}

message Get725Request {
  string id = 1;
}

message Get725Response {
  Message725 result = 1;
}

message List725Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List725Response {
  repeated Message725 results = 1;
  string next_page_token = 2;
}

message Create725Request {
  Message725 message = 1;
}

message Create725Response {
  Message725 result = 1;
}
