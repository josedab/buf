syntax = "proto3";

package benchmark.pkg215;

// Message with various field types
message Message215 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage215 nested = 7;
  Status215 status = 8;
}

// Nested message type
message NestedMessage215 {
  string name = 1;
  int32 value = 2;
  repeated Item215 items = 3;
}

// Simple item message
message Item215 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status215 {
  STATUS_215_UNSPECIFIED = 0;
  STATUS_215_ACTIVE = 1;
  STATUS_215_INACTIVE = 2;
  STATUS_215_PENDING = 3;
}

// Service definition
service Service215 {
  rpc Get215(Get215Request) returns (Get215Response);
  rpc List215(List215Request) returns (List215Response);
  rpc Create215(Create215Request) returns (Create215Response);
}

message Get215Request {
  string id = 1;
}

message Get215Response {
  Message215 result = 1;
}

message List215Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List215Response {
  repeated Message215 results = 1;
  string next_page_token = 2;
}

message Create215Request {
  Message215 message = 1;
}

message Create215Response {
  Message215 result = 1;
}
