syntax = "proto3";

package benchmark.pkg834;

// Message with various field types
message Message834 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage834 nested = 7;
  Status834 status = 8;
}

// Nested message type
message NestedMessage834 {
  string name = 1;
  int32 value = 2;
  repeated Item834 items = 3;
}

// Simple item message
message Item834 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status834 {
  STATUS_834_UNSPECIFIED = 0;
  STATUS_834_ACTIVE = 1;
  STATUS_834_INACTIVE = 2;
  STATUS_834_PENDING = 3;
}

// Service definition
service Service834 {
  rpc Get834(Get834Request) returns (Get834Response);
  rpc List834(List834Request) returns (List834Response);
  rpc Create834(Create834Request) returns (Create834Response);
}

message Get834Request {
  string id = 1;
}

message Get834Response {
  Message834 result = 1;
}

message List834Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List834Response {
  repeated Message834 results = 1;
  string next_page_token = 2;
}

message Create834Request {
  Message834 message = 1;
}

message Create834Response {
  Message834 result = 1;
}
