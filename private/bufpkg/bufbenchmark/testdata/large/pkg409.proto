syntax = "proto3";

package benchmark.pkg409;

// Message with various field types
message Message409 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage409 nested = 7;
  Status409 status = 8;
}

// Nested message type
message NestedMessage409 {
  string name = 1;
  int32 value = 2;
  repeated Item409 items = 3;
}

// Simple item message
message Item409 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status409 {
  STATUS_409_UNSPECIFIED = 0;
  STATUS_409_ACTIVE = 1;
  STATUS_409_INACTIVE = 2;
  STATUS_409_PENDING = 3;
}

// Service definition
service Service409 {
  rpc Get409(Get409Request) returns (Get409Response);
  rpc List409(List409Request) returns (List409Response);
  rpc Create409(Create409Request) returns (Create409Response);
}

message Get409Request {
  string id = 1;
}

message Get409Response {
  Message409 result = 1;
}

message List409Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List409Response {
  repeated Message409 results = 1;
  string next_page_token = 2;
}

message Create409Request {
  Message409 message = 1;
}

message Create409Response {
  Message409 result = 1;
}
