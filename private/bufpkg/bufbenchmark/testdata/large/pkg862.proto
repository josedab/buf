syntax = "proto3";

package benchmark.pkg862;

// Message with various field types
message Message862 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage862 nested = 7;
  Status862 status = 8;
}

// Nested message type
message NestedMessage862 {
  string name = 1;
  int32 value = 2;
  repeated Item862 items = 3;
}

// Simple item message
message Item862 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status862 {
  STATUS_862_UNSPECIFIED = 0;
  STATUS_862_ACTIVE = 1;
  STATUS_862_INACTIVE = 2;
  STATUS_862_PENDING = 3;
}

// Service definition
service Service862 {
  rpc Get862(Get862Request) returns (Get862Response);
  rpc List862(List862Request) returns (List862Response);
  rpc Create862(Create862Request) returns (Create862Response);
}

message Get862Request {
  string id = 1;
}

message Get862Response {
  Message862 result = 1;
}

message List862Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List862Response {
  repeated Message862 results = 1;
  string next_page_token = 2;
}

message Create862Request {
  Message862 message = 1;
}

message Create862Response {
  Message862 result = 1;
}
