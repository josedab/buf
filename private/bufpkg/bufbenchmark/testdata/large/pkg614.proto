syntax = "proto3";

package benchmark.pkg614;

// Message with various field types
message Message614 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage614 nested = 7;
  Status614 status = 8;
}

// Nested message type
message NestedMessage614 {
  string name = 1;
  int32 value = 2;
  repeated Item614 items = 3;
}

// Simple item message
message Item614 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status614 {
  STATUS_614_UNSPECIFIED = 0;
  STATUS_614_ACTIVE = 1;
  STATUS_614_INACTIVE = 2;
  STATUS_614_PENDING = 3;
}

// Service definition
service Service614 {
  rpc Get614(Get614Request) returns (Get614Response);
  rpc List614(List614Request) returns (List614Response);
  rpc Create614(Create614Request) returns (Create614Response);
}

message Get614Request {
  string id = 1;
}

message Get614Response {
  Message614 result = 1;
}

message List614Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List614Response {
  repeated Message614 results = 1;
  string next_page_token = 2;
}

message Create614Request {
  Message614 message = 1;
}

message Create614Response {
  Message614 result = 1;
}
