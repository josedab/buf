syntax = "proto3";

package benchmark.pkg489;

// Message with various field types
message Message489 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage489 nested = 7;
  Status489 status = 8;
}

// Nested message type
message NestedMessage489 {
  string name = 1;
  int32 value = 2;
  repeated Item489 items = 3;
}

// Simple item message
message Item489 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status489 {
  STATUS_489_UNSPECIFIED = 0;
  STATUS_489_ACTIVE = 1;
  STATUS_489_INACTIVE = 2;
  STATUS_489_PENDING = 3;
}

// Service definition
service Service489 {
  rpc Get489(Get489Request) returns (Get489Response);
  rpc List489(List489Request) returns (List489Response);
  rpc Create489(Create489Request) returns (Create489Response);
}

message Get489Request {
  string id = 1;
}

message Get489Response {
  Message489 result = 1;
}

message List489Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List489Response {
  repeated Message489 results = 1;
  string next_page_token = 2;
}

message Create489Request {
  Message489 message = 1;
}

message Create489Response {
  Message489 result = 1;
}
