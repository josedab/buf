syntax = "proto3";

package benchmark.pkg229;

// Message with various field types
message Message229 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage229 nested = 7;
  Status229 status = 8;
}

// Nested message type
message NestedMessage229 {
  string name = 1;
  int32 value = 2;
  repeated Item229 items = 3;
}

// Simple item message
message Item229 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status229 {
  STATUS_229_UNSPECIFIED = 0;
  STATUS_229_ACTIVE = 1;
  STATUS_229_INACTIVE = 2;
  STATUS_229_PENDING = 3;
}

// Service definition
service Service229 {
  rpc Get229(Get229Request) returns (Get229Response);
  rpc List229(List229Request) returns (List229Response);
  rpc Create229(Create229Request) returns (Create229Response);
}

message Get229Request {
  string id = 1;
}

message Get229Response {
  Message229 result = 1;
}

message List229Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List229Response {
  repeated Message229 results = 1;
  string next_page_token = 2;
}

message Create229Request {
  Message229 message = 1;
}

message Create229Response {
  Message229 result = 1;
}
