syntax = "proto3";

package benchmark.pkg119;

// Message with various field types
message Message119 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage119 nested = 7;
  Status119 status = 8;
}

// Nested message type
message NestedMessage119 {
  string name = 1;
  int32 value = 2;
  repeated Item119 items = 3;
}

// Simple item message
message Item119 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status119 {
  STATUS_119_UNSPECIFIED = 0;
  STATUS_119_ACTIVE = 1;
  STATUS_119_INACTIVE = 2;
  STATUS_119_PENDING = 3;
}

// Service definition
service Service119 {
  rpc Get119(Get119Request) returns (Get119Response);
  rpc List119(List119Request) returns (List119Response);
  rpc Create119(Create119Request) returns (Create119Response);
}

message Get119Request {
  string id = 1;
}

message Get119Response {
  Message119 result = 1;
}

message List119Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List119Response {
  repeated Message119 results = 1;
  string next_page_token = 2;
}

message Create119Request {
  Message119 message = 1;
}

message Create119Response {
  Message119 result = 1;
}
