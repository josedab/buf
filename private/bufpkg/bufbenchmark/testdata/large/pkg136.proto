syntax = "proto3";

package benchmark.pkg136;

// Message with various field types
message Message136 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage136 nested = 7;
  Status136 status = 8;
}

// Nested message type
message NestedMessage136 {
  string name = 1;
  int32 value = 2;
  repeated Item136 items = 3;
}

// Simple item message
message Item136 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status136 {
  STATUS_136_UNSPECIFIED = 0;
  STATUS_136_ACTIVE = 1;
  STATUS_136_INACTIVE = 2;
  STATUS_136_PENDING = 3;
}

// Service definition
service Service136 {
  rpc Get136(Get136Request) returns (Get136Response);
  rpc List136(List136Request) returns (List136Response);
  rpc Create136(Create136Request) returns (Create136Response);
}

message Get136Request {
  string id = 1;
}

message Get136Response {
  Message136 result = 1;
}

message List136Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List136Response {
  repeated Message136 results = 1;
  string next_page_token = 2;
}

message Create136Request {
  Message136 message = 1;
}

message Create136Response {
  Message136 result = 1;
}
