syntax = "proto3";

package benchmark.pkg134;

// Message with various field types
message Message134 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage134 nested = 7;
  Status134 status = 8;
}

// Nested message type
message NestedMessage134 {
  string name = 1;
  int32 value = 2;
  repeated Item134 items = 3;
}

// Simple item message
message Item134 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status134 {
  STATUS_134_UNSPECIFIED = 0;
  STATUS_134_ACTIVE = 1;
  STATUS_134_INACTIVE = 2;
  STATUS_134_PENDING = 3;
}

// Service definition
service Service134 {
  rpc Get134(Get134Request) returns (Get134Response);
  rpc List134(List134Request) returns (List134Response);
  rpc Create134(Create134Request) returns (Create134Response);
}

message Get134Request {
  string id = 1;
}

message Get134Response {
  Message134 result = 1;
}

message List134Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List134Response {
  repeated Message134 results = 1;
  string next_page_token = 2;
}

message Create134Request {
  Message134 message = 1;
}

message Create134Response {
  Message134 result = 1;
}
