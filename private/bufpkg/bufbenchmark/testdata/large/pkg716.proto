syntax = "proto3";

package benchmark.pkg716;

// Message with various field types
message Message716 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage716 nested = 7;
  Status716 status = 8;
}

// Nested message type
message NestedMessage716 {
  string name = 1;
  int32 value = 2;
  repeated Item716 items = 3;
}

// Simple item message
message Item716 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status716 {
  STATUS_716_UNSPECIFIED = 0;
  STATUS_716_ACTIVE = 1;
  STATUS_716_INACTIVE = 2;
  STATUS_716_PENDING = 3;
}

// Service definition
service Service716 {
  rpc Get716(Get716Request) returns (Get716Response);
  rpc List716(List716Request) returns (List716Response);
  rpc Create716(Create716Request) returns (Create716Response);
}

message Get716Request {
  string id = 1;
}

message Get716Response {
  Message716 result = 1;
}

message List716Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List716Response {
  repeated Message716 results = 1;
  string next_page_token = 2;
}

message Create716Request {
  Message716 message = 1;
}

message Create716Response {
  Message716 result = 1;
}
