syntax = "proto3";

package benchmark.pkg496;

// Message with various field types
message Message496 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage496 nested = 7;
  Status496 status = 8;
}

// Nested message type
message NestedMessage496 {
  string name = 1;
  int32 value = 2;
  repeated Item496 items = 3;
}

// Simple item message
message Item496 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status496 {
  STATUS_496_UNSPECIFIED = 0;
  STATUS_496_ACTIVE = 1;
  STATUS_496_INACTIVE = 2;
  STATUS_496_PENDING = 3;
}

// Service definition
service Service496 {
  rpc Get496(Get496Request) returns (Get496Response);
  rpc List496(List496Request) returns (List496Response);
  rpc Create496(Create496Request) returns (Create496Response);
}

message Get496Request {
  string id = 1;
}

message Get496Response {
  Message496 result = 1;
}

message List496Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List496Response {
  repeated Message496 results = 1;
  string next_page_token = 2;
}

message Create496Request {
  Message496 message = 1;
}

message Create496Response {
  Message496 result = 1;
}
