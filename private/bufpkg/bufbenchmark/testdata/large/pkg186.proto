syntax = "proto3";

package benchmark.pkg186;

// Message with various field types
message Message186 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage186 nested = 7;
  Status186 status = 8;
}

// Nested message type
message NestedMessage186 {
  string name = 1;
  int32 value = 2;
  repeated Item186 items = 3;
}

// Simple item message
message Item186 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status186 {
  STATUS_186_UNSPECIFIED = 0;
  STATUS_186_ACTIVE = 1;
  STATUS_186_INACTIVE = 2;
  STATUS_186_PENDING = 3;
}

// Service definition
service Service186 {
  rpc Get186(Get186Request) returns (Get186Response);
  rpc List186(List186Request) returns (List186Response);
  rpc Create186(Create186Request) returns (Create186Response);
}

message Get186Request {
  string id = 1;
}

message Get186Response {
  Message186 result = 1;
}

message List186Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List186Response {
  repeated Message186 results = 1;
  string next_page_token = 2;
}

message Create186Request {
  Message186 message = 1;
}

message Create186Response {
  Message186 result = 1;
}
