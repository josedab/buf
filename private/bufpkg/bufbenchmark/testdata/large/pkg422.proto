syntax = "proto3";

package benchmark.pkg422;

// Message with various field types
message Message422 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage422 nested = 7;
  Status422 status = 8;
}

// Nested message type
message NestedMessage422 {
  string name = 1;
  int32 value = 2;
  repeated Item422 items = 3;
}

// Simple item message
message Item422 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status422 {
  STATUS_422_UNSPECIFIED = 0;
  STATUS_422_ACTIVE = 1;
  STATUS_422_INACTIVE = 2;
  STATUS_422_PENDING = 3;
}

// Service definition
service Service422 {
  rpc Get422(Get422Request) returns (Get422Response);
  rpc List422(List422Request) returns (List422Response);
  rpc Create422(Create422Request) returns (Create422Response);
}

message Get422Request {
  string id = 1;
}

message Get422Response {
  Message422 result = 1;
}

message List422Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List422Response {
  repeated Message422 results = 1;
  string next_page_token = 2;
}

message Create422Request {
  Message422 message = 1;
}

message Create422Response {
  Message422 result = 1;
}
