syntax = "proto3";

package benchmark.pkg387;

// Message with various field types
message Message387 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage387 nested = 7;
  Status387 status = 8;
}

// Nested message type
message NestedMessage387 {
  string name = 1;
  int32 value = 2;
  repeated Item387 items = 3;
}

// Simple item message
message Item387 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status387 {
  STATUS_387_UNSPECIFIED = 0;
  STATUS_387_ACTIVE = 1;
  STATUS_387_INACTIVE = 2;
  STATUS_387_PENDING = 3;
}

// Service definition
service Service387 {
  rpc Get387(Get387Request) returns (Get387Response);
  rpc List387(List387Request) returns (List387Response);
  rpc Create387(Create387Request) returns (Create387Response);
}

message Get387Request {
  string id = 1;
}

message Get387Response {
  Message387 result = 1;
}

message List387Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List387Response {
  repeated Message387 results = 1;
  string next_page_token = 2;
}

message Create387Request {
  Message387 message = 1;
}

message Create387Response {
  Message387 result = 1;
}
