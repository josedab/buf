syntax = "proto3";

package benchmark.pkg389;

// Message with various field types
message Message389 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage389 nested = 7;
  Status389 status = 8;
}

// Nested message type
message NestedMessage389 {
  string name = 1;
  int32 value = 2;
  repeated Item389 items = 3;
}

// Simple item message
message Item389 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status389 {
  STATUS_389_UNSPECIFIED = 0;
  STATUS_389_ACTIVE = 1;
  STATUS_389_INACTIVE = 2;
  STATUS_389_PENDING = 3;
}

// Service definition
service Service389 {
  rpc Get389(Get389Request) returns (Get389Response);
  rpc List389(List389Request) returns (List389Response);
  rpc Create389(Create389Request) returns (Create389Response);
}

message Get389Request {
  string id = 1;
}

message Get389Response {
  Message389 result = 1;
}

message List389Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List389Response {
  repeated Message389 results = 1;
  string next_page_token = 2;
}

message Create389Request {
  Message389 message = 1;
}

message Create389Response {
  Message389 result = 1;
}
