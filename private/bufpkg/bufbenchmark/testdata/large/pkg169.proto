syntax = "proto3";

package benchmark.pkg169;

// Message with various field types
message Message169 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage169 nested = 7;
  Status169 status = 8;
}

// Nested message type
message NestedMessage169 {
  string name = 1;
  int32 value = 2;
  repeated Item169 items = 3;
}

// Simple item message
message Item169 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status169 {
  STATUS_169_UNSPECIFIED = 0;
  STATUS_169_ACTIVE = 1;
  STATUS_169_INACTIVE = 2;
  STATUS_169_PENDING = 3;
}

// Service definition
service Service169 {
  rpc Get169(Get169Request) returns (Get169Response);
  rpc List169(List169Request) returns (List169Response);
  rpc Create169(Create169Request) returns (Create169Response);
}

message Get169Request {
  string id = 1;
}

message Get169Response {
  Message169 result = 1;
}

message List169Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List169Response {
  repeated Message169 results = 1;
  string next_page_token = 2;
}

message Create169Request {
  Message169 message = 1;
}

message Create169Response {
  Message169 result = 1;
}
