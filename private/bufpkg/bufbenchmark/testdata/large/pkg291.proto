syntax = "proto3";

package benchmark.pkg291;

// Message with various field types
message Message291 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage291 nested = 7;
  Status291 status = 8;
}

// Nested message type
message NestedMessage291 {
  string name = 1;
  int32 value = 2;
  repeated Item291 items = 3;
}

// Simple item message
message Item291 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status291 {
  STATUS_291_UNSPECIFIED = 0;
  STATUS_291_ACTIVE = 1;
  STATUS_291_INACTIVE = 2;
  STATUS_291_PENDING = 3;
}

// Service definition
service Service291 {
  rpc Get291(Get291Request) returns (Get291Response);
  rpc List291(List291Request) returns (List291Response);
  rpc Create291(Create291Request) returns (Create291Response);
}

message Get291Request {
  string id = 1;
}

message Get291Response {
  Message291 result = 1;
}

message List291Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List291Response {
  repeated Message291 results = 1;
  string next_page_token = 2;
}

message Create291Request {
  Message291 message = 1;
}

message Create291Response {
  Message291 result = 1;
}
