syntax = "proto3";

package benchmark.pkg281;

// Message with various field types
message Message281 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage281 nested = 7;
  Status281 status = 8;
}

// Nested message type
message NestedMessage281 {
  string name = 1;
  int32 value = 2;
  repeated Item281 items = 3;
}

// Simple item message
message Item281 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status281 {
  STATUS_281_UNSPECIFIED = 0;
  STATUS_281_ACTIVE = 1;
  STATUS_281_INACTIVE = 2;
  STATUS_281_PENDING = 3;
}

// Service definition
service Service281 {
  rpc Get281(Get281Request) returns (Get281Response);
  rpc List281(List281Request) returns (List281Response);
  rpc Create281(Create281Request) returns (Create281Response);
}

message Get281Request {
  string id = 1;
}

message Get281Response {
  Message281 result = 1;
}

message List281Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List281Response {
  repeated Message281 results = 1;
  string next_page_token = 2;
}

message Create281Request {
  Message281 message = 1;
}

message Create281Response {
  Message281 result = 1;
}
