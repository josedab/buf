syntax = "proto3";

package benchmark.pkg162;

// Message with various field types
message Message162 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage162 nested = 7;
  Status162 status = 8;
}

// Nested message type
message NestedMessage162 {
  string name = 1;
  int32 value = 2;
  repeated Item162 items = 3;
}

// Simple item message
message Item162 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status162 {
  STATUS_162_UNSPECIFIED = 0;
  STATUS_162_ACTIVE = 1;
  STATUS_162_INACTIVE = 2;
  STATUS_162_PENDING = 3;
}

// Service definition
service Service162 {
  rpc Get162(Get162Request) returns (Get162Response);
  rpc List162(List162Request) returns (List162Response);
  rpc Create162(Create162Request) returns (Create162Response);
}

message Get162Request {
  string id = 1;
}

message Get162Response {
  Message162 result = 1;
}

message List162Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List162Response {
  repeated Message162 results = 1;
  string next_page_token = 2;
}

message Create162Request {
  Message162 message = 1;
}

message Create162Response {
  Message162 result = 1;
}
