syntax = "proto3";

package benchmark.pkg677;

// Message with various field types
message Message677 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage677 nested = 7;
  Status677 status = 8;
}

// Nested message type
message NestedMessage677 {
  string name = 1;
  int32 value = 2;
  repeated Item677 items = 3;
}

// Simple item message
message Item677 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status677 {
  STATUS_677_UNSPECIFIED = 0;
  STATUS_677_ACTIVE = 1;
  STATUS_677_INACTIVE = 2;
  STATUS_677_PENDING = 3;
}

// Service definition
service Service677 {
  rpc Get677(Get677Request) returns (Get677Response);
  rpc List677(List677Request) returns (List677Response);
  rpc Create677(Create677Request) returns (Create677Response);
}

message Get677Request {
  string id = 1;
}

message Get677Response {
  Message677 result = 1;
}

message List677Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List677Response {
  repeated Message677 results = 1;
  string next_page_token = 2;
}

message Create677Request {
  Message677 message = 1;
}

message Create677Response {
  Message677 result = 1;
}
