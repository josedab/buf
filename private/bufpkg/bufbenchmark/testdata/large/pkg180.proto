syntax = "proto3";

package benchmark.pkg180;

// Message with various field types
message Message180 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage180 nested = 7;
  Status180 status = 8;
}

// Nested message type
message NestedMessage180 {
  string name = 1;
  int32 value = 2;
  repeated Item180 items = 3;
}

// Simple item message
message Item180 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status180 {
  STATUS_180_UNSPECIFIED = 0;
  STATUS_180_ACTIVE = 1;
  STATUS_180_INACTIVE = 2;
  STATUS_180_PENDING = 3;
}

// Service definition
service Service180 {
  rpc Get180(Get180Request) returns (Get180Response);
  rpc List180(List180Request) returns (List180Response);
  rpc Create180(Create180Request) returns (Create180Response);
}

message Get180Request {
  string id = 1;
}

message Get180Response {
  Message180 result = 1;
}

message List180Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List180Response {
  repeated Message180 results = 1;
  string next_page_token = 2;
}

message Create180Request {
  Message180 message = 1;
}

message Create180Response {
  Message180 result = 1;
}
