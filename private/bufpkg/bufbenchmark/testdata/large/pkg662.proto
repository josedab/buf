syntax = "proto3";

package benchmark.pkg662;

// Message with various field types
message Message662 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage662 nested = 7;
  Status662 status = 8;
}

// Nested message type
message NestedMessage662 {
  string name = 1;
  int32 value = 2;
  repeated Item662 items = 3;
}

// Simple item message
message Item662 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status662 {
  STATUS_662_UNSPECIFIED = 0;
  STATUS_662_ACTIVE = 1;
  STATUS_662_INACTIVE = 2;
  STATUS_662_PENDING = 3;
}

// Service definition
service Service662 {
  rpc Get662(Get662Request) returns (Get662Response);
  rpc List662(List662Request) returns (List662Response);
  rpc Create662(Create662Request) returns (Create662Response);
}

message Get662Request {
  string id = 1;
}

message Get662Response {
  Message662 result = 1;
}

message List662Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List662Response {
  repeated Message662 results = 1;
  string next_page_token = 2;
}

message Create662Request {
  Message662 message = 1;
}

message Create662Response {
  Message662 result = 1;
}
