syntax = "proto3";

package benchmark.pkg686;

// Message with various field types
message Message686 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage686 nested = 7;
  Status686 status = 8;
}

// Nested message type
message NestedMessage686 {
  string name = 1;
  int32 value = 2;
  repeated Item686 items = 3;
}

// Simple item message
message Item686 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status686 {
  STATUS_686_UNSPECIFIED = 0;
  STATUS_686_ACTIVE = 1;
  STATUS_686_INACTIVE = 2;
  STATUS_686_PENDING = 3;
}

// Service definition
service Service686 {
  rpc Get686(Get686Request) returns (Get686Response);
  rpc List686(List686Request) returns (List686Response);
  rpc Create686(Create686Request) returns (Create686Response);
}

message Get686Request {
  string id = 1;
}

message Get686Response {
  Message686 result = 1;
}

message List686Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List686Response {
  repeated Message686 results = 1;
  string next_page_token = 2;
}

message Create686Request {
  Message686 message = 1;
}

message Create686Response {
  Message686 result = 1;
}
