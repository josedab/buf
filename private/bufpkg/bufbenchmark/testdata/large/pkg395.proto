syntax = "proto3";

package benchmark.pkg395;

// Message with various field types
message Message395 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage395 nested = 7;
  Status395 status = 8;
}

// Nested message type
message NestedMessage395 {
  string name = 1;
  int32 value = 2;
  repeated Item395 items = 3;
}

// Simple item message
message Item395 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status395 {
  STATUS_395_UNSPECIFIED = 0;
  STATUS_395_ACTIVE = 1;
  STATUS_395_INACTIVE = 2;
  STATUS_395_PENDING = 3;
}

// Service definition
service Service395 {
  rpc Get395(Get395Request) returns (Get395Response);
  rpc List395(List395Request) returns (List395Response);
  rpc Create395(Create395Request) returns (Create395Response);
}

message Get395Request {
  string id = 1;
}

message Get395Response {
  Message395 result = 1;
}

message List395Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List395Response {
  repeated Message395 results = 1;
  string next_page_token = 2;
}

message Create395Request {
  Message395 message = 1;
}

message Create395Response {
  Message395 result = 1;
}
