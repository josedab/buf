syntax = "proto3";

package benchmark.pkg393;

// Message with various field types
message Message393 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage393 nested = 7;
  Status393 status = 8;
}

// Nested message type
message NestedMessage393 {
  string name = 1;
  int32 value = 2;
  repeated Item393 items = 3;
}

// Simple item message
message Item393 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status393 {
  STATUS_393_UNSPECIFIED = 0;
  STATUS_393_ACTIVE = 1;
  STATUS_393_INACTIVE = 2;
  STATUS_393_PENDING = 3;
}

// Service definition
service Service393 {
  rpc Get393(Get393Request) returns (Get393Response);
  rpc List393(List393Request) returns (List393Response);
  rpc Create393(Create393Request) returns (Create393Response);
}

message Get393Request {
  string id = 1;
}

message Get393Response {
  Message393 result = 1;
}

message List393Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List393Response {
  repeated Message393 results = 1;
  string next_page_token = 2;
}

message Create393Request {
  Message393 message = 1;
}

message Create393Response {
  Message393 result = 1;
}
