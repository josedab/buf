syntax = "proto3";

package benchmark.pkg880;

// Message with various field types
message Message880 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage880 nested = 7;
  Status880 status = 8;
}

// Nested message type
message NestedMessage880 {
  string name = 1;
  int32 value = 2;
  repeated Item880 items = 3;
}

// Simple item message
message Item880 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status880 {
  STATUS_880_UNSPECIFIED = 0;
  STATUS_880_ACTIVE = 1;
  STATUS_880_INACTIVE = 2;
  STATUS_880_PENDING = 3;
}

// Service definition
service Service880 {
  rpc Get880(Get880Request) returns (Get880Response);
  rpc List880(List880Request) returns (List880Response);
  rpc Create880(Create880Request) returns (Create880Response);
}

message Get880Request {
  string id = 1;
}

message Get880Response {
  Message880 result = 1;
}

message List880Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List880Response {
  repeated Message880 results = 1;
  string next_page_token = 2;
}

message Create880Request {
  Message880 message = 1;
}

message Create880Response {
  Message880 result = 1;
}
