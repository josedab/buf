syntax = "proto3";

package benchmark.pkg598;

// Message with various field types
message Message598 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage598 nested = 7;
  Status598 status = 8;
}

// Nested message type
message NestedMessage598 {
  string name = 1;
  int32 value = 2;
  repeated Item598 items = 3;
}

// Simple item message
message Item598 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status598 {
  STATUS_598_UNSPECIFIED = 0;
  STATUS_598_ACTIVE = 1;
  STATUS_598_INACTIVE = 2;
  STATUS_598_PENDING = 3;
}

// Service definition
service Service598 {
  rpc Get598(Get598Request) returns (Get598Response);
  rpc List598(List598Request) returns (List598Response);
  rpc Create598(Create598Request) returns (Create598Response);
}

message Get598Request {
  string id = 1;
}

message Get598Response {
  Message598 result = 1;
}

message List598Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List598Response {
  repeated Message598 results = 1;
  string next_page_token = 2;
}

message Create598Request {
  Message598 message = 1;
}

message Create598Response {
  Message598 result = 1;
}
