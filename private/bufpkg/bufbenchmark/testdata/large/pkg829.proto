syntax = "proto3";

package benchmark.pkg829;

// Message with various field types
message Message829 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage829 nested = 7;
  Status829 status = 8;
}

// Nested message type
message NestedMessage829 {
  string name = 1;
  int32 value = 2;
  repeated Item829 items = 3;
}

// Simple item message
message Item829 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status829 {
  STATUS_829_UNSPECIFIED = 0;
  STATUS_829_ACTIVE = 1;
  STATUS_829_INACTIVE = 2;
  STATUS_829_PENDING = 3;
}

// Service definition
service Service829 {
  rpc Get829(Get829Request) returns (Get829Response);
  rpc List829(List829Request) returns (List829Response);
  rpc Create829(Create829Request) returns (Create829Response);
}

message Get829Request {
  string id = 1;
}

message Get829Response {
  Message829 result = 1;
}

message List829Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List829Response {
  repeated Message829 results = 1;
  string next_page_token = 2;
}

message Create829Request {
  Message829 message = 1;
}

message Create829Response {
  Message829 result = 1;
}
