syntax = "proto3";

package benchmark.pkg757;

// Message with various field types
message Message757 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage757 nested = 7;
  Status757 status = 8;
}

// Nested message type
message NestedMessage757 {
  string name = 1;
  int32 value = 2;
  repeated Item757 items = 3;
}

// Simple item message
message Item757 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status757 {
  STATUS_757_UNSPECIFIED = 0;
  STATUS_757_ACTIVE = 1;
  STATUS_757_INACTIVE = 2;
  STATUS_757_PENDING = 3;
}

// Service definition
service Service757 {
  rpc Get757(Get757Request) returns (Get757Response);
  rpc List757(List757Request) returns (List757Response);
  rpc Create757(Create757Request) returns (Create757Response);
}

message Get757Request {
  string id = 1;
}

message Get757Response {
  Message757 result = 1;
}

message List757Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List757Response {
  repeated Message757 results = 1;
  string next_page_token = 2;
}

message Create757Request {
  Message757 message = 1;
}

message Create757Response {
  Message757 result = 1;
}
