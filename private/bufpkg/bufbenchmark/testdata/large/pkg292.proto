syntax = "proto3";

package benchmark.pkg292;

// Message with various field types
message Message292 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage292 nested = 7;
  Status292 status = 8;
}

// Nested message type
message NestedMessage292 {
  string name = 1;
  int32 value = 2;
  repeated Item292 items = 3;
}

// Simple item message
message Item292 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status292 {
  STATUS_292_UNSPECIFIED = 0;
  STATUS_292_ACTIVE = 1;
  STATUS_292_INACTIVE = 2;
  STATUS_292_PENDING = 3;
}

// Service definition
service Service292 {
  rpc Get292(Get292Request) returns (Get292Response);
  rpc List292(List292Request) returns (List292Response);
  rpc Create292(Create292Request) returns (Create292Response);
}

message Get292Request {
  string id = 1;
}

message Get292Response {
  Message292 result = 1;
}

message List292Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List292Response {
  repeated Message292 results = 1;
  string next_page_token = 2;
}

message Create292Request {
  Message292 message = 1;
}

message Create292Response {
  Message292 result = 1;
}
