syntax = "proto3";

package benchmark.pkg289;

// Message with various field types
message Message289 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage289 nested = 7;
  Status289 status = 8;
}

// Nested message type
message NestedMessage289 {
  string name = 1;
  int32 value = 2;
  repeated Item289 items = 3;
}

// Simple item message
message Item289 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status289 {
  STATUS_289_UNSPECIFIED = 0;
  STATUS_289_ACTIVE = 1;
  STATUS_289_INACTIVE = 2;
  STATUS_289_PENDING = 3;
}

// Service definition
service Service289 {
  rpc Get289(Get289Request) returns (Get289Response);
  rpc List289(List289Request) returns (List289Response);
  rpc Create289(Create289Request) returns (Create289Response);
}

message Get289Request {
  string id = 1;
}

message Get289Response {
  Message289 result = 1;
}

message List289Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List289Response {
  repeated Message289 results = 1;
  string next_page_token = 2;
}

message Create289Request {
  Message289 message = 1;
}

message Create289Response {
  Message289 result = 1;
}
