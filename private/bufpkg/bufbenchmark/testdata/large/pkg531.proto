syntax = "proto3";

package benchmark.pkg531;

// Message with various field types
message Message531 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage531 nested = 7;
  Status531 status = 8;
}

// Nested message type
message NestedMessage531 {
  string name = 1;
  int32 value = 2;
  repeated Item531 items = 3;
}

// Simple item message
message Item531 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status531 {
  STATUS_531_UNSPECIFIED = 0;
  STATUS_531_ACTIVE = 1;
  STATUS_531_INACTIVE = 2;
  STATUS_531_PENDING = 3;
}

// Service definition
service Service531 {
  rpc Get531(Get531Request) returns (Get531Response);
  rpc List531(List531Request) returns (List531Response);
  rpc Create531(Create531Request) returns (Create531Response);
}

message Get531Request {
  string id = 1;
}

message Get531Response {
  Message531 result = 1;
}

message List531Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List531Response {
  repeated Message531 results = 1;
  string next_page_token = 2;
}

message Create531Request {
  Message531 message = 1;
}

message Create531Response {
  Message531 result = 1;
}
