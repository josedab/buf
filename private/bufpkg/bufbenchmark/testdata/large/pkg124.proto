syntax = "proto3";

package benchmark.pkg124;

// Message with various field types
message Message124 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage124 nested = 7;
  Status124 status = 8;
}

// Nested message type
message NestedMessage124 {
  string name = 1;
  int32 value = 2;
  repeated Item124 items = 3;
}

// Simple item message
message Item124 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status124 {
  STATUS_124_UNSPECIFIED = 0;
  STATUS_124_ACTIVE = 1;
  STATUS_124_INACTIVE = 2;
  STATUS_124_PENDING = 3;
}

// Service definition
service Service124 {
  rpc Get124(Get124Request) returns (Get124Response);
  rpc List124(List124Request) returns (List124Response);
  rpc Create124(Create124Request) returns (Create124Response);
}

message Get124Request {
  string id = 1;
}

message Get124Response {
  Message124 result = 1;
}

message List124Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List124Response {
  repeated Message124 results = 1;
  string next_page_token = 2;
}

message Create124Request {
  Message124 message = 1;
}

message Create124Response {
  Message124 result = 1;
}
