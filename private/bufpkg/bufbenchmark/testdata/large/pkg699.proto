syntax = "proto3";

package benchmark.pkg699;

// Message with various field types
message Message699 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage699 nested = 7;
  Status699 status = 8;
}

// Nested message type
message NestedMessage699 {
  string name = 1;
  int32 value = 2;
  repeated Item699 items = 3;
}

// Simple item message
message Item699 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status699 {
  STATUS_699_UNSPECIFIED = 0;
  STATUS_699_ACTIVE = 1;
  STATUS_699_INACTIVE = 2;
  STATUS_699_PENDING = 3;
}

// Service definition
service Service699 {
  rpc Get699(Get699Request) returns (Get699Response);
  rpc List699(List699Request) returns (List699Response);
  rpc Create699(Create699Request) returns (Create699Response);
}

message Get699Request {
  string id = 1;
}

message Get699Response {
  Message699 result = 1;
}

message List699Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List699Response {
  repeated Message699 results = 1;
  string next_page_token = 2;
}

message Create699Request {
  Message699 message = 1;
}

message Create699Response {
  Message699 result = 1;
}
