syntax = "proto3";

package benchmark.pkg526;

// Message with various field types
message Message526 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage526 nested = 7;
  Status526 status = 8;
}

// Nested message type
message NestedMessage526 {
  string name = 1;
  int32 value = 2;
  repeated Item526 items = 3;
}

// Simple item message
message Item526 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status526 {
  STATUS_526_UNSPECIFIED = 0;
  STATUS_526_ACTIVE = 1;
  STATUS_526_INACTIVE = 2;
  STATUS_526_PENDING = 3;
}

// Service definition
service Service526 {
  rpc Get526(Get526Request) returns (Get526Response);
  rpc List526(List526Request) returns (List526Response);
  rpc Create526(Create526Request) returns (Create526Response);
}

message Get526Request {
  string id = 1;
}

message Get526Response {
  Message526 result = 1;
}

message List526Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List526Response {
  repeated Message526 results = 1;
  string next_page_token = 2;
}

message Create526Request {
  Message526 message = 1;
}

message Create526Response {
  Message526 result = 1;
}
