syntax = "proto3";

package benchmark.pkg795;

// Message with various field types
message Message795 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage795 nested = 7;
  Status795 status = 8;
}

// Nested message type
message NestedMessage795 {
  string name = 1;
  int32 value = 2;
  repeated Item795 items = 3;
}

// Simple item message
message Item795 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status795 {
  STATUS_795_UNSPECIFIED = 0;
  STATUS_795_ACTIVE = 1;
  STATUS_795_INACTIVE = 2;
  STATUS_795_PENDING = 3;
}

// Service definition
service Service795 {
  rpc Get795(Get795Request) returns (Get795Response);
  rpc List795(List795Request) returns (List795Response);
  rpc Create795(Create795Request) returns (Create795Response);
}

message Get795Request {
  string id = 1;
}

message Get795Response {
  Message795 result = 1;
}

message List795Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List795Response {
  repeated Message795 results = 1;
  string next_page_token = 2;
}

message Create795Request {
  Message795 message = 1;
}

message Create795Response {
  Message795 result = 1;
}
