syntax = "proto3";

package benchmark.pkg929;

// Message with various field types
message Message929 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage929 nested = 7;
  Status929 status = 8;
}

// Nested message type
message NestedMessage929 {
  string name = 1;
  int32 value = 2;
  repeated Item929 items = 3;
}

// Simple item message
message Item929 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status929 {
  STATUS_929_UNSPECIFIED = 0;
  STATUS_929_ACTIVE = 1;
  STATUS_929_INACTIVE = 2;
  STATUS_929_PENDING = 3;
}

// Service definition
service Service929 {
  rpc Get929(Get929Request) returns (Get929Response);
  rpc List929(List929Request) returns (List929Response);
  rpc Create929(Create929Request) returns (Create929Response);
}

message Get929Request {
  string id = 1;
}

message Get929Response {
  Message929 result = 1;
}

message List929Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List929Response {
  repeated Message929 results = 1;
  string next_page_token = 2;
}

message Create929Request {
  Message929 message = 1;
}

message Create929Response {
  Message929 result = 1;
}
