syntax = "proto3";

package benchmark.pkg668;

// Message with various field types
message Message668 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage668 nested = 7;
  Status668 status = 8;
}

// Nested message type
message NestedMessage668 {
  string name = 1;
  int32 value = 2;
  repeated Item668 items = 3;
}

// Simple item message
message Item668 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status668 {
  STATUS_668_UNSPECIFIED = 0;
  STATUS_668_ACTIVE = 1;
  STATUS_668_INACTIVE = 2;
  STATUS_668_PENDING = 3;
}

// Service definition
service Service668 {
  rpc Get668(Get668Request) returns (Get668Response);
  rpc List668(List668Request) returns (List668Response);
  rpc Create668(Create668Request) returns (Create668Response);
}

message Get668Request {
  string id = 1;
}

message Get668Response {
  Message668 result = 1;
}

message List668Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List668Response {
  repeated Message668 results = 1;
  string next_page_token = 2;
}

message Create668Request {
  Message668 message = 1;
}

message Create668Response {
  Message668 result = 1;
}
