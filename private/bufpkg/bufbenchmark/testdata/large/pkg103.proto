syntax = "proto3";

package benchmark.pkg103;

// Message with various field types
message Message103 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage103 nested = 7;
  Status103 status = 8;
}

// Nested message type
message NestedMessage103 {
  string name = 1;
  int32 value = 2;
  repeated Item103 items = 3;
}

// Simple item message
message Item103 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status103 {
  STATUS_103_UNSPECIFIED = 0;
  STATUS_103_ACTIVE = 1;
  STATUS_103_INACTIVE = 2;
  STATUS_103_PENDING = 3;
}

// Service definition
service Service103 {
  rpc Get103(Get103Request) returns (Get103Response);
  rpc List103(List103Request) returns (List103Response);
  rpc Create103(Create103Request) returns (Create103Response);
}

message Get103Request {
  string id = 1;
}

message Get103Response {
  Message103 result = 1;
}

message List103Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List103Response {
  repeated Message103 results = 1;
  string next_page_token = 2;
}

message Create103Request {
  Message103 message = 1;
}

message Create103Response {
  Message103 result = 1;
}
