syntax = "proto3";

package benchmark.pkg588;

// Message with various field types
message Message588 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage588 nested = 7;
  Status588 status = 8;
}

// Nested message type
message NestedMessage588 {
  string name = 1;
  int32 value = 2;
  repeated Item588 items = 3;
}

// Simple item message
message Item588 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status588 {
  STATUS_588_UNSPECIFIED = 0;
  STATUS_588_ACTIVE = 1;
  STATUS_588_INACTIVE = 2;
  STATUS_588_PENDING = 3;
}

// Service definition
service Service588 {
  rpc Get588(Get588Request) returns (Get588Response);
  rpc List588(List588Request) returns (List588Response);
  rpc Create588(Create588Request) returns (Create588Response);
}

message Get588Request {
  string id = 1;
}

message Get588Response {
  Message588 result = 1;
}

message List588Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List588Response {
  repeated Message588 results = 1;
  string next_page_token = 2;
}

message Create588Request {
  Message588 message = 1;
}

message Create588Response {
  Message588 result = 1;
}
