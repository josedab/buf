syntax = "proto3";

package benchmark.pkg254;

// Message with various field types
message Message254 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage254 nested = 7;
  Status254 status = 8;
}

// Nested message type
message NestedMessage254 {
  string name = 1;
  int32 value = 2;
  repeated Item254 items = 3;
}

// Simple item message
message Item254 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status254 {
  STATUS_254_UNSPECIFIED = 0;
  STATUS_254_ACTIVE = 1;
  STATUS_254_INACTIVE = 2;
  STATUS_254_PENDING = 3;
}

// Service definition
service Service254 {
  rpc Get254(Get254Request) returns (Get254Response);
  rpc List254(List254Request) returns (List254Response);
  rpc Create254(Create254Request) returns (Create254Response);
}

message Get254Request {
  string id = 1;
}

message Get254Response {
  Message254 result = 1;
}

message List254Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List254Response {
  repeated Message254 results = 1;
  string next_page_token = 2;
}

message Create254Request {
  Message254 message = 1;
}

message Create254Response {
  Message254 result = 1;
}
