syntax = "proto3";

package benchmark.pkg640;

// Message with various field types
message Message640 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage640 nested = 7;
  Status640 status = 8;
}

// Nested message type
message NestedMessage640 {
  string name = 1;
  int32 value = 2;
  repeated Item640 items = 3;
}

// Simple item message
message Item640 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status640 {
  STATUS_640_UNSPECIFIED = 0;
  STATUS_640_ACTIVE = 1;
  STATUS_640_INACTIVE = 2;
  STATUS_640_PENDING = 3;
}

// Service definition
service Service640 {
  rpc Get640(Get640Request) returns (Get640Response);
  rpc List640(List640Request) returns (List640Response);
  rpc Create640(Create640Request) returns (Create640Response);
}

message Get640Request {
  string id = 1;
}

message Get640Response {
  Message640 result = 1;
}

message List640Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List640Response {
  repeated Message640 results = 1;
  string next_page_token = 2;
}

message Create640Request {
  Message640 message = 1;
}

message Create640Response {
  Message640 result = 1;
}
