syntax = "proto3";

package benchmark.pkg777;

// Message with various field types
message Message777 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage777 nested = 7;
  Status777 status = 8;
}

// Nested message type
message NestedMessage777 {
  string name = 1;
  int32 value = 2;
  repeated Item777 items = 3;
}

// Simple item message
message Item777 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status777 {
  STATUS_777_UNSPECIFIED = 0;
  STATUS_777_ACTIVE = 1;
  STATUS_777_INACTIVE = 2;
  STATUS_777_PENDING = 3;
}

// Service definition
service Service777 {
  rpc Get777(Get777Request) returns (Get777Response);
  rpc List777(List777Request) returns (List777Response);
  rpc Create777(Create777Request) returns (Create777Response);
}

message Get777Request {
  string id = 1;
}

message Get777Response {
  Message777 result = 1;
}

message List777Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List777Response {
  repeated Message777 results = 1;
  string next_page_token = 2;
}

message Create777Request {
  Message777 message = 1;
}

message Create777Response {
  Message777 result = 1;
}
