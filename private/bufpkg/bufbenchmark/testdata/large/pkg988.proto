syntax = "proto3";

package benchmark.pkg988;

// Message with various field types
message Message988 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage988 nested = 7;
  Status988 status = 8;
}

// Nested message type
message NestedMessage988 {
  string name = 1;
  int32 value = 2;
  repeated Item988 items = 3;
}

// Simple item message
message Item988 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status988 {
  STATUS_988_UNSPECIFIED = 0;
  STATUS_988_ACTIVE = 1;
  STATUS_988_INACTIVE = 2;
  STATUS_988_PENDING = 3;
}

// Service definition
service Service988 {
  rpc Get988(Get988Request) returns (Get988Response);
  rpc List988(List988Request) returns (List988Response);
  rpc Create988(Create988Request) returns (Create988Response);
}

message Get988Request {
  string id = 1;
}

message Get988Response {
  Message988 result = 1;
}

message List988Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List988Response {
  repeated Message988 results = 1;
  string next_page_token = 2;
}

message Create988Request {
  Message988 message = 1;
}

message Create988Response {
  Message988 result = 1;
}
