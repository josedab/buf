syntax = "proto3";

package benchmark.pkg853;

// Message with various field types
message Message853 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage853 nested = 7;
  Status853 status = 8;
}

// Nested message type
message NestedMessage853 {
  string name = 1;
  int32 value = 2;
  repeated Item853 items = 3;
}

// Simple item message
message Item853 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status853 {
  STATUS_853_UNSPECIFIED = 0;
  STATUS_853_ACTIVE = 1;
  STATUS_853_INACTIVE = 2;
  STATUS_853_PENDING = 3;
}

// Service definition
service Service853 {
  rpc Get853(Get853Request) returns (Get853Response);
  rpc List853(List853Request) returns (List853Response);
  rpc Create853(Create853Request) returns (Create853Response);
}

message Get853Request {
  string id = 1;
}

message Get853Response {
  Message853 result = 1;
}

message List853Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List853Response {
  repeated Message853 results = 1;
  string next_page_token = 2;
}

message Create853Request {
  Message853 message = 1;
}

message Create853Response {
  Message853 result = 1;
}
