syntax = "proto3";

package benchmark.pkg985;

// Message with various field types
message Message985 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage985 nested = 7;
  Status985 status = 8;
}

// Nested message type
message NestedMessage985 {
  string name = 1;
  int32 value = 2;
  repeated Item985 items = 3;
}

// Simple item message
message Item985 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status985 {
  STATUS_985_UNSPECIFIED = 0;
  STATUS_985_ACTIVE = 1;
  STATUS_985_INACTIVE = 2;
  STATUS_985_PENDING = 3;
}

// Service definition
service Service985 {
  rpc Get985(Get985Request) returns (Get985Response);
  rpc List985(List985Request) returns (List985Response);
  rpc Create985(Create985Request) returns (Create985Response);
}

message Get985Request {
  string id = 1;
}

message Get985Response {
  Message985 result = 1;
}

message List985Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List985Response {
  repeated Message985 results = 1;
  string next_page_token = 2;
}

message Create985Request {
  Message985 message = 1;
}

message Create985Response {
  Message985 result = 1;
}
