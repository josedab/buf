syntax = "proto3";

package benchmark.pkg594;

// Message with various field types
message Message594 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage594 nested = 7;
  Status594 status = 8;
}

// Nested message type
message NestedMessage594 {
  string name = 1;
  int32 value = 2;
  repeated Item594 items = 3;
}

// Simple item message
message Item594 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status594 {
  STATUS_594_UNSPECIFIED = 0;
  STATUS_594_ACTIVE = 1;
  STATUS_594_INACTIVE = 2;
  STATUS_594_PENDING = 3;
}

// Service definition
service Service594 {
  rpc Get594(Get594Request) returns (Get594Response);
  rpc List594(List594Request) returns (List594Response);
  rpc Create594(Create594Request) returns (Create594Response);
}

message Get594Request {
  string id = 1;
}

message Get594Response {
  Message594 result = 1;
}

message List594Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List594Response {
  repeated Message594 results = 1;
  string next_page_token = 2;
}

message Create594Request {
  Message594 message = 1;
}

message Create594Response {
  Message594 result = 1;
}
