syntax = "proto3";

package benchmark.pkg982;

// Message with various field types
message Message982 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage982 nested = 7;
  Status982 status = 8;
}

// Nested message type
message NestedMessage982 {
  string name = 1;
  int32 value = 2;
  repeated Item982 items = 3;
}

// Simple item message
message Item982 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status982 {
  STATUS_982_UNSPECIFIED = 0;
  STATUS_982_ACTIVE = 1;
  STATUS_982_INACTIVE = 2;
  STATUS_982_PENDING = 3;
}

// Service definition
service Service982 {
  rpc Get982(Get982Request) returns (Get982Response);
  rpc List982(List982Request) returns (List982Response);
  rpc Create982(Create982Request) returns (Create982Response);
}

message Get982Request {
  string id = 1;
}

message Get982Response {
  Message982 result = 1;
}

message List982Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List982Response {
  repeated Message982 results = 1;
  string next_page_token = 2;
}

message Create982Request {
  Message982 message = 1;
}

message Create982Response {
  Message982 result = 1;
}
