syntax = "proto3";

package benchmark.pkg823;

// Message with various field types
message Message823 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage823 nested = 7;
  Status823 status = 8;
}

// Nested message type
message NestedMessage823 {
  string name = 1;
  int32 value = 2;
  repeated Item823 items = 3;
}

// Simple item message
message Item823 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status823 {
  STATUS_823_UNSPECIFIED = 0;
  STATUS_823_ACTIVE = 1;
  STATUS_823_INACTIVE = 2;
  STATUS_823_PENDING = 3;
}

// Service definition
service Service823 {
  rpc Get823(Get823Request) returns (Get823Response);
  rpc List823(List823Request) returns (List823Response);
  rpc Create823(Create823Request) returns (Create823Response);
}

message Get823Request {
  string id = 1;
}

message Get823Response {
  Message823 result = 1;
}

message List823Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List823Response {
  repeated Message823 results = 1;
  string next_page_token = 2;
}

message Create823Request {
  Message823 message = 1;
}

message Create823Response {
  Message823 result = 1;
}
