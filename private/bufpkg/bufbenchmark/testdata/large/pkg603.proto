syntax = "proto3";

package benchmark.pkg603;

// Message with various field types
message Message603 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage603 nested = 7;
  Status603 status = 8;
}

// Nested message type
message NestedMessage603 {
  string name = 1;
  int32 value = 2;
  repeated Item603 items = 3;
}

// Simple item message
message Item603 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status603 {
  STATUS_603_UNSPECIFIED = 0;
  STATUS_603_ACTIVE = 1;
  STATUS_603_INACTIVE = 2;
  STATUS_603_PENDING = 3;
}

// Service definition
service Service603 {
  rpc Get603(Get603Request) returns (Get603Response);
  rpc List603(List603Request) returns (List603Response);
  rpc Create603(Create603Request) returns (Create603Response);
}

message Get603Request {
  string id = 1;
}

message Get603Response {
  Message603 result = 1;
}

message List603Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List603Response {
  repeated Message603 results = 1;
  string next_page_token = 2;
}

message Create603Request {
  Message603 message = 1;
}

message Create603Response {
  Message603 result = 1;
}
