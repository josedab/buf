syntax = "proto3";

package benchmark.pkg591;

// Message with various field types
message Message591 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage591 nested = 7;
  Status591 status = 8;
}

// Nested message type
message NestedMessage591 {
  string name = 1;
  int32 value = 2;
  repeated Item591 items = 3;
}

// Simple item message
message Item591 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status591 {
  STATUS_591_UNSPECIFIED = 0;
  STATUS_591_ACTIVE = 1;
  STATUS_591_INACTIVE = 2;
  STATUS_591_PENDING = 3;
}

// Service definition
service Service591 {
  rpc Get591(Get591Request) returns (Get591Response);
  rpc List591(List591Request) returns (List591Response);
  rpc Create591(Create591Request) returns (Create591Response);
}

message Get591Request {
  string id = 1;
}

message Get591Response {
  Message591 result = 1;
}

message List591Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List591Response {
  repeated Message591 results = 1;
  string next_page_token = 2;
}

message Create591Request {
  Message591 message = 1;
}

message Create591Response {
  Message591 result = 1;
}
