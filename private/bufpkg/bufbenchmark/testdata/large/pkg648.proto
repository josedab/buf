syntax = "proto3";

package benchmark.pkg648;

// Message with various field types
message Message648 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage648 nested = 7;
  Status648 status = 8;
}

// Nested message type
message NestedMessage648 {
  string name = 1;
  int32 value = 2;
  repeated Item648 items = 3;
}

// Simple item message
message Item648 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status648 {
  STATUS_648_UNSPECIFIED = 0;
  STATUS_648_ACTIVE = 1;
  STATUS_648_INACTIVE = 2;
  STATUS_648_PENDING = 3;
}

// Service definition
service Service648 {
  rpc Get648(Get648Request) returns (Get648Response);
  rpc List648(List648Request) returns (List648Response);
  rpc Create648(Create648Request) returns (Create648Response);
}

message Get648Request {
  string id = 1;
}

message Get648Response {
  Message648 result = 1;
}

message List648Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List648Response {
  repeated Message648 results = 1;
  string next_page_token = 2;
}

message Create648Request {
  Message648 message = 1;
}

message Create648Response {
  Message648 result = 1;
}
