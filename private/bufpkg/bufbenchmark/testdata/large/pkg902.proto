syntax = "proto3";

package benchmark.pkg902;

// Message with various field types
message Message902 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage902 nested = 7;
  Status902 status = 8;
}

// Nested message type
message NestedMessage902 {
  string name = 1;
  int32 value = 2;
  repeated Item902 items = 3;
}

// Simple item message
message Item902 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status902 {
  STATUS_902_UNSPECIFIED = 0;
  STATUS_902_ACTIVE = 1;
  STATUS_902_INACTIVE = 2;
  STATUS_902_PENDING = 3;
}

// Service definition
service Service902 {
  rpc Get902(Get902Request) returns (Get902Response);
  rpc List902(List902Request) returns (List902Response);
  rpc Create902(Create902Request) returns (Create902Response);
}

message Get902Request {
  string id = 1;
}

message Get902Response {
  Message902 result = 1;
}

message List902Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List902Response {
  repeated Message902 results = 1;
  string next_page_token = 2;
}

message Create902Request {
  Message902 message = 1;
}

message Create902Response {
  Message902 result = 1;
}
