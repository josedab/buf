syntax = "proto3";

package benchmark.pkg335;

// Message with various field types
message Message335 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage335 nested = 7;
  Status335 status = 8;
}

// Nested message type
message NestedMessage335 {
  string name = 1;
  int32 value = 2;
  repeated Item335 items = 3;
}

// Simple item message
message Item335 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status335 {
  STATUS_335_UNSPECIFIED = 0;
  STATUS_335_ACTIVE = 1;
  STATUS_335_INACTIVE = 2;
  STATUS_335_PENDING = 3;
}

// Service definition
service Service335 {
  rpc Get335(Get335Request) returns (Get335Response);
  rpc List335(List335Request) returns (List335Response);
  rpc Create335(Create335Request) returns (Create335Response);
}

message Get335Request {
  string id = 1;
}

message Get335Response {
  Message335 result = 1;
}

message List335Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List335Response {
  repeated Message335 results = 1;
  string next_page_token = 2;
}

message Create335Request {
  Message335 message = 1;
}

message Create335Response {
  Message335 result = 1;
}
