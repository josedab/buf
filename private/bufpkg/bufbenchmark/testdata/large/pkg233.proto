syntax = "proto3";

package benchmark.pkg233;

// Message with various field types
message Message233 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage233 nested = 7;
  Status233 status = 8;
}

// Nested message type
message NestedMessage233 {
  string name = 1;
  int32 value = 2;
  repeated Item233 items = 3;
}

// Simple item message
message Item233 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status233 {
  STATUS_233_UNSPECIFIED = 0;
  STATUS_233_ACTIVE = 1;
  STATUS_233_INACTIVE = 2;
  STATUS_233_PENDING = 3;
}

// Service definition
service Service233 {
  rpc Get233(Get233Request) returns (Get233Response);
  rpc List233(List233Request) returns (List233Response);
  rpc Create233(Create233Request) returns (Create233Response);
}

message Get233Request {
  string id = 1;
}

message Get233Response {
  Message233 result = 1;
}

message List233Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List233Response {
  repeated Message233 results = 1;
  string next_page_token = 2;
}

message Create233Request {
  Message233 message = 1;
}

message Create233Response {
  Message233 result = 1;
}
