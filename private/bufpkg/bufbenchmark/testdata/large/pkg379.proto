syntax = "proto3";

package benchmark.pkg379;

// Message with various field types
message Message379 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage379 nested = 7;
  Status379 status = 8;
}

// Nested message type
message NestedMessage379 {
  string name = 1;
  int32 value = 2;
  repeated Item379 items = 3;
}

// Simple item message
message Item379 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status379 {
  STATUS_379_UNSPECIFIED = 0;
  STATUS_379_ACTIVE = 1;
  STATUS_379_INACTIVE = 2;
  STATUS_379_PENDING = 3;
}

// Service definition
service Service379 {
  rpc Get379(Get379Request) returns (Get379Response);
  rpc List379(List379Request) returns (List379Response);
  rpc Create379(Create379Request) returns (Create379Response);
}

message Get379Request {
  string id = 1;
}

message Get379Response {
  Message379 result = 1;
}

message List379Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List379Response {
  repeated Message379 results = 1;
  string next_page_token = 2;
}

message Create379Request {
  Message379 message = 1;
}

message Create379Response {
  Message379 result = 1;
}
