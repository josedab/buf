syntax = "proto3";

package benchmark.pkg123;

// Message with various field types
message Message123 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage123 nested = 7;
  Status123 status = 8;
}

// Nested message type
message NestedMessage123 {
  string name = 1;
  int32 value = 2;
  repeated Item123 items = 3;
}

// Simple item message
message Item123 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status123 {
  STATUS_123_UNSPECIFIED = 0;
  STATUS_123_ACTIVE = 1;
  STATUS_123_INACTIVE = 2;
  STATUS_123_PENDING = 3;
}

// Service definition
service Service123 {
  rpc Get123(Get123Request) returns (Get123Response);
  rpc List123(List123Request) returns (List123Response);
  rpc Create123(Create123Request) returns (Create123Response);
}

message Get123Request {
  string id = 1;
}

message Get123Response {
  Message123 result = 1;
}

message List123Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List123Response {
  repeated Message123 results = 1;
  string next_page_token = 2;
}

message Create123Request {
  Message123 message = 1;
}

message Create123Response {
  Message123 result = 1;
}
