syntax = "proto3";

package benchmark.pkg804;

// Message with various field types
message Message804 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage804 nested = 7;
  Status804 status = 8;
}

// Nested message type
message NestedMessage804 {
  string name = 1;
  int32 value = 2;
  repeated Item804 items = 3;
}

// Simple item message
message Item804 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status804 {
  STATUS_804_UNSPECIFIED = 0;
  STATUS_804_ACTIVE = 1;
  STATUS_804_INACTIVE = 2;
  STATUS_804_PENDING = 3;
}

// Service definition
service Service804 {
  rpc Get804(Get804Request) returns (Get804Response);
  rpc List804(List804Request) returns (List804Response);
  rpc Create804(Create804Request) returns (Create804Response);
}

message Get804Request {
  string id = 1;
}

message Get804Response {
  Message804 result = 1;
}

message List804Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List804Response {
  repeated Message804 results = 1;
  string next_page_token = 2;
}

message Create804Request {
  Message804 message = 1;
}

message Create804Response {
  Message804 result = 1;
}
