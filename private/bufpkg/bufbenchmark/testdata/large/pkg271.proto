syntax = "proto3";

package benchmark.pkg271;

// Message with various field types
message Message271 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage271 nested = 7;
  Status271 status = 8;
}

// Nested message type
message NestedMessage271 {
  string name = 1;
  int32 value = 2;
  repeated Item271 items = 3;
}

// Simple item message
message Item271 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status271 {
  STATUS_271_UNSPECIFIED = 0;
  STATUS_271_ACTIVE = 1;
  STATUS_271_INACTIVE = 2;
  STATUS_271_PENDING = 3;
}

// Service definition
service Service271 {
  rpc Get271(Get271Request) returns (Get271Response);
  rpc List271(List271Request) returns (List271Response);
  rpc Create271(Create271Request) returns (Create271Response);
}

message Get271Request {
  string id = 1;
}

message Get271Response {
  Message271 result = 1;
}

message List271Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List271Response {
  repeated Message271 results = 1;
  string next_page_token = 2;
}

message Create271Request {
  Message271 message = 1;
}

message Create271Response {
  Message271 result = 1;
}
