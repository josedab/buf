syntax = "proto3";

package benchmark.pkg311;

// Message with various field types
message Message311 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage311 nested = 7;
  Status311 status = 8;
}

// Nested message type
message NestedMessage311 {
  string name = 1;
  int32 value = 2;
  repeated Item311 items = 3;
}

// Simple item message
message Item311 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status311 {
  STATUS_311_UNSPECIFIED = 0;
  STATUS_311_ACTIVE = 1;
  STATUS_311_INACTIVE = 2;
  STATUS_311_PENDING = 3;
}

// Service definition
service Service311 {
  rpc Get311(Get311Request) returns (Get311Response);
  rpc List311(List311Request) returns (List311Response);
  rpc Create311(Create311Request) returns (Create311Response);
}

message Get311Request {
  string id = 1;
}

message Get311Response {
  Message311 result = 1;
}

message List311Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List311Response {
  repeated Message311 results = 1;
  string next_page_token = 2;
}

message Create311Request {
  Message311 message = 1;
}

message Create311Response {
  Message311 result = 1;
}
