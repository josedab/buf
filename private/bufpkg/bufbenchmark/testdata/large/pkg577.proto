syntax = "proto3";

package benchmark.pkg577;

// Message with various field types
message Message577 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage577 nested = 7;
  Status577 status = 8;
}

// Nested message type
message NestedMessage577 {
  string name = 1;
  int32 value = 2;
  repeated Item577 items = 3;
}

// Simple item message
message Item577 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status577 {
  STATUS_577_UNSPECIFIED = 0;
  STATUS_577_ACTIVE = 1;
  STATUS_577_INACTIVE = 2;
  STATUS_577_PENDING = 3;
}

// Service definition
service Service577 {
  rpc Get577(Get577Request) returns (Get577Response);
  rpc List577(List577Request) returns (List577Response);
  rpc Create577(Create577Request) returns (Create577Response);
}

message Get577Request {
  string id = 1;
}

message Get577Response {
  Message577 result = 1;
}

message List577Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List577Response {
  repeated Message577 results = 1;
  string next_page_token = 2;
}

message Create577Request {
  Message577 message = 1;
}

message Create577Response {
  Message577 result = 1;
}
