syntax = "proto3";

package benchmark.pkg815;

// Message with various field types
message Message815 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage815 nested = 7;
  Status815 status = 8;
}

// Nested message type
message NestedMessage815 {
  string name = 1;
  int32 value = 2;
  repeated Item815 items = 3;
}

// Simple item message
message Item815 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status815 {
  STATUS_815_UNSPECIFIED = 0;
  STATUS_815_ACTIVE = 1;
  STATUS_815_INACTIVE = 2;
  STATUS_815_PENDING = 3;
}

// Service definition
service Service815 {
  rpc Get815(Get815Request) returns (Get815Response);
  rpc List815(List815Request) returns (List815Response);
  rpc Create815(Create815Request) returns (Create815Response);
}

message Get815Request {
  string id = 1;
}

message Get815Response {
  Message815 result = 1;
}

message List815Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List815Response {
  repeated Message815 results = 1;
  string next_page_token = 2;
}

message Create815Request {
  Message815 message = 1;
}

message Create815Response {
  Message815 result = 1;
}
