syntax = "proto3";

package benchmark.pkg16;

// Message with various field types
message Message16 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage16 nested = 7;
  Status16 status = 8;
}

// Nested message type
message NestedMessage16 {
  string name = 1;
  int32 value = 2;
  repeated Item16 items = 3;
}

// Simple item message
message Item16 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status16 {
  STATUS_16_UNSPECIFIED = 0;
  STATUS_16_ACTIVE = 1;
  STATUS_16_INACTIVE = 2;
  STATUS_16_PENDING = 3;
}

// Service definition
service Service16 {
  rpc Get16(Get16Request) returns (Get16Response);
  rpc List16(List16Request) returns (List16Response);
  rpc Create16(Create16Request) returns (Create16Response);
}

message Get16Request {
  string id = 1;
}

message Get16Response {
  Message16 result = 1;
}

message List16Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List16Response {
  repeated Message16 results = 1;
  string next_page_token = 2;
}

message Create16Request {
  Message16 message = 1;
}

message Create16Response {
  Message16 result = 1;
}
