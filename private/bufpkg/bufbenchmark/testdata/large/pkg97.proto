syntax = "proto3";

package benchmark.pkg97;

// Message with various field types
message Message97 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage97 nested = 7;
  Status97 status = 8;
}

// Nested message type
message NestedMessage97 {
  string name = 1;
  int32 value = 2;
  repeated Item97 items = 3;
}

// Simple item message
message Item97 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status97 {
  STATUS_97_UNSPECIFIED = 0;
  STATUS_97_ACTIVE = 1;
  STATUS_97_INACTIVE = 2;
  STATUS_97_PENDING = 3;
}

// Service definition
service Service97 {
  rpc Get97(Get97Request) returns (Get97Response);
  rpc List97(List97Request) returns (List97Response);
  rpc Create97(Create97Request) returns (Create97Response);
}

message Get97Request {
  string id = 1;
}

message Get97Response {
  Message97 result = 1;
}

message List97Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List97Response {
  repeated Message97 results = 1;
  string next_page_token = 2;
}

message Create97Request {
  Message97 message = 1;
}

message Create97Response {
  Message97 result = 1;
}
