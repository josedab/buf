syntax = "proto3";

package benchmark.pkg987;

// Message with various field types
message Message987 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage987 nested = 7;
  Status987 status = 8;
}

// Nested message type
message NestedMessage987 {
  string name = 1;
  int32 value = 2;
  repeated Item987 items = 3;
}

// Simple item message
message Item987 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status987 {
  STATUS_987_UNSPECIFIED = 0;
  STATUS_987_ACTIVE = 1;
  STATUS_987_INACTIVE = 2;
  STATUS_987_PENDING = 3;
}

// Service definition
service Service987 {
  rpc Get987(Get987Request) returns (Get987Response);
  rpc List987(List987Request) returns (List987Response);
  rpc Create987(Create987Request) returns (Create987Response);
}

message Get987Request {
  string id = 1;
}

message Get987Response {
  Message987 result = 1;
}

message List987Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List987Response {
  repeated Message987 results = 1;
  string next_page_token = 2;
}

message Create987Request {
  Message987 message = 1;
}

message Create987Response {
  Message987 result = 1;
}
