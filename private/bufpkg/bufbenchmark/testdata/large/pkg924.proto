syntax = "proto3";

package benchmark.pkg924;

// Message with various field types
message Message924 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage924 nested = 7;
  Status924 status = 8;
}

// Nested message type
message NestedMessage924 {
  string name = 1;
  int32 value = 2;
  repeated Item924 items = 3;
}

// Simple item message
message Item924 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status924 {
  STATUS_924_UNSPECIFIED = 0;
  STATUS_924_ACTIVE = 1;
  STATUS_924_INACTIVE = 2;
  STATUS_924_PENDING = 3;
}

// Service definition
service Service924 {
  rpc Get924(Get924Request) returns (Get924Response);
  rpc List924(List924Request) returns (List924Response);
  rpc Create924(Create924Request) returns (Create924Response);
}

message Get924Request {
  string id = 1;
}

message Get924Response {
  Message924 result = 1;
}

message List924Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List924Response {
  repeated Message924 results = 1;
  string next_page_token = 2;
}

message Create924Request {
  Message924 message = 1;
}

message Create924Response {
  Message924 result = 1;
}
