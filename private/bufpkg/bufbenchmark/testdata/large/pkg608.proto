syntax = "proto3";

package benchmark.pkg608;

// Message with various field types
message Message608 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage608 nested = 7;
  Status608 status = 8;
}

// Nested message type
message NestedMessage608 {
  string name = 1;
  int32 value = 2;
  repeated Item608 items = 3;
}

// Simple item message
message Item608 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status608 {
  STATUS_608_UNSPECIFIED = 0;
  STATUS_608_ACTIVE = 1;
  STATUS_608_INACTIVE = 2;
  STATUS_608_PENDING = 3;
}

// Service definition
service Service608 {
  rpc Get608(Get608Request) returns (Get608Response);
  rpc List608(List608Request) returns (List608Response);
  rpc Create608(Create608Request) returns (Create608Response);
}

message Get608Request {
  string id = 1;
}

message Get608Response {
  Message608 result = 1;
}

message List608Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List608Response {
  repeated Message608 results = 1;
  string next_page_token = 2;
}

message Create608Request {
  Message608 message = 1;
}

message Create608Response {
  Message608 result = 1;
}
