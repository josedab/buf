syntax = "proto3";

package benchmark.pkg71;

// Message with various field types
message Message71 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage71 nested = 7;
  Status71 status = 8;
}

// Nested message type
message NestedMessage71 {
  string name = 1;
  int32 value = 2;
  repeated Item71 items = 3;
}

// Simple item message
message Item71 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status71 {
  STATUS_71_UNSPECIFIED = 0;
  STATUS_71_ACTIVE = 1;
  STATUS_71_INACTIVE = 2;
  STATUS_71_PENDING = 3;
}

// Service definition
service Service71 {
  rpc Get71(Get71Request) returns (Get71Response);
  rpc List71(List71Request) returns (List71Response);
  rpc Create71(Create71Request) returns (Create71Response);
}

message Get71Request {
  string id = 1;
}

message Get71Response {
  Message71 result = 1;
}

message List71Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List71Response {
  repeated Message71 results = 1;
  string next_page_token = 2;
}

message Create71Request {
  Message71 message = 1;
}

message Create71Response {
  Message71 result = 1;
}
