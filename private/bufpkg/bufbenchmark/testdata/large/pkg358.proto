syntax = "proto3";

package benchmark.pkg358;

// Message with various field types
message Message358 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage358 nested = 7;
  Status358 status = 8;
}

// Nested message type
message NestedMessage358 {
  string name = 1;
  int32 value = 2;
  repeated Item358 items = 3;
}

// Simple item message
message Item358 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status358 {
  STATUS_358_UNSPECIFIED = 0;
  STATUS_358_ACTIVE = 1;
  STATUS_358_INACTIVE = 2;
  STATUS_358_PENDING = 3;
}

// Service definition
service Service358 {
  rpc Get358(Get358Request) returns (Get358Response);
  rpc List358(List358Request) returns (List358Response);
  rpc Create358(Create358Request) returns (Create358Response);
}

message Get358Request {
  string id = 1;
}

message Get358Response {
  Message358 result = 1;
}

message List358Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List358Response {
  repeated Message358 results = 1;
  string next_page_token = 2;
}

message Create358Request {
  Message358 message = 1;
}

message Create358Response {
  Message358 result = 1;
}
