syntax = "proto3";

package benchmark.pkg319;

// Message with various field types
message Message319 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage319 nested = 7;
  Status319 status = 8;
}

// Nested message type
message NestedMessage319 {
  string name = 1;
  int32 value = 2;
  repeated Item319 items = 3;
}

// Simple item message
message Item319 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status319 {
  STATUS_319_UNSPECIFIED = 0;
  STATUS_319_ACTIVE = 1;
  STATUS_319_INACTIVE = 2;
  STATUS_319_PENDING = 3;
}

// Service definition
service Service319 {
  rpc Get319(Get319Request) returns (Get319Response);
  rpc List319(List319Request) returns (List319Response);
  rpc Create319(Create319Request) returns (Create319Response);
}

message Get319Request {
  string id = 1;
}

message Get319Response {
  Message319 result = 1;
}

message List319Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List319Response {
  repeated Message319 results = 1;
  string next_page_token = 2;
}

message Create319Request {
  Message319 message = 1;
}

message Create319Response {
  Message319 result = 1;
}
