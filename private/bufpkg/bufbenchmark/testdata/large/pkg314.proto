syntax = "proto3";

package benchmark.pkg314;

// Message with various field types
message Message314 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage314 nested = 7;
  Status314 status = 8;
}

// Nested message type
message NestedMessage314 {
  string name = 1;
  int32 value = 2;
  repeated Item314 items = 3;
}

// Simple item message
message Item314 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status314 {
  STATUS_314_UNSPECIFIED = 0;
  STATUS_314_ACTIVE = 1;
  STATUS_314_INACTIVE = 2;
  STATUS_314_PENDING = 3;
}

// Service definition
service Service314 {
  rpc Get314(Get314Request) returns (Get314Response);
  rpc List314(List314Request) returns (List314Response);
  rpc Create314(Create314Request) returns (Create314Response);
}

message Get314Request {
  string id = 1;
}

message Get314Response {
  Message314 result = 1;
}

message List314Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List314Response {
  repeated Message314 results = 1;
  string next_page_token = 2;
}

message Create314Request {
  Message314 message = 1;
}

message Create314Response {
  Message314 result = 1;
}
