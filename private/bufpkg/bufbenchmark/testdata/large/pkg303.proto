syntax = "proto3";

package benchmark.pkg303;

// Message with various field types
message Message303 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage303 nested = 7;
  Status303 status = 8;
}

// Nested message type
message NestedMessage303 {
  string name = 1;
  int32 value = 2;
  repeated Item303 items = 3;
}

// Simple item message
message Item303 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status303 {
  STATUS_303_UNSPECIFIED = 0;
  STATUS_303_ACTIVE = 1;
  STATUS_303_INACTIVE = 2;
  STATUS_303_PENDING = 3;
}

// Service definition
service Service303 {
  rpc Get303(Get303Request) returns (Get303Response);
  rpc List303(List303Request) returns (List303Response);
  rpc Create303(Create303Request) returns (Create303Response);
}

message Get303Request {
  string id = 1;
}

message Get303Response {
  Message303 result = 1;
}

message List303Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List303Response {
  repeated Message303 results = 1;
  string next_page_token = 2;
}

message Create303Request {
  Message303 message = 1;
}

message Create303Response {
  Message303 result = 1;
}
