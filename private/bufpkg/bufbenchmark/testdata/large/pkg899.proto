syntax = "proto3";

package benchmark.pkg899;

// Message with various field types
message Message899 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage899 nested = 7;
  Status899 status = 8;
}

// Nested message type
message NestedMessage899 {
  string name = 1;
  int32 value = 2;
  repeated Item899 items = 3;
}

// Simple item message
message Item899 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status899 {
  STATUS_899_UNSPECIFIED = 0;
  STATUS_899_ACTIVE = 1;
  STATUS_899_INACTIVE = 2;
  STATUS_899_PENDING = 3;
}

// Service definition
service Service899 {
  rpc Get899(Get899Request) returns (Get899Response);
  rpc List899(List899Request) returns (List899Response);
  rpc Create899(Create899Request) returns (Create899Response);
}

message Get899Request {
  string id = 1;
}

message Get899Response {
  Message899 result = 1;
}

message List899Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List899Response {
  repeated Message899 results = 1;
  string next_page_token = 2;
}

message Create899Request {
  Message899 message = 1;
}

message Create899Response {
  Message899 result = 1;
}
