syntax = "proto3";

package benchmark.pkg212;

// Message with various field types
message Message212 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage212 nested = 7;
  Status212 status = 8;
}

// Nested message type
message NestedMessage212 {
  string name = 1;
  int32 value = 2;
  repeated Item212 items = 3;
}

// Simple item message
message Item212 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status212 {
  STATUS_212_UNSPECIFIED = 0;
  STATUS_212_ACTIVE = 1;
  STATUS_212_INACTIVE = 2;
  STATUS_212_PENDING = 3;
}

// Service definition
service Service212 {
  rpc Get212(Get212Request) returns (Get212Response);
  rpc List212(List212Request) returns (List212Response);
  rpc Create212(Create212Request) returns (Create212Response);
}

message Get212Request {
  string id = 1;
}

message Get212Response {
  Message212 result = 1;
}

message List212Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List212Response {
  repeated Message212 results = 1;
  string next_page_token = 2;
}

message Create212Request {
  Message212 message = 1;
}

message Create212Response {
  Message212 result = 1;
}
