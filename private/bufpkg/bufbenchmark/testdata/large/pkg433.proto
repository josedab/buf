syntax = "proto3";

package benchmark.pkg433;

// Message with various field types
message Message433 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage433 nested = 7;
  Status433 status = 8;
}

// Nested message type
message NestedMessage433 {
  string name = 1;
  int32 value = 2;
  repeated Item433 items = 3;
}

// Simple item message
message Item433 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status433 {
  STATUS_433_UNSPECIFIED = 0;
  STATUS_433_ACTIVE = 1;
  STATUS_433_INACTIVE = 2;
  STATUS_433_PENDING = 3;
}

// Service definition
service Service433 {
  rpc Get433(Get433Request) returns (Get433Response);
  rpc List433(List433Request) returns (List433Response);
  rpc Create433(Create433Request) returns (Create433Response);
}

message Get433Request {
  string id = 1;
}

message Get433Response {
  Message433 result = 1;
}

message List433Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List433Response {
  repeated Message433 results = 1;
  string next_page_token = 2;
}

message Create433Request {
  Message433 message = 1;
}

message Create433Response {
  Message433 result = 1;
}
