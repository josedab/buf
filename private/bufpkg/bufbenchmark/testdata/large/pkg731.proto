syntax = "proto3";

package benchmark.pkg731;

// Message with various field types
message Message731 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage731 nested = 7;
  Status731 status = 8;
}

// Nested message type
message NestedMessage731 {
  string name = 1;
  int32 value = 2;
  repeated Item731 items = 3;
}

// Simple item message
message Item731 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status731 {
  STATUS_731_UNSPECIFIED = 0;
  STATUS_731_ACTIVE = 1;
  STATUS_731_INACTIVE = 2;
  STATUS_731_PENDING = 3;
}

// Service definition
service Service731 {
  rpc Get731(Get731Request) returns (Get731Response);
  rpc List731(List731Request) returns (List731Response);
  rpc Create731(Create731Request) returns (Create731Response);
}

message Get731Request {
  string id = 1;
}

message Get731Response {
  Message731 result = 1;
}

message List731Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List731Response {
  repeated Message731 results = 1;
  string next_page_token = 2;
}

message Create731Request {
  Message731 message = 1;
}

message Create731Response {
  Message731 result = 1;
}
