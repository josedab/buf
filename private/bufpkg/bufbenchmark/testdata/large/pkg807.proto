syntax = "proto3";

package benchmark.pkg807;

// Message with various field types
message Message807 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage807 nested = 7;
  Status807 status = 8;
}

// Nested message type
message NestedMessage807 {
  string name = 1;
  int32 value = 2;
  repeated Item807 items = 3;
}

// Simple item message
message Item807 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status807 {
  STATUS_807_UNSPECIFIED = 0;
  STATUS_807_ACTIVE = 1;
  STATUS_807_INACTIVE = 2;
  STATUS_807_PENDING = 3;
}

// Service definition
service Service807 {
  rpc Get807(Get807Request) returns (Get807Response);
  rpc List807(List807Request) returns (List807Response);
  rpc Create807(Create807Request) returns (Create807Response);
}

message Get807Request {
  string id = 1;
}

message Get807Response {
  Message807 result = 1;
}

message List807Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List807Response {
  repeated Message807 results = 1;
  string next_page_token = 2;
}

message Create807Request {
  Message807 message = 1;
}

message Create807Response {
  Message807 result = 1;
}
