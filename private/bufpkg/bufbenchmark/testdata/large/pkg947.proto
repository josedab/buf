syntax = "proto3";

package benchmark.pkg947;

// Message with various field types
message Message947 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage947 nested = 7;
  Status947 status = 8;
}

// Nested message type
message NestedMessage947 {
  string name = 1;
  int32 value = 2;
  repeated Item947 items = 3;
}

// Simple item message
message Item947 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status947 {
  STATUS_947_UNSPECIFIED = 0;
  STATUS_947_ACTIVE = 1;
  STATUS_947_INACTIVE = 2;
  STATUS_947_PENDING = 3;
}

// Service definition
service Service947 {
  rpc Get947(Get947Request) returns (Get947Response);
  rpc List947(List947Request) returns (List947Response);
  rpc Create947(Create947Request) returns (Create947Response);
}

message Get947Request {
  string id = 1;
}

message Get947Response {
  Message947 result = 1;
}

message List947Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List947Response {
  repeated Message947 results = 1;
  string next_page_token = 2;
}

message Create947Request {
  Message947 message = 1;
}

message Create947Response {
  Message947 result = 1;
}
