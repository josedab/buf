syntax = "proto3";

package benchmark.pkg133;

// Message with various field types
message Message133 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage133 nested = 7;
  Status133 status = 8;
}

// Nested message type
message NestedMessage133 {
  string name = 1;
  int32 value = 2;
  repeated Item133 items = 3;
}

// Simple item message
message Item133 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status133 {
  STATUS_133_UNSPECIFIED = 0;
  STATUS_133_ACTIVE = 1;
  STATUS_133_INACTIVE = 2;
  STATUS_133_PENDING = 3;
}

// Service definition
service Service133 {
  rpc Get133(Get133Request) returns (Get133Response);
  rpc List133(List133Request) returns (List133Response);
  rpc Create133(Create133Request) returns (Create133Response);
}

message Get133Request {
  string id = 1;
}

message Get133Response {
  Message133 result = 1;
}

message List133Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List133Response {
  repeated Message133 results = 1;
  string next_page_token = 2;
}

message Create133Request {
  Message133 message = 1;
}

message Create133Response {
  Message133 result = 1;
}
