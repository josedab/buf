syntax = "proto3";

package benchmark.pkg160;

// Message with various field types
message Message160 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage160 nested = 7;
  Status160 status = 8;
}

// Nested message type
message NestedMessage160 {
  string name = 1;
  int32 value = 2;
  repeated Item160 items = 3;
}

// Simple item message
message Item160 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status160 {
  STATUS_160_UNSPECIFIED = 0;
  STATUS_160_ACTIVE = 1;
  STATUS_160_INACTIVE = 2;
  STATUS_160_PENDING = 3;
}

// Service definition
service Service160 {
  rpc Get160(Get160Request) returns (Get160Response);
  rpc List160(List160Request) returns (List160Response);
  rpc Create160(Create160Request) returns (Create160Response);
}

message Get160Request {
  string id = 1;
}

message Get160Response {
  Message160 result = 1;
}

message List160Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List160Response {
  repeated Message160 results = 1;
  string next_page_token = 2;
}

message Create160Request {
  Message160 message = 1;
}

message Create160Response {
  Message160 result = 1;
}
