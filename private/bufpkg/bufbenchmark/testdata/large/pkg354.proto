syntax = "proto3";

package benchmark.pkg354;

// Message with various field types
message Message354 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage354 nested = 7;
  Status354 status = 8;
}

// Nested message type
message NestedMessage354 {
  string name = 1;
  int32 value = 2;
  repeated Item354 items = 3;
}

// Simple item message
message Item354 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status354 {
  STATUS_354_UNSPECIFIED = 0;
  STATUS_354_ACTIVE = 1;
  STATUS_354_INACTIVE = 2;
  STATUS_354_PENDING = 3;
}

// Service definition
service Service354 {
  rpc Get354(Get354Request) returns (Get354Response);
  rpc List354(List354Request) returns (List354Response);
  rpc Create354(Create354Request) returns (Create354Response);
}

message Get354Request {
  string id = 1;
}

message Get354Response {
  Message354 result = 1;
}

message List354Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List354Response {
  repeated Message354 results = 1;
  string next_page_token = 2;
}

message Create354Request {
  Message354 message = 1;
}

message Create354Response {
  Message354 result = 1;
}
