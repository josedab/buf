syntax = "proto3";

package benchmark.pkg837;

// Message with various field types
message Message837 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage837 nested = 7;
  Status837 status = 8;
}

// Nested message type
message NestedMessage837 {
  string name = 1;
  int32 value = 2;
  repeated Item837 items = 3;
}

// Simple item message
message Item837 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status837 {
  STATUS_837_UNSPECIFIED = 0;
  STATUS_837_ACTIVE = 1;
  STATUS_837_INACTIVE = 2;
  STATUS_837_PENDING = 3;
}

// Service definition
service Service837 {
  rpc Get837(Get837Request) returns (Get837Response);
  rpc List837(List837Request) returns (List837Response);
  rpc Create837(Create837Request) returns (Create837Response);
}

message Get837Request {
  string id = 1;
}

message Get837Response {
  Message837 result = 1;
}

message List837Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List837Response {
  repeated Message837 results = 1;
  string next_page_token = 2;
}

message Create837Request {
  Message837 message = 1;
}

message Create837Response {
  Message837 result = 1;
}
