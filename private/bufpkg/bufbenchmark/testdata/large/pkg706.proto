syntax = "proto3";

package benchmark.pkg706;

// Message with various field types
message Message706 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage706 nested = 7;
  Status706 status = 8;
}

// Nested message type
message NestedMessage706 {
  string name = 1;
  int32 value = 2;
  repeated Item706 items = 3;
}

// Simple item message
message Item706 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status706 {
  STATUS_706_UNSPECIFIED = 0;
  STATUS_706_ACTIVE = 1;
  STATUS_706_INACTIVE = 2;
  STATUS_706_PENDING = 3;
}

// Service definition
service Service706 {
  rpc Get706(Get706Request) returns (Get706Response);
  rpc List706(List706Request) returns (List706Response);
  rpc Create706(Create706Request) returns (Create706Response);
}

message Get706Request {
  string id = 1;
}

message Get706Response {
  Message706 result = 1;
}

message List706Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List706Response {
  repeated Message706 results = 1;
  string next_page_token = 2;
}

message Create706Request {
  Message706 message = 1;
}

message Create706Response {
  Message706 result = 1;
}
