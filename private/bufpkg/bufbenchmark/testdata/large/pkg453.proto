syntax = "proto3";

package benchmark.pkg453;

// Message with various field types
message Message453 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage453 nested = 7;
  Status453 status = 8;
}

// Nested message type
message NestedMessage453 {
  string name = 1;
  int32 value = 2;
  repeated Item453 items = 3;
}

// Simple item message
message Item453 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status453 {
  STATUS_453_UNSPECIFIED = 0;
  STATUS_453_ACTIVE = 1;
  STATUS_453_INACTIVE = 2;
  STATUS_453_PENDING = 3;
}

// Service definition
service Service453 {
  rpc Get453(Get453Request) returns (Get453Response);
  rpc List453(List453Request) returns (List453Response);
  rpc Create453(Create453Request) returns (Create453Response);
}

message Get453Request {
  string id = 1;
}

message Get453Response {
  Message453 result = 1;
}

message List453Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List453Response {
  repeated Message453 results = 1;
  string next_page_token = 2;
}

message Create453Request {
  Message453 message = 1;
}

message Create453Response {
  Message453 result = 1;
}
