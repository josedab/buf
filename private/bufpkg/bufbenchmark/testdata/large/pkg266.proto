syntax = "proto3";

package benchmark.pkg266;

// Message with various field types
message Message266 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage266 nested = 7;
  Status266 status = 8;
}

// Nested message type
message NestedMessage266 {
  string name = 1;
  int32 value = 2;
  repeated Item266 items = 3;
}

// Simple item message
message Item266 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status266 {
  STATUS_266_UNSPECIFIED = 0;
  STATUS_266_ACTIVE = 1;
  STATUS_266_INACTIVE = 2;
  STATUS_266_PENDING = 3;
}

// Service definition
service Service266 {
  rpc Get266(Get266Request) returns (Get266Response);
  rpc List266(List266Request) returns (List266Response);
  rpc Create266(Create266Request) returns (Create266Response);
}

message Get266Request {
  string id = 1;
}

message Get266Response {
  Message266 result = 1;
}

message List266Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List266Response {
  repeated Message266 results = 1;
  string next_page_token = 2;
}

message Create266Request {
  Message266 message = 1;
}

message Create266Response {
  Message266 result = 1;
}
