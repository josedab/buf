syntax = "proto3";

package benchmark.pkg860;

// Message with various field types
message Message860 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage860 nested = 7;
  Status860 status = 8;
}

// Nested message type
message NestedMessage860 {
  string name = 1;
  int32 value = 2;
  repeated Item860 items = 3;
}

// Simple item message
message Item860 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status860 {
  STATUS_860_UNSPECIFIED = 0;
  STATUS_860_ACTIVE = 1;
  STATUS_860_INACTIVE = 2;
  STATUS_860_PENDING = 3;
}

// Service definition
service Service860 {
  rpc Get860(Get860Request) returns (Get860Response);
  rpc List860(List860Request) returns (List860Response);
  rpc Create860(Create860Request) returns (Create860Response);
}

message Get860Request {
  string id = 1;
}

message Get860Response {
  Message860 result = 1;
}

message List860Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List860Response {
  repeated Message860 results = 1;
  string next_page_token = 2;
}

message Create860Request {
  Message860 message = 1;
}

message Create860Response {
  Message860 result = 1;
}
