syntax = "proto3";

package benchmark.pkg866;

// Message with various field types
message Message866 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage866 nested = 7;
  Status866 status = 8;
}

// Nested message type
message NestedMessage866 {
  string name = 1;
  int32 value = 2;
  repeated Item866 items = 3;
}

// Simple item message
message Item866 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status866 {
  STATUS_866_UNSPECIFIED = 0;
  STATUS_866_ACTIVE = 1;
  STATUS_866_INACTIVE = 2;
  STATUS_866_PENDING = 3;
}

// Service definition
service Service866 {
  rpc Get866(Get866Request) returns (Get866Response);
  rpc List866(List866Request) returns (List866Response);
  rpc Create866(Create866Request) returns (Create866Response);
}

message Get866Request {
  string id = 1;
}

message Get866Response {
  Message866 result = 1;
}

message List866Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List866Response {
  repeated Message866 results = 1;
  string next_page_token = 2;
}

message Create866Request {
  Message866 message = 1;
}

message Create866Response {
  Message866 result = 1;
}
