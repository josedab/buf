syntax = "proto3";

package benchmark.pkg665;

// Message with various field types
message Message665 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage665 nested = 7;
  Status665 status = 8;
}

// Nested message type
message NestedMessage665 {
  string name = 1;
  int32 value = 2;
  repeated Item665 items = 3;
}

// Simple item message
message Item665 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status665 {
  STATUS_665_UNSPECIFIED = 0;
  STATUS_665_ACTIVE = 1;
  STATUS_665_INACTIVE = 2;
  STATUS_665_PENDING = 3;
}

// Service definition
service Service665 {
  rpc Get665(Get665Request) returns (Get665Response);
  rpc List665(List665Request) returns (List665Response);
  rpc Create665(Create665Request) returns (Create665Response);
}

message Get665Request {
  string id = 1;
}

message Get665Response {
  Message665 result = 1;
}

message List665Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List665Response {
  repeated Message665 results = 1;
  string next_page_token = 2;
}

message Create665Request {
  Message665 message = 1;
}

message Create665Response {
  Message665 result = 1;
}
