syntax = "proto3";

package benchmark.pkg413;

// Message with various field types
message Message413 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage413 nested = 7;
  Status413 status = 8;
}

// Nested message type
message NestedMessage413 {
  string name = 1;
  int32 value = 2;
  repeated Item413 items = 3;
}

// Simple item message
message Item413 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status413 {
  STATUS_413_UNSPECIFIED = 0;
  STATUS_413_ACTIVE = 1;
  STATUS_413_INACTIVE = 2;
  STATUS_413_PENDING = 3;
}

// Service definition
service Service413 {
  rpc Get413(Get413Request) returns (Get413Response);
  rpc List413(List413Request) returns (List413Response);
  rpc Create413(Create413Request) returns (Create413Response);
}

message Get413Request {
  string id = 1;
}

message Get413Response {
  Message413 result = 1;
}

message List413Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List413Response {
  repeated Message413 results = 1;
  string next_page_token = 2;
}

message Create413Request {
  Message413 message = 1;
}

message Create413Response {
  Message413 result = 1;
}
