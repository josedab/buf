syntax = "proto3";

package benchmark.pkg308;

// Message with various field types
message Message308 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage308 nested = 7;
  Status308 status = 8;
}

// Nested message type
message NestedMessage308 {
  string name = 1;
  int32 value = 2;
  repeated Item308 items = 3;
}

// Simple item message
message Item308 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status308 {
  STATUS_308_UNSPECIFIED = 0;
  STATUS_308_ACTIVE = 1;
  STATUS_308_INACTIVE = 2;
  STATUS_308_PENDING = 3;
}

// Service definition
service Service308 {
  rpc Get308(Get308Request) returns (Get308Response);
  rpc List308(List308Request) returns (List308Response);
  rpc Create308(Create308Request) returns (Create308Response);
}

message Get308Request {
  string id = 1;
}

message Get308Response {
  Message308 result = 1;
}

message List308Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List308Response {
  repeated Message308 results = 1;
  string next_page_token = 2;
}

message Create308Request {
  Message308 message = 1;
}

message Create308Response {
  Message308 result = 1;
}
