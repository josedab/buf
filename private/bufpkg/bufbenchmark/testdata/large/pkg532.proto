syntax = "proto3";

package benchmark.pkg532;

// Message with various field types
message Message532 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage532 nested = 7;
  Status532 status = 8;
}

// Nested message type
message NestedMessage532 {
  string name = 1;
  int32 value = 2;
  repeated Item532 items = 3;
}

// Simple item message
message Item532 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status532 {
  STATUS_532_UNSPECIFIED = 0;
  STATUS_532_ACTIVE = 1;
  STATUS_532_INACTIVE = 2;
  STATUS_532_PENDING = 3;
}

// Service definition
service Service532 {
  rpc Get532(Get532Request) returns (Get532Response);
  rpc List532(List532Request) returns (List532Response);
  rpc Create532(Create532Request) returns (Create532Response);
}

message Get532Request {
  string id = 1;
}

message Get532Response {
  Message532 result = 1;
}

message List532Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List532Response {
  repeated Message532 results = 1;
  string next_page_token = 2;
}

message Create532Request {
  Message532 message = 1;
}

message Create532Response {
  Message532 result = 1;
}
