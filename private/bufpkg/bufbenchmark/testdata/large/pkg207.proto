syntax = "proto3";

package benchmark.pkg207;

// Message with various field types
message Message207 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage207 nested = 7;
  Status207 status = 8;
}

// Nested message type
message NestedMessage207 {
  string name = 1;
  int32 value = 2;
  repeated Item207 items = 3;
}

// Simple item message
message Item207 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status207 {
  STATUS_207_UNSPECIFIED = 0;
  STATUS_207_ACTIVE = 1;
  STATUS_207_INACTIVE = 2;
  STATUS_207_PENDING = 3;
}

// Service definition
service Service207 {
  rpc Get207(Get207Request) returns (Get207Response);
  rpc List207(List207Request) returns (List207Response);
  rpc Create207(Create207Request) returns (Create207Response);
}

message Get207Request {
  string id = 1;
}

message Get207Response {
  Message207 result = 1;
}

message List207Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List207Response {
  repeated Message207 results = 1;
  string next_page_token = 2;
}

message Create207Request {
  Message207 message = 1;
}

message Create207Response {
  Message207 result = 1;
}
