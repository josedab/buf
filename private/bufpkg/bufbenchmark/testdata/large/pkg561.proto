syntax = "proto3";

package benchmark.pkg561;

// Message with various field types
message Message561 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage561 nested = 7;
  Status561 status = 8;
}

// Nested message type
message NestedMessage561 {
  string name = 1;
  int32 value = 2;
  repeated Item561 items = 3;
}

// Simple item message
message Item561 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status561 {
  STATUS_561_UNSPECIFIED = 0;
  STATUS_561_ACTIVE = 1;
  STATUS_561_INACTIVE = 2;
  STATUS_561_PENDING = 3;
}

// Service definition
service Service561 {
  rpc Get561(Get561Request) returns (Get561Response);
  rpc List561(List561Request) returns (List561Response);
  rpc Create561(Create561Request) returns (Create561Response);
}

message Get561Request {
  string id = 1;
}

message Get561Response {
  Message561 result = 1;
}

message List561Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List561Response {
  repeated Message561 results = 1;
  string next_page_token = 2;
}

message Create561Request {
  Message561 message = 1;
}

message Create561Response {
  Message561 result = 1;
}
