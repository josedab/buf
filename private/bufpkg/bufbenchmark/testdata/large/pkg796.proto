syntax = "proto3";

package benchmark.pkg796;

// Message with various field types
message Message796 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage796 nested = 7;
  Status796 status = 8;
}

// Nested message type
message NestedMessage796 {
  string name = 1;
  int32 value = 2;
  repeated Item796 items = 3;
}

// Simple item message
message Item796 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status796 {
  STATUS_796_UNSPECIFIED = 0;
  STATUS_796_ACTIVE = 1;
  STATUS_796_INACTIVE = 2;
  STATUS_796_PENDING = 3;
}

// Service definition
service Service796 {
  rpc Get796(Get796Request) returns (Get796Response);
  rpc List796(List796Request) returns (List796Response);
  rpc Create796(Create796Request) returns (Create796Response);
}

message Get796Request {
  string id = 1;
}

message Get796Response {
  Message796 result = 1;
}

message List796Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List796Response {
  repeated Message796 results = 1;
  string next_page_token = 2;
}

message Create796Request {
  Message796 message = 1;
}

message Create796Response {
  Message796 result = 1;
}
