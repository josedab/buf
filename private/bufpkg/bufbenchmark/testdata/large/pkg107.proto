syntax = "proto3";

package benchmark.pkg107;

// Message with various field types
message Message107 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage107 nested = 7;
  Status107 status = 8;
}

// Nested message type
message NestedMessage107 {
  string name = 1;
  int32 value = 2;
  repeated Item107 items = 3;
}

// Simple item message
message Item107 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status107 {
  STATUS_107_UNSPECIFIED = 0;
  STATUS_107_ACTIVE = 1;
  STATUS_107_INACTIVE = 2;
  STATUS_107_PENDING = 3;
}

// Service definition
service Service107 {
  rpc Get107(Get107Request) returns (Get107Response);
  rpc List107(List107Request) returns (List107Response);
  rpc Create107(Create107Request) returns (Create107Response);
}

message Get107Request {
  string id = 1;
}

message Get107Response {
  Message107 result = 1;
}

message List107Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List107Response {
  repeated Message107 results = 1;
  string next_page_token = 2;
}

message Create107Request {
  Message107 message = 1;
}

message Create107Response {
  Message107 result = 1;
}
