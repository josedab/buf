syntax = "proto3";

package benchmark.pkg675;

// Message with various field types
message Message675 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage675 nested = 7;
  Status675 status = 8;
}

// Nested message type
message NestedMessage675 {
  string name = 1;
  int32 value = 2;
  repeated Item675 items = 3;
}

// Simple item message
message Item675 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status675 {
  STATUS_675_UNSPECIFIED = 0;
  STATUS_675_ACTIVE = 1;
  STATUS_675_INACTIVE = 2;
  STATUS_675_PENDING = 3;
}

// Service definition
service Service675 {
  rpc Get675(Get675Request) returns (Get675Response);
  rpc List675(List675Request) returns (List675Response);
  rpc Create675(Create675Request) returns (Create675Response);
}

message Get675Request {
  string id = 1;
}

message Get675Response {
  Message675 result = 1;
}

message List675Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List675Response {
  repeated Message675 results = 1;
  string next_page_token = 2;
}

message Create675Request {
  Message675 message = 1;
}

message Create675Response {
  Message675 result = 1;
}
