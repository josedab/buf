syntax = "proto3";

package benchmark.pkg423;

// Message with various field types
message Message423 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage423 nested = 7;
  Status423 status = 8;
}

// Nested message type
message NestedMessage423 {
  string name = 1;
  int32 value = 2;
  repeated Item423 items = 3;
}

// Simple item message
message Item423 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status423 {
  STATUS_423_UNSPECIFIED = 0;
  STATUS_423_ACTIVE = 1;
  STATUS_423_INACTIVE = 2;
  STATUS_423_PENDING = 3;
}

// Service definition
service Service423 {
  rpc Get423(Get423Request) returns (Get423Response);
  rpc List423(List423Request) returns (List423Response);
  rpc Create423(Create423Request) returns (Create423Response);
}

message Get423Request {
  string id = 1;
}

message Get423Response {
  Message423 result = 1;
}

message List423Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List423Response {
  repeated Message423 results = 1;
  string next_page_token = 2;
}

message Create423Request {
  Message423 message = 1;
}

message Create423Response {
  Message423 result = 1;
}
