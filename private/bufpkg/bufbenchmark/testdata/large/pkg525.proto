syntax = "proto3";

package benchmark.pkg525;

// Message with various field types
message Message525 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage525 nested = 7;
  Status525 status = 8;
}

// Nested message type
message NestedMessage525 {
  string name = 1;
  int32 value = 2;
  repeated Item525 items = 3;
}

// Simple item message
message Item525 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status525 {
  STATUS_525_UNSPECIFIED = 0;
  STATUS_525_ACTIVE = 1;
  STATUS_525_INACTIVE = 2;
  STATUS_525_PENDING = 3;
}

// Service definition
service Service525 {
  rpc Get525(Get525Request) returns (Get525Response);
  rpc List525(List525Request) returns (List525Response);
  rpc Create525(Create525Request) returns (Create525Response);
}

message Get525Request {
  string id = 1;
}

message Get525Response {
  Message525 result = 1;
}

message List525Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List525Response {
  repeated Message525 results = 1;
  string next_page_token = 2;
}

message Create525Request {
  Message525 message = 1;
}

message Create525Response {
  Message525 result = 1;
}
