syntax = "proto3";

package benchmark.pkg192;

// Message with various field types
message Message192 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage192 nested = 7;
  Status192 status = 8;
}

// Nested message type
message NestedMessage192 {
  string name = 1;
  int32 value = 2;
  repeated Item192 items = 3;
}

// Simple item message
message Item192 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status192 {
  STATUS_192_UNSPECIFIED = 0;
  STATUS_192_ACTIVE = 1;
  STATUS_192_INACTIVE = 2;
  STATUS_192_PENDING = 3;
}

// Service definition
service Service192 {
  rpc Get192(Get192Request) returns (Get192Response);
  rpc List192(List192Request) returns (List192Response);
  rpc Create192(Create192Request) returns (Create192Response);
}

message Get192Request {
  string id = 1;
}

message Get192Response {
  Message192 result = 1;
}

message List192Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List192Response {
  repeated Message192 results = 1;
  string next_page_token = 2;
}

message Create192Request {
  Message192 message = 1;
}

message Create192Response {
  Message192 result = 1;
}
