syntax = "proto3";

package benchmark.pkg121;

// Message with various field types
message Message121 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage121 nested = 7;
  Status121 status = 8;
}

// Nested message type
message NestedMessage121 {
  string name = 1;
  int32 value = 2;
  repeated Item121 items = 3;
}

// Simple item message
message Item121 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status121 {
  STATUS_121_UNSPECIFIED = 0;
  STATUS_121_ACTIVE = 1;
  STATUS_121_INACTIVE = 2;
  STATUS_121_PENDING = 3;
}

// Service definition
service Service121 {
  rpc Get121(Get121Request) returns (Get121Response);
  rpc List121(List121Request) returns (List121Response);
  rpc Create121(Create121Request) returns (Create121Response);
}

message Get121Request {
  string id = 1;
}

message Get121Response {
  Message121 result = 1;
}

message List121Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List121Response {
  repeated Message121 results = 1;
  string next_page_token = 2;
}

message Create121Request {
  Message121 message = 1;
}

message Create121Response {
  Message121 result = 1;
}
