syntax = "proto3";

package benchmark.pkg209;

// Message with various field types
message Message209 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage209 nested = 7;
  Status209 status = 8;
}

// Nested message type
message NestedMessage209 {
  string name = 1;
  int32 value = 2;
  repeated Item209 items = 3;
}

// Simple item message
message Item209 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status209 {
  STATUS_209_UNSPECIFIED = 0;
  STATUS_209_ACTIVE = 1;
  STATUS_209_INACTIVE = 2;
  STATUS_209_PENDING = 3;
}

// Service definition
service Service209 {
  rpc Get209(Get209Request) returns (Get209Response);
  rpc List209(List209Request) returns (List209Response);
  rpc Create209(Create209Request) returns (Create209Response);
}

message Get209Request {
  string id = 1;
}

message Get209Response {
  Message209 result = 1;
}

message List209Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List209Response {
  repeated Message209 results = 1;
  string next_page_token = 2;
}

message Create209Request {
  Message209 message = 1;
}

message Create209Response {
  Message209 result = 1;
}
