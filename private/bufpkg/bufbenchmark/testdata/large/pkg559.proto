syntax = "proto3";

package benchmark.pkg559;

// Message with various field types
message Message559 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage559 nested = 7;
  Status559 status = 8;
}

// Nested message type
message NestedMessage559 {
  string name = 1;
  int32 value = 2;
  repeated Item559 items = 3;
}

// Simple item message
message Item559 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status559 {
  STATUS_559_UNSPECIFIED = 0;
  STATUS_559_ACTIVE = 1;
  STATUS_559_INACTIVE = 2;
  STATUS_559_PENDING = 3;
}

// Service definition
service Service559 {
  rpc Get559(Get559Request) returns (Get559Response);
  rpc List559(List559Request) returns (List559Response);
  rpc Create559(Create559Request) returns (Create559Response);
}

message Get559Request {
  string id = 1;
}

message Get559Response {
  Message559 result = 1;
}

message List559Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List559Response {
  repeated Message559 results = 1;
  string next_page_token = 2;
}

message Create559Request {
  Message559 message = 1;
}

message Create559Response {
  Message559 result = 1;
}
