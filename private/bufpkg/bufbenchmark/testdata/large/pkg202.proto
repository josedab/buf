syntax = "proto3";

package benchmark.pkg202;

// Message with various field types
message Message202 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage202 nested = 7;
  Status202 status = 8;
}

// Nested message type
message NestedMessage202 {
  string name = 1;
  int32 value = 2;
  repeated Item202 items = 3;
}

// Simple item message
message Item202 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status202 {
  STATUS_202_UNSPECIFIED = 0;
  STATUS_202_ACTIVE = 1;
  STATUS_202_INACTIVE = 2;
  STATUS_202_PENDING = 3;
}

// Service definition
service Service202 {
  rpc Get202(Get202Request) returns (Get202Response);
  rpc List202(List202Request) returns (List202Response);
  rpc Create202(Create202Request) returns (Create202Response);
}

message Get202Request {
  string id = 1;
}

message Get202Response {
  Message202 result = 1;
}

message List202Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List202Response {
  repeated Message202 results = 1;
  string next_page_token = 2;
}

message Create202Request {
  Message202 message = 1;
}

message Create202Response {
  Message202 result = 1;
}
