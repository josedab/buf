syntax = "proto3";

package benchmark.pkg847;

// Message with various field types
message Message847 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage847 nested = 7;
  Status847 status = 8;
}

// Nested message type
message NestedMessage847 {
  string name = 1;
  int32 value = 2;
  repeated Item847 items = 3;
}

// Simple item message
message Item847 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status847 {
  STATUS_847_UNSPECIFIED = 0;
  STATUS_847_ACTIVE = 1;
  STATUS_847_INACTIVE = 2;
  STATUS_847_PENDING = 3;
}

// Service definition
service Service847 {
  rpc Get847(Get847Request) returns (Get847Response);
  rpc List847(List847Request) returns (List847Response);
  rpc Create847(Create847Request) returns (Create847Response);
}

message Get847Request {
  string id = 1;
}

message Get847Response {
  Message847 result = 1;
}

message List847Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List847Response {
  repeated Message847 results = 1;
  string next_page_token = 2;
}

message Create847Request {
  Message847 message = 1;
}

message Create847Response {
  Message847 result = 1;
}
