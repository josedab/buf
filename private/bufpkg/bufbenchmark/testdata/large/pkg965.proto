syntax = "proto3";

package benchmark.pkg965;

// Message with various field types
message Message965 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage965 nested = 7;
  Status965 status = 8;
}

// Nested message type
message NestedMessage965 {
  string name = 1;
  int32 value = 2;
  repeated Item965 items = 3;
}

// Simple item message
message Item965 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status965 {
  STATUS_965_UNSPECIFIED = 0;
  STATUS_965_ACTIVE = 1;
  STATUS_965_INACTIVE = 2;
  STATUS_965_PENDING = 3;
}

// Service definition
service Service965 {
  rpc Get965(Get965Request) returns (Get965Response);
  rpc List965(List965Request) returns (List965Response);
  rpc Create965(Create965Request) returns (Create965Response);
}

message Get965Request {
  string id = 1;
}

message Get965Response {
  Message965 result = 1;
}

message List965Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List965Response {
  repeated Message965 results = 1;
  string next_page_token = 2;
}

message Create965Request {
  Message965 message = 1;
}

message Create965Response {
  Message965 result = 1;
}
