syntax = "proto3";

package benchmark.pkg495;

// Message with various field types
message Message495 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage495 nested = 7;
  Status495 status = 8;
}

// Nested message type
message NestedMessage495 {
  string name = 1;
  int32 value = 2;
  repeated Item495 items = 3;
}

// Simple item message
message Item495 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status495 {
  STATUS_495_UNSPECIFIED = 0;
  STATUS_495_ACTIVE = 1;
  STATUS_495_INACTIVE = 2;
  STATUS_495_PENDING = 3;
}

// Service definition
service Service495 {
  rpc Get495(Get495Request) returns (Get495Response);
  rpc List495(List495Request) returns (List495Response);
  rpc Create495(Create495Request) returns (Create495Response);
}

message Get495Request {
  string id = 1;
}

message Get495Response {
  Message495 result = 1;
}

message List495Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List495Response {
  repeated Message495 results = 1;
  string next_page_token = 2;
}

message Create495Request {
  Message495 message = 1;
}

message Create495Response {
  Message495 result = 1;
}
