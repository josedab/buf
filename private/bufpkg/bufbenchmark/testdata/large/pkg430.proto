syntax = "proto3";

package benchmark.pkg430;

// Message with various field types
message Message430 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage430 nested = 7;
  Status430 status = 8;
}

// Nested message type
message NestedMessage430 {
  string name = 1;
  int32 value = 2;
  repeated Item430 items = 3;
}

// Simple item message
message Item430 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status430 {
  STATUS_430_UNSPECIFIED = 0;
  STATUS_430_ACTIVE = 1;
  STATUS_430_INACTIVE = 2;
  STATUS_430_PENDING = 3;
}

// Service definition
service Service430 {
  rpc Get430(Get430Request) returns (Get430Response);
  rpc List430(List430Request) returns (List430Response);
  rpc Create430(Create430Request) returns (Create430Response);
}

message Get430Request {
  string id = 1;
}

message Get430Response {
  Message430 result = 1;
}

message List430Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List430Response {
  repeated Message430 results = 1;
  string next_page_token = 2;
}

message Create430Request {
  Message430 message = 1;
}

message Create430Response {
  Message430 result = 1;
}
