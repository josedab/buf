syntax = "proto3";

package benchmark.pkg491;

// Message with various field types
message Message491 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage491 nested = 7;
  Status491 status = 8;
}

// Nested message type
message NestedMessage491 {
  string name = 1;
  int32 value = 2;
  repeated Item491 items = 3;
}

// Simple item message
message Item491 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status491 {
  STATUS_491_UNSPECIFIED = 0;
  STATUS_491_ACTIVE = 1;
  STATUS_491_INACTIVE = 2;
  STATUS_491_PENDING = 3;
}

// Service definition
service Service491 {
  rpc Get491(Get491Request) returns (Get491Response);
  rpc List491(List491Request) returns (List491Response);
  rpc Create491(Create491Request) returns (Create491Response);
}

message Get491Request {
  string id = 1;
}

message Get491Response {
  Message491 result = 1;
}

message List491Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List491Response {
  repeated Message491 results = 1;
  string next_page_token = 2;
}

message Create491Request {
  Message491 message = 1;
}

message Create491Response {
  Message491 result = 1;
}
