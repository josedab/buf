syntax = "proto3";

package benchmark.pkg424;

// Message with various field types
message Message424 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage424 nested = 7;
  Status424 status = 8;
}

// Nested message type
message NestedMessage424 {
  string name = 1;
  int32 value = 2;
  repeated Item424 items = 3;
}

// Simple item message
message Item424 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status424 {
  STATUS_424_UNSPECIFIED = 0;
  STATUS_424_ACTIVE = 1;
  STATUS_424_INACTIVE = 2;
  STATUS_424_PENDING = 3;
}

// Service definition
service Service424 {
  rpc Get424(Get424Request) returns (Get424Response);
  rpc List424(List424Request) returns (List424Response);
  rpc Create424(Create424Request) returns (Create424Response);
}

message Get424Request {
  string id = 1;
}

message Get424Response {
  Message424 result = 1;
}

message List424Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List424Response {
  repeated Message424 results = 1;
  string next_page_token = 2;
}

message Create424Request {
  Message424 message = 1;
}

message Create424Response {
  Message424 result = 1;
}
