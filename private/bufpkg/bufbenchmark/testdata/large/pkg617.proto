syntax = "proto3";

package benchmark.pkg617;

// Message with various field types
message Message617 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage617 nested = 7;
  Status617 status = 8;
}

// Nested message type
message NestedMessage617 {
  string name = 1;
  int32 value = 2;
  repeated Item617 items = 3;
}

// Simple item message
message Item617 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status617 {
  STATUS_617_UNSPECIFIED = 0;
  STATUS_617_ACTIVE = 1;
  STATUS_617_INACTIVE = 2;
  STATUS_617_PENDING = 3;
}

// Service definition
service Service617 {
  rpc Get617(Get617Request) returns (Get617Response);
  rpc List617(List617Request) returns (List617Response);
  rpc Create617(Create617Request) returns (Create617Response);
}

message Get617Request {
  string id = 1;
}

message Get617Response {
  Message617 result = 1;
}

message List617Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List617Response {
  repeated Message617 results = 1;
  string next_page_token = 2;
}

message Create617Request {
  Message617 message = 1;
}

message Create617Response {
  Message617 result = 1;
}
