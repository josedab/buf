syntax = "proto3";

package benchmark.pkg999;

// Message with various field types
message Message999 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage999 nested = 7;
  Status999 status = 8;
}

// Nested message type
message NestedMessage999 {
  string name = 1;
  int32 value = 2;
  repeated Item999 items = 3;
}

// Simple item message
message Item999 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status999 {
  STATUS_999_UNSPECIFIED = 0;
  STATUS_999_ACTIVE = 1;
  STATUS_999_INACTIVE = 2;
  STATUS_999_PENDING = 3;
}

// Service definition
service Service999 {
  rpc Get999(Get999Request) returns (Get999Response);
  rpc List999(List999Request) returns (List999Response);
  rpc Create999(Create999Request) returns (Create999Response);
}

message Get999Request {
  string id = 1;
}

message Get999Response {
  Message999 result = 1;
}

message List999Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List999Response {
  repeated Message999 results = 1;
  string next_page_token = 2;
}

message Create999Request {
  Message999 message = 1;
}

message Create999Response {
  Message999 result = 1;
}
