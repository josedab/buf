syntax = "proto3";

package benchmark.pkg653;

// Message with various field types
message Message653 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage653 nested = 7;
  Status653 status = 8;
}

// Nested message type
message NestedMessage653 {
  string name = 1;
  int32 value = 2;
  repeated Item653 items = 3;
}

// Simple item message
message Item653 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status653 {
  STATUS_653_UNSPECIFIED = 0;
  STATUS_653_ACTIVE = 1;
  STATUS_653_INACTIVE = 2;
  STATUS_653_PENDING = 3;
}

// Service definition
service Service653 {
  rpc Get653(Get653Request) returns (Get653Response);
  rpc List653(List653Request) returns (List653Response);
  rpc Create653(Create653Request) returns (Create653Response);
}

message Get653Request {
  string id = 1;
}

message Get653Response {
  Message653 result = 1;
}

message List653Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List653Response {
  repeated Message653 results = 1;
  string next_page_token = 2;
}

message Create653Request {
  Message653 message = 1;
}

message Create653Response {
  Message653 result = 1;
}
