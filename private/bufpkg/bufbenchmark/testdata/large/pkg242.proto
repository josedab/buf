syntax = "proto3";

package benchmark.pkg242;

// Message with various field types
message Message242 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage242 nested = 7;
  Status242 status = 8;
}

// Nested message type
message NestedMessage242 {
  string name = 1;
  int32 value = 2;
  repeated Item242 items = 3;
}

// Simple item message
message Item242 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status242 {
  STATUS_242_UNSPECIFIED = 0;
  STATUS_242_ACTIVE = 1;
  STATUS_242_INACTIVE = 2;
  STATUS_242_PENDING = 3;
}

// Service definition
service Service242 {
  rpc Get242(Get242Request) returns (Get242Response);
  rpc List242(List242Request) returns (List242Response);
  rpc Create242(Create242Request) returns (Create242Response);
}

message Get242Request {
  string id = 1;
}

message Get242Response {
  Message242 result = 1;
}

message List242Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List242Response {
  repeated Message242 results = 1;
  string next_page_token = 2;
}

message Create242Request {
  Message242 message = 1;
}

message Create242Response {
  Message242 result = 1;
}
