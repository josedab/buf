syntax = "proto3";

package benchmark.pkg557;

// Message with various field types
message Message557 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage557 nested = 7;
  Status557 status = 8;
}

// Nested message type
message NestedMessage557 {
  string name = 1;
  int32 value = 2;
  repeated Item557 items = 3;
}

// Simple item message
message Item557 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status557 {
  STATUS_557_UNSPECIFIED = 0;
  STATUS_557_ACTIVE = 1;
  STATUS_557_INACTIVE = 2;
  STATUS_557_PENDING = 3;
}

// Service definition
service Service557 {
  rpc Get557(Get557Request) returns (Get557Response);
  rpc List557(List557Request) returns (List557Response);
  rpc Create557(Create557Request) returns (Create557Response);
}

message Get557Request {
  string id = 1;
}

message Get557Response {
  Message557 result = 1;
}

message List557Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List557Response {
  repeated Message557 results = 1;
  string next_page_token = 2;
}

message Create557Request {
  Message557 message = 1;
}

message Create557Response {
  Message557 result = 1;
}
