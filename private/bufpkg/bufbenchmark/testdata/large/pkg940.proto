syntax = "proto3";

package benchmark.pkg940;

// Message with various field types
message Message940 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage940 nested = 7;
  Status940 status = 8;
}

// Nested message type
message NestedMessage940 {
  string name = 1;
  int32 value = 2;
  repeated Item940 items = 3;
}

// Simple item message
message Item940 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status940 {
  STATUS_940_UNSPECIFIED = 0;
  STATUS_940_ACTIVE = 1;
  STATUS_940_INACTIVE = 2;
  STATUS_940_PENDING = 3;
}

// Service definition
service Service940 {
  rpc Get940(Get940Request) returns (Get940Response);
  rpc List940(List940Request) returns (List940Response);
  rpc Create940(Create940Request) returns (Create940Response);
}

message Get940Request {
  string id = 1;
}

message Get940Response {
  Message940 result = 1;
}

message List940Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List940Response {
  repeated Message940 results = 1;
  string next_page_token = 2;
}

message Create940Request {
  Message940 message = 1;
}

message Create940Response {
  Message940 result = 1;
}
