syntax = "proto3";

package benchmark.pkg907;

// Message with various field types
message Message907 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage907 nested = 7;
  Status907 status = 8;
}

// Nested message type
message NestedMessage907 {
  string name = 1;
  int32 value = 2;
  repeated Item907 items = 3;
}

// Simple item message
message Item907 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status907 {
  STATUS_907_UNSPECIFIED = 0;
  STATUS_907_ACTIVE = 1;
  STATUS_907_INACTIVE = 2;
  STATUS_907_PENDING = 3;
}

// Service definition
service Service907 {
  rpc Get907(Get907Request) returns (Get907Response);
  rpc List907(List907Request) returns (List907Response);
  rpc Create907(Create907Request) returns (Create907Response);
}

message Get907Request {
  string id = 1;
}

message Get907Response {
  Message907 result = 1;
}

message List907Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List907Response {
  repeated Message907 results = 1;
  string next_page_token = 2;
}

message Create907Request {
  Message907 message = 1;
}

message Create907Response {
  Message907 result = 1;
}
