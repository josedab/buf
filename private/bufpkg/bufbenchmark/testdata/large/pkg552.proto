syntax = "proto3";

package benchmark.pkg552;

// Message with various field types
message Message552 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage552 nested = 7;
  Status552 status = 8;
}

// Nested message type
message NestedMessage552 {
  string name = 1;
  int32 value = 2;
  repeated Item552 items = 3;
}

// Simple item message
message Item552 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status552 {
  STATUS_552_UNSPECIFIED = 0;
  STATUS_552_ACTIVE = 1;
  STATUS_552_INACTIVE = 2;
  STATUS_552_PENDING = 3;
}

// Service definition
service Service552 {
  rpc Get552(Get552Request) returns (Get552Response);
  rpc List552(List552Request) returns (List552Response);
  rpc Create552(Create552Request) returns (Create552Response);
}

message Get552Request {
  string id = 1;
}

message Get552Response {
  Message552 result = 1;
}

message List552Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List552Response {
  repeated Message552 results = 1;
  string next_page_token = 2;
}

message Create552Request {
  Message552 message = 1;
}

message Create552Response {
  Message552 result = 1;
}
