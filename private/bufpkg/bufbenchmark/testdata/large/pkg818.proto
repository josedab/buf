syntax = "proto3";

package benchmark.pkg818;

// Message with various field types
message Message818 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage818 nested = 7;
  Status818 status = 8;
}

// Nested message type
message NestedMessage818 {
  string name = 1;
  int32 value = 2;
  repeated Item818 items = 3;
}

// Simple item message
message Item818 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status818 {
  STATUS_818_UNSPECIFIED = 0;
  STATUS_818_ACTIVE = 1;
  STATUS_818_INACTIVE = 2;
  STATUS_818_PENDING = 3;
}

// Service definition
service Service818 {
  rpc Get818(Get818Request) returns (Get818Response);
  rpc List818(List818Request) returns (List818Response);
  rpc Create818(Create818Request) returns (Create818Response);
}

message Get818Request {
  string id = 1;
}

message Get818Response {
  Message818 result = 1;
}

message List818Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List818Response {
  repeated Message818 results = 1;
  string next_page_token = 2;
}

message Create818Request {
  Message818 message = 1;
}

message Create818Response {
  Message818 result = 1;
}
