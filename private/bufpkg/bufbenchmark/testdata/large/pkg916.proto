syntax = "proto3";

package benchmark.pkg916;

// Message with various field types
message Message916 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage916 nested = 7;
  Status916 status = 8;
}

// Nested message type
message NestedMessage916 {
  string name = 1;
  int32 value = 2;
  repeated Item916 items = 3;
}

// Simple item message
message Item916 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status916 {
  STATUS_916_UNSPECIFIED = 0;
  STATUS_916_ACTIVE = 1;
  STATUS_916_INACTIVE = 2;
  STATUS_916_PENDING = 3;
}

// Service definition
service Service916 {
  rpc Get916(Get916Request) returns (Get916Response);
  rpc List916(List916Request) returns (List916Response);
  rpc Create916(Create916Request) returns (Create916Response);
}

message Get916Request {
  string id = 1;
}

message Get916Response {
  Message916 result = 1;
}

message List916Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List916Response {
  repeated Message916 results = 1;
  string next_page_token = 2;
}

message Create916Request {
  Message916 message = 1;
}

message Create916Response {
  Message916 result = 1;
}
