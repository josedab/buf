syntax = "proto3";

package benchmark.pkg237;

// Message with various field types
message Message237 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage237 nested = 7;
  Status237 status = 8;
}

// Nested message type
message NestedMessage237 {
  string name = 1;
  int32 value = 2;
  repeated Item237 items = 3;
}

// Simple item message
message Item237 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status237 {
  STATUS_237_UNSPECIFIED = 0;
  STATUS_237_ACTIVE = 1;
  STATUS_237_INACTIVE = 2;
  STATUS_237_PENDING = 3;
}

// Service definition
service Service237 {
  rpc Get237(Get237Request) returns (Get237Response);
  rpc List237(List237Request) returns (List237Response);
  rpc Create237(Create237Request) returns (Create237Response);
}

message Get237Request {
  string id = 1;
}

message Get237Response {
  Message237 result = 1;
}

message List237Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List237Response {
  repeated Message237 results = 1;
  string next_page_token = 2;
}

message Create237Request {
  Message237 message = 1;
}

message Create237Response {
  Message237 result = 1;
}
