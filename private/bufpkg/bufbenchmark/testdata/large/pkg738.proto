syntax = "proto3";

package benchmark.pkg738;

// Message with various field types
message Message738 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage738 nested = 7;
  Status738 status = 8;
}

// Nested message type
message NestedMessage738 {
  string name = 1;
  int32 value = 2;
  repeated Item738 items = 3;
}

// Simple item message
message Item738 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status738 {
  STATUS_738_UNSPECIFIED = 0;
  STATUS_738_ACTIVE = 1;
  STATUS_738_INACTIVE = 2;
  STATUS_738_PENDING = 3;
}

// Service definition
service Service738 {
  rpc Get738(Get738Request) returns (Get738Response);
  rpc List738(List738Request) returns (List738Response);
  rpc Create738(Create738Request) returns (Create738Response);
}

message Get738Request {
  string id = 1;
}

message Get738Response {
  Message738 result = 1;
}

message List738Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List738Response {
  repeated Message738 results = 1;
  string next_page_token = 2;
}

message Create738Request {
  Message738 message = 1;
}

message Create738Response {
  Message738 result = 1;
}
