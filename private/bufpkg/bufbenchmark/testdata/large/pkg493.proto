syntax = "proto3";

package benchmark.pkg493;

// Message with various field types
message Message493 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage493 nested = 7;
  Status493 status = 8;
}

// Nested message type
message NestedMessage493 {
  string name = 1;
  int32 value = 2;
  repeated Item493 items = 3;
}

// Simple item message
message Item493 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status493 {
  STATUS_493_UNSPECIFIED = 0;
  STATUS_493_ACTIVE = 1;
  STATUS_493_INACTIVE = 2;
  STATUS_493_PENDING = 3;
}

// Service definition
service Service493 {
  rpc Get493(Get493Request) returns (Get493Response);
  rpc List493(List493Request) returns (List493Response);
  rpc Create493(Create493Request) returns (Create493Response);
}

message Get493Request {
  string id = 1;
}

message Get493Response {
  Message493 result = 1;
}

message List493Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List493Response {
  repeated Message493 results = 1;
  string next_page_token = 2;
}

message Create493Request {
  Message493 message = 1;
}

message Create493Response {
  Message493 result = 1;
}
