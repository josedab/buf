syntax = "proto3";

package benchmark.pkg320;

// Message with various field types
message Message320 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage320 nested = 7;
  Status320 status = 8;
}

// Nested message type
message NestedMessage320 {
  string name = 1;
  int32 value = 2;
  repeated Item320 items = 3;
}

// Simple item message
message Item320 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status320 {
  STATUS_320_UNSPECIFIED = 0;
  STATUS_320_ACTIVE = 1;
  STATUS_320_INACTIVE = 2;
  STATUS_320_PENDING = 3;
}

// Service definition
service Service320 {
  rpc Get320(Get320Request) returns (Get320Response);
  rpc List320(List320Request) returns (List320Response);
  rpc Create320(Create320Request) returns (Create320Response);
}

message Get320Request {
  string id = 1;
}

message Get320Response {
  Message320 result = 1;
}

message List320Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List320Response {
  repeated Message320 results = 1;
  string next_page_token = 2;
}

message Create320Request {
  Message320 message = 1;
}

message Create320Response {
  Message320 result = 1;
}
