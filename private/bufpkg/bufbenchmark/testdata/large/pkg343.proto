syntax = "proto3";

package benchmark.pkg343;

// Message with various field types
message Message343 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage343 nested = 7;
  Status343 status = 8;
}

// Nested message type
message NestedMessage343 {
  string name = 1;
  int32 value = 2;
  repeated Item343 items = 3;
}

// Simple item message
message Item343 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status343 {
  STATUS_343_UNSPECIFIED = 0;
  STATUS_343_ACTIVE = 1;
  STATUS_343_INACTIVE = 2;
  STATUS_343_PENDING = 3;
}

// Service definition
service Service343 {
  rpc Get343(Get343Request) returns (Get343Response);
  rpc List343(List343Request) returns (List343Response);
  rpc Create343(Create343Request) returns (Create343Response);
}

message Get343Request {
  string id = 1;
}

message Get343Response {
  Message343 result = 1;
}

message List343Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List343Response {
  repeated Message343 results = 1;
  string next_page_token = 2;
}

message Create343Request {
  Message343 message = 1;
}

message Create343Response {
  Message343 result = 1;
}
