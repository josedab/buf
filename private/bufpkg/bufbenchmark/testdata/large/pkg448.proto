syntax = "proto3";

package benchmark.pkg448;

// Message with various field types
message Message448 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage448 nested = 7;
  Status448 status = 8;
}

// Nested message type
message NestedMessage448 {
  string name = 1;
  int32 value = 2;
  repeated Item448 items = 3;
}

// Simple item message
message Item448 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status448 {
  STATUS_448_UNSPECIFIED = 0;
  STATUS_448_ACTIVE = 1;
  STATUS_448_INACTIVE = 2;
  STATUS_448_PENDING = 3;
}

// Service definition
service Service448 {
  rpc Get448(Get448Request) returns (Get448Response);
  rpc List448(List448Request) returns (List448Response);
  rpc Create448(Create448Request) returns (Create448Response);
}

message Get448Request {
  string id = 1;
}

message Get448Response {
  Message448 result = 1;
}

message List448Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List448Response {
  repeated Message448 results = 1;
  string next_page_token = 2;
}

message Create448Request {
  Message448 message = 1;
}

message Create448Response {
  Message448 result = 1;
}
