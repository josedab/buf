syntax = "proto3";

package benchmark.pkg590;

// Message with various field types
message Message590 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage590 nested = 7;
  Status590 status = 8;
}

// Nested message type
message NestedMessage590 {
  string name = 1;
  int32 value = 2;
  repeated Item590 items = 3;
}

// Simple item message
message Item590 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status590 {
  STATUS_590_UNSPECIFIED = 0;
  STATUS_590_ACTIVE = 1;
  STATUS_590_INACTIVE = 2;
  STATUS_590_PENDING = 3;
}

// Service definition
service Service590 {
  rpc Get590(Get590Request) returns (Get590Response);
  rpc List590(List590Request) returns (List590Response);
  rpc Create590(Create590Request) returns (Create590Response);
}

message Get590Request {
  string id = 1;
}

message Get590Response {
  Message590 result = 1;
}

message List590Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List590Response {
  repeated Message590 results = 1;
  string next_page_token = 2;
}

message Create590Request {
  Message590 message = 1;
}

message Create590Response {
  Message590 result = 1;
}
