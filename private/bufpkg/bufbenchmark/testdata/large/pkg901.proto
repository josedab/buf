syntax = "proto3";

package benchmark.pkg901;

// Message with various field types
message Message901 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage901 nested = 7;
  Status901 status = 8;
}

// Nested message type
message NestedMessage901 {
  string name = 1;
  int32 value = 2;
  repeated Item901 items = 3;
}

// Simple item message
message Item901 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status901 {
  STATUS_901_UNSPECIFIED = 0;
  STATUS_901_ACTIVE = 1;
  STATUS_901_INACTIVE = 2;
  STATUS_901_PENDING = 3;
}

// Service definition
service Service901 {
  rpc Get901(Get901Request) returns (Get901Response);
  rpc List901(List901Request) returns (List901Response);
  rpc Create901(Create901Request) returns (Create901Response);
}

message Get901Request {
  string id = 1;
}

message Get901Response {
  Message901 result = 1;
}

message List901Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List901Response {
  repeated Message901 results = 1;
  string next_page_token = 2;
}

message Create901Request {
  Message901 message = 1;
}

message Create901Response {
  Message901 result = 1;
}
