syntax = "proto3";

package benchmark.pkg104;

// Message with various field types
message Message104 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage104 nested = 7;
  Status104 status = 8;
}

// Nested message type
message NestedMessage104 {
  string name = 1;
  int32 value = 2;
  repeated Item104 items = 3;
}

// Simple item message
message Item104 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status104 {
  STATUS_104_UNSPECIFIED = 0;
  STATUS_104_ACTIVE = 1;
  STATUS_104_INACTIVE = 2;
  STATUS_104_PENDING = 3;
}

// Service definition
service Service104 {
  rpc Get104(Get104Request) returns (Get104Response);
  rpc List104(List104Request) returns (List104Response);
  rpc Create104(Create104Request) returns (Create104Response);
}

message Get104Request {
  string id = 1;
}

message Get104Response {
  Message104 result = 1;
}

message List104Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List104Response {
  repeated Message104 results = 1;
  string next_page_token = 2;
}

message Create104Request {
  Message104 message = 1;
}

message Create104Response {
  Message104 result = 1;
}
