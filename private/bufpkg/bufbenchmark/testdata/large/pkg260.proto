syntax = "proto3";

package benchmark.pkg260;

// Message with various field types
message Message260 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage260 nested = 7;
  Status260 status = 8;
}

// Nested message type
message NestedMessage260 {
  string name = 1;
  int32 value = 2;
  repeated Item260 items = 3;
}

// Simple item message
message Item260 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status260 {
  STATUS_260_UNSPECIFIED = 0;
  STATUS_260_ACTIVE = 1;
  STATUS_260_INACTIVE = 2;
  STATUS_260_PENDING = 3;
}

// Service definition
service Service260 {
  rpc Get260(Get260Request) returns (Get260Response);
  rpc List260(List260Request) returns (List260Response);
  rpc Create260(Create260Request) returns (Create260Response);
}

message Get260Request {
  string id = 1;
}

message Get260Response {
  Message260 result = 1;
}

message List260Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List260Response {
  repeated Message260 results = 1;
  string next_page_token = 2;
}

message Create260Request {
  Message260 message = 1;
}

message Create260Response {
  Message260 result = 1;
}
