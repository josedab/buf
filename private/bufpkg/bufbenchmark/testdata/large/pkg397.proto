syntax = "proto3";

package benchmark.pkg397;

// Message with various field types
message Message397 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage397 nested = 7;
  Status397 status = 8;
}

// Nested message type
message NestedMessage397 {
  string name = 1;
  int32 value = 2;
  repeated Item397 items = 3;
}

// Simple item message
message Item397 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status397 {
  STATUS_397_UNSPECIFIED = 0;
  STATUS_397_ACTIVE = 1;
  STATUS_397_INACTIVE = 2;
  STATUS_397_PENDING = 3;
}

// Service definition
service Service397 {
  rpc Get397(Get397Request) returns (Get397Response);
  rpc List397(List397Request) returns (List397Response);
  rpc Create397(Create397Request) returns (Create397Response);
}

message Get397Request {
  string id = 1;
}

message Get397Response {
  Message397 result = 1;
}

message List397Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List397Response {
  repeated Message397 results = 1;
  string next_page_token = 2;
}

message Create397Request {
  Message397 message = 1;
}

message Create397Response {
  Message397 result = 1;
}
