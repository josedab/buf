syntax = "proto3";

package benchmark.pkg115;

// Message with various field types
message Message115 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage115 nested = 7;
  Status115 status = 8;
}

// Nested message type
message NestedMessage115 {
  string name = 1;
  int32 value = 2;
  repeated Item115 items = 3;
}

// Simple item message
message Item115 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status115 {
  STATUS_115_UNSPECIFIED = 0;
  STATUS_115_ACTIVE = 1;
  STATUS_115_INACTIVE = 2;
  STATUS_115_PENDING = 3;
}

// Service definition
service Service115 {
  rpc Get115(Get115Request) returns (Get115Response);
  rpc List115(List115Request) returns (List115Response);
  rpc Create115(Create115Request) returns (Create115Response);
}

message Get115Request {
  string id = 1;
}

message Get115Response {
  Message115 result = 1;
}

message List115Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List115Response {
  repeated Message115 results = 1;
  string next_page_token = 2;
}

message Create115Request {
  Message115 message = 1;
}

message Create115Response {
  Message115 result = 1;
}
