syntax = "proto3";

package benchmark.pkg997;

// Message with various field types
message Message997 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage997 nested = 7;
  Status997 status = 8;
}

// Nested message type
message NestedMessage997 {
  string name = 1;
  int32 value = 2;
  repeated Item997 items = 3;
}

// Simple item message
message Item997 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status997 {
  STATUS_997_UNSPECIFIED = 0;
  STATUS_997_ACTIVE = 1;
  STATUS_997_INACTIVE = 2;
  STATUS_997_PENDING = 3;
}

// Service definition
service Service997 {
  rpc Get997(Get997Request) returns (Get997Response);
  rpc List997(List997Request) returns (List997Response);
  rpc Create997(Create997Request) returns (Create997Response);
}

message Get997Request {
  string id = 1;
}

message Get997Response {
  Message997 result = 1;
}

message List997Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List997Response {
  repeated Message997 results = 1;
  string next_page_token = 2;
}

message Create997Request {
  Message997 message = 1;
}

message Create997Response {
  Message997 result = 1;
}
