syntax = "proto3";

package benchmark.pkg811;

// Message with various field types
message Message811 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage811 nested = 7;
  Status811 status = 8;
}

// Nested message type
message NestedMessage811 {
  string name = 1;
  int32 value = 2;
  repeated Item811 items = 3;
}

// Simple item message
message Item811 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status811 {
  STATUS_811_UNSPECIFIED = 0;
  STATUS_811_ACTIVE = 1;
  STATUS_811_INACTIVE = 2;
  STATUS_811_PENDING = 3;
}

// Service definition
service Service811 {
  rpc Get811(Get811Request) returns (Get811Response);
  rpc List811(List811Request) returns (List811Response);
  rpc Create811(Create811Request) returns (Create811Response);
}

message Get811Request {
  string id = 1;
}

message Get811Response {
  Message811 result = 1;
}

message List811Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List811Response {
  repeated Message811 results = 1;
  string next_page_token = 2;
}

message Create811Request {
  Message811 message = 1;
}

message Create811Response {
  Message811 result = 1;
}
