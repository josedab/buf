syntax = "proto3";

package benchmark.pkg414;

// Message with various field types
message Message414 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage414 nested = 7;
  Status414 status = 8;
}

// Nested message type
message NestedMessage414 {
  string name = 1;
  int32 value = 2;
  repeated Item414 items = 3;
}

// Simple item message
message Item414 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status414 {
  STATUS_414_UNSPECIFIED = 0;
  STATUS_414_ACTIVE = 1;
  STATUS_414_INACTIVE = 2;
  STATUS_414_PENDING = 3;
}

// Service definition
service Service414 {
  rpc Get414(Get414Request) returns (Get414Response);
  rpc List414(List414Request) returns (List414Response);
  rpc Create414(Create414Request) returns (Create414Response);
}

message Get414Request {
  string id = 1;
}

message Get414Response {
  Message414 result = 1;
}

message List414Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List414Response {
  repeated Message414 results = 1;
  string next_page_token = 2;
}

message Create414Request {
  Message414 message = 1;
}

message Create414Response {
  Message414 result = 1;
}
