syntax = "proto3";

package benchmark.pkg251;

// Message with various field types
message Message251 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage251 nested = 7;
  Status251 status = 8;
}

// Nested message type
message NestedMessage251 {
  string name = 1;
  int32 value = 2;
  repeated Item251 items = 3;
}

// Simple item message
message Item251 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status251 {
  STATUS_251_UNSPECIFIED = 0;
  STATUS_251_ACTIVE = 1;
  STATUS_251_INACTIVE = 2;
  STATUS_251_PENDING = 3;
}

// Service definition
service Service251 {
  rpc Get251(Get251Request) returns (Get251Response);
  rpc List251(List251Request) returns (List251Response);
  rpc Create251(Create251Request) returns (Create251Response);
}

message Get251Request {
  string id = 1;
}

message Get251Response {
  Message251 result = 1;
}

message List251Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List251Response {
  repeated Message251 results = 1;
  string next_page_token = 2;
}

message Create251Request {
  Message251 message = 1;
}

message Create251Response {
  Message251 result = 1;
}
