syntax = "proto3";

package benchmark.pkg416;

// Message with various field types
message Message416 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage416 nested = 7;
  Status416 status = 8;
}

// Nested message type
message NestedMessage416 {
  string name = 1;
  int32 value = 2;
  repeated Item416 items = 3;
}

// Simple item message
message Item416 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status416 {
  STATUS_416_UNSPECIFIED = 0;
  STATUS_416_ACTIVE = 1;
  STATUS_416_INACTIVE = 2;
  STATUS_416_PENDING = 3;
}

// Service definition
service Service416 {
  rpc Get416(Get416Request) returns (Get416Response);
  rpc List416(List416Request) returns (List416Response);
  rpc Create416(Create416Request) returns (Create416Response);
}

message Get416Request {
  string id = 1;
}

message Get416Response {
  Message416 result = 1;
}

message List416Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List416Response {
  repeated Message416 results = 1;
  string next_page_token = 2;
}

message Create416Request {
  Message416 message = 1;
}

message Create416Response {
  Message416 result = 1;
}
