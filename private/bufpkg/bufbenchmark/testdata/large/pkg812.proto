syntax = "proto3";

package benchmark.pkg812;

// Message with various field types
message Message812 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage812 nested = 7;
  Status812 status = 8;
}

// Nested message type
message NestedMessage812 {
  string name = 1;
  int32 value = 2;
  repeated Item812 items = 3;
}

// Simple item message
message Item812 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status812 {
  STATUS_812_UNSPECIFIED = 0;
  STATUS_812_ACTIVE = 1;
  STATUS_812_INACTIVE = 2;
  STATUS_812_PENDING = 3;
}

// Service definition
service Service812 {
  rpc Get812(Get812Request) returns (Get812Response);
  rpc List812(List812Request) returns (List812Response);
  rpc Create812(Create812Request) returns (Create812Response);
}

message Get812Request {
  string id = 1;
}

message Get812Response {
  Message812 result = 1;
}

message List812Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List812Response {
  repeated Message812 results = 1;
  string next_page_token = 2;
}

message Create812Request {
  Message812 message = 1;
}

message Create812Response {
  Message812 result = 1;
}
