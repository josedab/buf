syntax = "proto3";

package benchmark.pkg605;

// Message with various field types
message Message605 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage605 nested = 7;
  Status605 status = 8;
}

// Nested message type
message NestedMessage605 {
  string name = 1;
  int32 value = 2;
  repeated Item605 items = 3;
}

// Simple item message
message Item605 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status605 {
  STATUS_605_UNSPECIFIED = 0;
  STATUS_605_ACTIVE = 1;
  STATUS_605_INACTIVE = 2;
  STATUS_605_PENDING = 3;
}

// Service definition
service Service605 {
  rpc Get605(Get605Request) returns (Get605Response);
  rpc List605(List605Request) returns (List605Response);
  rpc Create605(Create605Request) returns (Create605Response);
}

message Get605Request {
  string id = 1;
}

message Get605Response {
  Message605 result = 1;
}

message List605Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List605Response {
  repeated Message605 results = 1;
  string next_page_token = 2;
}

message Create605Request {
  Message605 message = 1;
}

message Create605Response {
  Message605 result = 1;
}
