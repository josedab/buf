syntax = "proto3";

package benchmark.pkg816;

// Message with various field types
message Message816 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage816 nested = 7;
  Status816 status = 8;
}

// Nested message type
message NestedMessage816 {
  string name = 1;
  int32 value = 2;
  repeated Item816 items = 3;
}

// Simple item message
message Item816 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status816 {
  STATUS_816_UNSPECIFIED = 0;
  STATUS_816_ACTIVE = 1;
  STATUS_816_INACTIVE = 2;
  STATUS_816_PENDING = 3;
}

// Service definition
service Service816 {
  rpc Get816(Get816Request) returns (Get816Response);
  rpc List816(List816Request) returns (List816Response);
  rpc Create816(Create816Request) returns (Create816Response);
}

message Get816Request {
  string id = 1;
}

message Get816Response {
  Message816 result = 1;
}

message List816Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List816Response {
  repeated Message816 results = 1;
  string next_page_token = 2;
}

message Create816Request {
  Message816 message = 1;
}

message Create816Response {
  Message816 result = 1;
}
