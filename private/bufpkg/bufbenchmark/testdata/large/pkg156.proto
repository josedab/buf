syntax = "proto3";

package benchmark.pkg156;

// Message with various field types
message Message156 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage156 nested = 7;
  Status156 status = 8;
}

// Nested message type
message NestedMessage156 {
  string name = 1;
  int32 value = 2;
  repeated Item156 items = 3;
}

// Simple item message
message Item156 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status156 {
  STATUS_156_UNSPECIFIED = 0;
  STATUS_156_ACTIVE = 1;
  STATUS_156_INACTIVE = 2;
  STATUS_156_PENDING = 3;
}

// Service definition
service Service156 {
  rpc Get156(Get156Request) returns (Get156Response);
  rpc List156(List156Request) returns (List156Response);
  rpc Create156(Create156Request) returns (Create156Response);
}

message Get156Request {
  string id = 1;
}

message Get156Response {
  Message156 result = 1;
}

message List156Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List156Response {
  repeated Message156 results = 1;
  string next_page_token = 2;
}

message Create156Request {
  Message156 message = 1;
}

message Create156Response {
  Message156 result = 1;
}
