syntax = "proto3";

package benchmark.pkg584;

// Message with various field types
message Message584 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage584 nested = 7;
  Status584 status = 8;
}

// Nested message type
message NestedMessage584 {
  string name = 1;
  int32 value = 2;
  repeated Item584 items = 3;
}

// Simple item message
message Item584 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status584 {
  STATUS_584_UNSPECIFIED = 0;
  STATUS_584_ACTIVE = 1;
  STATUS_584_INACTIVE = 2;
  STATUS_584_PENDING = 3;
}

// Service definition
service Service584 {
  rpc Get584(Get584Request) returns (Get584Response);
  rpc List584(List584Request) returns (List584Response);
  rpc Create584(Create584Request) returns (Create584Response);
}

message Get584Request {
  string id = 1;
}

message Get584Response {
  Message584 result = 1;
}

message List584Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List584Response {
  repeated Message584 results = 1;
  string next_page_token = 2;
}

message Create584Request {
  Message584 message = 1;
}

message Create584Response {
  Message584 result = 1;
}
