syntax = "proto3";

package benchmark.pkg326;

// Message with various field types
message Message326 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage326 nested = 7;
  Status326 status = 8;
}

// Nested message type
message NestedMessage326 {
  string name = 1;
  int32 value = 2;
  repeated Item326 items = 3;
}

// Simple item message
message Item326 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status326 {
  STATUS_326_UNSPECIFIED = 0;
  STATUS_326_ACTIVE = 1;
  STATUS_326_INACTIVE = 2;
  STATUS_326_PENDING = 3;
}

// Service definition
service Service326 {
  rpc Get326(Get326Request) returns (Get326Response);
  rpc List326(List326Request) returns (List326Response);
  rpc Create326(Create326Request) returns (Create326Response);
}

message Get326Request {
  string id = 1;
}

message Get326Response {
  Message326 result = 1;
}

message List326Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List326Response {
  repeated Message326 results = 1;
  string next_page_token = 2;
}

message Create326Request {
  Message326 message = 1;
}

message Create326Response {
  Message326 result = 1;
}
