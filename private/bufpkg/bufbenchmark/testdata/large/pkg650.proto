syntax = "proto3";

package benchmark.pkg650;

// Message with various field types
message Message650 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage650 nested = 7;
  Status650 status = 8;
}

// Nested message type
message NestedMessage650 {
  string name = 1;
  int32 value = 2;
  repeated Item650 items = 3;
}

// Simple item message
message Item650 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status650 {
  STATUS_650_UNSPECIFIED = 0;
  STATUS_650_ACTIVE = 1;
  STATUS_650_INACTIVE = 2;
  STATUS_650_PENDING = 3;
}

// Service definition
service Service650 {
  rpc Get650(Get650Request) returns (Get650Response);
  rpc List650(List650Request) returns (List650Response);
  rpc Create650(Create650Request) returns (Create650Response);
}

message Get650Request {
  string id = 1;
}

message Get650Response {
  Message650 result = 1;
}

message List650Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List650Response {
  repeated Message650 results = 1;
  string next_page_token = 2;
}

message Create650Request {
  Message650 message = 1;
}

message Create650Response {
  Message650 result = 1;
}
