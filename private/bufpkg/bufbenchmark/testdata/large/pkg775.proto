syntax = "proto3";

package benchmark.pkg775;

// Message with various field types
message Message775 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage775 nested = 7;
  Status775 status = 8;
}

// Nested message type
message NestedMessage775 {
  string name = 1;
  int32 value = 2;
  repeated Item775 items = 3;
}

// Simple item message
message Item775 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status775 {
  STATUS_775_UNSPECIFIED = 0;
  STATUS_775_ACTIVE = 1;
  STATUS_775_INACTIVE = 2;
  STATUS_775_PENDING = 3;
}

// Service definition
service Service775 {
  rpc Get775(Get775Request) returns (Get775Response);
  rpc List775(List775Request) returns (List775Response);
  rpc Create775(Create775Request) returns (Create775Response);
}

message Get775Request {
  string id = 1;
}

message Get775Response {
  Message775 result = 1;
}

message List775Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List775Response {
  repeated Message775 results = 1;
  string next_page_token = 2;
}

message Create775Request {
  Message775 message = 1;
}

message Create775Response {
  Message775 result = 1;
}
