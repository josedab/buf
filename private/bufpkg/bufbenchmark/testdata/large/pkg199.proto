syntax = "proto3";

package benchmark.pkg199;

// Message with various field types
message Message199 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage199 nested = 7;
  Status199 status = 8;
}

// Nested message type
message NestedMessage199 {
  string name = 1;
  int32 value = 2;
  repeated Item199 items = 3;
}

// Simple item message
message Item199 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status199 {
  STATUS_199_UNSPECIFIED = 0;
  STATUS_199_ACTIVE = 1;
  STATUS_199_INACTIVE = 2;
  STATUS_199_PENDING = 3;
}

// Service definition
service Service199 {
  rpc Get199(Get199Request) returns (Get199Response);
  rpc List199(List199Request) returns (List199Response);
  rpc Create199(Create199Request) returns (Create199Response);
}

message Get199Request {
  string id = 1;
}

message Get199Response {
  Message199 result = 1;
}

message List199Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List199Response {
  repeated Message199 results = 1;
  string next_page_token = 2;
}

message Create199Request {
  Message199 message = 1;
}

message Create199Response {
  Message199 result = 1;
}
