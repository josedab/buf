syntax = "proto3";

package benchmark.pkg599;

// Message with various field types
message Message599 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage599 nested = 7;
  Status599 status = 8;
}

// Nested message type
message NestedMessage599 {
  string name = 1;
  int32 value = 2;
  repeated Item599 items = 3;
}

// Simple item message
message Item599 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status599 {
  STATUS_599_UNSPECIFIED = 0;
  STATUS_599_ACTIVE = 1;
  STATUS_599_INACTIVE = 2;
  STATUS_599_PENDING = 3;
}

// Service definition
service Service599 {
  rpc Get599(Get599Request) returns (Get599Response);
  rpc List599(List599Request) returns (List599Response);
  rpc Create599(Create599Request) returns (Create599Response);
}

message Get599Request {
  string id = 1;
}

message Get599Response {
  Message599 result = 1;
}

message List599Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List599Response {
  repeated Message599 results = 1;
  string next_page_token = 2;
}

message Create599Request {
  Message599 message = 1;
}

message Create599Response {
  Message599 result = 1;
}
