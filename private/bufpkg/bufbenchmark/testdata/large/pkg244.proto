syntax = "proto3";

package benchmark.pkg244;

// Message with various field types
message Message244 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage244 nested = 7;
  Status244 status = 8;
}

// Nested message type
message NestedMessage244 {
  string name = 1;
  int32 value = 2;
  repeated Item244 items = 3;
}

// Simple item message
message Item244 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status244 {
  STATUS_244_UNSPECIFIED = 0;
  STATUS_244_ACTIVE = 1;
  STATUS_244_INACTIVE = 2;
  STATUS_244_PENDING = 3;
}

// Service definition
service Service244 {
  rpc Get244(Get244Request) returns (Get244Response);
  rpc List244(List244Request) returns (List244Response);
  rpc Create244(Create244Request) returns (Create244Response);
}

message Get244Request {
  string id = 1;
}

message Get244Response {
  Message244 result = 1;
}

message List244Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List244Response {
  repeated Message244 results = 1;
  string next_page_token = 2;
}

message Create244Request {
  Message244 message = 1;
}

message Create244Response {
  Message244 result = 1;
}
