syntax = "proto3";

package benchmark.pkg111;

// Message with various field types
message Message111 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage111 nested = 7;
  Status111 status = 8;
}

// Nested message type
message NestedMessage111 {
  string name = 1;
  int32 value = 2;
  repeated Item111 items = 3;
}

// Simple item message
message Item111 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status111 {
  STATUS_111_UNSPECIFIED = 0;
  STATUS_111_ACTIVE = 1;
  STATUS_111_INACTIVE = 2;
  STATUS_111_PENDING = 3;
}

// Service definition
service Service111 {
  rpc Get111(Get111Request) returns (Get111Response);
  rpc List111(List111Request) returns (List111Response);
  rpc Create111(Create111Request) returns (Create111Response);
}

message Get111Request {
  string id = 1;
}

message Get111Response {
  Message111 result = 1;
}

message List111Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List111Response {
  repeated Message111 results = 1;
  string next_page_token = 2;
}

message Create111Request {
  Message111 message = 1;
}

message Create111Response {
  Message111 result = 1;
}
