syntax = "proto3";

package benchmark.pkg317;

// Message with various field types
message Message317 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage317 nested = 7;
  Status317 status = 8;
}

// Nested message type
message NestedMessage317 {
  string name = 1;
  int32 value = 2;
  repeated Item317 items = 3;
}

// Simple item message
message Item317 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status317 {
  STATUS_317_UNSPECIFIED = 0;
  STATUS_317_ACTIVE = 1;
  STATUS_317_INACTIVE = 2;
  STATUS_317_PENDING = 3;
}

// Service definition
service Service317 {
  rpc Get317(Get317Request) returns (Get317Response);
  rpc List317(List317Request) returns (List317Response);
  rpc Create317(Create317Request) returns (Create317Response);
}

message Get317Request {
  string id = 1;
}

message Get317Response {
  Message317 result = 1;
}

message List317Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List317Response {
  repeated Message317 results = 1;
  string next_page_token = 2;
}

message Create317Request {
  Message317 message = 1;
}

message Create317Response {
  Message317 result = 1;
}
