syntax = "proto3";

package benchmark.pkg388;

// Message with various field types
message Message388 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage388 nested = 7;
  Status388 status = 8;
}

// Nested message type
message NestedMessage388 {
  string name = 1;
  int32 value = 2;
  repeated Item388 items = 3;
}

// Simple item message
message Item388 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status388 {
  STATUS_388_UNSPECIFIED = 0;
  STATUS_388_ACTIVE = 1;
  STATUS_388_INACTIVE = 2;
  STATUS_388_PENDING = 3;
}

// Service definition
service Service388 {
  rpc Get388(Get388Request) returns (Get388Response);
  rpc List388(List388Request) returns (List388Response);
  rpc Create388(Create388Request) returns (Create388Response);
}

message Get388Request {
  string id = 1;
}

message Get388Response {
  Message388 result = 1;
}

message List388Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List388Response {
  repeated Message388 results = 1;
  string next_page_token = 2;
}

message Create388Request {
  Message388 message = 1;
}

message Create388Response {
  Message388 result = 1;
}
