syntax = "proto3";

package benchmark.pkg109;

// Message with various field types
message Message109 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage109 nested = 7;
  Status109 status = 8;
}

// Nested message type
message NestedMessage109 {
  string name = 1;
  int32 value = 2;
  repeated Item109 items = 3;
}

// Simple item message
message Item109 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status109 {
  STATUS_109_UNSPECIFIED = 0;
  STATUS_109_ACTIVE = 1;
  STATUS_109_INACTIVE = 2;
  STATUS_109_PENDING = 3;
}

// Service definition
service Service109 {
  rpc Get109(Get109Request) returns (Get109Response);
  rpc List109(List109Request) returns (List109Response);
  rpc Create109(Create109Request) returns (Create109Response);
}

message Get109Request {
  string id = 1;
}

message Get109Response {
  Message109 result = 1;
}

message List109Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List109Response {
  repeated Message109 results = 1;
  string next_page_token = 2;
}

message Create109Request {
  Message109 message = 1;
}

message Create109Response {
  Message109 result = 1;
}
