syntax = "proto3";

package benchmark.pkg362;

// Message with various field types
message Message362 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage362 nested = 7;
  Status362 status = 8;
}

// Nested message type
message NestedMessage362 {
  string name = 1;
  int32 value = 2;
  repeated Item362 items = 3;
}

// Simple item message
message Item362 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status362 {
  STATUS_362_UNSPECIFIED = 0;
  STATUS_362_ACTIVE = 1;
  STATUS_362_INACTIVE = 2;
  STATUS_362_PENDING = 3;
}

// Service definition
service Service362 {
  rpc Get362(Get362Request) returns (Get362Response);
  rpc List362(List362Request) returns (List362Response);
  rpc Create362(Create362Request) returns (Create362Response);
}

message Get362Request {
  string id = 1;
}

message Get362Response {
  Message362 result = 1;
}

message List362Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List362Response {
  repeated Message362 results = 1;
  string next_page_token = 2;
}

message Create362Request {
  Message362 message = 1;
}

message Create362Response {
  Message362 result = 1;
}
