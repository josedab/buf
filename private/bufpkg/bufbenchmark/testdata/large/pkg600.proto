syntax = "proto3";

package benchmark.pkg600;

// Message with various field types
message Message600 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage600 nested = 7;
  Status600 status = 8;
}

// Nested message type
message NestedMessage600 {
  string name = 1;
  int32 value = 2;
  repeated Item600 items = 3;
}

// Simple item message
message Item600 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status600 {
  STATUS_600_UNSPECIFIED = 0;
  STATUS_600_ACTIVE = 1;
  STATUS_600_INACTIVE = 2;
  STATUS_600_PENDING = 3;
}

// Service definition
service Service600 {
  rpc Get600(Get600Request) returns (Get600Response);
  rpc List600(List600Request) returns (List600Response);
  rpc Create600(Create600Request) returns (Create600Response);
}

message Get600Request {
  string id = 1;
}

message Get600Response {
  Message600 result = 1;
}

message List600Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List600Response {
  repeated Message600 results = 1;
  string next_page_token = 2;
}

message Create600Request {
  Message600 message = 1;
}

message Create600Response {
  Message600 result = 1;
}
