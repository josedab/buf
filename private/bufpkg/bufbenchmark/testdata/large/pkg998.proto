syntax = "proto3";

package benchmark.pkg998;

// Message with various field types
message Message998 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage998 nested = 7;
  Status998 status = 8;
}

// Nested message type
message NestedMessage998 {
  string name = 1;
  int32 value = 2;
  repeated Item998 items = 3;
}

// Simple item message
message Item998 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status998 {
  STATUS_998_UNSPECIFIED = 0;
  STATUS_998_ACTIVE = 1;
  STATUS_998_INACTIVE = 2;
  STATUS_998_PENDING = 3;
}

// Service definition
service Service998 {
  rpc Get998(Get998Request) returns (Get998Response);
  rpc List998(List998Request) returns (List998Response);
  rpc Create998(Create998Request) returns (Create998Response);
}

message Get998Request {
  string id = 1;
}

message Get998Response {
  Message998 result = 1;
}

message List998Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List998Response {
  repeated Message998 results = 1;
  string next_page_token = 2;
}

message Create998Request {
  Message998 message = 1;
}

message Create998Response {
  Message998 result = 1;
}
