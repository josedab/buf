syntax = "proto3";

package benchmark.pkg908;

// Message with various field types
message Message908 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage908 nested = 7;
  Status908 status = 8;
}

// Nested message type
message NestedMessage908 {
  string name = 1;
  int32 value = 2;
  repeated Item908 items = 3;
}

// Simple item message
message Item908 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status908 {
  STATUS_908_UNSPECIFIED = 0;
  STATUS_908_ACTIVE = 1;
  STATUS_908_INACTIVE = 2;
  STATUS_908_PENDING = 3;
}

// Service definition
service Service908 {
  rpc Get908(Get908Request) returns (Get908Response);
  rpc List908(List908Request) returns (List908Response);
  rpc Create908(Create908Request) returns (Create908Response);
}

message Get908Request {
  string id = 1;
}

message Get908Response {
  Message908 result = 1;
}

message List908Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List908Response {
  repeated Message908 results = 1;
  string next_page_token = 2;
}

message Create908Request {
  Message908 message = 1;
}

message Create908Response {
  Message908 result = 1;
}
