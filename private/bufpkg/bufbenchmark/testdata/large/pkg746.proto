syntax = "proto3";

package benchmark.pkg746;

// Message with various field types
message Message746 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage746 nested = 7;
  Status746 status = 8;
}

// Nested message type
message NestedMessage746 {
  string name = 1;
  int32 value = 2;
  repeated Item746 items = 3;
}

// Simple item message
message Item746 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status746 {
  STATUS_746_UNSPECIFIED = 0;
  STATUS_746_ACTIVE = 1;
  STATUS_746_INACTIVE = 2;
  STATUS_746_PENDING = 3;
}

// Service definition
service Service746 {
  rpc Get746(Get746Request) returns (Get746Response);
  rpc List746(List746Request) returns (List746Response);
  rpc Create746(Create746Request) returns (Create746Response);
}

message Get746Request {
  string id = 1;
}

message Get746Response {
  Message746 result = 1;
}

message List746Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List746Response {
  repeated Message746 results = 1;
  string next_page_token = 2;
}

message Create746Request {
  Message746 message = 1;
}

message Create746Response {
  Message746 result = 1;
}
