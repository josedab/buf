syntax = "proto3";

package benchmark.pkg54;

// Message with various field types
message Message54 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage54 nested = 7;
  Status54 status = 8;
}

// Nested message type
message NestedMessage54 {
  string name = 1;
  int32 value = 2;
  repeated Item54 items = 3;
}

// Simple item message
message Item54 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status54 {
  STATUS_54_UNSPECIFIED = 0;
  STATUS_54_ACTIVE = 1;
  STATUS_54_INACTIVE = 2;
  STATUS_54_PENDING = 3;
}

// Service definition
service Service54 {
  rpc Get54(Get54Request) returns (Get54Response);
  rpc List54(List54Request) returns (List54Response);
  rpc Create54(Create54Request) returns (Create54Response);
}

message Get54Request {
  string id = 1;
}

message Get54Response {
  Message54 result = 1;
}

message List54Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List54Response {
  repeated Message54 results = 1;
  string next_page_token = 2;
}

message Create54Request {
  Message54 message = 1;
}

message Create54Response {
  Message54 result = 1;
}
