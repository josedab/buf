syntax = "proto3";

package benchmark.pkg334;

// Message with various field types
message Message334 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage334 nested = 7;
  Status334 status = 8;
}

// Nested message type
message NestedMessage334 {
  string name = 1;
  int32 value = 2;
  repeated Item334 items = 3;
}

// Simple item message
message Item334 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status334 {
  STATUS_334_UNSPECIFIED = 0;
  STATUS_334_ACTIVE = 1;
  STATUS_334_INACTIVE = 2;
  STATUS_334_PENDING = 3;
}

// Service definition
service Service334 {
  rpc Get334(Get334Request) returns (Get334Response);
  rpc List334(List334Request) returns (List334Response);
  rpc Create334(Create334Request) returns (Create334Response);
}

message Get334Request {
  string id = 1;
}

message Get334Response {
  Message334 result = 1;
}

message List334Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List334Response {
  repeated Message334 results = 1;
  string next_page_token = 2;
}

message Create334Request {
  Message334 message = 1;
}

message Create334Response {
  Message334 result = 1;
}
