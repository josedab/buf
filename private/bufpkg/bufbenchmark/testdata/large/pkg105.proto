syntax = "proto3";

package benchmark.pkg105;

// Message with various field types
message Message105 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage105 nested = 7;
  Status105 status = 8;
}

// Nested message type
message NestedMessage105 {
  string name = 1;
  int32 value = 2;
  repeated Item105 items = 3;
}

// Simple item message
message Item105 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status105 {
  STATUS_105_UNSPECIFIED = 0;
  STATUS_105_ACTIVE = 1;
  STATUS_105_INACTIVE = 2;
  STATUS_105_PENDING = 3;
}

// Service definition
service Service105 {
  rpc Get105(Get105Request) returns (Get105Response);
  rpc List105(List105Request) returns (List105Response);
  rpc Create105(Create105Request) returns (Create105Response);
}

message Get105Request {
  string id = 1;
}

message Get105Response {
  Message105 result = 1;
}

message List105Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List105Response {
  repeated Message105 results = 1;
  string next_page_token = 2;
}

message Create105Request {
  Message105 message = 1;
}

message Create105Response {
  Message105 result = 1;
}
