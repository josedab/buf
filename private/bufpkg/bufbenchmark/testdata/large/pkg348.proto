syntax = "proto3";

package benchmark.pkg348;

// Message with various field types
message Message348 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage348 nested = 7;
  Status348 status = 8;
}

// Nested message type
message NestedMessage348 {
  string name = 1;
  int32 value = 2;
  repeated Item348 items = 3;
}

// Simple item message
message Item348 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status348 {
  STATUS_348_UNSPECIFIED = 0;
  STATUS_348_ACTIVE = 1;
  STATUS_348_INACTIVE = 2;
  STATUS_348_PENDING = 3;
}

// Service definition
service Service348 {
  rpc Get348(Get348Request) returns (Get348Response);
  rpc List348(List348Request) returns (List348Response);
  rpc Create348(Create348Request) returns (Create348Response);
}

message Get348Request {
  string id = 1;
}

message Get348Response {
  Message348 result = 1;
}

message List348Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List348Response {
  repeated Message348 results = 1;
  string next_page_token = 2;
}

message Create348Request {
  Message348 message = 1;
}

message Create348Response {
  Message348 result = 1;
}
