syntax = "proto3";

package benchmark.pkg522;

// Message with various field types
message Message522 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage522 nested = 7;
  Status522 status = 8;
}

// Nested message type
message NestedMessage522 {
  string name = 1;
  int32 value = 2;
  repeated Item522 items = 3;
}

// Simple item message
message Item522 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status522 {
  STATUS_522_UNSPECIFIED = 0;
  STATUS_522_ACTIVE = 1;
  STATUS_522_INACTIVE = 2;
  STATUS_522_PENDING = 3;
}

// Service definition
service Service522 {
  rpc Get522(Get522Request) returns (Get522Response);
  rpc List522(List522Request) returns (List522Response);
  rpc Create522(Create522Request) returns (Create522Response);
}

message Get522Request {
  string id = 1;
}

message Get522Response {
  Message522 result = 1;
}

message List522Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List522Response {
  repeated Message522 results = 1;
  string next_page_token = 2;
}

message Create522Request {
  Message522 message = 1;
}

message Create522Response {
  Message522 result = 1;
}
