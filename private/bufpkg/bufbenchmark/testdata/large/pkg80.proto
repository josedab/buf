syntax = "proto3";

package benchmark.pkg80;

// Message with various field types
message Message80 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage80 nested = 7;
  Status80 status = 8;
}

// Nested message type
message NestedMessage80 {
  string name = 1;
  int32 value = 2;
  repeated Item80 items = 3;
}

// Simple item message
message Item80 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status80 {
  STATUS_80_UNSPECIFIED = 0;
  STATUS_80_ACTIVE = 1;
  STATUS_80_INACTIVE = 2;
  STATUS_80_PENDING = 3;
}

// Service definition
service Service80 {
  rpc Get80(Get80Request) returns (Get80Response);
  rpc List80(List80Request) returns (List80Response);
  rpc Create80(Create80Request) returns (Create80Response);
}

message Get80Request {
  string id = 1;
}

message Get80Response {
  Message80 result = 1;
}

message List80Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List80Response {
  repeated Message80 results = 1;
  string next_page_token = 2;
}

message Create80Request {
  Message80 message = 1;
}

message Create80Response {
  Message80 result = 1;
}
