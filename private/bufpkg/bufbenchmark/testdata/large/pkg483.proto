syntax = "proto3";

package benchmark.pkg483;

// Message with various field types
message Message483 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage483 nested = 7;
  Status483 status = 8;
}

// Nested message type
message NestedMessage483 {
  string name = 1;
  int32 value = 2;
  repeated Item483 items = 3;
}

// Simple item message
message Item483 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status483 {
  STATUS_483_UNSPECIFIED = 0;
  STATUS_483_ACTIVE = 1;
  STATUS_483_INACTIVE = 2;
  STATUS_483_PENDING = 3;
}

// Service definition
service Service483 {
  rpc Get483(Get483Request) returns (Get483Response);
  rpc List483(List483Request) returns (List483Response);
  rpc Create483(Create483Request) returns (Create483Response);
}

message Get483Request {
  string id = 1;
}

message Get483Response {
  Message483 result = 1;
}

message List483Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List483Response {
  repeated Message483 results = 1;
  string next_page_token = 2;
}

message Create483Request {
  Message483 message = 1;
}

message Create483Response {
  Message483 result = 1;
}
