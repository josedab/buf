syntax = "proto3";

package benchmark.pkg152;

// Message with various field types
message Message152 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage152 nested = 7;
  Status152 status = 8;
}

// Nested message type
message NestedMessage152 {
  string name = 1;
  int32 value = 2;
  repeated Item152 items = 3;
}

// Simple item message
message Item152 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status152 {
  STATUS_152_UNSPECIFIED = 0;
  STATUS_152_ACTIVE = 1;
  STATUS_152_INACTIVE = 2;
  STATUS_152_PENDING = 3;
}

// Service definition
service Service152 {
  rpc Get152(Get152Request) returns (Get152Response);
  rpc List152(List152Request) returns (List152Response);
  rpc Create152(Create152Request) returns (Create152Response);
}

message Get152Request {
  string id = 1;
}

message Get152Response {
  Message152 result = 1;
}

message List152Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List152Response {
  repeated Message152 results = 1;
  string next_page_token = 2;
}

message Create152Request {
  Message152 message = 1;
}

message Create152Response {
  Message152 result = 1;
}
