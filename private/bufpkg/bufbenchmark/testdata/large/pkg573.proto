syntax = "proto3";

package benchmark.pkg573;

// Message with various field types
message Message573 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage573 nested = 7;
  Status573 status = 8;
}

// Nested message type
message NestedMessage573 {
  string name = 1;
  int32 value = 2;
  repeated Item573 items = 3;
}

// Simple item message
message Item573 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status573 {
  STATUS_573_UNSPECIFIED = 0;
  STATUS_573_ACTIVE = 1;
  STATUS_573_INACTIVE = 2;
  STATUS_573_PENDING = 3;
}

// Service definition
service Service573 {
  rpc Get573(Get573Request) returns (Get573Response);
  rpc List573(List573Request) returns (List573Response);
  rpc Create573(Create573Request) returns (Create573Response);
}

message Get573Request {
  string id = 1;
}

message Get573Response {
  Message573 result = 1;
}

message List573Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List573Response {
  repeated Message573 results = 1;
  string next_page_token = 2;
}

message Create573Request {
  Message573 message = 1;
}

message Create573Response {
  Message573 result = 1;
}
