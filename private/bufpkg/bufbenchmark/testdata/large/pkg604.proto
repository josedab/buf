syntax = "proto3";

package benchmark.pkg604;

// Message with various field types
message Message604 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage604 nested = 7;
  Status604 status = 8;
}

// Nested message type
message NestedMessage604 {
  string name = 1;
  int32 value = 2;
  repeated Item604 items = 3;
}

// Simple item message
message Item604 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status604 {
  STATUS_604_UNSPECIFIED = 0;
  STATUS_604_ACTIVE = 1;
  STATUS_604_INACTIVE = 2;
  STATUS_604_PENDING = 3;
}

// Service definition
service Service604 {
  rpc Get604(Get604Request) returns (Get604Response);
  rpc List604(List604Request) returns (List604Response);
  rpc Create604(Create604Request) returns (Create604Response);
}

message Get604Request {
  string id = 1;
}

message Get604Response {
  Message604 result = 1;
}

message List604Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List604Response {
  repeated Message604 results = 1;
  string next_page_token = 2;
}

message Create604Request {
  Message604 message = 1;
}

message Create604Response {
  Message604 result = 1;
}
