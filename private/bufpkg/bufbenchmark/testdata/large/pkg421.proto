syntax = "proto3";

package benchmark.pkg421;

// Message with various field types
message Message421 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage421 nested = 7;
  Status421 status = 8;
}

// Nested message type
message NestedMessage421 {
  string name = 1;
  int32 value = 2;
  repeated Item421 items = 3;
}

// Simple item message
message Item421 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status421 {
  STATUS_421_UNSPECIFIED = 0;
  STATUS_421_ACTIVE = 1;
  STATUS_421_INACTIVE = 2;
  STATUS_421_PENDING = 3;
}

// Service definition
service Service421 {
  rpc Get421(Get421Request) returns (Get421Response);
  rpc List421(List421Request) returns (List421Response);
  rpc Create421(Create421Request) returns (Create421Response);
}

message Get421Request {
  string id = 1;
}

message Get421Response {
  Message421 result = 1;
}

message List421Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List421Response {
  repeated Message421 results = 1;
  string next_page_token = 2;
}

message Create421Request {
  Message421 message = 1;
}

message Create421Response {
  Message421 result = 1;
}
