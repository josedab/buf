syntax = "proto3";

package benchmark.pkg883;

// Message with various field types
message Message883 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage883 nested = 7;
  Status883 status = 8;
}

// Nested message type
message NestedMessage883 {
  string name = 1;
  int32 value = 2;
  repeated Item883 items = 3;
}

// Simple item message
message Item883 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status883 {
  STATUS_883_UNSPECIFIED = 0;
  STATUS_883_ACTIVE = 1;
  STATUS_883_INACTIVE = 2;
  STATUS_883_PENDING = 3;
}

// Service definition
service Service883 {
  rpc Get883(Get883Request) returns (Get883Response);
  rpc List883(List883Request) returns (List883Response);
  rpc Create883(Create883Request) returns (Create883Response);
}

message Get883Request {
  string id = 1;
}

message Get883Response {
  Message883 result = 1;
}

message List883Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List883Response {
  repeated Message883 results = 1;
  string next_page_token = 2;
}

message Create883Request {
  Message883 message = 1;
}

message Create883Response {
  Message883 result = 1;
}
