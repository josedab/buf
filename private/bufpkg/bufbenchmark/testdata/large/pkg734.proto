syntax = "proto3";

package benchmark.pkg734;

// Message with various field types
message Message734 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage734 nested = 7;
  Status734 status = 8;
}

// Nested message type
message NestedMessage734 {
  string name = 1;
  int32 value = 2;
  repeated Item734 items = 3;
}

// Simple item message
message Item734 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status734 {
  STATUS_734_UNSPECIFIED = 0;
  STATUS_734_ACTIVE = 1;
  STATUS_734_INACTIVE = 2;
  STATUS_734_PENDING = 3;
}

// Service definition
service Service734 {
  rpc Get734(Get734Request) returns (Get734Response);
  rpc List734(List734Request) returns (List734Response);
  rpc Create734(Create734Request) returns (Create734Response);
}

message Get734Request {
  string id = 1;
}

message Get734Response {
  Message734 result = 1;
}

message List734Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List734Response {
  repeated Message734 results = 1;
  string next_page_token = 2;
}

message Create734Request {
  Message734 message = 1;
}

message Create734Response {
  Message734 result = 1;
}
