syntax = "proto3";

package benchmark.pkg122;

// Message with various field types
message Message122 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage122 nested = 7;
  Status122 status = 8;
}

// Nested message type
message NestedMessage122 {
  string name = 1;
  int32 value = 2;
  repeated Item122 items = 3;
}

// Simple item message
message Item122 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status122 {
  STATUS_122_UNSPECIFIED = 0;
  STATUS_122_ACTIVE = 1;
  STATUS_122_INACTIVE = 2;
  STATUS_122_PENDING = 3;
}

// Service definition
service Service122 {
  rpc Get122(Get122Request) returns (Get122Response);
  rpc List122(List122Request) returns (List122Response);
  rpc Create122(Create122Request) returns (Create122Response);
}

message Get122Request {
  string id = 1;
}

message Get122Response {
  Message122 result = 1;
}

message List122Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List122Response {
  repeated Message122 results = 1;
  string next_page_token = 2;
}

message Create122Request {
  Message122 message = 1;
}

message Create122Response {
  Message122 result = 1;
}
