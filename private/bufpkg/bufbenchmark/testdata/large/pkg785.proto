syntax = "proto3";

package benchmark.pkg785;

// Message with various field types
message Message785 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage785 nested = 7;
  Status785 status = 8;
}

// Nested message type
message NestedMessage785 {
  string name = 1;
  int32 value = 2;
  repeated Item785 items = 3;
}

// Simple item message
message Item785 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status785 {
  STATUS_785_UNSPECIFIED = 0;
  STATUS_785_ACTIVE = 1;
  STATUS_785_INACTIVE = 2;
  STATUS_785_PENDING = 3;
}

// Service definition
service Service785 {
  rpc Get785(Get785Request) returns (Get785Response);
  rpc List785(List785Request) returns (List785Response);
  rpc Create785(Create785Request) returns (Create785Response);
}

message Get785Request {
  string id = 1;
}

message Get785Response {
  Message785 result = 1;
}

message List785Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List785Response {
  repeated Message785 results = 1;
  string next_page_token = 2;
}

message Create785Request {
  Message785 message = 1;
}

message Create785Response {
  Message785 result = 1;
}
