syntax = "proto3";

package benchmark.pkg752;

// Message with various field types
message Message752 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage752 nested = 7;
  Status752 status = 8;
}

// Nested message type
message NestedMessage752 {
  string name = 1;
  int32 value = 2;
  repeated Item752 items = 3;
}

// Simple item message
message Item752 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status752 {
  STATUS_752_UNSPECIFIED = 0;
  STATUS_752_ACTIVE = 1;
  STATUS_752_INACTIVE = 2;
  STATUS_752_PENDING = 3;
}

// Service definition
service Service752 {
  rpc Get752(Get752Request) returns (Get752Response);
  rpc List752(List752Request) returns (List752Response);
  rpc Create752(Create752Request) returns (Create752Response);
}

message Get752Request {
  string id = 1;
}

message Get752Response {
  Message752 result = 1;
}

message List752Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List752Response {
  repeated Message752 results = 1;
  string next_page_token = 2;
}

message Create752Request {
  Message752 message = 1;
}

message Create752Response {
  Message752 result = 1;
}
