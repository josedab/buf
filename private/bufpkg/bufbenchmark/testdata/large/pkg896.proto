syntax = "proto3";

package benchmark.pkg896;

// Message with various field types
message Message896 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage896 nested = 7;
  Status896 status = 8;
}

// Nested message type
message NestedMessage896 {
  string name = 1;
  int32 value = 2;
  repeated Item896 items = 3;
}

// Simple item message
message Item896 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status896 {
  STATUS_896_UNSPECIFIED = 0;
  STATUS_896_ACTIVE = 1;
  STATUS_896_INACTIVE = 2;
  STATUS_896_PENDING = 3;
}

// Service definition
service Service896 {
  rpc Get896(Get896Request) returns (Get896Response);
  rpc List896(List896Request) returns (List896Response);
  rpc Create896(Create896Request) returns (Create896Response);
}

message Get896Request {
  string id = 1;
}

message Get896Response {
  Message896 result = 1;
}

message List896Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List896Response {
  repeated Message896 results = 1;
  string next_page_token = 2;
}

message Create896Request {
  Message896 message = 1;
}

message Create896Response {
  Message896 result = 1;
}
