syntax = "proto3";

package benchmark.pkg842;

// Message with various field types
message Message842 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage842 nested = 7;
  Status842 status = 8;
}

// Nested message type
message NestedMessage842 {
  string name = 1;
  int32 value = 2;
  repeated Item842 items = 3;
}

// Simple item message
message Item842 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status842 {
  STATUS_842_UNSPECIFIED = 0;
  STATUS_842_ACTIVE = 1;
  STATUS_842_INACTIVE = 2;
  STATUS_842_PENDING = 3;
}

// Service definition
service Service842 {
  rpc Get842(Get842Request) returns (Get842Response);
  rpc List842(List842Request) returns (List842Response);
  rpc Create842(Create842Request) returns (Create842Response);
}

message Get842Request {
  string id = 1;
}

message Get842Response {
  Message842 result = 1;
}

message List842Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List842Response {
  repeated Message842 results = 1;
  string next_page_token = 2;
}

message Create842Request {
  Message842 message = 1;
}

message Create842Response {
  Message842 result = 1;
}
