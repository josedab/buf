syntax = "proto3";

package benchmark.pkg194;

// Message with various field types
message Message194 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage194 nested = 7;
  Status194 status = 8;
}

// Nested message type
message NestedMessage194 {
  string name = 1;
  int32 value = 2;
  repeated Item194 items = 3;
}

// Simple item message
message Item194 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status194 {
  STATUS_194_UNSPECIFIED = 0;
  STATUS_194_ACTIVE = 1;
  STATUS_194_INACTIVE = 2;
  STATUS_194_PENDING = 3;
}

// Service definition
service Service194 {
  rpc Get194(Get194Request) returns (Get194Response);
  rpc List194(List194Request) returns (List194Response);
  rpc Create194(Create194Request) returns (Create194Response);
}

message Get194Request {
  string id = 1;
}

message Get194Response {
  Message194 result = 1;
}

message List194Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List194Response {
  repeated Message194 results = 1;
  string next_page_token = 2;
}

message Create194Request {
  Message194 message = 1;
}

message Create194Response {
  Message194 result = 1;
}
