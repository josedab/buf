syntax = "proto3";

package benchmark.pkg363;

// Message with various field types
message Message363 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage363 nested = 7;
  Status363 status = 8;
}

// Nested message type
message NestedMessage363 {
  string name = 1;
  int32 value = 2;
  repeated Item363 items = 3;
}

// Simple item message
message Item363 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status363 {
  STATUS_363_UNSPECIFIED = 0;
  STATUS_363_ACTIVE = 1;
  STATUS_363_INACTIVE = 2;
  STATUS_363_PENDING = 3;
}

// Service definition
service Service363 {
  rpc Get363(Get363Request) returns (Get363Response);
  rpc List363(List363Request) returns (List363Response);
  rpc Create363(Create363Request) returns (Create363Response);
}

message Get363Request {
  string id = 1;
}

message Get363Response {
  Message363 result = 1;
}

message List363Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List363Response {
  repeated Message363 results = 1;
  string next_page_token = 2;
}

message Create363Request {
  Message363 message = 1;
}

message Create363Response {
  Message363 result = 1;
}
