syntax = "proto3";

package benchmark.pkg551;

// Message with various field types
message Message551 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage551 nested = 7;
  Status551 status = 8;
}

// Nested message type
message NestedMessage551 {
  string name = 1;
  int32 value = 2;
  repeated Item551 items = 3;
}

// Simple item message
message Item551 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status551 {
  STATUS_551_UNSPECIFIED = 0;
  STATUS_551_ACTIVE = 1;
  STATUS_551_INACTIVE = 2;
  STATUS_551_PENDING = 3;
}

// Service definition
service Service551 {
  rpc Get551(Get551Request) returns (Get551Response);
  rpc List551(List551Request) returns (List551Response);
  rpc Create551(Create551Request) returns (Create551Response);
}

message Get551Request {
  string id = 1;
}

message Get551Response {
  Message551 result = 1;
}

message List551Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List551Response {
  repeated Message551 results = 1;
  string next_page_token = 2;
}

message Create551Request {
  Message551 message = 1;
}

message Create551Response {
  Message551 result = 1;
}
