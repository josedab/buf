syntax = "proto3";

package benchmark.pkg37;

// Message with various field types
message Message37 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage37 nested = 7;
  Status37 status = 8;
}

// Nested message type
message NestedMessage37 {
  string name = 1;
  int32 value = 2;
  repeated Item37 items = 3;
}

// Simple item message
message Item37 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status37 {
  STATUS_37_UNSPECIFIED = 0;
  STATUS_37_ACTIVE = 1;
  STATUS_37_INACTIVE = 2;
  STATUS_37_PENDING = 3;
}

// Service definition
service Service37 {
  rpc Get37(Get37Request) returns (Get37Response);
  rpc List37(List37Request) returns (List37Response);
  rpc Create37(Create37Request) returns (Create37Response);
}

message Get37Request {
  string id = 1;
}

message Get37Response {
  Message37 result = 1;
}

message List37Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List37Response {
  repeated Message37 results = 1;
  string next_page_token = 2;
}

message Create37Request {
  Message37 message = 1;
}

message Create37Response {
  Message37 result = 1;
}
