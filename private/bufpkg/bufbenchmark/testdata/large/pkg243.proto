syntax = "proto3";

package benchmark.pkg243;

// Message with various field types
message Message243 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage243 nested = 7;
  Status243 status = 8;
}

// Nested message type
message NestedMessage243 {
  string name = 1;
  int32 value = 2;
  repeated Item243 items = 3;
}

// Simple item message
message Item243 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status243 {
  STATUS_243_UNSPECIFIED = 0;
  STATUS_243_ACTIVE = 1;
  STATUS_243_INACTIVE = 2;
  STATUS_243_PENDING = 3;
}

// Service definition
service Service243 {
  rpc Get243(Get243Request) returns (Get243Response);
  rpc List243(List243Request) returns (List243Response);
  rpc Create243(Create243Request) returns (Create243Response);
}

message Get243Request {
  string id = 1;
}

message Get243Response {
  Message243 result = 1;
}

message List243Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List243Response {
  repeated Message243 results = 1;
  string next_page_token = 2;
}

message Create243Request {
  Message243 message = 1;
}

message Create243Response {
  Message243 result = 1;
}
