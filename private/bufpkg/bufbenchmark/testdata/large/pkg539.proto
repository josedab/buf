syntax = "proto3";

package benchmark.pkg539;

// Message with various field types
message Message539 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage539 nested = 7;
  Status539 status = 8;
}

// Nested message type
message NestedMessage539 {
  string name = 1;
  int32 value = 2;
  repeated Item539 items = 3;
}

// Simple item message
message Item539 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status539 {
  STATUS_539_UNSPECIFIED = 0;
  STATUS_539_ACTIVE = 1;
  STATUS_539_INACTIVE = 2;
  STATUS_539_PENDING = 3;
}

// Service definition
service Service539 {
  rpc Get539(Get539Request) returns (Get539Response);
  rpc List539(List539Request) returns (List539Response);
  rpc Create539(Create539Request) returns (Create539Response);
}

message Get539Request {
  string id = 1;
}

message Get539Response {
  Message539 result = 1;
}

message List539Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List539Response {
  repeated Message539 results = 1;
  string next_page_token = 2;
}

message Create539Request {
  Message539 message = 1;
}

message Create539Response {
  Message539 result = 1;
}
