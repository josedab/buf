syntax = "proto3";

package benchmark.pkg307;

// Message with various field types
message Message307 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage307 nested = 7;
  Status307 status = 8;
}

// Nested message type
message NestedMessage307 {
  string name = 1;
  int32 value = 2;
  repeated Item307 items = 3;
}

// Simple item message
message Item307 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status307 {
  STATUS_307_UNSPECIFIED = 0;
  STATUS_307_ACTIVE = 1;
  STATUS_307_INACTIVE = 2;
  STATUS_307_PENDING = 3;
}

// Service definition
service Service307 {
  rpc Get307(Get307Request) returns (Get307Response);
  rpc List307(List307Request) returns (List307Response);
  rpc Create307(Create307Request) returns (Create307Response);
}

message Get307Request {
  string id = 1;
}

message Get307Response {
  Message307 result = 1;
}

message List307Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List307Response {
  repeated Message307 results = 1;
  string next_page_token = 2;
}

message Create307Request {
  Message307 message = 1;
}

message Create307Response {
  Message307 result = 1;
}
