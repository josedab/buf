syntax = "proto3";

package benchmark.pkg692;

// Message with various field types
message Message692 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage692 nested = 7;
  Status692 status = 8;
}

// Nested message type
message NestedMessage692 {
  string name = 1;
  int32 value = 2;
  repeated Item692 items = 3;
}

// Simple item message
message Item692 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status692 {
  STATUS_692_UNSPECIFIED = 0;
  STATUS_692_ACTIVE = 1;
  STATUS_692_INACTIVE = 2;
  STATUS_692_PENDING = 3;
}

// Service definition
service Service692 {
  rpc Get692(Get692Request) returns (Get692Response);
  rpc List692(List692Request) returns (List692Response);
  rpc Create692(Create692Request) returns (Create692Response);
}

message Get692Request {
  string id = 1;
}

message Get692Response {
  Message692 result = 1;
}

message List692Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List692Response {
  repeated Message692 results = 1;
  string next_page_token = 2;
}

message Create692Request {
  Message692 message = 1;
}

message Create692Response {
  Message692 result = 1;
}
