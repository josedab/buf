syntax = "proto3";

package benchmark.pkg864;

// Message with various field types
message Message864 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage864 nested = 7;
  Status864 status = 8;
}

// Nested message type
message NestedMessage864 {
  string name = 1;
  int32 value = 2;
  repeated Item864 items = 3;
}

// Simple item message
message Item864 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status864 {
  STATUS_864_UNSPECIFIED = 0;
  STATUS_864_ACTIVE = 1;
  STATUS_864_INACTIVE = 2;
  STATUS_864_PENDING = 3;
}

// Service definition
service Service864 {
  rpc Get864(Get864Request) returns (Get864Response);
  rpc List864(List864Request) returns (List864Response);
  rpc Create864(Create864Request) returns (Create864Response);
}

message Get864Request {
  string id = 1;
}

message Get864Response {
  Message864 result = 1;
}

message List864Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List864Response {
  repeated Message864 results = 1;
  string next_page_token = 2;
}

message Create864Request {
  Message864 message = 1;
}

message Create864Response {
  Message864 result = 1;
}
