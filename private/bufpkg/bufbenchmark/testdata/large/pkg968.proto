syntax = "proto3";

package benchmark.pkg968;

// Message with various field types
message Message968 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage968 nested = 7;
  Status968 status = 8;
}

// Nested message type
message NestedMessage968 {
  string name = 1;
  int32 value = 2;
  repeated Item968 items = 3;
}

// Simple item message
message Item968 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status968 {
  STATUS_968_UNSPECIFIED = 0;
  STATUS_968_ACTIVE = 1;
  STATUS_968_INACTIVE = 2;
  STATUS_968_PENDING = 3;
}

// Service definition
service Service968 {
  rpc Get968(Get968Request) returns (Get968Response);
  rpc List968(List968Request) returns (List968Response);
  rpc Create968(Create968Request) returns (Create968Response);
}

message Get968Request {
  string id = 1;
}

message Get968Response {
  Message968 result = 1;
}

message List968Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List968Response {
  repeated Message968 results = 1;
  string next_page_token = 2;
}

message Create968Request {
  Message968 message = 1;
}

message Create968Response {
  Message968 result = 1;
}
