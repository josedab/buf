syntax = "proto3";

package benchmark.pkg856;

// Message with various field types
message Message856 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage856 nested = 7;
  Status856 status = 8;
}

// Nested message type
message NestedMessage856 {
  string name = 1;
  int32 value = 2;
  repeated Item856 items = 3;
}

// Simple item message
message Item856 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status856 {
  STATUS_856_UNSPECIFIED = 0;
  STATUS_856_ACTIVE = 1;
  STATUS_856_INACTIVE = 2;
  STATUS_856_PENDING = 3;
}

// Service definition
service Service856 {
  rpc Get856(Get856Request) returns (Get856Response);
  rpc List856(List856Request) returns (List856Response);
  rpc Create856(Create856Request) returns (Create856Response);
}

message Get856Request {
  string id = 1;
}

message Get856Response {
  Message856 result = 1;
}

message List856Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List856Response {
  repeated Message856 results = 1;
  string next_page_token = 2;
}

message Create856Request {
  Message856 message = 1;
}

message Create856Response {
  Message856 result = 1;
}
