syntax = "proto3";

package benchmark.pkg869;

// Message with various field types
message Message869 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage869 nested = 7;
  Status869 status = 8;
}

// Nested message type
message NestedMessage869 {
  string name = 1;
  int32 value = 2;
  repeated Item869 items = 3;
}

// Simple item message
message Item869 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status869 {
  STATUS_869_UNSPECIFIED = 0;
  STATUS_869_ACTIVE = 1;
  STATUS_869_INACTIVE = 2;
  STATUS_869_PENDING = 3;
}

// Service definition
service Service869 {
  rpc Get869(Get869Request) returns (Get869Response);
  rpc List869(List869Request) returns (List869Response);
  rpc Create869(Create869Request) returns (Create869Response);
}

message Get869Request {
  string id = 1;
}

message Get869Response {
  Message869 result = 1;
}

message List869Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List869Response {
  repeated Message869 results = 1;
  string next_page_token = 2;
}

message Create869Request {
  Message869 message = 1;
}

message Create869Response {
  Message869 result = 1;
}
