syntax = "proto3";

package benchmark.pkg865;

// Message with various field types
message Message865 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage865 nested = 7;
  Status865 status = 8;
}

// Nested message type
message NestedMessage865 {
  string name = 1;
  int32 value = 2;
  repeated Item865 items = 3;
}

// Simple item message
message Item865 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status865 {
  STATUS_865_UNSPECIFIED = 0;
  STATUS_865_ACTIVE = 1;
  STATUS_865_INACTIVE = 2;
  STATUS_865_PENDING = 3;
}

// Service definition
service Service865 {
  rpc Get865(Get865Request) returns (Get865Response);
  rpc List865(List865Request) returns (List865Response);
  rpc Create865(Create865Request) returns (Create865Response);
}

message Get865Request {
  string id = 1;
}

message Get865Response {
  Message865 result = 1;
}

message List865Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List865Response {
  repeated Message865 results = 1;
  string next_page_token = 2;
}

message Create865Request {
  Message865 message = 1;
}

message Create865Response {
  Message865 result = 1;
}
