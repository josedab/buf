syntax = "proto3";

package benchmark.pkg66;

// Message with various field types
message Message66 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage66 nested = 7;
  Status66 status = 8;
}

// Nested message type
message NestedMessage66 {
  string name = 1;
  int32 value = 2;
  repeated Item66 items = 3;
}

// Simple item message
message Item66 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status66 {
  STATUS_66_UNSPECIFIED = 0;
  STATUS_66_ACTIVE = 1;
  STATUS_66_INACTIVE = 2;
  STATUS_66_PENDING = 3;
}

// Service definition
service Service66 {
  rpc Get66(Get66Request) returns (Get66Response);
  rpc List66(List66Request) returns (List66Response);
  rpc Create66(Create66Request) returns (Create66Response);
}

message Get66Request {
  string id = 1;
}

message Get66Response {
  Message66 result = 1;
}

message List66Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List66Response {
  repeated Message66 results = 1;
  string next_page_token = 2;
}

message Create66Request {
  Message66 message = 1;
}

message Create66Response {
  Message66 result = 1;
}
