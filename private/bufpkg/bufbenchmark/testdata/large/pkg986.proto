syntax = "proto3";

package benchmark.pkg986;

// Message with various field types
message Message986 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage986 nested = 7;
  Status986 status = 8;
}

// Nested message type
message NestedMessage986 {
  string name = 1;
  int32 value = 2;
  repeated Item986 items = 3;
}

// Simple item message
message Item986 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status986 {
  STATUS_986_UNSPECIFIED = 0;
  STATUS_986_ACTIVE = 1;
  STATUS_986_INACTIVE = 2;
  STATUS_986_PENDING = 3;
}

// Service definition
service Service986 {
  rpc Get986(Get986Request) returns (Get986Response);
  rpc List986(List986Request) returns (List986Response);
  rpc Create986(Create986Request) returns (Create986Response);
}

message Get986Request {
  string id = 1;
}

message Get986Response {
  Message986 result = 1;
}

message List986Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List986Response {
  repeated Message986 results = 1;
  string next_page_token = 2;
}

message Create986Request {
  Message986 message = 1;
}

message Create986Response {
  Message986 result = 1;
}
