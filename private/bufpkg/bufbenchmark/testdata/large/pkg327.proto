syntax = "proto3";

package benchmark.pkg327;

// Message with various field types
message Message327 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage327 nested = 7;
  Status327 status = 8;
}

// Nested message type
message NestedMessage327 {
  string name = 1;
  int32 value = 2;
  repeated Item327 items = 3;
}

// Simple item message
message Item327 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status327 {
  STATUS_327_UNSPECIFIED = 0;
  STATUS_327_ACTIVE = 1;
  STATUS_327_INACTIVE = 2;
  STATUS_327_PENDING = 3;
}

// Service definition
service Service327 {
  rpc Get327(Get327Request) returns (Get327Response);
  rpc List327(List327Request) returns (List327Response);
  rpc Create327(Create327Request) returns (Create327Response);
}

message Get327Request {
  string id = 1;
}

message Get327Response {
  Message327 result = 1;
}

message List327Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List327Response {
  repeated Message327 results = 1;
  string next_page_token = 2;
}

message Create327Request {
  Message327 message = 1;
}

message Create327Response {
  Message327 result = 1;
}
