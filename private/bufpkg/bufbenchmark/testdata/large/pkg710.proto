syntax = "proto3";

package benchmark.pkg710;

// Message with various field types
message Message710 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage710 nested = 7;
  Status710 status = 8;
}

// Nested message type
message NestedMessage710 {
  string name = 1;
  int32 value = 2;
  repeated Item710 items = 3;
}

// Simple item message
message Item710 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status710 {
  STATUS_710_UNSPECIFIED = 0;
  STATUS_710_ACTIVE = 1;
  STATUS_710_INACTIVE = 2;
  STATUS_710_PENDING = 3;
}

// Service definition
service Service710 {
  rpc Get710(Get710Request) returns (Get710Response);
  rpc List710(List710Request) returns (List710Response);
  rpc Create710(Create710Request) returns (Create710Response);
}

message Get710Request {
  string id = 1;
}

message Get710Response {
  Message710 result = 1;
}

message List710Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List710Response {
  repeated Message710 results = 1;
  string next_page_token = 2;
}

message Create710Request {
  Message710 message = 1;
}

message Create710Response {
  Message710 result = 1;
}
