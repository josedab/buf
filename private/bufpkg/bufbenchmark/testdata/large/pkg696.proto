syntax = "proto3";

package benchmark.pkg696;

// Message with various field types
message Message696 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage696 nested = 7;
  Status696 status = 8;
}

// Nested message type
message NestedMessage696 {
  string name = 1;
  int32 value = 2;
  repeated Item696 items = 3;
}

// Simple item message
message Item696 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status696 {
  STATUS_696_UNSPECIFIED = 0;
  STATUS_696_ACTIVE = 1;
  STATUS_696_INACTIVE = 2;
  STATUS_696_PENDING = 3;
}

// Service definition
service Service696 {
  rpc Get696(Get696Request) returns (Get696Response);
  rpc List696(List696Request) returns (List696Response);
  rpc Create696(Create696Request) returns (Create696Response);
}

message Get696Request {
  string id = 1;
}

message Get696Response {
  Message696 result = 1;
}

message List696Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List696Response {
  repeated Message696 results = 1;
  string next_page_token = 2;
}

message Create696Request {
  Message696 message = 1;
}

message Create696Response {
  Message696 result = 1;
}
