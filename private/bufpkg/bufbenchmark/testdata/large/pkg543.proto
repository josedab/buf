syntax = "proto3";

package benchmark.pkg543;

// Message with various field types
message Message543 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage543 nested = 7;
  Status543 status = 8;
}

// Nested message type
message NestedMessage543 {
  string name = 1;
  int32 value = 2;
  repeated Item543 items = 3;
}

// Simple item message
message Item543 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status543 {
  STATUS_543_UNSPECIFIED = 0;
  STATUS_543_ACTIVE = 1;
  STATUS_543_INACTIVE = 2;
  STATUS_543_PENDING = 3;
}

// Service definition
service Service543 {
  rpc Get543(Get543Request) returns (Get543Response);
  rpc List543(List543Request) returns (List543Response);
  rpc Create543(Create543Request) returns (Create543Response);
}

message Get543Request {
  string id = 1;
}

message Get543Response {
  Message543 result = 1;
}

message List543Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List543Response {
  repeated Message543 results = 1;
  string next_page_token = 2;
}

message Create543Request {
  Message543 message = 1;
}

message Create543Response {
  Message543 result = 1;
}
