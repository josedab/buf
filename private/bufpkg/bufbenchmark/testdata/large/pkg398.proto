syntax = "proto3";

package benchmark.pkg398;

// Message with various field types
message Message398 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage398 nested = 7;
  Status398 status = 8;
}

// Nested message type
message NestedMessage398 {
  string name = 1;
  int32 value = 2;
  repeated Item398 items = 3;
}

// Simple item message
message Item398 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status398 {
  STATUS_398_UNSPECIFIED = 0;
  STATUS_398_ACTIVE = 1;
  STATUS_398_INACTIVE = 2;
  STATUS_398_PENDING = 3;
}

// Service definition
service Service398 {
  rpc Get398(Get398Request) returns (Get398Response);
  rpc List398(List398Request) returns (List398Response);
  rpc Create398(Create398Request) returns (Create398Response);
}

message Get398Request {
  string id = 1;
}

message Get398Response {
  Message398 result = 1;
}

message List398Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List398Response {
  repeated Message398 results = 1;
  string next_page_token = 2;
}

message Create398Request {
  Message398 message = 1;
}

message Create398Response {
  Message398 result = 1;
}
