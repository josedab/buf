syntax = "proto3";

package benchmark.pkg259;

// Message with various field types
message Message259 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage259 nested = 7;
  Status259 status = 8;
}

// Nested message type
message NestedMessage259 {
  string name = 1;
  int32 value = 2;
  repeated Item259 items = 3;
}

// Simple item message
message Item259 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status259 {
  STATUS_259_UNSPECIFIED = 0;
  STATUS_259_ACTIVE = 1;
  STATUS_259_INACTIVE = 2;
  STATUS_259_PENDING = 3;
}

// Service definition
service Service259 {
  rpc Get259(Get259Request) returns (Get259Response);
  rpc List259(List259Request) returns (List259Response);
  rpc Create259(Create259Request) returns (Create259Response);
}

message Get259Request {
  string id = 1;
}

message Get259Response {
  Message259 result = 1;
}

message List259Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List259Response {
  repeated Message259 results = 1;
  string next_page_token = 2;
}

message Create259Request {
  Message259 message = 1;
}

message Create259Response {
  Message259 result = 1;
}
