syntax = "proto3";

package benchmark.pkg325;

// Message with various field types
message Message325 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage325 nested = 7;
  Status325 status = 8;
}

// Nested message type
message NestedMessage325 {
  string name = 1;
  int32 value = 2;
  repeated Item325 items = 3;
}

// Simple item message
message Item325 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status325 {
  STATUS_325_UNSPECIFIED = 0;
  STATUS_325_ACTIVE = 1;
  STATUS_325_INACTIVE = 2;
  STATUS_325_PENDING = 3;
}

// Service definition
service Service325 {
  rpc Get325(Get325Request) returns (Get325Response);
  rpc List325(List325Request) returns (List325Response);
  rpc Create325(Create325Request) returns (Create325Response);
}

message Get325Request {
  string id = 1;
}

message Get325Response {
  Message325 result = 1;
}

message List325Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List325Response {
  repeated Message325 results = 1;
  string next_page_token = 2;
}

message Create325Request {
  Message325 message = 1;
}

message Create325Response {
  Message325 result = 1;
}
