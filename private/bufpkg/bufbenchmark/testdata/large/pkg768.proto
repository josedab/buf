syntax = "proto3";

package benchmark.pkg768;

// Message with various field types
message Message768 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage768 nested = 7;
  Status768 status = 8;
}

// Nested message type
message NestedMessage768 {
  string name = 1;
  int32 value = 2;
  repeated Item768 items = 3;
}

// Simple item message
message Item768 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status768 {
  STATUS_768_UNSPECIFIED = 0;
  STATUS_768_ACTIVE = 1;
  STATUS_768_INACTIVE = 2;
  STATUS_768_PENDING = 3;
}

// Service definition
service Service768 {
  rpc Get768(Get768Request) returns (Get768Response);
  rpc List768(List768Request) returns (List768Response);
  rpc Create768(Create768Request) returns (Create768Response);
}

message Get768Request {
  string id = 1;
}

message Get768Response {
  Message768 result = 1;
}

message List768Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List768Response {
  repeated Message768 results = 1;
  string next_page_token = 2;
}

message Create768Request {
  Message768 message = 1;
}

message Create768Response {
  Message768 result = 1;
}
