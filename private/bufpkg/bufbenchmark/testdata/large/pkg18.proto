syntax = "proto3";

package benchmark.pkg18;

// Message with various field types
message Message18 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage18 nested = 7;
  Status18 status = 8;
}

// Nested message type
message NestedMessage18 {
  string name = 1;
  int32 value = 2;
  repeated Item18 items = 3;
}

// Simple item message
message Item18 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status18 {
  STATUS_18_UNSPECIFIED = 0;
  STATUS_18_ACTIVE = 1;
  STATUS_18_INACTIVE = 2;
  STATUS_18_PENDING = 3;
}

// Service definition
service Service18 {
  rpc Get18(Get18Request) returns (Get18Response);
  rpc List18(List18Request) returns (List18Response);
  rpc Create18(Create18Request) returns (Create18Response);
}

message Get18Request {
  string id = 1;
}

message Get18Response {
  Message18 result = 1;
}

message List18Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List18Response {
  repeated Message18 results = 1;
  string next_page_token = 2;
}

message Create18Request {
  Message18 message = 1;
}

message Create18Response {
  Message18 result = 1;
}
