syntax = "proto3";

package benchmark.pkg98;

// Message with various field types
message Message98 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage98 nested = 7;
  Status98 status = 8;
}

// Nested message type
message NestedMessage98 {
  string name = 1;
  int32 value = 2;
  repeated Item98 items = 3;
}

// Simple item message
message Item98 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status98 {
  STATUS_98_UNSPECIFIED = 0;
  STATUS_98_ACTIVE = 1;
  STATUS_98_INACTIVE = 2;
  STATUS_98_PENDING = 3;
}

// Service definition
service Service98 {
  rpc Get98(Get98Request) returns (Get98Response);
  rpc List98(List98Request) returns (List98Response);
  rpc Create98(Create98Request) returns (Create98Response);
}

message Get98Request {
  string id = 1;
}

message Get98Response {
  Message98 result = 1;
}

message List98Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List98Response {
  repeated Message98 results = 1;
  string next_page_token = 2;
}

message Create98Request {
  Message98 message = 1;
}

message Create98Response {
  Message98 result = 1;
}
