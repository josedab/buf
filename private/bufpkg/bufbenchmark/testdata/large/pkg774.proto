syntax = "proto3";

package benchmark.pkg774;

// Message with various field types
message Message774 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage774 nested = 7;
  Status774 status = 8;
}

// Nested message type
message NestedMessage774 {
  string name = 1;
  int32 value = 2;
  repeated Item774 items = 3;
}

// Simple item message
message Item774 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status774 {
  STATUS_774_UNSPECIFIED = 0;
  STATUS_774_ACTIVE = 1;
  STATUS_774_INACTIVE = 2;
  STATUS_774_PENDING = 3;
}

// Service definition
service Service774 {
  rpc Get774(Get774Request) returns (Get774Response);
  rpc List774(List774Request) returns (List774Response);
  rpc Create774(Create774Request) returns (Create774Response);
}

message Get774Request {
  string id = 1;
}

message Get774Response {
  Message774 result = 1;
}

message List774Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List774Response {
  repeated Message774 results = 1;
  string next_page_token = 2;
}

message Create774Request {
  Message774 message = 1;
}

message Create774Response {
  Message774 result = 1;
}
