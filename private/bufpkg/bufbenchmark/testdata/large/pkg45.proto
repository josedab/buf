syntax = "proto3";

package benchmark.pkg45;

// Message with various field types
message Message45 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage45 nested = 7;
  Status45 status = 8;
}

// Nested message type
message NestedMessage45 {
  string name = 1;
  int32 value = 2;
  repeated Item45 items = 3;
}

// Simple item message
message Item45 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status45 {
  STATUS_45_UNSPECIFIED = 0;
  STATUS_45_ACTIVE = 1;
  STATUS_45_INACTIVE = 2;
  STATUS_45_PENDING = 3;
}

// Service definition
service Service45 {
  rpc Get45(Get45Request) returns (Get45Response);
  rpc List45(List45Request) returns (List45Response);
  rpc Create45(Create45Request) returns (Create45Response);
}

message Get45Request {
  string id = 1;
}

message Get45Response {
  Message45 result = 1;
}

message List45Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List45Response {
  repeated Message45 results = 1;
  string next_page_token = 2;
}

message Create45Request {
  Message45 message = 1;
}

message Create45Response {
  Message45 result = 1;
}
