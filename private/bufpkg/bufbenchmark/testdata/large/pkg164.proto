syntax = "proto3";

package benchmark.pkg164;

// Message with various field types
message Message164 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage164 nested = 7;
  Status164 status = 8;
}

// Nested message type
message NestedMessage164 {
  string name = 1;
  int32 value = 2;
  repeated Item164 items = 3;
}

// Simple item message
message Item164 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status164 {
  STATUS_164_UNSPECIFIED = 0;
  STATUS_164_ACTIVE = 1;
  STATUS_164_INACTIVE = 2;
  STATUS_164_PENDING = 3;
}

// Service definition
service Service164 {
  rpc Get164(Get164Request) returns (Get164Response);
  rpc List164(List164Request) returns (List164Response);
  rpc Create164(Create164Request) returns (Create164Response);
}

message Get164Request {
  string id = 1;
}

message Get164Response {
  Message164 result = 1;
}

message List164Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List164Response {
  repeated Message164 results = 1;
  string next_page_token = 2;
}

message Create164Request {
  Message164 message = 1;
}

message Create164Response {
  Message164 result = 1;
}
