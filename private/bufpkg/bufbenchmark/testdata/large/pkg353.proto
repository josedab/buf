syntax = "proto3";

package benchmark.pkg353;

// Message with various field types
message Message353 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage353 nested = 7;
  Status353 status = 8;
}

// Nested message type
message NestedMessage353 {
  string name = 1;
  int32 value = 2;
  repeated Item353 items = 3;
}

// Simple item message
message Item353 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status353 {
  STATUS_353_UNSPECIFIED = 0;
  STATUS_353_ACTIVE = 1;
  STATUS_353_INACTIVE = 2;
  STATUS_353_PENDING = 3;
}

// Service definition
service Service353 {
  rpc Get353(Get353Request) returns (Get353Response);
  rpc List353(List353Request) returns (List353Response);
  rpc Create353(Create353Request) returns (Create353Response);
}

message Get353Request {
  string id = 1;
}

message Get353Response {
  Message353 result = 1;
}

message List353Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List353Response {
  repeated Message353 results = 1;
  string next_page_token = 2;
}

message Create353Request {
  Message353 message = 1;
}

message Create353Response {
  Message353 result = 1;
}
