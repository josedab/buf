syntax = "proto3";

package benchmark.pkg991;

// Message with various field types
message Message991 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage991 nested = 7;
  Status991 status = 8;
}

// Nested message type
message NestedMessage991 {
  string name = 1;
  int32 value = 2;
  repeated Item991 items = 3;
}

// Simple item message
message Item991 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status991 {
  STATUS_991_UNSPECIFIED = 0;
  STATUS_991_ACTIVE = 1;
  STATUS_991_INACTIVE = 2;
  STATUS_991_PENDING = 3;
}

// Service definition
service Service991 {
  rpc Get991(Get991Request) returns (Get991Response);
  rpc List991(List991Request) returns (List991Response);
  rpc Create991(Create991Request) returns (Create991Response);
}

message Get991Request {
  string id = 1;
}

message Get991Response {
  Message991 result = 1;
}

message List991Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List991Response {
  repeated Message991 results = 1;
  string next_page_token = 2;
}

message Create991Request {
  Message991 message = 1;
}

message Create991Response {
  Message991 result = 1;
}
