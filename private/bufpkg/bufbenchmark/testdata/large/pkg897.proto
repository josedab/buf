syntax = "proto3";

package benchmark.pkg897;

// Message with various field types
message Message897 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage897 nested = 7;
  Status897 status = 8;
}

// Nested message type
message NestedMessage897 {
  string name = 1;
  int32 value = 2;
  repeated Item897 items = 3;
}

// Simple item message
message Item897 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status897 {
  STATUS_897_UNSPECIFIED = 0;
  STATUS_897_ACTIVE = 1;
  STATUS_897_INACTIVE = 2;
  STATUS_897_PENDING = 3;
}

// Service definition
service Service897 {
  rpc Get897(Get897Request) returns (Get897Response);
  rpc List897(List897Request) returns (List897Response);
  rpc Create897(Create897Request) returns (Create897Response);
}

message Get897Request {
  string id = 1;
}

message Get897Response {
  Message897 result = 1;
}

message List897Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List897Response {
  repeated Message897 results = 1;
  string next_page_token = 2;
}

message Create897Request {
  Message897 message = 1;
}

message Create897Response {
  Message897 result = 1;
}
