syntax = "proto3";

package benchmark.pkg955;

// Message with various field types
message Message955 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage955 nested = 7;
  Status955 status = 8;
}

// Nested message type
message NestedMessage955 {
  string name = 1;
  int32 value = 2;
  repeated Item955 items = 3;
}

// Simple item message
message Item955 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status955 {
  STATUS_955_UNSPECIFIED = 0;
  STATUS_955_ACTIVE = 1;
  STATUS_955_INACTIVE = 2;
  STATUS_955_PENDING = 3;
}

// Service definition
service Service955 {
  rpc Get955(Get955Request) returns (Get955Response);
  rpc List955(List955Request) returns (List955Response);
  rpc Create955(Create955Request) returns (Create955Response);
}

message Get955Request {
  string id = 1;
}

message Get955Response {
  Message955 result = 1;
}

message List955Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List955Response {
  repeated Message955 results = 1;
  string next_page_token = 2;
}

message Create955Request {
  Message955 message = 1;
}

message Create955Response {
  Message955 result = 1;
}
