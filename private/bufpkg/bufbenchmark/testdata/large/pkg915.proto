syntax = "proto3";

package benchmark.pkg915;

// Message with various field types
message Message915 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage915 nested = 7;
  Status915 status = 8;
}

// Nested message type
message NestedMessage915 {
  string name = 1;
  int32 value = 2;
  repeated Item915 items = 3;
}

// Simple item message
message Item915 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status915 {
  STATUS_915_UNSPECIFIED = 0;
  STATUS_915_ACTIVE = 1;
  STATUS_915_INACTIVE = 2;
  STATUS_915_PENDING = 3;
}

// Service definition
service Service915 {
  rpc Get915(Get915Request) returns (Get915Response);
  rpc List915(List915Request) returns (List915Response);
  rpc Create915(Create915Request) returns (Create915Response);
}

message Get915Request {
  string id = 1;
}

message Get915Response {
  Message915 result = 1;
}

message List915Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List915Response {
  repeated Message915 results = 1;
  string next_page_token = 2;
}

message Create915Request {
  Message915 message = 1;
}

message Create915Response {
  Message915 result = 1;
}
