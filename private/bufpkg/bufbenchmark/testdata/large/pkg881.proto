syntax = "proto3";

package benchmark.pkg881;

// Message with various field types
message Message881 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage881 nested = 7;
  Status881 status = 8;
}

// Nested message type
message NestedMessage881 {
  string name = 1;
  int32 value = 2;
  repeated Item881 items = 3;
}

// Simple item message
message Item881 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status881 {
  STATUS_881_UNSPECIFIED = 0;
  STATUS_881_ACTIVE = 1;
  STATUS_881_INACTIVE = 2;
  STATUS_881_PENDING = 3;
}

// Service definition
service Service881 {
  rpc Get881(Get881Request) returns (Get881Response);
  rpc List881(List881Request) returns (List881Response);
  rpc Create881(Create881Request) returns (Create881Response);
}

message Get881Request {
  string id = 1;
}

message Get881Response {
  Message881 result = 1;
}

message List881Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List881Response {
  repeated Message881 results = 1;
  string next_page_token = 2;
}

message Create881Request {
  Message881 message = 1;
}

message Create881Response {
  Message881 result = 1;
}
