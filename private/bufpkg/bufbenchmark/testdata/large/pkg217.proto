syntax = "proto3";

package benchmark.pkg217;

// Message with various field types
message Message217 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage217 nested = 7;
  Status217 status = 8;
}

// Nested message type
message NestedMessage217 {
  string name = 1;
  int32 value = 2;
  repeated Item217 items = 3;
}

// Simple item message
message Item217 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status217 {
  STATUS_217_UNSPECIFIED = 0;
  STATUS_217_ACTIVE = 1;
  STATUS_217_INACTIVE = 2;
  STATUS_217_PENDING = 3;
}

// Service definition
service Service217 {
  rpc Get217(Get217Request) returns (Get217Response);
  rpc List217(List217Request) returns (List217Response);
  rpc Create217(Create217Request) returns (Create217Response);
}

message Get217Request {
  string id = 1;
}

message Get217Response {
  Message217 result = 1;
}

message List217Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List217Response {
  repeated Message217 results = 1;
  string next_page_token = 2;
}

message Create217Request {
  Message217 message = 1;
}

message Create217Response {
  Message217 result = 1;
}
