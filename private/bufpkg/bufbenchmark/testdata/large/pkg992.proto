syntax = "proto3";

package benchmark.pkg992;

// Message with various field types
message Message992 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage992 nested = 7;
  Status992 status = 8;
}

// Nested message type
message NestedMessage992 {
  string name = 1;
  int32 value = 2;
  repeated Item992 items = 3;
}

// Simple item message
message Item992 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status992 {
  STATUS_992_UNSPECIFIED = 0;
  STATUS_992_ACTIVE = 1;
  STATUS_992_INACTIVE = 2;
  STATUS_992_PENDING = 3;
}

// Service definition
service Service992 {
  rpc Get992(Get992Request) returns (Get992Response);
  rpc List992(List992Request) returns (List992Response);
  rpc Create992(Create992Request) returns (Create992Response);
}

message Get992Request {
  string id = 1;
}

message Get992Response {
  Message992 result = 1;
}

message List992Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List992Response {
  repeated Message992 results = 1;
  string next_page_token = 2;
}

message Create992Request {
  Message992 message = 1;
}

message Create992Response {
  Message992 result = 1;
}
