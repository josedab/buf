syntax = "proto3";

package benchmark.pkg859;

// Message with various field types
message Message859 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage859 nested = 7;
  Status859 status = 8;
}

// Nested message type
message NestedMessage859 {
  string name = 1;
  int32 value = 2;
  repeated Item859 items = 3;
}

// Simple item message
message Item859 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status859 {
  STATUS_859_UNSPECIFIED = 0;
  STATUS_859_ACTIVE = 1;
  STATUS_859_INACTIVE = 2;
  STATUS_859_PENDING = 3;
}

// Service definition
service Service859 {
  rpc Get859(Get859Request) returns (Get859Response);
  rpc List859(List859Request) returns (List859Response);
  rpc Create859(Create859Request) returns (Create859Response);
}

message Get859Request {
  string id = 1;
}

message Get859Response {
  Message859 result = 1;
}

message List859Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List859Response {
  repeated Message859 results = 1;
  string next_page_token = 2;
}

message Create859Request {
  Message859 message = 1;
}

message Create859Response {
  Message859 result = 1;
}
