syntax = "proto3";

package benchmark.pkg497;

// Message with various field types
message Message497 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage497 nested = 7;
  Status497 status = 8;
}

// Nested message type
message NestedMessage497 {
  string name = 1;
  int32 value = 2;
  repeated Item497 items = 3;
}

// Simple item message
message Item497 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status497 {
  STATUS_497_UNSPECIFIED = 0;
  STATUS_497_ACTIVE = 1;
  STATUS_497_INACTIVE = 2;
  STATUS_497_PENDING = 3;
}

// Service definition
service Service497 {
  rpc Get497(Get497Request) returns (Get497Response);
  rpc List497(List497Request) returns (List497Response);
  rpc Create497(Create497Request) returns (Create497Response);
}

message Get497Request {
  string id = 1;
}

message Get497Response {
  Message497 result = 1;
}

message List497Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List497Response {
  repeated Message497 results = 1;
  string next_page_token = 2;
}

message Create497Request {
  Message497 message = 1;
}

message Create497Response {
  Message497 result = 1;
}
