syntax = "proto3";

package benchmark.pkg871;

// Message with various field types
message Message871 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage871 nested = 7;
  Status871 status = 8;
}

// Nested message type
message NestedMessage871 {
  string name = 1;
  int32 value = 2;
  repeated Item871 items = 3;
}

// Simple item message
message Item871 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status871 {
  STATUS_871_UNSPECIFIED = 0;
  STATUS_871_ACTIVE = 1;
  STATUS_871_INACTIVE = 2;
  STATUS_871_PENDING = 3;
}

// Service definition
service Service871 {
  rpc Get871(Get871Request) returns (Get871Response);
  rpc List871(List871Request) returns (List871Response);
  rpc Create871(Create871Request) returns (Create871Response);
}

message Get871Request {
  string id = 1;
}

message Get871Response {
  Message871 result = 1;
}

message List871Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List871Response {
  repeated Message871 results = 1;
  string next_page_token = 2;
}

message Create871Request {
  Message871 message = 1;
}

message Create871Response {
  Message871 result = 1;
}
