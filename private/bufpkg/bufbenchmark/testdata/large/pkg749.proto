syntax = "proto3";

package benchmark.pkg749;

// Message with various field types
message Message749 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage749 nested = 7;
  Status749 status = 8;
}

// Nested message type
message NestedMessage749 {
  string name = 1;
  int32 value = 2;
  repeated Item749 items = 3;
}

// Simple item message
message Item749 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status749 {
  STATUS_749_UNSPECIFIED = 0;
  STATUS_749_ACTIVE = 1;
  STATUS_749_INACTIVE = 2;
  STATUS_749_PENDING = 3;
}

// Service definition
service Service749 {
  rpc Get749(Get749Request) returns (Get749Response);
  rpc List749(List749Request) returns (List749Response);
  rpc Create749(Create749Request) returns (Create749Response);
}

message Get749Request {
  string id = 1;
}

message Get749Response {
  Message749 result = 1;
}

message List749Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List749Response {
  repeated Message749 results = 1;
  string next_page_token = 2;
}

message Create749Request {
  Message749 message = 1;
}

message Create749Response {
  Message749 result = 1;
}
