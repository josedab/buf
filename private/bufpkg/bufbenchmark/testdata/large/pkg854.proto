syntax = "proto3";

package benchmark.pkg854;

// Message with various field types
message Message854 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage854 nested = 7;
  Status854 status = 8;
}

// Nested message type
message NestedMessage854 {
  string name = 1;
  int32 value = 2;
  repeated Item854 items = 3;
}

// Simple item message
message Item854 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status854 {
  STATUS_854_UNSPECIFIED = 0;
  STATUS_854_ACTIVE = 1;
  STATUS_854_INACTIVE = 2;
  STATUS_854_PENDING = 3;
}

// Service definition
service Service854 {
  rpc Get854(Get854Request) returns (Get854Response);
  rpc List854(List854Request) returns (List854Response);
  rpc Create854(Create854Request) returns (Create854Response);
}

message Get854Request {
  string id = 1;
}

message Get854Response {
  Message854 result = 1;
}

message List854Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List854Response {
  repeated Message854 results = 1;
  string next_page_token = 2;
}

message Create854Request {
  Message854 message = 1;
}

message Create854Response {
  Message854 result = 1;
}
