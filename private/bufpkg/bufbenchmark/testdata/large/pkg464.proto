syntax = "proto3";

package benchmark.pkg464;

// Message with various field types
message Message464 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage464 nested = 7;
  Status464 status = 8;
}

// Nested message type
message NestedMessage464 {
  string name = 1;
  int32 value = 2;
  repeated Item464 items = 3;
}

// Simple item message
message Item464 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status464 {
  STATUS_464_UNSPECIFIED = 0;
  STATUS_464_ACTIVE = 1;
  STATUS_464_INACTIVE = 2;
  STATUS_464_PENDING = 3;
}

// Service definition
service Service464 {
  rpc Get464(Get464Request) returns (Get464Response);
  rpc List464(List464Request) returns (List464Response);
  rpc Create464(Create464Request) returns (Create464Response);
}

message Get464Request {
  string id = 1;
}

message Get464Response {
  Message464 result = 1;
}

message List464Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List464Response {
  repeated Message464 results = 1;
  string next_page_token = 2;
}

message Create464Request {
  Message464 message = 1;
}

message Create464Response {
  Message464 result = 1;
}
