syntax = "proto3";

package benchmark.pkg247;

// Message with various field types
message Message247 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage247 nested = 7;
  Status247 status = 8;
}

// Nested message type
message NestedMessage247 {
  string name = 1;
  int32 value = 2;
  repeated Item247 items = 3;
}

// Simple item message
message Item247 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status247 {
  STATUS_247_UNSPECIFIED = 0;
  STATUS_247_ACTIVE = 1;
  STATUS_247_INACTIVE = 2;
  STATUS_247_PENDING = 3;
}

// Service definition
service Service247 {
  rpc Get247(Get247Request) returns (Get247Response);
  rpc List247(List247Request) returns (List247Response);
  rpc Create247(Create247Request) returns (Create247Response);
}

message Get247Request {
  string id = 1;
}

message Get247Response {
  Message247 result = 1;
}

message List247Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List247Response {
  repeated Message247 results = 1;
  string next_page_token = 2;
}

message Create247Request {
  Message247 message = 1;
}

message Create247Response {
  Message247 result = 1;
}
