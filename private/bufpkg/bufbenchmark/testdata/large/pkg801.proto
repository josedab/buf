syntax = "proto3";

package benchmark.pkg801;

// Message with various field types
message Message801 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage801 nested = 7;
  Status801 status = 8;
}

// Nested message type
message NestedMessage801 {
  string name = 1;
  int32 value = 2;
  repeated Item801 items = 3;
}

// Simple item message
message Item801 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status801 {
  STATUS_801_UNSPECIFIED = 0;
  STATUS_801_ACTIVE = 1;
  STATUS_801_INACTIVE = 2;
  STATUS_801_PENDING = 3;
}

// Service definition
service Service801 {
  rpc Get801(Get801Request) returns (Get801Response);
  rpc List801(List801Request) returns (List801Response);
  rpc Create801(Create801Request) returns (Create801Response);
}

message Get801Request {
  string id = 1;
}

message Get801Response {
  Message801 result = 1;
}

message List801Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List801Response {
  repeated Message801 results = 1;
  string next_page_token = 2;
}

message Create801Request {
  Message801 message = 1;
}

message Create801Response {
  Message801 result = 1;
}
