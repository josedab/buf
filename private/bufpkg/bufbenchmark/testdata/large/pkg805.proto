syntax = "proto3";

package benchmark.pkg805;

// Message with various field types
message Message805 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage805 nested = 7;
  Status805 status = 8;
}

// Nested message type
message NestedMessage805 {
  string name = 1;
  int32 value = 2;
  repeated Item805 items = 3;
}

// Simple item message
message Item805 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status805 {
  STATUS_805_UNSPECIFIED = 0;
  STATUS_805_ACTIVE = 1;
  STATUS_805_INACTIVE = 2;
  STATUS_805_PENDING = 3;
}

// Service definition
service Service805 {
  rpc Get805(Get805Request) returns (Get805Response);
  rpc List805(List805Request) returns (List805Response);
  rpc Create805(Create805Request) returns (Create805Response);
}

message Get805Request {
  string id = 1;
}

message Get805Response {
  Message805 result = 1;
}

message List805Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List805Response {
  repeated Message805 results = 1;
  string next_page_token = 2;
}

message Create805Request {
  Message805 message = 1;
}

message Create805Response {
  Message805 result = 1;
}
