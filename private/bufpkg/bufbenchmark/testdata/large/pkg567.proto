syntax = "proto3";

package benchmark.pkg567;

// Message with various field types
message Message567 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage567 nested = 7;
  Status567 status = 8;
}

// Nested message type
message NestedMessage567 {
  string name = 1;
  int32 value = 2;
  repeated Item567 items = 3;
}

// Simple item message
message Item567 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status567 {
  STATUS_567_UNSPECIFIED = 0;
  STATUS_567_ACTIVE = 1;
  STATUS_567_INACTIVE = 2;
  STATUS_567_PENDING = 3;
}

// Service definition
service Service567 {
  rpc Get567(Get567Request) returns (Get567Response);
  rpc List567(List567Request) returns (List567Response);
  rpc Create567(Create567Request) returns (Create567Response);
}

message Get567Request {
  string id = 1;
}

message Get567Response {
  Message567 result = 1;
}

message List567Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List567Response {
  repeated Message567 results = 1;
  string next_page_token = 2;
}

message Create567Request {
  Message567 message = 1;
}

message Create567Response {
  Message567 result = 1;
}
