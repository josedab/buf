syntax = "proto3";

package benchmark.pkg803;

// Message with various field types
message Message803 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage803 nested = 7;
  Status803 status = 8;
}

// Nested message type
message NestedMessage803 {
  string name = 1;
  int32 value = 2;
  repeated Item803 items = 3;
}

// Simple item message
message Item803 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status803 {
  STATUS_803_UNSPECIFIED = 0;
  STATUS_803_ACTIVE = 1;
  STATUS_803_INACTIVE = 2;
  STATUS_803_PENDING = 3;
}

// Service definition
service Service803 {
  rpc Get803(Get803Request) returns (Get803Response);
  rpc List803(List803Request) returns (List803Response);
  rpc Create803(Create803Request) returns (Create803Response);
}

message Get803Request {
  string id = 1;
}

message Get803Response {
  Message803 result = 1;
}

message List803Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List803Response {
  repeated Message803 results = 1;
  string next_page_token = 2;
}

message Create803Request {
  Message803 message = 1;
}

message Create803Response {
  Message803 result = 1;
}
