syntax = "proto3";

package benchmark.pkg601;

// Message with various field types
message Message601 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage601 nested = 7;
  Status601 status = 8;
}

// Nested message type
message NestedMessage601 {
  string name = 1;
  int32 value = 2;
  repeated Item601 items = 3;
}

// Simple item message
message Item601 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status601 {
  STATUS_601_UNSPECIFIED = 0;
  STATUS_601_ACTIVE = 1;
  STATUS_601_INACTIVE = 2;
  STATUS_601_PENDING = 3;
}

// Service definition
service Service601 {
  rpc Get601(Get601Request) returns (Get601Response);
  rpc List601(List601Request) returns (List601Response);
  rpc Create601(Create601Request) returns (Create601Response);
}

message Get601Request {
  string id = 1;
}

message Get601Response {
  Message601 result = 1;
}

message List601Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List601Response {
  repeated Message601 results = 1;
  string next_page_token = 2;
}

message Create601Request {
  Message601 message = 1;
}

message Create601Response {
  Message601 result = 1;
}
