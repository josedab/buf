syntax = "proto3";

package benchmark.pkg910;

// Message with various field types
message Message910 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage910 nested = 7;
  Status910 status = 8;
}

// Nested message type
message NestedMessage910 {
  string name = 1;
  int32 value = 2;
  repeated Item910 items = 3;
}

// Simple item message
message Item910 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status910 {
  STATUS_910_UNSPECIFIED = 0;
  STATUS_910_ACTIVE = 1;
  STATUS_910_INACTIVE = 2;
  STATUS_910_PENDING = 3;
}

// Service definition
service Service910 {
  rpc Get910(Get910Request) returns (Get910Response);
  rpc List910(List910Request) returns (List910Response);
  rpc Create910(Create910Request) returns (Create910Response);
}

message Get910Request {
  string id = 1;
}

message Get910Response {
  Message910 result = 1;
}

message List910Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List910Response {
  repeated Message910 results = 1;
  string next_page_token = 2;
}

message Create910Request {
  Message910 message = 1;
}

message Create910Response {
  Message910 result = 1;
}
