syntax = "proto3";

package benchmark.pkg480;

// Message with various field types
message Message480 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage480 nested = 7;
  Status480 status = 8;
}

// Nested message type
message NestedMessage480 {
  string name = 1;
  int32 value = 2;
  repeated Item480 items = 3;
}

// Simple item message
message Item480 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status480 {
  STATUS_480_UNSPECIFIED = 0;
  STATUS_480_ACTIVE = 1;
  STATUS_480_INACTIVE = 2;
  STATUS_480_PENDING = 3;
}

// Service definition
service Service480 {
  rpc Get480(Get480Request) returns (Get480Response);
  rpc List480(List480Request) returns (List480Response);
  rpc Create480(Create480Request) returns (Create480Response);
}

message Get480Request {
  string id = 1;
}

message Get480Response {
  Message480 result = 1;
}

message List480Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List480Response {
  repeated Message480 results = 1;
  string next_page_token = 2;
}

message Create480Request {
  Message480 message = 1;
}

message Create480Response {
  Message480 result = 1;
}
