syntax = "proto3";

package benchmark.pkg580;

// Message with various field types
message Message580 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage580 nested = 7;
  Status580 status = 8;
}

// Nested message type
message NestedMessage580 {
  string name = 1;
  int32 value = 2;
  repeated Item580 items = 3;
}

// Simple item message
message Item580 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status580 {
  STATUS_580_UNSPECIFIED = 0;
  STATUS_580_ACTIVE = 1;
  STATUS_580_INACTIVE = 2;
  STATUS_580_PENDING = 3;
}

// Service definition
service Service580 {
  rpc Get580(Get580Request) returns (Get580Response);
  rpc List580(List580Request) returns (List580Response);
  rpc Create580(Create580Request) returns (Create580Response);
}

message Get580Request {
  string id = 1;
}

message Get580Response {
  Message580 result = 1;
}

message List580Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List580Response {
  repeated Message580 results = 1;
  string next_page_token = 2;
}

message Create580Request {
  Message580 message = 1;
}

message Create580Response {
  Message580 result = 1;
}
