syntax = "proto3";

package benchmark.pkg783;

// Message with various field types
message Message783 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage783 nested = 7;
  Status783 status = 8;
}

// Nested message type
message NestedMessage783 {
  string name = 1;
  int32 value = 2;
  repeated Item783 items = 3;
}

// Simple item message
message Item783 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status783 {
  STATUS_783_UNSPECIFIED = 0;
  STATUS_783_ACTIVE = 1;
  STATUS_783_INACTIVE = 2;
  STATUS_783_PENDING = 3;
}

// Service definition
service Service783 {
  rpc Get783(Get783Request) returns (Get783Response);
  rpc List783(List783Request) returns (List783Response);
  rpc Create783(Create783Request) returns (Create783Response);
}

message Get783Request {
  string id = 1;
}

message Get783Response {
  Message783 result = 1;
}

message List783Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List783Response {
  repeated Message783 results = 1;
  string next_page_token = 2;
}

message Create783Request {
  Message783 message = 1;
}

message Create783Response {
  Message783 result = 1;
}
