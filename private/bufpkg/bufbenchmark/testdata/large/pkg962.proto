syntax = "proto3";

package benchmark.pkg962;

// Message with various field types
message Message962 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage962 nested = 7;
  Status962 status = 8;
}

// Nested message type
message NestedMessage962 {
  string name = 1;
  int32 value = 2;
  repeated Item962 items = 3;
}

// Simple item message
message Item962 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status962 {
  STATUS_962_UNSPECIFIED = 0;
  STATUS_962_ACTIVE = 1;
  STATUS_962_INACTIVE = 2;
  STATUS_962_PENDING = 3;
}

// Service definition
service Service962 {
  rpc Get962(Get962Request) returns (Get962Response);
  rpc List962(List962Request) returns (List962Response);
  rpc Create962(Create962Request) returns (Create962Response);
}

message Get962Request {
  string id = 1;
}

message Get962Response {
  Message962 result = 1;
}

message List962Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List962Response {
  repeated Message962 results = 1;
  string next_page_token = 2;
}

message Create962Request {
  Message962 message = 1;
}

message Create962Response {
  Message962 result = 1;
}
