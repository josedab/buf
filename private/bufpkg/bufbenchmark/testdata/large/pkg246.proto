syntax = "proto3";

package benchmark.pkg246;

// Message with various field types
message Message246 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage246 nested = 7;
  Status246 status = 8;
}

// Nested message type
message NestedMessage246 {
  string name = 1;
  int32 value = 2;
  repeated Item246 items = 3;
}

// Simple item message
message Item246 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status246 {
  STATUS_246_UNSPECIFIED = 0;
  STATUS_246_ACTIVE = 1;
  STATUS_246_INACTIVE = 2;
  STATUS_246_PENDING = 3;
}

// Service definition
service Service246 {
  rpc Get246(Get246Request) returns (Get246Response);
  rpc List246(List246Request) returns (List246Response);
  rpc Create246(Create246Request) returns (Create246Response);
}

message Get246Request {
  string id = 1;
}

message Get246Response {
  Message246 result = 1;
}

message List246Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List246Response {
  repeated Message246 results = 1;
  string next_page_token = 2;
}

message Create246Request {
  Message246 message = 1;
}

message Create246Response {
  Message246 result = 1;
}
