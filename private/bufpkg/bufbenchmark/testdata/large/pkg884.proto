syntax = "proto3";

package benchmark.pkg884;

// Message with various field types
message Message884 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage884 nested = 7;
  Status884 status = 8;
}

// Nested message type
message NestedMessage884 {
  string name = 1;
  int32 value = 2;
  repeated Item884 items = 3;
}

// Simple item message
message Item884 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status884 {
  STATUS_884_UNSPECIFIED = 0;
  STATUS_884_ACTIVE = 1;
  STATUS_884_INACTIVE = 2;
  STATUS_884_PENDING = 3;
}

// Service definition
service Service884 {
  rpc Get884(Get884Request) returns (Get884Response);
  rpc List884(List884Request) returns (List884Response);
  rpc Create884(Create884Request) returns (Create884Response);
}

message Get884Request {
  string id = 1;
}

message Get884Response {
  Message884 result = 1;
}

message List884Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List884Response {
  repeated Message884 results = 1;
  string next_page_token = 2;
}

message Create884Request {
  Message884 message = 1;
}

message Create884Response {
  Message884 result = 1;
}
