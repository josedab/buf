syntax = "proto3";

package benchmark.pkg698;

// Message with various field types
message Message698 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage698 nested = 7;
  Status698 status = 8;
}

// Nested message type
message NestedMessage698 {
  string name = 1;
  int32 value = 2;
  repeated Item698 items = 3;
}

// Simple item message
message Item698 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status698 {
  STATUS_698_UNSPECIFIED = 0;
  STATUS_698_ACTIVE = 1;
  STATUS_698_INACTIVE = 2;
  STATUS_698_PENDING = 3;
}

// Service definition
service Service698 {
  rpc Get698(Get698Request) returns (Get698Response);
  rpc List698(List698Request) returns (List698Response);
  rpc Create698(Create698Request) returns (Create698Response);
}

message Get698Request {
  string id = 1;
}

message Get698Response {
  Message698 result = 1;
}

message List698Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List698Response {
  repeated Message698 results = 1;
  string next_page_token = 2;
}

message Create698Request {
  Message698 message = 1;
}

message Create698Response {
  Message698 result = 1;
}
