syntax = "proto3";

package benchmark.pkg17;

// Message with various field types
message Message17 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage17 nested = 7;
  Status17 status = 8;
}

// Nested message type
message NestedMessage17 {
  string name = 1;
  int32 value = 2;
  repeated Item17 items = 3;
}

// Simple item message
message Item17 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status17 {
  STATUS_17_UNSPECIFIED = 0;
  STATUS_17_ACTIVE = 1;
  STATUS_17_INACTIVE = 2;
  STATUS_17_PENDING = 3;
}

// Service definition
service Service17 {
  rpc Get17(Get17Request) returns (Get17Response);
  rpc List17(List17Request) returns (List17Response);
  rpc Create17(Create17Request) returns (Create17Response);
}

message Get17Request {
  string id = 1;
}

message Get17Response {
  Message17 result = 1;
}

message List17Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List17Response {
  repeated Message17 results = 1;
  string next_page_token = 2;
}

message Create17Request {
  Message17 message = 1;
}

message Create17Response {
  Message17 result = 1;
}
