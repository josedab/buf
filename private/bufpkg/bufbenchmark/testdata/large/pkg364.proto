syntax = "proto3";

package benchmark.pkg364;

// Message with various field types
message Message364 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage364 nested = 7;
  Status364 status = 8;
}

// Nested message type
message NestedMessage364 {
  string name = 1;
  int32 value = 2;
  repeated Item364 items = 3;
}

// Simple item message
message Item364 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status364 {
  STATUS_364_UNSPECIFIED = 0;
  STATUS_364_ACTIVE = 1;
  STATUS_364_INACTIVE = 2;
  STATUS_364_PENDING = 3;
}

// Service definition
service Service364 {
  rpc Get364(Get364Request) returns (Get364Response);
  rpc List364(List364Request) returns (List364Response);
  rpc Create364(Create364Request) returns (Create364Response);
}

message Get364Request {
  string id = 1;
}

message Get364Response {
  Message364 result = 1;
}

message List364Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List364Response {
  repeated Message364 results = 1;
  string next_page_token = 2;
}

message Create364Request {
  Message364 message = 1;
}

message Create364Response {
  Message364 result = 1;
}
