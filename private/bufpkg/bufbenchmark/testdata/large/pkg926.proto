syntax = "proto3";

package benchmark.pkg926;

// Message with various field types
message Message926 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage926 nested = 7;
  Status926 status = 8;
}

// Nested message type
message NestedMessage926 {
  string name = 1;
  int32 value = 2;
  repeated Item926 items = 3;
}

// Simple item message
message Item926 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status926 {
  STATUS_926_UNSPECIFIED = 0;
  STATUS_926_ACTIVE = 1;
  STATUS_926_INACTIVE = 2;
  STATUS_926_PENDING = 3;
}

// Service definition
service Service926 {
  rpc Get926(Get926Request) returns (Get926Response);
  rpc List926(List926Request) returns (List926Response);
  rpc Create926(Create926Request) returns (Create926Response);
}

message Get926Request {
  string id = 1;
}

message Get926Response {
  Message926 result = 1;
}

message List926Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List926Response {
  repeated Message926 results = 1;
  string next_page_token = 2;
}

message Create926Request {
  Message926 message = 1;
}

message Create926Response {
  Message926 result = 1;
}
