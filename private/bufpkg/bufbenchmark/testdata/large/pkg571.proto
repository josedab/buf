syntax = "proto3";

package benchmark.pkg571;

// Message with various field types
message Message571 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage571 nested = 7;
  Status571 status = 8;
}

// Nested message type
message NestedMessage571 {
  string name = 1;
  int32 value = 2;
  repeated Item571 items = 3;
}

// Simple item message
message Item571 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status571 {
  STATUS_571_UNSPECIFIED = 0;
  STATUS_571_ACTIVE = 1;
  STATUS_571_INACTIVE = 2;
  STATUS_571_PENDING = 3;
}

// Service definition
service Service571 {
  rpc Get571(Get571Request) returns (Get571Response);
  rpc List571(List571Request) returns (List571Response);
  rpc Create571(Create571Request) returns (Create571Response);
}

message Get571Request {
  string id = 1;
}

message Get571Response {
  Message571 result = 1;
}

message List571Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List571Response {
  repeated Message571 results = 1;
  string next_page_token = 2;
}

message Create571Request {
  Message571 message = 1;
}

message Create571Response {
  Message571 result = 1;
}
