syntax = "proto3";

package benchmark.pkg201;

// Message with various field types
message Message201 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage201 nested = 7;
  Status201 status = 8;
}

// Nested message type
message NestedMessage201 {
  string name = 1;
  int32 value = 2;
  repeated Item201 items = 3;
}

// Simple item message
message Item201 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status201 {
  STATUS_201_UNSPECIFIED = 0;
  STATUS_201_ACTIVE = 1;
  STATUS_201_INACTIVE = 2;
  STATUS_201_PENDING = 3;
}

// Service definition
service Service201 {
  rpc Get201(Get201Request) returns (Get201Response);
  rpc List201(List201Request) returns (List201Response);
  rpc Create201(Create201Request) returns (Create201Response);
}

message Get201Request {
  string id = 1;
}

message Get201Response {
  Message201 result = 1;
}

message List201Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List201Response {
  repeated Message201 results = 1;
  string next_page_token = 2;
}

message Create201Request {
  Message201 message = 1;
}

message Create201Response {
  Message201 result = 1;
}
