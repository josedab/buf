syntax = "proto3";

package benchmark.pkg373;

// Message with various field types
message Message373 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage373 nested = 7;
  Status373 status = 8;
}

// Nested message type
message NestedMessage373 {
  string name = 1;
  int32 value = 2;
  repeated Item373 items = 3;
}

// Simple item message
message Item373 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status373 {
  STATUS_373_UNSPECIFIED = 0;
  STATUS_373_ACTIVE = 1;
  STATUS_373_INACTIVE = 2;
  STATUS_373_PENDING = 3;
}

// Service definition
service Service373 {
  rpc Get373(Get373Request) returns (Get373Response);
  rpc List373(List373Request) returns (List373Response);
  rpc Create373(Create373Request) returns (Create373Response);
}

message Get373Request {
  string id = 1;
}

message Get373Response {
  Message373 result = 1;
}

message List373Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List373Response {
  repeated Message373 results = 1;
  string next_page_token = 2;
}

message Create373Request {
  Message373 message = 1;
}

message Create373Response {
  Message373 result = 1;
}
