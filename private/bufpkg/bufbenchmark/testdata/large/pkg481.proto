syntax = "proto3";

package benchmark.pkg481;

// Message with various field types
message Message481 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage481 nested = 7;
  Status481 status = 8;
}

// Nested message type
message NestedMessage481 {
  string name = 1;
  int32 value = 2;
  repeated Item481 items = 3;
}

// Simple item message
message Item481 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status481 {
  STATUS_481_UNSPECIFIED = 0;
  STATUS_481_ACTIVE = 1;
  STATUS_481_INACTIVE = 2;
  STATUS_481_PENDING = 3;
}

// Service definition
service Service481 {
  rpc Get481(Get481Request) returns (Get481Response);
  rpc List481(List481Request) returns (List481Response);
  rpc Create481(Create481Request) returns (Create481Response);
}

message Get481Request {
  string id = 1;
}

message Get481Response {
  Message481 result = 1;
}

message List481Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List481Response {
  repeated Message481 results = 1;
  string next_page_token = 2;
}

message Create481Request {
  Message481 message = 1;
}

message Create481Response {
  Message481 result = 1;
}
