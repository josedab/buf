syntax = "proto3";

package benchmark.pkg836;

// Message with various field types
message Message836 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage836 nested = 7;
  Status836 status = 8;
}

// Nested message type
message NestedMessage836 {
  string name = 1;
  int32 value = 2;
  repeated Item836 items = 3;
}

// Simple item message
message Item836 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status836 {
  STATUS_836_UNSPECIFIED = 0;
  STATUS_836_ACTIVE = 1;
  STATUS_836_INACTIVE = 2;
  STATUS_836_PENDING = 3;
}

// Service definition
service Service836 {
  rpc Get836(Get836Request) returns (Get836Response);
  rpc List836(List836Request) returns (List836Response);
  rpc Create836(Create836Request) returns (Create836Response);
}

message Get836Request {
  string id = 1;
}

message Get836Response {
  Message836 result = 1;
}

message List836Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List836Response {
  repeated Message836 results = 1;
  string next_page_token = 2;
}

message Create836Request {
  Message836 message = 1;
}

message Create836Response {
  Message836 result = 1;
}
