syntax = "proto3";

package benchmark.pkg964;

// Message with various field types
message Message964 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage964 nested = 7;
  Status964 status = 8;
}

// Nested message type
message NestedMessage964 {
  string name = 1;
  int32 value = 2;
  repeated Item964 items = 3;
}

// Simple item message
message Item964 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status964 {
  STATUS_964_UNSPECIFIED = 0;
  STATUS_964_ACTIVE = 1;
  STATUS_964_INACTIVE = 2;
  STATUS_964_PENDING = 3;
}

// Service definition
service Service964 {
  rpc Get964(Get964Request) returns (Get964Response);
  rpc List964(List964Request) returns (List964Response);
  rpc Create964(Create964Request) returns (Create964Response);
}

message Get964Request {
  string id = 1;
}

message Get964Response {
  Message964 result = 1;
}

message List964Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List964Response {
  repeated Message964 results = 1;
  string next_page_token = 2;
}

message Create964Request {
  Message964 message = 1;
}

message Create964Response {
  Message964 result = 1;
}
