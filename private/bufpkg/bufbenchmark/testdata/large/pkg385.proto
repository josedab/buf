syntax = "proto3";

package benchmark.pkg385;

// Message with various field types
message Message385 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage385 nested = 7;
  Status385 status = 8;
}

// Nested message type
message NestedMessage385 {
  string name = 1;
  int32 value = 2;
  repeated Item385 items = 3;
}

// Simple item message
message Item385 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status385 {
  STATUS_385_UNSPECIFIED = 0;
  STATUS_385_ACTIVE = 1;
  STATUS_385_INACTIVE = 2;
  STATUS_385_PENDING = 3;
}

// Service definition
service Service385 {
  rpc Get385(Get385Request) returns (Get385Response);
  rpc List385(List385Request) returns (List385Response);
  rpc Create385(Create385Request) returns (Create385Response);
}

message Get385Request {
  string id = 1;
}

message Get385Response {
  Message385 result = 1;
}

message List385Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List385Response {
  repeated Message385 results = 1;
  string next_page_token = 2;
}

message Create385Request {
  Message385 message = 1;
}

message Create385Response {
  Message385 result = 1;
}
