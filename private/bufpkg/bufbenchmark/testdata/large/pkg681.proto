syntax = "proto3";

package benchmark.pkg681;

// Message with various field types
message Message681 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage681 nested = 7;
  Status681 status = 8;
}

// Nested message type
message NestedMessage681 {
  string name = 1;
  int32 value = 2;
  repeated Item681 items = 3;
}

// Simple item message
message Item681 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status681 {
  STATUS_681_UNSPECIFIED = 0;
  STATUS_681_ACTIVE = 1;
  STATUS_681_INACTIVE = 2;
  STATUS_681_PENDING = 3;
}

// Service definition
service Service681 {
  rpc Get681(Get681Request) returns (Get681Response);
  rpc List681(List681Request) returns (List681Response);
  rpc Create681(Create681Request) returns (Create681Response);
}

message Get681Request {
  string id = 1;
}

message Get681Response {
  Message681 result = 1;
}

message List681Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List681Response {
  repeated Message681 results = 1;
  string next_page_token = 2;
}

message Create681Request {
  Message681 message = 1;
}

message Create681Response {
  Message681 result = 1;
}
