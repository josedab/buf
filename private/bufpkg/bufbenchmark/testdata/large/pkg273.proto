syntax = "proto3";

package benchmark.pkg273;

// Message with various field types
message Message273 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage273 nested = 7;
  Status273 status = 8;
}

// Nested message type
message NestedMessage273 {
  string name = 1;
  int32 value = 2;
  repeated Item273 items = 3;
}

// Simple item message
message Item273 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status273 {
  STATUS_273_UNSPECIFIED = 0;
  STATUS_273_ACTIVE = 1;
  STATUS_273_INACTIVE = 2;
  STATUS_273_PENDING = 3;
}

// Service definition
service Service273 {
  rpc Get273(Get273Request) returns (Get273Response);
  rpc List273(List273Request) returns (List273Response);
  rpc Create273(Create273Request) returns (Create273Response);
}

message Get273Request {
  string id = 1;
}

message Get273Response {
  Message273 result = 1;
}

message List273Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List273Response {
  repeated Message273 results = 1;
  string next_page_token = 2;
}

message Create273Request {
  Message273 message = 1;
}

message Create273Response {
  Message273 result = 1;
}
