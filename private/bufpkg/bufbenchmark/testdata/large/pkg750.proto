syntax = "proto3";

package benchmark.pkg750;

// Message with various field types
message Message750 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage750 nested = 7;
  Status750 status = 8;
}

// Nested message type
message NestedMessage750 {
  string name = 1;
  int32 value = 2;
  repeated Item750 items = 3;
}

// Simple item message
message Item750 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status750 {
  STATUS_750_UNSPECIFIED = 0;
  STATUS_750_ACTIVE = 1;
  STATUS_750_INACTIVE = 2;
  STATUS_750_PENDING = 3;
}

// Service definition
service Service750 {
  rpc Get750(Get750Request) returns (Get750Response);
  rpc List750(List750Request) returns (List750Response);
  rpc Create750(Create750Request) returns (Create750Response);
}

message Get750Request {
  string id = 1;
}

message Get750Response {
  Message750 result = 1;
}

message List750Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List750Response {
  repeated Message750 results = 1;
  string next_page_token = 2;
}

message Create750Request {
  Message750 message = 1;
}

message Create750Response {
  Message750 result = 1;
}
