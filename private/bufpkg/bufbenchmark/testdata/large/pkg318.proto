syntax = "proto3";

package benchmark.pkg318;

// Message with various field types
message Message318 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage318 nested = 7;
  Status318 status = 8;
}

// Nested message type
message NestedMessage318 {
  string name = 1;
  int32 value = 2;
  repeated Item318 items = 3;
}

// Simple item message
message Item318 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status318 {
  STATUS_318_UNSPECIFIED = 0;
  STATUS_318_ACTIVE = 1;
  STATUS_318_INACTIVE = 2;
  STATUS_318_PENDING = 3;
}

// Service definition
service Service318 {
  rpc Get318(Get318Request) returns (Get318Response);
  rpc List318(List318Request) returns (List318Response);
  rpc Create318(Create318Request) returns (Create318Response);
}

message Get318Request {
  string id = 1;
}

message Get318Response {
  Message318 result = 1;
}

message List318Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List318Response {
  repeated Message318 results = 1;
  string next_page_token = 2;
}

message Create318Request {
  Message318 message = 1;
}

message Create318Response {
  Message318 result = 1;
}
