syntax = "proto3";

package benchmark.pkg771;

// Message with various field types
message Message771 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage771 nested = 7;
  Status771 status = 8;
}

// Nested message type
message NestedMessage771 {
  string name = 1;
  int32 value = 2;
  repeated Item771 items = 3;
}

// Simple item message
message Item771 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status771 {
  STATUS_771_UNSPECIFIED = 0;
  STATUS_771_ACTIVE = 1;
  STATUS_771_INACTIVE = 2;
  STATUS_771_PENDING = 3;
}

// Service definition
service Service771 {
  rpc Get771(Get771Request) returns (Get771Response);
  rpc List771(List771Request) returns (List771Response);
  rpc Create771(Create771Request) returns (Create771Response);
}

message Get771Request {
  string id = 1;
}

message Get771Response {
  Message771 result = 1;
}

message List771Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List771Response {
  repeated Message771 results = 1;
  string next_page_token = 2;
}

message Create771Request {
  Message771 message = 1;
}

message Create771Response {
  Message771 result = 1;
}
