syntax = "proto3";

package benchmark.pkg616;

// Message with various field types
message Message616 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage616 nested = 7;
  Status616 status = 8;
}

// Nested message type
message NestedMessage616 {
  string name = 1;
  int32 value = 2;
  repeated Item616 items = 3;
}

// Simple item message
message Item616 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status616 {
  STATUS_616_UNSPECIFIED = 0;
  STATUS_616_ACTIVE = 1;
  STATUS_616_INACTIVE = 2;
  STATUS_616_PENDING = 3;
}

// Service definition
service Service616 {
  rpc Get616(Get616Request) returns (Get616Response);
  rpc List616(List616Request) returns (List616Response);
  rpc Create616(Create616Request) returns (Create616Response);
}

message Get616Request {
  string id = 1;
}

message Get616Response {
  Message616 result = 1;
}

message List616Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List616Response {
  repeated Message616 results = 1;
  string next_page_token = 2;
}

message Create616Request {
  Message616 message = 1;
}

message Create616Response {
  Message616 result = 1;
}
