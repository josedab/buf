syntax = "proto3";

package benchmark.pkg630;

// Message with various field types
message Message630 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage630 nested = 7;
  Status630 status = 8;
}

// Nested message type
message NestedMessage630 {
  string name = 1;
  int32 value = 2;
  repeated Item630 items = 3;
}

// Simple item message
message Item630 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status630 {
  STATUS_630_UNSPECIFIED = 0;
  STATUS_630_ACTIVE = 1;
  STATUS_630_INACTIVE = 2;
  STATUS_630_PENDING = 3;
}

// Service definition
service Service630 {
  rpc Get630(Get630Request) returns (Get630Response);
  rpc List630(List630Request) returns (List630Response);
  rpc Create630(Create630Request) returns (Create630Response);
}

message Get630Request {
  string id = 1;
}

message Get630Response {
  Message630 result = 1;
}

message List630Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List630Response {
  repeated Message630 results = 1;
  string next_page_token = 2;
}

message Create630Request {
  Message630 message = 1;
}

message Create630Response {
  Message630 result = 1;
}
