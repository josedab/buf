syntax = "proto3";

package benchmark.pkg701;

// Message with various field types
message Message701 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage701 nested = 7;
  Status701 status = 8;
}

// Nested message type
message NestedMessage701 {
  string name = 1;
  int32 value = 2;
  repeated Item701 items = 3;
}

// Simple item message
message Item701 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status701 {
  STATUS_701_UNSPECIFIED = 0;
  STATUS_701_ACTIVE = 1;
  STATUS_701_INACTIVE = 2;
  STATUS_701_PENDING = 3;
}

// Service definition
service Service701 {
  rpc Get701(Get701Request) returns (Get701Response);
  rpc List701(List701Request) returns (List701Response);
  rpc Create701(Create701Request) returns (Create701Response);
}

message Get701Request {
  string id = 1;
}

message Get701Response {
  Message701 result = 1;
}

message List701Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List701Response {
  repeated Message701 results = 1;
  string next_page_token = 2;
}

message Create701Request {
  Message701 message = 1;
}

message Create701Response {
  Message701 result = 1;
}
