syntax = "proto3";

package benchmark.pkg739;

// Message with various field types
message Message739 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage739 nested = 7;
  Status739 status = 8;
}

// Nested message type
message NestedMessage739 {
  string name = 1;
  int32 value = 2;
  repeated Item739 items = 3;
}

// Simple item message
message Item739 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status739 {
  STATUS_739_UNSPECIFIED = 0;
  STATUS_739_ACTIVE = 1;
  STATUS_739_INACTIVE = 2;
  STATUS_739_PENDING = 3;
}

// Service definition
service Service739 {
  rpc Get739(Get739Request) returns (Get739Response);
  rpc List739(List739Request) returns (List739Response);
  rpc Create739(Create739Request) returns (Create739Response);
}

message Get739Request {
  string id = 1;
}

message Get739Response {
  Message739 result = 1;
}

message List739Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List739Response {
  repeated Message739 results = 1;
  string next_page_token = 2;
}

message Create739Request {
  Message739 message = 1;
}

message Create739Response {
  Message739 result = 1;
}
