syntax = "proto3";

package benchmark.pkg887;

// Message with various field types
message Message887 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage887 nested = 7;
  Status887 status = 8;
}

// Nested message type
message NestedMessage887 {
  string name = 1;
  int32 value = 2;
  repeated Item887 items = 3;
}

// Simple item message
message Item887 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status887 {
  STATUS_887_UNSPECIFIED = 0;
  STATUS_887_ACTIVE = 1;
  STATUS_887_INACTIVE = 2;
  STATUS_887_PENDING = 3;
}

// Service definition
service Service887 {
  rpc Get887(Get887Request) returns (Get887Response);
  rpc List887(List887Request) returns (List887Response);
  rpc Create887(Create887Request) returns (Create887Response);
}

message Get887Request {
  string id = 1;
}

message Get887Response {
  Message887 result = 1;
}

message List887Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List887Response {
  repeated Message887 results = 1;
  string next_page_token = 2;
}

message Create887Request {
  Message887 message = 1;
}

message Create887Response {
  Message887 result = 1;
}
