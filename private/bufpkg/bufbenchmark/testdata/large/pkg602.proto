syntax = "proto3";

package benchmark.pkg602;

// Message with various field types
message Message602 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage602 nested = 7;
  Status602 status = 8;
}

// Nested message type
message NestedMessage602 {
  string name = 1;
  int32 value = 2;
  repeated Item602 items = 3;
}

// Simple item message
message Item602 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status602 {
  STATUS_602_UNSPECIFIED = 0;
  STATUS_602_ACTIVE = 1;
  STATUS_602_INACTIVE = 2;
  STATUS_602_PENDING = 3;
}

// Service definition
service Service602 {
  rpc Get602(Get602Request) returns (Get602Response);
  rpc List602(List602Request) returns (List602Response);
  rpc Create602(Create602Request) returns (Create602Response);
}

message Get602Request {
  string id = 1;
}

message Get602Response {
  Message602 result = 1;
}

message List602Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List602Response {
  repeated Message602 results = 1;
  string next_page_token = 2;
}

message Create602Request {
  Message602 message = 1;
}

message Create602Response {
  Message602 result = 1;
}
