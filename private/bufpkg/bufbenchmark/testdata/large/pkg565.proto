syntax = "proto3";

package benchmark.pkg565;

// Message with various field types
message Message565 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage565 nested = 7;
  Status565 status = 8;
}

// Nested message type
message NestedMessage565 {
  string name = 1;
  int32 value = 2;
  repeated Item565 items = 3;
}

// Simple item message
message Item565 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status565 {
  STATUS_565_UNSPECIFIED = 0;
  STATUS_565_ACTIVE = 1;
  STATUS_565_INACTIVE = 2;
  STATUS_565_PENDING = 3;
}

// Service definition
service Service565 {
  rpc Get565(Get565Request) returns (Get565Response);
  rpc List565(List565Request) returns (List565Response);
  rpc Create565(Create565Request) returns (Create565Response);
}

message Get565Request {
  string id = 1;
}

message Get565Response {
  Message565 result = 1;
}

message List565Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List565Response {
  repeated Message565 results = 1;
  string next_page_token = 2;
}

message Create565Request {
  Message565 message = 1;
}

message Create565Response {
  Message565 result = 1;
}
