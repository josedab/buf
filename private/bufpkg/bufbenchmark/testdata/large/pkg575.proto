syntax = "proto3";

package benchmark.pkg575;

// Message with various field types
message Message575 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage575 nested = 7;
  Status575 status = 8;
}

// Nested message type
message NestedMessage575 {
  string name = 1;
  int32 value = 2;
  repeated Item575 items = 3;
}

// Simple item message
message Item575 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status575 {
  STATUS_575_UNSPECIFIED = 0;
  STATUS_575_ACTIVE = 1;
  STATUS_575_INACTIVE = 2;
  STATUS_575_PENDING = 3;
}

// Service definition
service Service575 {
  rpc Get575(Get575Request) returns (Get575Response);
  rpc List575(List575Request) returns (List575Response);
  rpc Create575(Create575Request) returns (Create575Response);
}

message Get575Request {
  string id = 1;
}

message Get575Response {
  Message575 result = 1;
}

message List575Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List575Response {
  repeated Message575 results = 1;
  string next_page_token = 2;
}

message Create575Request {
  Message575 message = 1;
}

message Create575Response {
  Message575 result = 1;
}
