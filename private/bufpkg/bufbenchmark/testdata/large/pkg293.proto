syntax = "proto3";

package benchmark.pkg293;

// Message with various field types
message Message293 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage293 nested = 7;
  Status293 status = 8;
}

// Nested message type
message NestedMessage293 {
  string name = 1;
  int32 value = 2;
  repeated Item293 items = 3;
}

// Simple item message
message Item293 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status293 {
  STATUS_293_UNSPECIFIED = 0;
  STATUS_293_ACTIVE = 1;
  STATUS_293_INACTIVE = 2;
  STATUS_293_PENDING = 3;
}

// Service definition
service Service293 {
  rpc Get293(Get293Request) returns (Get293Response);
  rpc List293(List293Request) returns (List293Response);
  rpc Create293(Create293Request) returns (Create293Response);
}

message Get293Request {
  string id = 1;
}

message Get293Response {
  Message293 result = 1;
}

message List293Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List293Response {
  repeated Message293 results = 1;
  string next_page_token = 2;
}

message Create293Request {
  Message293 message = 1;
}

message Create293Response {
  Message293 result = 1;
}
