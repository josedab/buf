syntax = "proto3";

package benchmark.pkg660;

// Message with various field types
message Message660 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage660 nested = 7;
  Status660 status = 8;
}

// Nested message type
message NestedMessage660 {
  string name = 1;
  int32 value = 2;
  repeated Item660 items = 3;
}

// Simple item message
message Item660 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status660 {
  STATUS_660_UNSPECIFIED = 0;
  STATUS_660_ACTIVE = 1;
  STATUS_660_INACTIVE = 2;
  STATUS_660_PENDING = 3;
}

// Service definition
service Service660 {
  rpc Get660(Get660Request) returns (Get660Response);
  rpc List660(List660Request) returns (List660Response);
  rpc Create660(Create660Request) returns (Create660Response);
}

message Get660Request {
  string id = 1;
}

message Get660Response {
  Message660 result = 1;
}

message List660Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List660Response {
  repeated Message660 results = 1;
  string next_page_token = 2;
}

message Create660Request {
  Message660 message = 1;
}

message Create660Response {
  Message660 result = 1;
}
