syntax = "proto3";

package benchmark.pkg695;

// Message with various field types
message Message695 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage695 nested = 7;
  Status695 status = 8;
}

// Nested message type
message NestedMessage695 {
  string name = 1;
  int32 value = 2;
  repeated Item695 items = 3;
}

// Simple item message
message Item695 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status695 {
  STATUS_695_UNSPECIFIED = 0;
  STATUS_695_ACTIVE = 1;
  STATUS_695_INACTIVE = 2;
  STATUS_695_PENDING = 3;
}

// Service definition
service Service695 {
  rpc Get695(Get695Request) returns (Get695Response);
  rpc List695(List695Request) returns (List695Response);
  rpc Create695(Create695Request) returns (Create695Response);
}

message Get695Request {
  string id = 1;
}

message Get695Response {
  Message695 result = 1;
}

message List695Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List695Response {
  repeated Message695 results = 1;
  string next_page_token = 2;
}

message Create695Request {
  Message695 message = 1;
}

message Create695Response {
  Message695 result = 1;
}
