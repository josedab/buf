syntax = "proto3";

package benchmark.pkg284;

// Message with various field types
message Message284 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage284 nested = 7;
  Status284 status = 8;
}

// Nested message type
message NestedMessage284 {
  string name = 1;
  int32 value = 2;
  repeated Item284 items = 3;
}

// Simple item message
message Item284 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status284 {
  STATUS_284_UNSPECIFIED = 0;
  STATUS_284_ACTIVE = 1;
  STATUS_284_INACTIVE = 2;
  STATUS_284_PENDING = 3;
}

// Service definition
service Service284 {
  rpc Get284(Get284Request) returns (Get284Response);
  rpc List284(List284Request) returns (List284Response);
  rpc Create284(Create284Request) returns (Create284Response);
}

message Get284Request {
  string id = 1;
}

message Get284Response {
  Message284 result = 1;
}

message List284Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List284Response {
  repeated Message284 results = 1;
  string next_page_token = 2;
}

message Create284Request {
  Message284 message = 1;
}

message Create284Response {
  Message284 result = 1;
}
