syntax = "proto3";

package benchmark.pkg851;

// Message with various field types
message Message851 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage851 nested = 7;
  Status851 status = 8;
}

// Nested message type
message NestedMessage851 {
  string name = 1;
  int32 value = 2;
  repeated Item851 items = 3;
}

// Simple item message
message Item851 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status851 {
  STATUS_851_UNSPECIFIED = 0;
  STATUS_851_ACTIVE = 1;
  STATUS_851_INACTIVE = 2;
  STATUS_851_PENDING = 3;
}

// Service definition
service Service851 {
  rpc Get851(Get851Request) returns (Get851Response);
  rpc List851(List851Request) returns (List851Response);
  rpc Create851(Create851Request) returns (Create851Response);
}

message Get851Request {
  string id = 1;
}

message Get851Response {
  Message851 result = 1;
}

message List851Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List851Response {
  repeated Message851 results = 1;
  string next_page_token = 2;
}

message Create851Request {
  Message851 message = 1;
}

message Create851Response {
  Message851 result = 1;
}
