syntax = "proto3";

package benchmark.pkg377;

// Message with various field types
message Message377 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage377 nested = 7;
  Status377 status = 8;
}

// Nested message type
message NestedMessage377 {
  string name = 1;
  int32 value = 2;
  repeated Item377 items = 3;
}

// Simple item message
message Item377 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status377 {
  STATUS_377_UNSPECIFIED = 0;
  STATUS_377_ACTIVE = 1;
  STATUS_377_INACTIVE = 2;
  STATUS_377_PENDING = 3;
}

// Service definition
service Service377 {
  rpc Get377(Get377Request) returns (Get377Response);
  rpc List377(List377Request) returns (List377Response);
  rpc Create377(Create377Request) returns (Create377Response);
}

message Get377Request {
  string id = 1;
}

message Get377Response {
  Message377 result = 1;
}

message List377Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List377Response {
  repeated Message377 results = 1;
  string next_page_token = 2;
}

message Create377Request {
  Message377 message = 1;
}

message Create377Response {
  Message377 result = 1;
}
