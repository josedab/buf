syntax = "proto3";

package benchmark.pkg765;

// Message with various field types
message Message765 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage765 nested = 7;
  Status765 status = 8;
}

// Nested message type
message NestedMessage765 {
  string name = 1;
  int32 value = 2;
  repeated Item765 items = 3;
}

// Simple item message
message Item765 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status765 {
  STATUS_765_UNSPECIFIED = 0;
  STATUS_765_ACTIVE = 1;
  STATUS_765_INACTIVE = 2;
  STATUS_765_PENDING = 3;
}

// Service definition
service Service765 {
  rpc Get765(Get765Request) returns (Get765Response);
  rpc List765(List765Request) returns (List765Response);
  rpc Create765(Create765Request) returns (Create765Response);
}

message Get765Request {
  string id = 1;
}

message Get765Response {
  Message765 result = 1;
}

message List765Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List765Response {
  repeated Message765 results = 1;
  string next_page_token = 2;
}

message Create765Request {
  Message765 message = 1;
}

message Create765Response {
  Message765 result = 1;
}
