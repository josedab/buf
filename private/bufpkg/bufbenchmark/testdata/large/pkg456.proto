syntax = "proto3";

package benchmark.pkg456;

// Message with various field types
message Message456 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage456 nested = 7;
  Status456 status = 8;
}

// Nested message type
message NestedMessage456 {
  string name = 1;
  int32 value = 2;
  repeated Item456 items = 3;
}

// Simple item message
message Item456 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status456 {
  STATUS_456_UNSPECIFIED = 0;
  STATUS_456_ACTIVE = 1;
  STATUS_456_INACTIVE = 2;
  STATUS_456_PENDING = 3;
}

// Service definition
service Service456 {
  rpc Get456(Get456Request) returns (Get456Response);
  rpc List456(List456Request) returns (List456Response);
  rpc Create456(Create456Request) returns (Create456Response);
}

message Get456Request {
  string id = 1;
}

message Get456Response {
  Message456 result = 1;
}

message List456Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List456Response {
  repeated Message456 results = 1;
  string next_page_token = 2;
}

message Create456Request {
  Message456 message = 1;
}

message Create456Response {
  Message456 result = 1;
}
