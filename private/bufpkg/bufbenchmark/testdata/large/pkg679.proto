syntax = "proto3";

package benchmark.pkg679;

// Message with various field types
message Message679 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage679 nested = 7;
  Status679 status = 8;
}

// Nested message type
message NestedMessage679 {
  string name = 1;
  int32 value = 2;
  repeated Item679 items = 3;
}

// Simple item message
message Item679 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status679 {
  STATUS_679_UNSPECIFIED = 0;
  STATUS_679_ACTIVE = 1;
  STATUS_679_INACTIVE = 2;
  STATUS_679_PENDING = 3;
}

// Service definition
service Service679 {
  rpc Get679(Get679Request) returns (Get679Response);
  rpc List679(List679Request) returns (List679Response);
  rpc Create679(Create679Request) returns (Create679Response);
}

message Get679Request {
  string id = 1;
}

message Get679Response {
  Message679 result = 1;
}

message List679Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List679Response {
  repeated Message679 results = 1;
  string next_page_token = 2;
}

message Create679Request {
  Message679 message = 1;
}

message Create679Response {
  Message679 result = 1;
}
