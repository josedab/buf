syntax = "proto3";

package benchmark.pkg27;

// Message with various field types
message Message27 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage27 nested = 7;
  Status27 status = 8;
}

// Nested message type
message NestedMessage27 {
  string name = 1;
  int32 value = 2;
  repeated Item27 items = 3;
}

// Simple item message
message Item27 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status27 {
  STATUS_27_UNSPECIFIED = 0;
  STATUS_27_ACTIVE = 1;
  STATUS_27_INACTIVE = 2;
  STATUS_27_PENDING = 3;
}

// Service definition
service Service27 {
  rpc Get27(Get27Request) returns (Get27Response);
  rpc List27(List27Request) returns (List27Response);
  rpc Create27(Create27Request) returns (Create27Response);
}

message Get27Request {
  string id = 1;
}

message Get27Response {
  Message27 result = 1;
}

message List27Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List27Response {
  repeated Message27 results = 1;
  string next_page_token = 2;
}

message Create27Request {
  Message27 message = 1;
}

message Create27Response {
  Message27 result = 1;
}
