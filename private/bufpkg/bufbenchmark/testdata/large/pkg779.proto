syntax = "proto3";

package benchmark.pkg779;

// Message with various field types
message Message779 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage779 nested = 7;
  Status779 status = 8;
}

// Nested message type
message NestedMessage779 {
  string name = 1;
  int32 value = 2;
  repeated Item779 items = 3;
}

// Simple item message
message Item779 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status779 {
  STATUS_779_UNSPECIFIED = 0;
  STATUS_779_ACTIVE = 1;
  STATUS_779_INACTIVE = 2;
  STATUS_779_PENDING = 3;
}

// Service definition
service Service779 {
  rpc Get779(Get779Request) returns (Get779Response);
  rpc List779(List779Request) returns (List779Response);
  rpc Create779(Create779Request) returns (Create779Response);
}

message Get779Request {
  string id = 1;
}

message Get779Response {
  Message779 result = 1;
}

message List779Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List779Response {
  repeated Message779 results = 1;
  string next_page_token = 2;
}

message Create779Request {
  Message779 message = 1;
}

message Create779Response {
  Message779 result = 1;
}
