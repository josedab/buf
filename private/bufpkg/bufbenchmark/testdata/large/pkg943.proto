syntax = "proto3";

package benchmark.pkg943;

// Message with various field types
message Message943 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage943 nested = 7;
  Status943 status = 8;
}

// Nested message type
message NestedMessage943 {
  string name = 1;
  int32 value = 2;
  repeated Item943 items = 3;
}

// Simple item message
message Item943 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status943 {
  STATUS_943_UNSPECIFIED = 0;
  STATUS_943_ACTIVE = 1;
  STATUS_943_INACTIVE = 2;
  STATUS_943_PENDING = 3;
}

// Service definition
service Service943 {
  rpc Get943(Get943Request) returns (Get943Response);
  rpc List943(List943Request) returns (List943Response);
  rpc Create943(Create943Request) returns (Create943Response);
}

message Get943Request {
  string id = 1;
}

message Get943Response {
  Message943 result = 1;
}

message List943Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List943Response {
  repeated Message943 results = 1;
  string next_page_token = 2;
}

message Create943Request {
  Message943 message = 1;
}

message Create943Response {
  Message943 result = 1;
}
