syntax = "proto3";

package benchmark.pkg253;

// Message with various field types
message Message253 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage253 nested = 7;
  Status253 status = 8;
}

// Nested message type
message NestedMessage253 {
  string name = 1;
  int32 value = 2;
  repeated Item253 items = 3;
}

// Simple item message
message Item253 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status253 {
  STATUS_253_UNSPECIFIED = 0;
  STATUS_253_ACTIVE = 1;
  STATUS_253_INACTIVE = 2;
  STATUS_253_PENDING = 3;
}

// Service definition
service Service253 {
  rpc Get253(Get253Request) returns (Get253Response);
  rpc List253(List253Request) returns (List253Response);
  rpc Create253(Create253Request) returns (Create253Response);
}

message Get253Request {
  string id = 1;
}

message Get253Response {
  Message253 result = 1;
}

message List253Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List253Response {
  repeated Message253 results = 1;
  string next_page_token = 2;
}

message Create253Request {
  Message253 message = 1;
}

message Create253Response {
  Message253 result = 1;
}
