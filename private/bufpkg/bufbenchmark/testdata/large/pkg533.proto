syntax = "proto3";

package benchmark.pkg533;

// Message with various field types
message Message533 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage533 nested = 7;
  Status533 status = 8;
}

// Nested message type
message NestedMessage533 {
  string name = 1;
  int32 value = 2;
  repeated Item533 items = 3;
}

// Simple item message
message Item533 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status533 {
  STATUS_533_UNSPECIFIED = 0;
  STATUS_533_ACTIVE = 1;
  STATUS_533_INACTIVE = 2;
  STATUS_533_PENDING = 3;
}

// Service definition
service Service533 {
  rpc Get533(Get533Request) returns (Get533Response);
  rpc List533(List533Request) returns (List533Response);
  rpc Create533(Create533Request) returns (Create533Response);
}

message Get533Request {
  string id = 1;
}

message Get533Response {
  Message533 result = 1;
}

message List533Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List533Response {
  repeated Message533 results = 1;
  string next_page_token = 2;
}

message Create533Request {
  Message533 message = 1;
}

message Create533Response {
  Message533 result = 1;
}
