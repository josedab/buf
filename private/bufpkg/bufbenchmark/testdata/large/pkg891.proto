syntax = "proto3";

package benchmark.pkg891;

// Message with various field types
message Message891 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage891 nested = 7;
  Status891 status = 8;
}

// Nested message type
message NestedMessage891 {
  string name = 1;
  int32 value = 2;
  repeated Item891 items = 3;
}

// Simple item message
message Item891 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status891 {
  STATUS_891_UNSPECIFIED = 0;
  STATUS_891_ACTIVE = 1;
  STATUS_891_INACTIVE = 2;
  STATUS_891_PENDING = 3;
}

// Service definition
service Service891 {
  rpc Get891(Get891Request) returns (Get891Response);
  rpc List891(List891Request) returns (List891Response);
  rpc Create891(Create891Request) returns (Create891Response);
}

message Get891Request {
  string id = 1;
}

message Get891Response {
  Message891 result = 1;
}

message List891Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List891Response {
  repeated Message891 results = 1;
  string next_page_token = 2;
}

message Create891Request {
  Message891 message = 1;
}

message Create891Response {
  Message891 result = 1;
}
