syntax = "proto3";

package benchmark.pkg440;

// Message with various field types
message Message440 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage440 nested = 7;
  Status440 status = 8;
}

// Nested message type
message NestedMessage440 {
  string name = 1;
  int32 value = 2;
  repeated Item440 items = 3;
}

// Simple item message
message Item440 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status440 {
  STATUS_440_UNSPECIFIED = 0;
  STATUS_440_ACTIVE = 1;
  STATUS_440_INACTIVE = 2;
  STATUS_440_PENDING = 3;
}

// Service definition
service Service440 {
  rpc Get440(Get440Request) returns (Get440Response);
  rpc List440(List440Request) returns (List440Response);
  rpc Create440(Create440Request) returns (Create440Response);
}

message Get440Request {
  string id = 1;
}

message Get440Response {
  Message440 result = 1;
}

message List440Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List440Response {
  repeated Message440 results = 1;
  string next_page_token = 2;
}

message Create440Request {
  Message440 message = 1;
}

message Create440Response {
  Message440 result = 1;
}
