syntax = "proto3";

package benchmark.pkg983;

// Message with various field types
message Message983 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage983 nested = 7;
  Status983 status = 8;
}

// Nested message type
message NestedMessage983 {
  string name = 1;
  int32 value = 2;
  repeated Item983 items = 3;
}

// Simple item message
message Item983 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status983 {
  STATUS_983_UNSPECIFIED = 0;
  STATUS_983_ACTIVE = 1;
  STATUS_983_INACTIVE = 2;
  STATUS_983_PENDING = 3;
}

// Service definition
service Service983 {
  rpc Get983(Get983Request) returns (Get983Response);
  rpc List983(List983Request) returns (List983Response);
  rpc Create983(Create983Request) returns (Create983Response);
}

message Get983Request {
  string id = 1;
}

message Get983Response {
  Message983 result = 1;
}

message List983Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List983Response {
  repeated Message983 results = 1;
  string next_page_token = 2;
}

message Create983Request {
  Message983 message = 1;
}

message Create983Response {
  Message983 result = 1;
}
