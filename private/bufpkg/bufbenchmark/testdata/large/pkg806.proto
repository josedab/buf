syntax = "proto3";

package benchmark.pkg806;

// Message with various field types
message Message806 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage806 nested = 7;
  Status806 status = 8;
}

// Nested message type
message NestedMessage806 {
  string name = 1;
  int32 value = 2;
  repeated Item806 items = 3;
}

// Simple item message
message Item806 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status806 {
  STATUS_806_UNSPECIFIED = 0;
  STATUS_806_ACTIVE = 1;
  STATUS_806_INACTIVE = 2;
  STATUS_806_PENDING = 3;
}

// Service definition
service Service806 {
  rpc Get806(Get806Request) returns (Get806Response);
  rpc List806(List806Request) returns (List806Response);
  rpc Create806(Create806Request) returns (Create806Response);
}

message Get806Request {
  string id = 1;
}

message Get806Response {
  Message806 result = 1;
}

message List806Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List806Response {
  repeated Message806 results = 1;
  string next_page_token = 2;
}

message Create806Request {
  Message806 message = 1;
}

message Create806Response {
  Message806 result = 1;
}
