syntax = "proto3";

package benchmark.pkg390;

// Message with various field types
message Message390 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage390 nested = 7;
  Status390 status = 8;
}

// Nested message type
message NestedMessage390 {
  string name = 1;
  int32 value = 2;
  repeated Item390 items = 3;
}

// Simple item message
message Item390 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status390 {
  STATUS_390_UNSPECIFIED = 0;
  STATUS_390_ACTIVE = 1;
  STATUS_390_INACTIVE = 2;
  STATUS_390_PENDING = 3;
}

// Service definition
service Service390 {
  rpc Get390(Get390Request) returns (Get390Response);
  rpc List390(List390Request) returns (List390Response);
  rpc Create390(Create390Request) returns (Create390Response);
}

message Get390Request {
  string id = 1;
}

message Get390Response {
  Message390 result = 1;
}

message List390Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List390Response {
  repeated Message390 results = 1;
  string next_page_token = 2;
}

message Create390Request {
  Message390 message = 1;
}

message Create390Response {
  Message390 result = 1;
}
