syntax = "proto3";

package benchmark.pkg222;

// Message with various field types
message Message222 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage222 nested = 7;
  Status222 status = 8;
}

// Nested message type
message NestedMessage222 {
  string name = 1;
  int32 value = 2;
  repeated Item222 items = 3;
}

// Simple item message
message Item222 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status222 {
  STATUS_222_UNSPECIFIED = 0;
  STATUS_222_ACTIVE = 1;
  STATUS_222_INACTIVE = 2;
  STATUS_222_PENDING = 3;
}

// Service definition
service Service222 {
  rpc Get222(Get222Request) returns (Get222Response);
  rpc List222(List222Request) returns (List222Response);
  rpc Create222(Create222Request) returns (Create222Response);
}

message Get222Request {
  string id = 1;
}

message Get222Response {
  Message222 result = 1;
}

message List222Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List222Response {
  repeated Message222 results = 1;
  string next_page_token = 2;
}

message Create222Request {
  Message222 message = 1;
}

message Create222Response {
  Message222 result = 1;
}
