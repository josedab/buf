syntax = "proto3";

package benchmark.pkg634;

// Message with various field types
message Message634 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage634 nested = 7;
  Status634 status = 8;
}

// Nested message type
message NestedMessage634 {
  string name = 1;
  int32 value = 2;
  repeated Item634 items = 3;
}

// Simple item message
message Item634 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status634 {
  STATUS_634_UNSPECIFIED = 0;
  STATUS_634_ACTIVE = 1;
  STATUS_634_INACTIVE = 2;
  STATUS_634_PENDING = 3;
}

// Service definition
service Service634 {
  rpc Get634(Get634Request) returns (Get634Response);
  rpc List634(List634Request) returns (List634Response);
  rpc Create634(Create634Request) returns (Create634Response);
}

message Get634Request {
  string id = 1;
}

message Get634Response {
  Message634 result = 1;
}

message List634Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List634Response {
  repeated Message634 results = 1;
  string next_page_token = 2;
}

message Create634Request {
  Message634 message = 1;
}

message Create634Response {
  Message634 result = 1;
}
