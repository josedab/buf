syntax = "proto3";

package benchmark.pkg338;

// Message with various field types
message Message338 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage338 nested = 7;
  Status338 status = 8;
}

// Nested message type
message NestedMessage338 {
  string name = 1;
  int32 value = 2;
  repeated Item338 items = 3;
}

// Simple item message
message Item338 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status338 {
  STATUS_338_UNSPECIFIED = 0;
  STATUS_338_ACTIVE = 1;
  STATUS_338_INACTIVE = 2;
  STATUS_338_PENDING = 3;
}

// Service definition
service Service338 {
  rpc Get338(Get338Request) returns (Get338Response);
  rpc List338(List338Request) returns (List338Response);
  rpc Create338(Create338Request) returns (Create338Response);
}

message Get338Request {
  string id = 1;
}

message Get338Response {
  Message338 result = 1;
}

message List338Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List338Response {
  repeated Message338 results = 1;
  string next_page_token = 2;
}

message Create338Request {
  Message338 message = 1;
}

message Create338Response {
  Message338 result = 1;
}
