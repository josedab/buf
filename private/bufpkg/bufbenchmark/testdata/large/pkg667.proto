syntax = "proto3";

package benchmark.pkg667;

// Message with various field types
message Message667 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage667 nested = 7;
  Status667 status = 8;
}

// Nested message type
message NestedMessage667 {
  string name = 1;
  int32 value = 2;
  repeated Item667 items = 3;
}

// Simple item message
message Item667 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status667 {
  STATUS_667_UNSPECIFIED = 0;
  STATUS_667_ACTIVE = 1;
  STATUS_667_INACTIVE = 2;
  STATUS_667_PENDING = 3;
}

// Service definition
service Service667 {
  rpc Get667(Get667Request) returns (Get667Response);
  rpc List667(List667Request) returns (List667Response);
  rpc Create667(Create667Request) returns (Create667Response);
}

message Get667Request {
  string id = 1;
}

message Get667Response {
  Message667 result = 1;
}

message List667Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List667Response {
  repeated Message667 results = 1;
  string next_page_token = 2;
}

message Create667Request {
  Message667 message = 1;
}

message Create667Response {
  Message667 result = 1;
}
