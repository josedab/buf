syntax = "proto3";

package benchmark.pkg674;

// Message with various field types
message Message674 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage674 nested = 7;
  Status674 status = 8;
}

// Nested message type
message NestedMessage674 {
  string name = 1;
  int32 value = 2;
  repeated Item674 items = 3;
}

// Simple item message
message Item674 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status674 {
  STATUS_674_UNSPECIFIED = 0;
  STATUS_674_ACTIVE = 1;
  STATUS_674_INACTIVE = 2;
  STATUS_674_PENDING = 3;
}

// Service definition
service Service674 {
  rpc Get674(Get674Request) returns (Get674Response);
  rpc List674(List674Request) returns (List674Response);
  rpc Create674(Create674Request) returns (Create674Response);
}

message Get674Request {
  string id = 1;
}

message Get674Response {
  Message674 result = 1;
}

message List674Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List674Response {
  repeated Message674 results = 1;
  string next_page_token = 2;
}

message Create674Request {
  Message674 message = 1;
}

message Create674Response {
  Message674 result = 1;
}
