syntax = "proto3";

package benchmark.pkg191;

// Message with various field types
message Message191 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage191 nested = 7;
  Status191 status = 8;
}

// Nested message type
message NestedMessage191 {
  string name = 1;
  int32 value = 2;
  repeated Item191 items = 3;
}

// Simple item message
message Item191 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status191 {
  STATUS_191_UNSPECIFIED = 0;
  STATUS_191_ACTIVE = 1;
  STATUS_191_INACTIVE = 2;
  STATUS_191_PENDING = 3;
}

// Service definition
service Service191 {
  rpc Get191(Get191Request) returns (Get191Response);
  rpc List191(List191Request) returns (List191Response);
  rpc Create191(Create191Request) returns (Create191Response);
}

message Get191Request {
  string id = 1;
}

message Get191Response {
  Message191 result = 1;
}

message List191Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List191Response {
  repeated Message191 results = 1;
  string next_page_token = 2;
}

message Create191Request {
  Message191 message = 1;
}

message Create191Response {
  Message191 result = 1;
}
