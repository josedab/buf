syntax = "proto3";

package benchmark.pkg538;

// Message with various field types
message Message538 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage538 nested = 7;
  Status538 status = 8;
}

// Nested message type
message NestedMessage538 {
  string name = 1;
  int32 value = 2;
  repeated Item538 items = 3;
}

// Simple item message
message Item538 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status538 {
  STATUS_538_UNSPECIFIED = 0;
  STATUS_538_ACTIVE = 1;
  STATUS_538_INACTIVE = 2;
  STATUS_538_PENDING = 3;
}

// Service definition
service Service538 {
  rpc Get538(Get538Request) returns (Get538Response);
  rpc List538(List538Request) returns (List538Response);
  rpc Create538(Create538Request) returns (Create538Response);
}

message Get538Request {
  string id = 1;
}

message Get538Response {
  Message538 result = 1;
}

message List538Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List538Response {
  repeated Message538 results = 1;
  string next_page_token = 2;
}

message Create538Request {
  Message538 message = 1;
}

message Create538Response {
  Message538 result = 1;
}
