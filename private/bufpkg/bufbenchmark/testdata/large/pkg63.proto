syntax = "proto3";

package benchmark.pkg63;

// Message with various field types
message Message63 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage63 nested = 7;
  Status63 status = 8;
}

// Nested message type
message NestedMessage63 {
  string name = 1;
  int32 value = 2;
  repeated Item63 items = 3;
}

// Simple item message
message Item63 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status63 {
  STATUS_63_UNSPECIFIED = 0;
  STATUS_63_ACTIVE = 1;
  STATUS_63_INACTIVE = 2;
  STATUS_63_PENDING = 3;
}

// Service definition
service Service63 {
  rpc Get63(Get63Request) returns (Get63Response);
  rpc List63(List63Request) returns (List63Response);
  rpc Create63(Create63Request) returns (Create63Response);
}

message Get63Request {
  string id = 1;
}

message Get63Response {
  Message63 result = 1;
}

message List63Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List63Response {
  repeated Message63 results = 1;
  string next_page_token = 2;
}

message Create63Request {
  Message63 message = 1;
}

message Create63Response {
  Message63 result = 1;
}
