syntax = "proto3";

package benchmark.pkg850;

// Message with various field types
message Message850 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage850 nested = 7;
  Status850 status = 8;
}

// Nested message type
message NestedMessage850 {
  string name = 1;
  int32 value = 2;
  repeated Item850 items = 3;
}

// Simple item message
message Item850 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status850 {
  STATUS_850_UNSPECIFIED = 0;
  STATUS_850_ACTIVE = 1;
  STATUS_850_INACTIVE = 2;
  STATUS_850_PENDING = 3;
}

// Service definition
service Service850 {
  rpc Get850(Get850Request) returns (Get850Response);
  rpc List850(List850Request) returns (List850Response);
  rpc Create850(Create850Request) returns (Create850Response);
}

message Get850Request {
  string id = 1;
}

message Get850Response {
  Message850 result = 1;
}

message List850Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List850Response {
  repeated Message850 results = 1;
  string next_page_token = 2;
}

message Create850Request {
  Message850 message = 1;
}

message Create850Response {
  Message850 result = 1;
}
