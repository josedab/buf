syntax = "proto3";

package benchmark.pkg763;

// Message with various field types
message Message763 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage763 nested = 7;
  Status763 status = 8;
}

// Nested message type
message NestedMessage763 {
  string name = 1;
  int32 value = 2;
  repeated Item763 items = 3;
}

// Simple item message
message Item763 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status763 {
  STATUS_763_UNSPECIFIED = 0;
  STATUS_763_ACTIVE = 1;
  STATUS_763_INACTIVE = 2;
  STATUS_763_PENDING = 3;
}

// Service definition
service Service763 {
  rpc Get763(Get763Request) returns (Get763Response);
  rpc List763(List763Request) returns (List763Response);
  rpc Create763(Create763Request) returns (Create763Response);
}

message Get763Request {
  string id = 1;
}

message Get763Response {
  Message763 result = 1;
}

message List763Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List763Response {
  repeated Message763 results = 1;
  string next_page_token = 2;
}

message Create763Request {
  Message763 message = 1;
}

message Create763Response {
  Message763 result = 1;
}
