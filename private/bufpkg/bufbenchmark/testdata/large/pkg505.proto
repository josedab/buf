syntax = "proto3";

package benchmark.pkg505;

// Message with various field types
message Message505 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage505 nested = 7;
  Status505 status = 8;
}

// Nested message type
message NestedMessage505 {
  string name = 1;
  int32 value = 2;
  repeated Item505 items = 3;
}

// Simple item message
message Item505 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status505 {
  STATUS_505_UNSPECIFIED = 0;
  STATUS_505_ACTIVE = 1;
  STATUS_505_INACTIVE = 2;
  STATUS_505_PENDING = 3;
}

// Service definition
service Service505 {
  rpc Get505(Get505Request) returns (Get505Response);
  rpc List505(List505Request) returns (List505Response);
  rpc Create505(Create505Request) returns (Create505Response);
}

message Get505Request {
  string id = 1;
}

message Get505Response {
  Message505 result = 1;
}

message List505Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List505Response {
  repeated Message505 results = 1;
  string next_page_token = 2;
}

message Create505Request {
  Message505 message = 1;
}

message Create505Response {
  Message505 result = 1;
}
