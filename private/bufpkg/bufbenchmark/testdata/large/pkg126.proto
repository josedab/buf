syntax = "proto3";

package benchmark.pkg126;

// Message with various field types
message Message126 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage126 nested = 7;
  Status126 status = 8;
}

// Nested message type
message NestedMessage126 {
  string name = 1;
  int32 value = 2;
  repeated Item126 items = 3;
}

// Simple item message
message Item126 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status126 {
  STATUS_126_UNSPECIFIED = 0;
  STATUS_126_ACTIVE = 1;
  STATUS_126_INACTIVE = 2;
  STATUS_126_PENDING = 3;
}

// Service definition
service Service126 {
  rpc Get126(Get126Request) returns (Get126Response);
  rpc List126(List126Request) returns (List126Response);
  rpc Create126(Create126Request) returns (Create126Response);
}

message Get126Request {
  string id = 1;
}

message Get126Response {
  Message126 result = 1;
}

message List126Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List126Response {
  repeated Message126 results = 1;
  string next_page_token = 2;
}

message Create126Request {
  Message126 message = 1;
}

message Create126Response {
  Message126 result = 1;
}
