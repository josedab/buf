syntax = "proto3";

package benchmark.pkg154;

// Message with various field types
message Message154 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage154 nested = 7;
  Status154 status = 8;
}

// Nested message type
message NestedMessage154 {
  string name = 1;
  int32 value = 2;
  repeated Item154 items = 3;
}

// Simple item message
message Item154 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status154 {
  STATUS_154_UNSPECIFIED = 0;
  STATUS_154_ACTIVE = 1;
  STATUS_154_INACTIVE = 2;
  STATUS_154_PENDING = 3;
}

// Service definition
service Service154 {
  rpc Get154(Get154Request) returns (Get154Response);
  rpc List154(List154Request) returns (List154Response);
  rpc Create154(Create154Request) returns (Create154Response);
}

message Get154Request {
  string id = 1;
}

message Get154Response {
  Message154 result = 1;
}

message List154Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List154Response {
  repeated Message154 results = 1;
  string next_page_token = 2;
}

message Create154Request {
  Message154 message = 1;
}

message Create154Response {
  Message154 result = 1;
}
