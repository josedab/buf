syntax = "proto3";

package benchmark.pkg709;

// Message with various field types
message Message709 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage709 nested = 7;
  Status709 status = 8;
}

// Nested message type
message NestedMessage709 {
  string name = 1;
  int32 value = 2;
  repeated Item709 items = 3;
}

// Simple item message
message Item709 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status709 {
  STATUS_709_UNSPECIFIED = 0;
  STATUS_709_ACTIVE = 1;
  STATUS_709_INACTIVE = 2;
  STATUS_709_PENDING = 3;
}

// Service definition
service Service709 {
  rpc Get709(Get709Request) returns (Get709Response);
  rpc List709(List709Request) returns (List709Response);
  rpc Create709(Create709Request) returns (Create709Response);
}

message Get709Request {
  string id = 1;
}

message Get709Response {
  Message709 result = 1;
}

message List709Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List709Response {
  repeated Message709 results = 1;
  string next_page_token = 2;
}

message Create709Request {
  Message709 message = 1;
}

message Create709Response {
  Message709 result = 1;
}
