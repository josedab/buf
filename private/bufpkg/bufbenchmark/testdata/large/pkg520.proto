syntax = "proto3";

package benchmark.pkg520;

// Message with various field types
message Message520 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage520 nested = 7;
  Status520 status = 8;
}

// Nested message type
message NestedMessage520 {
  string name = 1;
  int32 value = 2;
  repeated Item520 items = 3;
}

// Simple item message
message Item520 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status520 {
  STATUS_520_UNSPECIFIED = 0;
  STATUS_520_ACTIVE = 1;
  STATUS_520_INACTIVE = 2;
  STATUS_520_PENDING = 3;
}

// Service definition
service Service520 {
  rpc Get520(Get520Request) returns (Get520Response);
  rpc List520(List520Request) returns (List520Response);
  rpc Create520(Create520Request) returns (Create520Response);
}

message Get520Request {
  string id = 1;
}

message Get520Response {
  Message520 result = 1;
}

message List520Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List520Response {
  repeated Message520 results = 1;
  string next_page_token = 2;
}

message Create520Request {
  Message520 message = 1;
}

message Create520Response {
  Message520 result = 1;
}
