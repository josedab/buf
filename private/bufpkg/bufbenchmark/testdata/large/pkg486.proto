syntax = "proto3";

package benchmark.pkg486;

// Message with various field types
message Message486 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage486 nested = 7;
  Status486 status = 8;
}

// Nested message type
message NestedMessage486 {
  string name = 1;
  int32 value = 2;
  repeated Item486 items = 3;
}

// Simple item message
message Item486 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status486 {
  STATUS_486_UNSPECIFIED = 0;
  STATUS_486_ACTIVE = 1;
  STATUS_486_INACTIVE = 2;
  STATUS_486_PENDING = 3;
}

// Service definition
service Service486 {
  rpc Get486(Get486Request) returns (Get486Response);
  rpc List486(List486Request) returns (List486Response);
  rpc Create486(Create486Request) returns (Create486Response);
}

message Get486Request {
  string id = 1;
}

message Get486Response {
  Message486 result = 1;
}

message List486Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List486Response {
  repeated Message486 results = 1;
  string next_page_token = 2;
}

message Create486Request {
  Message486 message = 1;
}

message Create486Response {
  Message486 result = 1;
}
