syntax = "proto3";

package benchmark.pkg312;

// Message with various field types
message Message312 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage312 nested = 7;
  Status312 status = 8;
}

// Nested message type
message NestedMessage312 {
  string name = 1;
  int32 value = 2;
  repeated Item312 items = 3;
}

// Simple item message
message Item312 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status312 {
  STATUS_312_UNSPECIFIED = 0;
  STATUS_312_ACTIVE = 1;
  STATUS_312_INACTIVE = 2;
  STATUS_312_PENDING = 3;
}

// Service definition
service Service312 {
  rpc Get312(Get312Request) returns (Get312Response);
  rpc List312(List312Request) returns (List312Response);
  rpc Create312(Create312Request) returns (Create312Response);
}

message Get312Request {
  string id = 1;
}

message Get312Response {
  Message312 result = 1;
}

message List312Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List312Response {
  repeated Message312 results = 1;
  string next_page_token = 2;
}

message Create312Request {
  Message312 message = 1;
}

message Create312Response {
  Message312 result = 1;
}
