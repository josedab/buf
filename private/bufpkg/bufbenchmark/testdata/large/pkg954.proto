syntax = "proto3";

package benchmark.pkg954;

// Message with various field types
message Message954 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage954 nested = 7;
  Status954 status = 8;
}

// Nested message type
message NestedMessage954 {
  string name = 1;
  int32 value = 2;
  repeated Item954 items = 3;
}

// Simple item message
message Item954 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status954 {
  STATUS_954_UNSPECIFIED = 0;
  STATUS_954_ACTIVE = 1;
  STATUS_954_INACTIVE = 2;
  STATUS_954_PENDING = 3;
}

// Service definition
service Service954 {
  rpc Get954(Get954Request) returns (Get954Response);
  rpc List954(List954Request) returns (List954Response);
  rpc Create954(Create954Request) returns (Create954Response);
}

message Get954Request {
  string id = 1;
}

message Get954Response {
  Message954 result = 1;
}

message List954Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List954Response {
  repeated Message954 results = 1;
  string next_page_token = 2;
}

message Create954Request {
  Message954 message = 1;
}

message Create954Response {
  Message954 result = 1;
}
