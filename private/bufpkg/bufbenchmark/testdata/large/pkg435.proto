syntax = "proto3";

package benchmark.pkg435;

// Message with various field types
message Message435 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage435 nested = 7;
  Status435 status = 8;
}

// Nested message type
message NestedMessage435 {
  string name = 1;
  int32 value = 2;
  repeated Item435 items = 3;
}

// Simple item message
message Item435 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status435 {
  STATUS_435_UNSPECIFIED = 0;
  STATUS_435_ACTIVE = 1;
  STATUS_435_INACTIVE = 2;
  STATUS_435_PENDING = 3;
}

// Service definition
service Service435 {
  rpc Get435(Get435Request) returns (Get435Response);
  rpc List435(List435Request) returns (List435Response);
  rpc Create435(Create435Request) returns (Create435Response);
}

message Get435Request {
  string id = 1;
}

message Get435Response {
  Message435 result = 1;
}

message List435Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List435Response {
  repeated Message435 results = 1;
  string next_page_token = 2;
}

message Create435Request {
  Message435 message = 1;
}

message Create435Response {
  Message435 result = 1;
}
