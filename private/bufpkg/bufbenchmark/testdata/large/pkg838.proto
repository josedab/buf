syntax = "proto3";

package benchmark.pkg838;

// Message with various field types
message Message838 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage838 nested = 7;
  Status838 status = 8;
}

// Nested message type
message NestedMessage838 {
  string name = 1;
  int32 value = 2;
  repeated Item838 items = 3;
}

// Simple item message
message Item838 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status838 {
  STATUS_838_UNSPECIFIED = 0;
  STATUS_838_ACTIVE = 1;
  STATUS_838_INACTIVE = 2;
  STATUS_838_PENDING = 3;
}

// Service definition
service Service838 {
  rpc Get838(Get838Request) returns (Get838Response);
  rpc List838(List838Request) returns (List838Response);
  rpc Create838(Create838Request) returns (Create838Response);
}

message Get838Request {
  string id = 1;
}

message Get838Response {
  Message838 result = 1;
}

message List838Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List838Response {
  repeated Message838 results = 1;
  string next_page_token = 2;
}

message Create838Request {
  Message838 message = 1;
}

message Create838Response {
  Message838 result = 1;
}
