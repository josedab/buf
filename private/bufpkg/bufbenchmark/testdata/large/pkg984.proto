syntax = "proto3";

package benchmark.pkg984;

// Message with various field types
message Message984 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage984 nested = 7;
  Status984 status = 8;
}

// Nested message type
message NestedMessage984 {
  string name = 1;
  int32 value = 2;
  repeated Item984 items = 3;
}

// Simple item message
message Item984 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status984 {
  STATUS_984_UNSPECIFIED = 0;
  STATUS_984_ACTIVE = 1;
  STATUS_984_INACTIVE = 2;
  STATUS_984_PENDING = 3;
}

// Service definition
service Service984 {
  rpc Get984(Get984Request) returns (Get984Response);
  rpc List984(List984Request) returns (List984Response);
  rpc Create984(Create984Request) returns (Create984Response);
}

message Get984Request {
  string id = 1;
}

message Get984Response {
  Message984 result = 1;
}

message List984Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List984Response {
  repeated Message984 results = 1;
  string next_page_token = 2;
}

message Create984Request {
  Message984 message = 1;
}

message Create984Response {
  Message984 result = 1;
}
