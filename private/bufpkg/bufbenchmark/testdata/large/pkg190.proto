syntax = "proto3";

package benchmark.pkg190;

// Message with various field types
message Message190 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage190 nested = 7;
  Status190 status = 8;
}

// Nested message type
message NestedMessage190 {
  string name = 1;
  int32 value = 2;
  repeated Item190 items = 3;
}

// Simple item message
message Item190 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status190 {
  STATUS_190_UNSPECIFIED = 0;
  STATUS_190_ACTIVE = 1;
  STATUS_190_INACTIVE = 2;
  STATUS_190_PENDING = 3;
}

// Service definition
service Service190 {
  rpc Get190(Get190Request) returns (Get190Response);
  rpc List190(List190Request) returns (List190Response);
  rpc Create190(Create190Request) returns (Create190Response);
}

message Get190Request {
  string id = 1;
}

message Get190Response {
  Message190 result = 1;
}

message List190Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List190Response {
  repeated Message190 results = 1;
  string next_page_token = 2;
}

message Create190Request {
  Message190 message = 1;
}

message Create190Response {
  Message190 result = 1;
}
