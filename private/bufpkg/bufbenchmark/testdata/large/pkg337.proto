syntax = "proto3";

package benchmark.pkg337;

// Message with various field types
message Message337 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage337 nested = 7;
  Status337 status = 8;
}

// Nested message type
message NestedMessage337 {
  string name = 1;
  int32 value = 2;
  repeated Item337 items = 3;
}

// Simple item message
message Item337 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status337 {
  STATUS_337_UNSPECIFIED = 0;
  STATUS_337_ACTIVE = 1;
  STATUS_337_INACTIVE = 2;
  STATUS_337_PENDING = 3;
}

// Service definition
service Service337 {
  rpc Get337(Get337Request) returns (Get337Response);
  rpc List337(List337Request) returns (List337Response);
  rpc Create337(Create337Request) returns (Create337Response);
}

message Get337Request {
  string id = 1;
}

message Get337Response {
  Message337 result = 1;
}

message List337Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List337Response {
  repeated Message337 results = 1;
  string next_page_token = 2;
}

message Create337Request {
  Message337 message = 1;
}

message Create337Response {
  Message337 result = 1;
}
