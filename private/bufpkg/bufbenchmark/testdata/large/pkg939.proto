syntax = "proto3";

package benchmark.pkg939;

// Message with various field types
message Message939 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage939 nested = 7;
  Status939 status = 8;
}

// Nested message type
message NestedMessage939 {
  string name = 1;
  int32 value = 2;
  repeated Item939 items = 3;
}

// Simple item message
message Item939 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status939 {
  STATUS_939_UNSPECIFIED = 0;
  STATUS_939_ACTIVE = 1;
  STATUS_939_INACTIVE = 2;
  STATUS_939_PENDING = 3;
}

// Service definition
service Service939 {
  rpc Get939(Get939Request) returns (Get939Response);
  rpc List939(List939Request) returns (List939Response);
  rpc Create939(Create939Request) returns (Create939Response);
}

message Get939Request {
  string id = 1;
}

message Get939Response {
  Message939 result = 1;
}

message List939Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List939Response {
  repeated Message939 results = 1;
  string next_page_token = 2;
}

message Create939Request {
  Message939 message = 1;
}

message Create939Response {
  Message939 result = 1;
}
