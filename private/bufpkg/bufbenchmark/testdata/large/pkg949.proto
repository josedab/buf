syntax = "proto3";

package benchmark.pkg949;

// Message with various field types
message Message949 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage949 nested = 7;
  Status949 status = 8;
}

// Nested message type
message NestedMessage949 {
  string name = 1;
  int32 value = 2;
  repeated Item949 items = 3;
}

// Simple item message
message Item949 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status949 {
  STATUS_949_UNSPECIFIED = 0;
  STATUS_949_ACTIVE = 1;
  STATUS_949_INACTIVE = 2;
  STATUS_949_PENDING = 3;
}

// Service definition
service Service949 {
  rpc Get949(Get949Request) returns (Get949Response);
  rpc List949(List949Request) returns (List949Response);
  rpc Create949(Create949Request) returns (Create949Response);
}

message Get949Request {
  string id = 1;
}

message Get949Response {
  Message949 result = 1;
}

message List949Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List949Response {
  repeated Message949 results = 1;
  string next_page_token = 2;
}

message Create949Request {
  Message949 message = 1;
}

message Create949Response {
  Message949 result = 1;
}
