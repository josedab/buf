syntax = "proto3";

package benchmark.pkg957;

// Message with various field types
message Message957 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage957 nested = 7;
  Status957 status = 8;
}

// Nested message type
message NestedMessage957 {
  string name = 1;
  int32 value = 2;
  repeated Item957 items = 3;
}

// Simple item message
message Item957 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status957 {
  STATUS_957_UNSPECIFIED = 0;
  STATUS_957_ACTIVE = 1;
  STATUS_957_INACTIVE = 2;
  STATUS_957_PENDING = 3;
}

// Service definition
service Service957 {
  rpc Get957(Get957Request) returns (Get957Response);
  rpc List957(List957Request) returns (List957Response);
  rpc Create957(Create957Request) returns (Create957Response);
}

message Get957Request {
  string id = 1;
}

message Get957Response {
  Message957 result = 1;
}

message List957Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List957Response {
  repeated Message957 results = 1;
  string next_page_token = 2;
}

message Create957Request {
  Message957 message = 1;
}

message Create957Response {
  Message957 result = 1;
}
