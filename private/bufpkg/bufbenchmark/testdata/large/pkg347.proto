syntax = "proto3";

package benchmark.pkg347;

// Message with various field types
message Message347 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage347 nested = 7;
  Status347 status = 8;
}

// Nested message type
message NestedMessage347 {
  string name = 1;
  int32 value = 2;
  repeated Item347 items = 3;
}

// Simple item message
message Item347 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status347 {
  STATUS_347_UNSPECIFIED = 0;
  STATUS_347_ACTIVE = 1;
  STATUS_347_INACTIVE = 2;
  STATUS_347_PENDING = 3;
}

// Service definition
service Service347 {
  rpc Get347(Get347Request) returns (Get347Response);
  rpc List347(List347Request) returns (List347Response);
  rpc Create347(Create347Request) returns (Create347Response);
}

message Get347Request {
  string id = 1;
}

message Get347Response {
  Message347 result = 1;
}

message List347Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List347Response {
  repeated Message347 results = 1;
  string next_page_token = 2;
}

message Create347Request {
  Message347 message = 1;
}

message Create347Response {
  Message347 result = 1;
}
