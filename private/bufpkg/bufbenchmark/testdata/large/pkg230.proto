syntax = "proto3";

package benchmark.pkg230;

// Message with various field types
message Message230 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage230 nested = 7;
  Status230 status = 8;
}

// Nested message type
message NestedMessage230 {
  string name = 1;
  int32 value = 2;
  repeated Item230 items = 3;
}

// Simple item message
message Item230 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status230 {
  STATUS_230_UNSPECIFIED = 0;
  STATUS_230_ACTIVE = 1;
  STATUS_230_INACTIVE = 2;
  STATUS_230_PENDING = 3;
}

// Service definition
service Service230 {
  rpc Get230(Get230Request) returns (Get230Response);
  rpc List230(List230Request) returns (List230Response);
  rpc Create230(Create230Request) returns (Create230Response);
}

message Get230Request {
  string id = 1;
}

message Get230Response {
  Message230 result = 1;
}

message List230Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List230Response {
  repeated Message230 results = 1;
  string next_page_token = 2;
}

message Create230Request {
  Message230 message = 1;
}

message Create230Response {
  Message230 result = 1;
}
