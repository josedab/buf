syntax = "proto3";

package benchmark.pkg518;

// Message with various field types
message Message518 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage518 nested = 7;
  Status518 status = 8;
}

// Nested message type
message NestedMessage518 {
  string name = 1;
  int32 value = 2;
  repeated Item518 items = 3;
}

// Simple item message
message Item518 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status518 {
  STATUS_518_UNSPECIFIED = 0;
  STATUS_518_ACTIVE = 1;
  STATUS_518_INACTIVE = 2;
  STATUS_518_PENDING = 3;
}

// Service definition
service Service518 {
  rpc Get518(Get518Request) returns (Get518Response);
  rpc List518(List518Request) returns (List518Response);
  rpc Create518(Create518Request) returns (Create518Response);
}

message Get518Request {
  string id = 1;
}

message Get518Response {
  Message518 result = 1;
}

message List518Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List518Response {
  repeated Message518 results = 1;
  string next_page_token = 2;
}

message Create518Request {
  Message518 message = 1;
}

message Create518Response {
  Message518 result = 1;
}
