syntax = "proto3";

package benchmark.pkg546;

// Message with various field types
message Message546 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage546 nested = 7;
  Status546 status = 8;
}

// Nested message type
message NestedMessage546 {
  string name = 1;
  int32 value = 2;
  repeated Item546 items = 3;
}

// Simple item message
message Item546 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status546 {
  STATUS_546_UNSPECIFIED = 0;
  STATUS_546_ACTIVE = 1;
  STATUS_546_INACTIVE = 2;
  STATUS_546_PENDING = 3;
}

// Service definition
service Service546 {
  rpc Get546(Get546Request) returns (Get546Response);
  rpc List546(List546Request) returns (List546Response);
  rpc Create546(Create546Request) returns (Create546Response);
}

message Get546Request {
  string id = 1;
}

message Get546Response {
  Message546 result = 1;
}

message List546Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List546Response {
  repeated Message546 results = 1;
  string next_page_token = 2;
}

message Create546Request {
  Message546 message = 1;
}

message Create546Response {
  Message546 result = 1;
}
