syntax = "proto3";

package benchmark.pkg301;

// Message with various field types
message Message301 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage301 nested = 7;
  Status301 status = 8;
}

// Nested message type
message NestedMessage301 {
  string name = 1;
  int32 value = 2;
  repeated Item301 items = 3;
}

// Simple item message
message Item301 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status301 {
  STATUS_301_UNSPECIFIED = 0;
  STATUS_301_ACTIVE = 1;
  STATUS_301_INACTIVE = 2;
  STATUS_301_PENDING = 3;
}

// Service definition
service Service301 {
  rpc Get301(Get301Request) returns (Get301Response);
  rpc List301(List301Request) returns (List301Response);
  rpc Create301(Create301Request) returns (Create301Response);
}

message Get301Request {
  string id = 1;
}

message Get301Response {
  Message301 result = 1;
}

message List301Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List301Response {
  repeated Message301 results = 1;
  string next_page_token = 2;
}

message Create301Request {
  Message301 message = 1;
}

message Create301Response {
  Message301 result = 1;
}
