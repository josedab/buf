syntax = "proto3";

package benchmark.pkg621;

// Message with various field types
message Message621 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage621 nested = 7;
  Status621 status = 8;
}

// Nested message type
message NestedMessage621 {
  string name = 1;
  int32 value = 2;
  repeated Item621 items = 3;
}

// Simple item message
message Item621 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status621 {
  STATUS_621_UNSPECIFIED = 0;
  STATUS_621_ACTIVE = 1;
  STATUS_621_INACTIVE = 2;
  STATUS_621_PENDING = 3;
}

// Service definition
service Service621 {
  rpc Get621(Get621Request) returns (Get621Response);
  rpc List621(List621Request) returns (List621Response);
  rpc Create621(Create621Request) returns (Create621Response);
}

message Get621Request {
  string id = 1;
}

message Get621Response {
  Message621 result = 1;
}

message List621Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List621Response {
  repeated Message621 results = 1;
  string next_page_token = 2;
}

message Create621Request {
  Message621 message = 1;
}

message Create621Response {
  Message621 result = 1;
}
