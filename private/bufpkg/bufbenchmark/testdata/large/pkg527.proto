syntax = "proto3";

package benchmark.pkg527;

// Message with various field types
message Message527 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage527 nested = 7;
  Status527 status = 8;
}

// Nested message type
message NestedMessage527 {
  string name = 1;
  int32 value = 2;
  repeated Item527 items = 3;
}

// Simple item message
message Item527 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status527 {
  STATUS_527_UNSPECIFIED = 0;
  STATUS_527_ACTIVE = 1;
  STATUS_527_INACTIVE = 2;
  STATUS_527_PENDING = 3;
}

// Service definition
service Service527 {
  rpc Get527(Get527Request) returns (Get527Response);
  rpc List527(List527Request) returns (List527Response);
  rpc Create527(Create527Request) returns (Create527Response);
}

message Get527Request {
  string id = 1;
}

message Get527Response {
  Message527 result = 1;
}

message List527Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List527Response {
  repeated Message527 results = 1;
  string next_page_token = 2;
}

message Create527Request {
  Message527 message = 1;
}

message Create527Response {
  Message527 result = 1;
}
