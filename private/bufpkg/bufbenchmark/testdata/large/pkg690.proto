syntax = "proto3";

package benchmark.pkg690;

// Message with various field types
message Message690 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage690 nested = 7;
  Status690 status = 8;
}

// Nested message type
message NestedMessage690 {
  string name = 1;
  int32 value = 2;
  repeated Item690 items = 3;
}

// Simple item message
message Item690 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status690 {
  STATUS_690_UNSPECIFIED = 0;
  STATUS_690_ACTIVE = 1;
  STATUS_690_INACTIVE = 2;
  STATUS_690_PENDING = 3;
}

// Service definition
service Service690 {
  rpc Get690(Get690Request) returns (Get690Response);
  rpc List690(List690Request) returns (List690Response);
  rpc Create690(Create690Request) returns (Create690Response);
}

message Get690Request {
  string id = 1;
}

message Get690Response {
  Message690 result = 1;
}

message List690Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List690Response {
  repeated Message690 results = 1;
  string next_page_token = 2;
}

message Create690Request {
  Message690 message = 1;
}

message Create690Response {
  Message690 result = 1;
}
