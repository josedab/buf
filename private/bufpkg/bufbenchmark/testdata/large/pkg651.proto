syntax = "proto3";

package benchmark.pkg651;

// Message with various field types
message Message651 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage651 nested = 7;
  Status651 status = 8;
}

// Nested message type
message NestedMessage651 {
  string name = 1;
  int32 value = 2;
  repeated Item651 items = 3;
}

// Simple item message
message Item651 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status651 {
  STATUS_651_UNSPECIFIED = 0;
  STATUS_651_ACTIVE = 1;
  STATUS_651_INACTIVE = 2;
  STATUS_651_PENDING = 3;
}

// Service definition
service Service651 {
  rpc Get651(Get651Request) returns (Get651Response);
  rpc List651(List651Request) returns (List651Response);
  rpc Create651(Create651Request) returns (Create651Response);
}

message Get651Request {
  string id = 1;
}

message Get651Response {
  Message651 result = 1;
}

message List651Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List651Response {
  repeated Message651 results = 1;
  string next_page_token = 2;
}

message Create651Request {
  Message651 message = 1;
}

message Create651Response {
  Message651 result = 1;
}
