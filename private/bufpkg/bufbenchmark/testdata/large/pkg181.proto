syntax = "proto3";

package benchmark.pkg181;

// Message with various field types
message Message181 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage181 nested = 7;
  Status181 status = 8;
}

// Nested message type
message NestedMessage181 {
  string name = 1;
  int32 value = 2;
  repeated Item181 items = 3;
}

// Simple item message
message Item181 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status181 {
  STATUS_181_UNSPECIFIED = 0;
  STATUS_181_ACTIVE = 1;
  STATUS_181_INACTIVE = 2;
  STATUS_181_PENDING = 3;
}

// Service definition
service Service181 {
  rpc Get181(Get181Request) returns (Get181Response);
  rpc List181(List181Request) returns (List181Response);
  rpc Create181(Create181Request) returns (Create181Response);
}

message Get181Request {
  string id = 1;
}

message Get181Response {
  Message181 result = 1;
}

message List181Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List181Response {
  repeated Message181 results = 1;
  string next_page_token = 2;
}

message Create181Request {
  Message181 message = 1;
}

message Create181Response {
  Message181 result = 1;
}
