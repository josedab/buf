syntax = "proto3";

package benchmark.pkg245;

// Message with various field types
message Message245 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage245 nested = 7;
  Status245 status = 8;
}

// Nested message type
message NestedMessage245 {
  string name = 1;
  int32 value = 2;
  repeated Item245 items = 3;
}

// Simple item message
message Item245 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status245 {
  STATUS_245_UNSPECIFIED = 0;
  STATUS_245_ACTIVE = 1;
  STATUS_245_INACTIVE = 2;
  STATUS_245_PENDING = 3;
}

// Service definition
service Service245 {
  rpc Get245(Get245Request) returns (Get245Response);
  rpc List245(List245Request) returns (List245Response);
  rpc Create245(Create245Request) returns (Create245Response);
}

message Get245Request {
  string id = 1;
}

message Get245Response {
  Message245 result = 1;
}

message List245Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List245Response {
  repeated Message245 results = 1;
  string next_page_token = 2;
}

message Create245Request {
  Message245 message = 1;
}

message Create245Response {
  Message245 result = 1;
}
