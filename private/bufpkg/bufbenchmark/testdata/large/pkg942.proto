syntax = "proto3";

package benchmark.pkg942;

// Message with various field types
message Message942 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage942 nested = 7;
  Status942 status = 8;
}

// Nested message type
message NestedMessage942 {
  string name = 1;
  int32 value = 2;
  repeated Item942 items = 3;
}

// Simple item message
message Item942 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status942 {
  STATUS_942_UNSPECIFIED = 0;
  STATUS_942_ACTIVE = 1;
  STATUS_942_INACTIVE = 2;
  STATUS_942_PENDING = 3;
}

// Service definition
service Service942 {
  rpc Get942(Get942Request) returns (Get942Response);
  rpc List942(List942Request) returns (List942Response);
  rpc Create942(Create942Request) returns (Create942Response);
}

message Get942Request {
  string id = 1;
}

message Get942Response {
  Message942 result = 1;
}

message List942Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List942Response {
  repeated Message942 results = 1;
  string next_page_token = 2;
}

message Create942Request {
  Message942 message = 1;
}

message Create942Response {
  Message942 result = 1;
}
