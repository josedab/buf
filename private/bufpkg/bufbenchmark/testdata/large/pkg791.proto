syntax = "proto3";

package benchmark.pkg791;

// Message with various field types
message Message791 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage791 nested = 7;
  Status791 status = 8;
}

// Nested message type
message NestedMessage791 {
  string name = 1;
  int32 value = 2;
  repeated Item791 items = 3;
}

// Simple item message
message Item791 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status791 {
  STATUS_791_UNSPECIFIED = 0;
  STATUS_791_ACTIVE = 1;
  STATUS_791_INACTIVE = 2;
  STATUS_791_PENDING = 3;
}

// Service definition
service Service791 {
  rpc Get791(Get791Request) returns (Get791Response);
  rpc List791(List791Request) returns (List791Response);
  rpc Create791(Create791Request) returns (Create791Response);
}

message Get791Request {
  string id = 1;
}

message Get791Response {
  Message791 result = 1;
}

message List791Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List791Response {
  repeated Message791 results = 1;
  string next_page_token = 2;
}

message Create791Request {
  Message791 message = 1;
}

message Create791Response {
  Message791 result = 1;
}
