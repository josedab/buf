syntax = "proto3";

package benchmark.pkg938;

// Message with various field types
message Message938 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage938 nested = 7;
  Status938 status = 8;
}

// Nested message type
message NestedMessage938 {
  string name = 1;
  int32 value = 2;
  repeated Item938 items = 3;
}

// Simple item message
message Item938 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status938 {
  STATUS_938_UNSPECIFIED = 0;
  STATUS_938_ACTIVE = 1;
  STATUS_938_INACTIVE = 2;
  STATUS_938_PENDING = 3;
}

// Service definition
service Service938 {
  rpc Get938(Get938Request) returns (Get938Response);
  rpc List938(List938Request) returns (List938Response);
  rpc Create938(Create938Request) returns (Create938Response);
}

message Get938Request {
  string id = 1;
}

message Get938Response {
  Message938 result = 1;
}

message List938Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List938Response {
  repeated Message938 results = 1;
  string next_page_token = 2;
}

message Create938Request {
  Message938 message = 1;
}

message Create938Response {
  Message938 result = 1;
}
