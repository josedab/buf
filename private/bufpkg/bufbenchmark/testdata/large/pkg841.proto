syntax = "proto3";

package benchmark.pkg841;

// Message with various field types
message Message841 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage841 nested = 7;
  Status841 status = 8;
}

// Nested message type
message NestedMessage841 {
  string name = 1;
  int32 value = 2;
  repeated Item841 items = 3;
}

// Simple item message
message Item841 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status841 {
  STATUS_841_UNSPECIFIED = 0;
  STATUS_841_ACTIVE = 1;
  STATUS_841_INACTIVE = 2;
  STATUS_841_PENDING = 3;
}

// Service definition
service Service841 {
  rpc Get841(Get841Request) returns (Get841Response);
  rpc List841(List841Request) returns (List841Response);
  rpc Create841(Create841Request) returns (Create841Response);
}

message Get841Request {
  string id = 1;
}

message Get841Response {
  Message841 result = 1;
}

message List841Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List841Response {
  repeated Message841 results = 1;
  string next_page_token = 2;
}

message Create841Request {
  Message841 message = 1;
}

message Create841Response {
  Message841 result = 1;
}
