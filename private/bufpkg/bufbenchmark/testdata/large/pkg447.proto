syntax = "proto3";

package benchmark.pkg447;

// Message with various field types
message Message447 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage447 nested = 7;
  Status447 status = 8;
}

// Nested message type
message NestedMessage447 {
  string name = 1;
  int32 value = 2;
  repeated Item447 items = 3;
}

// Simple item message
message Item447 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status447 {
  STATUS_447_UNSPECIFIED = 0;
  STATUS_447_ACTIVE = 1;
  STATUS_447_INACTIVE = 2;
  STATUS_447_PENDING = 3;
}

// Service definition
service Service447 {
  rpc Get447(Get447Request) returns (Get447Response);
  rpc List447(List447Request) returns (List447Response);
  rpc Create447(Create447Request) returns (Create447Response);
}

message Get447Request {
  string id = 1;
}

message Get447Response {
  Message447 result = 1;
}

message List447Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List447Response {
  repeated Message447 results = 1;
  string next_page_token = 2;
}

message Create447Request {
  Message447 message = 1;
}

message Create447Response {
  Message447 result = 1;
}
