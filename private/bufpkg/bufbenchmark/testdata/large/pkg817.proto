syntax = "proto3";

package benchmark.pkg817;

// Message with various field types
message Message817 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage817 nested = 7;
  Status817 status = 8;
}

// Nested message type
message NestedMessage817 {
  string name = 1;
  int32 value = 2;
  repeated Item817 items = 3;
}

// Simple item message
message Item817 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status817 {
  STATUS_817_UNSPECIFIED = 0;
  STATUS_817_ACTIVE = 1;
  STATUS_817_INACTIVE = 2;
  STATUS_817_PENDING = 3;
}

// Service definition
service Service817 {
  rpc Get817(Get817Request) returns (Get817Response);
  rpc List817(List817Request) returns (List817Response);
  rpc Create817(Create817Request) returns (Create817Response);
}

message Get817Request {
  string id = 1;
}

message Get817Response {
  Message817 result = 1;
}

message List817Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List817Response {
  repeated Message817 results = 1;
  string next_page_token = 2;
}

message Create817Request {
  Message817 message = 1;
}

message Create817Response {
  Message817 result = 1;
}
