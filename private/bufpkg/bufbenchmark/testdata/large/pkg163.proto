syntax = "proto3";

package benchmark.pkg163;

// Message with various field types
message Message163 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage163 nested = 7;
  Status163 status = 8;
}

// Nested message type
message NestedMessage163 {
  string name = 1;
  int32 value = 2;
  repeated Item163 items = 3;
}

// Simple item message
message Item163 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status163 {
  STATUS_163_UNSPECIFIED = 0;
  STATUS_163_ACTIVE = 1;
  STATUS_163_INACTIVE = 2;
  STATUS_163_PENDING = 3;
}

// Service definition
service Service163 {
  rpc Get163(Get163Request) returns (Get163Response);
  rpc List163(List163Request) returns (List163Response);
  rpc Create163(Create163Request) returns (Create163Response);
}

message Get163Request {
  string id = 1;
}

message Get163Response {
  Message163 result = 1;
}

message List163Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List163Response {
  repeated Message163 results = 1;
  string next_page_token = 2;
}

message Create163Request {
  Message163 message = 1;
}

message Create163Response {
  Message163 result = 1;
}
