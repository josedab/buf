syntax = "proto3";

package benchmark.pkg470;

// Message with various field types
message Message470 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage470 nested = 7;
  Status470 status = 8;
}

// Nested message type
message NestedMessage470 {
  string name = 1;
  int32 value = 2;
  repeated Item470 items = 3;
}

// Simple item message
message Item470 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status470 {
  STATUS_470_UNSPECIFIED = 0;
  STATUS_470_ACTIVE = 1;
  STATUS_470_INACTIVE = 2;
  STATUS_470_PENDING = 3;
}

// Service definition
service Service470 {
  rpc Get470(Get470Request) returns (Get470Response);
  rpc List470(List470Request) returns (List470Response);
  rpc Create470(Create470Request) returns (Create470Response);
}

message Get470Request {
  string id = 1;
}

message Get470Response {
  Message470 result = 1;
}

message List470Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List470Response {
  repeated Message470 results = 1;
  string next_page_token = 2;
}

message Create470Request {
  Message470 message = 1;
}

message Create470Response {
  Message470 result = 1;
}
