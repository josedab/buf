syntax = "proto3";

package benchmark.pkg420;

// Message with various field types
message Message420 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage420 nested = 7;
  Status420 status = 8;
}

// Nested message type
message NestedMessage420 {
  string name = 1;
  int32 value = 2;
  repeated Item420 items = 3;
}

// Simple item message
message Item420 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status420 {
  STATUS_420_UNSPECIFIED = 0;
  STATUS_420_ACTIVE = 1;
  STATUS_420_INACTIVE = 2;
  STATUS_420_PENDING = 3;
}

// Service definition
service Service420 {
  rpc Get420(Get420Request) returns (Get420Response);
  rpc List420(List420Request) returns (List420Response);
  rpc Create420(Create420Request) returns (Create420Response);
}

message Get420Request {
  string id = 1;
}

message Get420Response {
  Message420 result = 1;
}

message List420Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List420Response {
  repeated Message420 results = 1;
  string next_page_token = 2;
}

message Create420Request {
  Message420 message = 1;
}

message Create420Response {
  Message420 result = 1;
}
