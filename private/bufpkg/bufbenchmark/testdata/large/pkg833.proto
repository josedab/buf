syntax = "proto3";

package benchmark.pkg833;

// Message with various field types
message Message833 {
  string id = 1;
  int32 count = 2;
  int64 timestamp = 3;
  bool active = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  NestedMessage833 nested = 7;
  Status833 status = 8;
}

// Nested message type
message NestedMessage833 {
  string name = 1;
  int32 value = 2;
  repeated Item833 items = 3;
}

// Simple item message
message Item833 {
  string key = 1;
  bytes data = 2;
}

// Status enum
enum Status833 {
  STATUS_833_UNSPECIFIED = 0;
  STATUS_833_ACTIVE = 1;
  STATUS_833_INACTIVE = 2;
  STATUS_833_PENDING = 3;
}

// Service definition
service Service833 {
  rpc Get833(Get833Request) returns (Get833Response);
  rpc List833(List833Request) returns (List833Response);
  rpc Create833(Create833Request) returns (Create833Response);
}

message Get833Request {
  string id = 1;
}

message Get833Response {
  Message833 result = 1;
}

message List833Request {
  int32 page_size = 1;
  string page_token = 2;
}

message List833Response {
  repeated Message833 results = 1;
  string next_page_token = 2;
}

message Create833Request {
  Message833 message = 1;
}

message Create833Response {
  Message833 result = 1;
}
