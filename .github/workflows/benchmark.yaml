name: Benchmarks

on:
  push:
    branches:
      - main
  pull_request:

# Prevent writing to the repository using the CI token.
permissions: read-all

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup-go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'

      - name: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/buf/${{ runner.os }}/x86_64/bin
            ~/.cache/buf/${{ runner.os }}/x86_64/go/pkg/mod
            ~/.cache/buf/${{ runner.os }}/x86_64/gocache
            ~/.cache/buf/${{ runner.os }}/x86_64/include
            ~/.cache/buf/${{ runner.os }}/x86_64/versions
          key: ${{ runner.os }}-buf-benchmark-${{ hashFiles('**/go.sum', 'make/**') }}
          restore-keys: |
            ${{ runner.os }}-buf-benchmark-

      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -count=5 \
            ./private/bufpkg/bufbenchmark/... \
            | tee benchmark-results.txt

      - name: Store benchmark result
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'go'
          output-file-path: benchmark-results.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Alert if 50% slower than baseline
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false

      - name: Compare benchmark result
        if: github.event_name == 'pull_request'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'go'
          output-file-path: benchmark-results.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Don't push to gh-pages on PRs
          auto-push: false
          # Comment on PR with comparison
          comment-always: true
          # Alert if 50% slower than baseline
          alert-threshold: '150%'
          comment-on-alert: true
          # Fail the workflow if regression is detected
          fail-on-alert: true
